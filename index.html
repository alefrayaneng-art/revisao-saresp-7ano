: [{"id": "p6q0", "texto": "Em 3x + 2 = 14, qual é a incógnita?", "alts": ["3, o número que multiplica", "2, o número somado", "14, o resultado", "x, o valor que queremos descobrir"], "certa": 3, "nivel": "Entrada", "tempo": 30, "just": "A incógnita é a letra x: o valor desconhecido.", "pista": "A incógnita é o que a equação ainda não revelou. Olhe cada parte de 3x + 2 = 14 e pergunte: isso já é conhecido ou é o que falta descobrir?", "alem": "Escreva uma equação sua com a incógnita y, como 5y − 1 = 9, e aponte o que é incógnita e o que é conhecido. Depois invente uma historinha do dia a dia que combine com 3x + 2 = 14.", "erros": ["Você escolheu o número que está colado na letra. Esse número (o coeficiente) já é conhecido. Confira qual parte da equação não tem valor dado.", "Você escolheu o número que é somado. Ele já está dado na equação, então é um valor conhecido. Procure a parte que ainda é desconhecida.", "Você olhou para o resultado da equação. Ele já está escrito no problema, então não é o que falta descobrir. Confira o que a pergunta quer encontrar.", null]}, {"id": "p6q1", "texto": "Resolva x + 5 = 12.", "alts": ["x = 7", "x = 17", "x = 60", "x = −7"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "Subtraindo 5 dos dois lados: x = 7.", "pista": "Imagine uma balança: de um lado x + 5, do outro 12. Que operação desfaz o \"+ 5\"? E o que você precisa fazer nos dois lados para a balança continuar equilibrada?", "alem": "Resolva x + 5 = 12 de dois jeitos (por exemplo, pensando \"que número mais 5 dá 12?\" e usando a operação inversa) e compare. Depois invente outra equação com a mesma solução.", "erros": [null, "Você somou 5 e 12. Mas o 5 já está somado ao x. Para desfazer uma soma, use a operação inversa, a subtração, nos dois lados.", "Você multiplicou 5 por 12. A equação tem uma soma, e a operação inversa da soma é a subtração, não a multiplicação.", "Você pode ter calculado 5 − 12 em vez de 12 − 5, ou trocado o sinal ao passar o 5 para o outro lado. Confira: −7 + 5 dá −2, e não 12."]}, {"id": "p6q2", "texto": "Resolva 3x = 12.", "alts": ["x = 9", "x = 4", "x = 15", "x = 36"], "certa": 1, "nivel": "Entrada", "tempo": 30, "just": "Dividindo os dois lados por 3: x = 4.", "pista": "3x quer dizer 3 vezes x. Que operação desfaz uma multiplicação por 3? E o que fazer nos dois lados da igualdade?", "alem": "Resolva 3x = 12 de dois jeitos: dividindo os dois lados e testando valores. Depois troque o 12 por um número que dê solução inteira e por outro que não dê. O que você percebe?", "erros": ["Você subtraiu 3 de 12. Mas 3x é multiplicação, e a operação inversa dela é a divisão. Confira: 3 × 9 dá 27, não 12.", null, "Você somou 3 a 12. Mas o 3 está multiplicando o x, não somando. Confira: 3 × 15 dá 45, não 12.", "Você multiplicou 12 por 3. Isso repete a operação em vez de desfazê-la. Confira: 3 × 36 dá 108, muito mais que 12."]}, {"id": "p6q3", "texto": "Resolva 2x + 6 = 18.", "alts": ["x = 12", "x = 6", "x = 3", "x = 24"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "2x = 12, e então x = 6.", "passos": ["Subtraia 6 dos dois lados: 2x = 12.", "Divida os dois lados por 2: x = 6.", "Confira: 2 × 6 + 6 = 18. Certo."], "pista": "Há duas operações em volta do x. Desfaça uma de cada vez, começando pela que está somada, e sempre faça o mesmo nos dois lados.", "alem": "Resolva 2x + 6 = 18 de dois jeitos: o caminho de sempre e outro, dividindo tudo por 2 logo no começo. Compare os dois. Depois invente uma equação do tipo ax + b = c com a mesma solução.", "erros": ["Você subtraiu 6 de 18 e parou. Esse 12 é o valor de 2x, e não de x. Falta desfazer a multiplicação por 2.", null, "Você dividiu 18 por 6, misturando os números. Desfaça o + 6 primeiro e só depois o 2 que multiplica. Confira: 2 × 3 + 6 dá 12, não 18.", "Você somou 6 a 18. Como o 6 está somado ao 2x, a operação inversa é subtrair. Confira: 2 × 24 + 6 dá 54, muito mais que 18."]}, {"id": "p6q4", "texto": "Resolva x/3 + 2 = 6.", "alts": ["x = 24", "x = 8", "x = 12", "x = 4"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "x/3 = 4, então x = 4 × 3 = 12.", "passos": ["Subtraia 2 dos dois lados: x/3 = 4.", "Multiplique os dois lados por 3: x = 12.", "Confira: 12 ÷ 3 + 2 = 6. Certo."], "pista": "Primeiro deixe o pedaço x/3 sozinho, desfazendo o \"+ 2\". Depois pergunte: que operação desfaz uma divisão por 3?", "alem": "Escolha um valor de x, por exemplo 15, e monte uma equação do tipo x/3 + □ = □ que tenha esse x como solução. Troque com um colega e resolvam as equações um do outro.", "erros": ["Você pode ter somado 2 ao 6 em vez de subtrair (6 + 2 = 8) e depois multiplicado por 3. O + 2 se desfaz subtraindo 2 dos dois lados.", "Você pode ter somado 2 ao 6 e deixado a divisão por 3 de lado. Confira: 8/3 + 2 dá 4,67 aproximadamente, não 6.", null, "Você chegou em x/3 = 4 e parou. Esse 4 é o valor de x/3, e não de x. Falta desfazer a divisão por 3."]}, {"id": "p6q5", "texto": "Qual é o primeiro passo correto para resolver 5x − 4 = 21?", "alts": ["Somar 4 só ao lado direito: 5x − 4 = 25", "Subtrair 4 dos dois lados: 5x = 17", "Dividir tudo por 5 e manter o 4: x − 4 = 21", "Somar 4 aos dois lados: 5x = 25"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "Para desfazer o −4, soma-se 4 nos dois lados, mantendo o equilíbrio.", "pista": "Pense na balança: o que se faz de um lado precisa ser feito do outro. Qual operação cancela um \"− 4\"? E onde ela deve ser aplicada?", "alem": "Resolva a equação até o fim e confira a solução. Depois resolva de outro jeito, dividindo tudo por 5 logo no começo, e compare. Por fim, escolha uma das outras alternativas e explique a um colega por que ela quebra o equilíbrio da igualdade.", "erros": ["Você aplicou a operação em um lado só. Para a igualdade continuar verdadeira, o que se faz de um lado precisa ser feito do outro.", "Você subtraiu 4 de 21, mas o − 4 do lado esquerdo sumiu sem motivo. Subtrair 4 dos dois lados deixaria 5x − 8 = 17, e não 5x = 17.", "Você dividiu só o 5x por 5. Dividir tudo por 5 daria x − 4/5 = 21/5, porque todos os termos dos dois lados são divididos.", null]}, {"id": "p6q6", "texto": "O número 5 é solução de qual equação?", "alts": ["4x = 15", "2x + 5 = 10", "3x − 5 = 10", "x + 5 = 5"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "Com x = 5: 3 × 5 − 5 = 10. Nas outras, o resultado é 15, 10 ≠ 5 e 20 ≠ 15.", "pista": "Troque x por 5 em cada equação e calcule os dois lados. Serve a equação em que os dois lados ficam com o mesmo valor.", "alem": "Invente uma equação do tipo 2x + □ = □ que também tenha 5 como solução. Quantas equações diferentes você consegue criar?", "erros": ["Para o 5 ser solução, a conta com ele precisa dar o número do outro lado. Confira: 4 × 5 dá 20, não 15.", "Você pode ter feito 10 − 5 = 5 e esquecido o 2 que multiplica o x. Confira: 2 × 5 + 5 dá 15, não 10.", null, "Você pode ter notado o 5 nos dois lados e achado que combinava. Confira: 5 + 5 dá 10, não 5."]}, {"id": "p6q7", "texto": "Para conferir que x = 6 resolve 2x + 6 = 18, o que fazemos?", "alts": ["Trocar x por 6 na equação original e ver se dá 18", "Dividir 18 por 6 e parar", "Somar 6 aos dois lados", "Trocar x por 6 só no lado direito"], "certa": 0, "nivel": "Raciocínio", "tempo": 90, "just": "2 × 6 + 6 = 18. A igualdade se confirma.", "pista": "Conferir é testar o valor na equação do enunciado. Em que parte da equação a letra aparece? E o que precisa acontecer no final da conta?", "alem": "Confira também x = 5 na mesma equação e veja o que acontece. Como você explicaria a um colega que a conferência mostra quando um valor não serve?", "erros": [null, "Dividir 18 por 6 dá 3, e essa conta não segue as operações da equação (× 2 e + 6). Confira se o 6 passa pelas mesmas contas que o x.", "Somar 6 aos dois lados mantém a igualdade, mas só cria outra equação (2x + 12 = 24). Essa conta não usa o valor 6 no lugar da letra.", "O lado direito é 18 e não tem a letra x. A letra aparece no lado esquerdo, então não há o que trocar no direito. Confira o que a equação inteira pede."]}, {"id": "p6q8", "texto": "Qual equação traduz \"a metade de um número, mais 5, é 11\"?", "alts": ["2x + 5 = 11", "x/2 − 5 = 11", "x/2 + 5 = 11", "(x + 5)/2 = 11"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "A metade de x é x/2. Mais 5, igual a 11: x/2 + 5 = 11.", "pista": "Traduza por partes: primeiro escreva \"a metade de um número\" usando x. Depois acrescente o \"mais 5\" e, por fim, o \"é 11\".", "alem": "Escreva uma frase em português para x/2 − 5 = 11 e outra para 2x + 5 = 11. Depois explique que história a expressão (x + 5)/2 conta.", "erros": ["Você usou o dobro (2x) no lugar da metade. Metade é dividir por 2, não multiplicar.", "Você trocou \"mais\" por \"menos\". Confira a palavra que vem depois de \"a metade de um número\".", null, "Você dividiu a soma inteira por 2. A frase diz a metade só do número, e o 5 é somado depois."]}, {"id": "p6q9", "texto": "O dobro de um número, mais 3, é 11. Qual é o número?", "alts": ["7", "8", "5", "4"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "2x + 3 = 11, então 2x = 8 e x = 4.", "passos": ["Monte a equação: o dobro de um número é 2x. Mais 3, igual a 11: 2x + 3 = 11.", "Subtraia 3 dos dois lados: 2x = 8.", "Divida por 2: x = 4. Confira: 2 × 4 + 3 = 11."], "pista": "Escreva com letra: o dobro do número é 2 vezes o número. Monte a equação e desfaça as operações uma de cada vez, sempre nos dois lados.", "alem": "Mude o enunciado para \"o triplo de um número, menos 2, é 13\" e resolva. Depois invente um problema parecido cuja resposta seja a mesma do problema original.", "erros": ["Esse valor não passa no teste do enunciado: o dobro de 7 é 14, e 14 + 3 dá 17, não 11. Monte a equação 2x + 3 = 11 antes de calcular.", "Você subtraiu 3 de 11 e parou. Esse 8 ainda é o dobro do número, e não o número. Falta mais uma operação.", "Você pode ter dividido 11 por 2 (5,5) e arredondado, ignorando o 3. Confira: o dobro de 5 mais 3 dá 13, não 11.", null]}], "mmcTool hantes, incógnita dos dois lados e problemas", "ideias": ["Distributiva: o número de fora multiplica cada termo de dentro. 3(x + 4) = 3x + 12.", "Cuidado com o sinal: −2(x − 3) = −2x + 6, porque menos vezes menos dá mais.", "Termos semelhantes têm a mesma letra: 4x e 9x podem ser somados; 4x e 9 não.", "Com x dos dois lados, leve as letras para um lado e os números para o outro.", "Em problema, escreva quem é x, monte a equação, resolva e confira na história."], "q": [{"id": "p7q0", "texto": "Qual é o resultado de 3(x + 4)?", "alts": ["3x + 12", "3x + 4", "3x + 7", "x + 12"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "O 3 multiplica cada termo: 3x + 12.", "pista": "Pense em três grupos iguais de (x + 4). Desenhe os três grupos e conte quantos x e quantos números aparecem ao todo.", "alem": "Escreva 3(x + 4) de outro jeito e teste as duas formas com dois valores de x que você escolher. Elas dão sempre o mesmo resultado? Invente outra expressão com parênteses que funcione da mesma maneira.", "erros": [null, "Você multiplicou o 3 só pelo x e deixou o 4 como estava. O 3 está fora dos parênteses e multiplica todos os termos de dentro, inclusive o número.", "Você somou o 3 ao 4 em vez de multiplicar. Um número colado na frente dos parênteses pede multiplicação, não soma. Teste com x = 1 na expressão original e na sua resposta.", "Você multiplicou o 3 só pelo 4 e esqueceu o x. Confira se o 3 multiplicou cada termo dentro dos parênteses, um por um."]}, {"id": "p7q1", "texto": "Quanto é −2(x − 3)?", "alts": ["2x + 6", "−2x − 6", "−2x + 6", "−2x − 3"], "certa": 2, "nivel": "Entrada", "tempo": 30, "just": "(−2) × x = −2x e (−2) × (−3) = +6.", "passos": ["O −2 multiplica cada termo dos parênteses.", "(−2) × x = −2x.", "(−2) × (−3) = +6. Resultado: −2x + 6."], "pista": "Multiplique −2 por cada termo de dentro, um de cada vez. Na segunda multiplicação, lembre a regra dos sinais para dois números negativos.", "alem": "Invente uma expressão do tipo número(x − número) cujo resultado tenha o termo sem letra positivo. Depois explique a um colega por que o sinal desse termo mudou.", "erros": ["Você acertou o segundo termo, mas perdeu o sinal de menos do −2 ao multiplicar pelo x. O −2 multiplica os dois termos, inclusive o primeiro.", "Você acertou o segundo termo, mas perdeu o sinal de menos do −2 ao multiplicar pelo x. O −2 multiplica os dois termos, inclusive o primeiro.", null, "Você multiplicou o −2 só pelo x e deixou o −3 como estava. O −2 multiplica também o segundo termo dos parênteses."]}, {"id": "p7q2", "texto": "Qual termo é semelhante a 4x?", "alts": ["9", "x + 9", "9x", "9y"], "certa": 2, "nivel": "Entrada", "tempo": 30, "just": "Termos semelhantes têm a mesma parte literal: 4x e 9x.", "pista": "Termos semelhantes têm a mesma parte com letra. Olhe a letra e o expoente de 4x e compare com cada opção.", "alem": "Escreva três termos semelhantes a 4x e um que não seja. Some 4x com cada um deles: com quais a soma vira um único termo? Explique por quê.", "erros": ["Você olhou só para o número. O 9 não tem letra e 4x tem. Para ser semelhante, a parte da letra precisa ser a mesma.", "Você viu o x, mas x + 9 tem dois termos, um com letra e outro sem. A pergunta é sobre um único termo com a mesma parte da letra de 4x.", null, "Você viu que há uma letra, mas ela é outra. A parte da letra de 4x é x e a de 9y é y. Letras diferentes não formam termos semelhantes."]}, {"id": "p7q3", "texto": "Resolva 2(x + 3) = 14.", "alts": ["x = 5,5", "x = 4", "x = 7", "x = 8"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "2x + 6 = 14, então 2x = 8 e x = 4.", "pista": "Comece desfazendo os parênteses: o 2 multiplica cada termo de dentro. Depois pense em como deixar x sozinho de um lado da igualdade.", "alem": "Resolva de dois jeitos: primeiro distribuindo o 2, depois dividindo os dois lados por 2 antes de qualquer outra conta. Compare os caminhos. Depois invente uma equação do tipo a(x + b) = c com a mesma solução.", "erros": ["Você multiplicou o 2 só pelo x e deixou o 3 sem multiplicar, ficando com 2x + 3 = 14. O 2 também multiplica o 3. Troque x pelo seu resultado na equação original para conferir.", null, "Você dividiu 14 por 2 e parou. Esse 7 é o valor de x + 3, não o de x. Falta um passo para deixar x sozinho.", "Você distribuiu o 2 e chegou a 2x = 8, mas parou antes de dividir por 2. Esse 8 é o valor de 2x, não o de x."]}, {"id": "p7q4", "texto": "Resolva 3(x − 2) = 15.", "alts": ["x = 5", "x = 6", "x = 9", "x = 7"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "3x − 6 = 15, então 3x = 21 e x = 7.", "pista": "Primeiro passo: distribua o 3 pelos dois termos dos parênteses. Depois desfaça as operações, na ordem contrária, até x ficar sozinho.", "alem": "Troque o 15 por outros números e resolva de novo. Para quais números do lado direito o valor de x dá inteiro? Descreva o padrão que você encontrou.", "erros": ["Você dividiu 15 por 3 e parou. Esse 5 é o valor de x − 2, e ainda falta desfazer o − 2.", "Esse valor não confere. Trocando x por 6, 3 × (6 − 2) dá 12 e não 15. Distribua o 3, isole 3x e só então ache x.", "Você distribuiu o 3 e chegou a 3x − 6 = 15, mas depois fez 15 − 6, em vez de somar 6 nos dois lados. Além disso, ainda faltaria dividir por 3.", null]}, {"id": "p7q5", "texto": "Resolva 5x + 3 = 2x + 15.", "alts": ["x = 2", "x = 12", "x = 6", "x = 4"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "3x = 12, então x = 4.", "passos": ["Tire 2x dos dois lados: 3x + 3 = 15.", "Subtraia 3 dos dois lados: 3x = 12.", "Divida por 3: x = 4. Confira: 5 × 4 + 3 = 23 e 2 × 4 + 15 = 23."], "pista": "Junte os termos com x de um lado e os números do outro. Lembre que, ao passar um termo para o outro lado, a operação se inverte.", "alem": "Resolva de novo passando as letras para o lado direito em vez do esquerdo e compare os caminhos. Depois invente outra equação com x dos dois lados que tenha a mesma solução.", "erros": ["Esse valor não confere. Trocando x por 2, o lado esquerdo vale 13 e o direito vale 19, que são diferentes. Revise como juntar os termos com x e os números.", "Você juntou certo as letras e os números, mas parou em 3x = 12. Falta dividir pelo número que multiplica x.", "Você passou o 3 para o lado direito somando, e não subtraindo, e chegou a 3x = 18. Ao trocar de lado, a operação se inverte.", null]}, {"id": "p7q6", "texto": "Resolva 4x − 1 = 3x + 6.", "alts": ["x = 1", "x = 7", "x = −7", "x = 5"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "4x − 3x = 6 + 1, então x = 7.", "pista": "Leve os termos com x para um lado e os números para o outro. Cuidado com o sinal do −1 quando ele trocar de lado.", "alem": "Mostre que 4x − 1 = 3x + 6 e x − 1 = 6 têm a mesma solução. Depois invente outra equação com x dos dois lados que também tenha essa solução.", "erros": ["Você fez 4 − 3 para achar o x, mas esqueceu de passar os números −1 e 6 para o outro lado e juntá-los.", null, "Esse valor não confere. Trocando x por −7, o lado esquerdo vale −29 e o direito vale −15. Confira o sinal do resultado ao passar os termos de lado.", "Você passou o −1 para o outro lado sem trocar o sinal e fez 6 − 1. Quando o −1 muda de lado, a operação se inverte."]}, {"id": "p7q7", "texto": "3 cadernos iguais e uma caneta de R$ 2 custam R$ 14. Qual é o preço de cada caderno?", "alts": ["R$ 4", "R$ 12", "R$ 4,67", "R$ 5"], "certa": 0, "nivel": "Raciocínio", "tempo": 90, "just": "3x + 2 = 14, então 3x = 12 e x = 4.", "pista": "Desenhe 3 cadernos e uma caneta. Do total pago, separe primeiro o que foi gasto com a caneta. O que sobrou é o preço dos 3 cadernos juntos.", "alem": "E se a caneta custasse outro valor, ou o total fosse outro? Troque os números e refaça. Depois invente um problema com 4 cadernos e uma caneta cuja resposta seja o mesmo preço de caderno deste problema.", "erros": [null, "Você tirou o preço da caneta do total, mas esse valor é o de todos os cadernos juntos. Falta dividir pelo número de cadernos.", "Você dividiu o total por 3 sem descontar a caneta. Os R$ 14 incluem a caneta, então ela precisa sair da conta antes de dividir.", "Esse valor não fecha: 3 cadernos de R$ 5 e uma caneta de R$ 2 dão R$ 17, e não R$ 14. Escreva a equação 3x + 2 = 14 e resolva por etapas."]}, {"id": "p7q8", "texto": "Ana tem o triplo da idade de Leo. Juntos têm 48 anos. Quantos anos tem Leo?", "alts": ["36 anos", "16 anos", "24 anos", "12 anos"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "x + 3x = 48, então 4x = 48 e x = 12.", "passos": ["Chame a idade de Leo de x. Ana tem o triplo: 3x.", "Juntos têm 48: x + 3x = 48, então 4x = 48.", "x = 12. Leo tem 12 anos e Ana tem 36. Confira: 12 + 36 = 48."], "pista": "Desenhe uma barra para a idade de Leo e, ao lado, três barras iguais para a de Ana. Quantas barras iguais há no total?", "alem": "E se Ana tivesse o dobro da idade de Leo, com os mesmos 48 anos juntos? Resolva. Depois resolva o problema original só com o desenho de barras, sem equação, e compare com o método da equação.", "erros": ["Esse valor serve para a idade de Ana, não para a de Leo. Releia o que a pergunta pede e confira qual das idades você calculou.", "Você dividiu 48 por 3, contando só as partes de Ana. A idade de Leo também entra na soma, então há mais partes iguais do que 3.", "Você dividiu 48 por 2, como se os dois tivessem a mesma idade. Mas Ana tem o triplo da idade de Leo, então as idades são diferentes.", null]}, {"id": "p7q9", "texto": "Uma locadora cobra R$ 30 fixos mais R$ 8 por dia. Com R$ 94, quantos dias dá para alugar?", "alts": ["8 dias", "12 dias", "15 dias", "7 dias"], "certa": 0, "nivel": "Raciocínio", "tempo": 90, "just": "30 + 8d = 94, então 8d = 64 e d = 8.", "pista": "Do total que você tem, separe primeiro a parte fixa, que é paga uma vez só. O que sobra é pago por dia. Quantas vezes o valor diário cabe nesse resto?", "alem": "E se você tivesse R$ 100? A divisão não dá exata: o que fazer com o dinheiro que sobra? Depois invente outra locadora, com valor fixo e valor por dia, e uma quantia que dê um número exato de dias.", "erros": [null, "Você parece ter dividido o total pelo valor diário (94 ÷ 8) e ignorado a parte fixa. Os R$ 30 são pagos uma vez e precisam sair do total antes de dividir.", "Você parece ter somado o valor fixo ao total em vez de subtraí-lo. Os R$ 30 já estão dentro do que você pode gastar, então devem ser descontados.", "Com 7 dias, o gasto é R$ 30 + 7 × 8 = R$ 86, menor que R$ 94. Confira se você aproveitou todo o dinheiro disponível."]}], "mmcTool": null, "dica": ["Faça um caderno de erros: copie a questão que errou, escreva onde errou e refaça três dias depois.", "Em problema, escreva primeiro \"x é ...\". Quem diz direito quem é o x já fez metade da questão."], "mapas": [3], "livro": [0, 21, 25], "kahoot": {"n": 7, "t": "Equações do 1º grau II: problemas e distributiva", "pin": "02522718", "url": "https://kahoot.it/challenge/02522718", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m1%200h1m1%200h1m2%200h4m1%200h1m3%200h7m-29%201h1m5%200h1m1%200h1m4%200h2m4%200h2m1%200h1m5%200h1m-29%201h1m1%200h3m1%200h1m1%200h2m1%200h1m1%200h1m1%200h2m1%200h3m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m2%200h1m2%200h1m1%200h2m1%200h1m1%200h2m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m2%200h4m2%200h3m2%200h1m1%200h3m1%200h1m-29%201h1m5%200h1m3%200h1m1%200h3m2%200h1m2%200h1m1%200h1m5%200h1m-29%201h7m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h7m-17%201h1m1%200h1m4%200h2m-21%201h1m2%200h6m1%200h1m1%200h4m1%200h1m1%200h1m1%200h1m2%200h1m1%200h3m-28%201h1m1%200h1m4%200h2m2%200h1m1%200h6m3%200h2m1%200h2m-27%201h7m1%200h1m4%200h3m3%200h1m1%200h1m3%200h1m-26%201h3m1%200h1m3%200h2m3%200h2m1%200h2m2%200h1m3%200h1m2%200h1m-28%201h3m2%200h1m1%200h3m1%200h4m4%200h1m1%200h2m4%200 h1m1%200h4m1%200h1m1%200h6m1%200h3m-37%201h1m1%200h3m1%200h1m5%200h1m1%200h1m5%200h6m1%200h1m1%200h2m3%200h1m1%200h1m-37%201h1m1%200h3m1%200h1m2%200h2m1%200h1m1%200h1m3%200h1m1%200h2m3%200h2m1%200h1m5%200h3m-37%201h1m5%200h1m3%200h2m1%200h1m1%200h2m5%200h3m1%200h1m1%200h3m1%200h2m2%200h1m-37%201h7m1%200h4m4%200h1m2%200h2m2%200h2m2%200h2m2%200h1m1%200h1m2%200h1%27%2F%3E%3C%2Fsvg%3E"}}, "deck": 3}, {"n": 8, "titulo": "Razão e proporcionalidade", "resumo": "proporção, grandezas diretas e inversas, regra de três e partilha proporcional", "ideias": ["Razão é uma comparação por divisão. Proporção é a igualdade de duas razões.", "Numa proporção, o produto em cruz é igual: em 2/3 = 4/6, 2 × 6 = 3 × 4.", "Diretamente proporcionais: quando uma dobra, a outra dobra (pães e preço).", "Inversamente proporcionais: quando uma dobra, a outra cai pela metade (máquinas e tempo).", "Na direta, ache o valor de 1 unidade e depois multiplique. Na inversa, o produto das duas grandezas fica igual."], "q": [{"id": "p8q0", "texto": "Qual igualdade forma uma proporção?", "alts": ["2/3 = 4/5", "1/2 = 2/5", "2/3 = 4/6", "2/3 = 3/4"], "certa": 2, "nivel": "Entrada", "tempo": 30, "just": "2 × 6 = 3 × 4: as razões são iguais.", "pista": "Proporção é uma igualdade entre duas razões. Para testar cada alternativa, simplifique as frações ou multiplique em cruz e compare os resultados.", "alem": "Invente uma proporção que não use a razão 2/3. Mostre dois jeitos diferentes de conferir que ela é mesmo uma proporção.", "erros": ["Você provavelmente somou 2 ao numerador e ao denominador. Para manter a razão, é preciso multiplicar os dois pelo mesmo número. Em cruz: 2 × 5 = 10 e 3 × 4 = 12, que são diferentes.", "Você provavelmente viu o numerador dobrar (de 1 para 2) e não conferiu o denominador: o dobro de 2 é 4, não 5. Em cruz: 1 × 5 = 5 e 2 × 2 = 4, que são diferentes.", null, "Você provavelmente somou 1 ao numerador e ao denominador de 2/3. Somar o mesmo número muda a razão. Multiplique em cruz: 2 × 4 = 8 e 3 × 3 = 9, que são diferentes."]}, {"id": "p8q1", "texto": "3 kg de arroz custam R$ 18. Qual é o preço de 1 kg?", "alts": ["R$ 54", "R$ 15", "R$ 6", "R$ 9"], "certa": 2, "nivel": "Entrada", "tempo": 30, "just": "18 ÷ 3 = 6.", "pista": "Você quer o preço de 1 kg. Pense em repartir o valor total em partes iguais, uma parte para cada quilo. Qual operação reparte?", "alem": "Invente outro preço total e outra quantidade de quilos que deem o mesmo preço por quilo. Depois ache um segundo jeito de chegar ao preço de 1 kg.", "erros": ["Você provavelmente fez 18 × 3. Isso daria o preço de 9 kg, uma quantidade maior que 3 kg. Para 1 kg, que é menos que 3 kg, o preço tem de ficar menor que R$ 18.", "Você provavelmente fez 18 − 3. O preço de 1 kg vem de repartir o total em partes iguais, e repartir é dividir, não subtrair.", null, "Você provavelmente fez 18 ÷ 2. Mas o total é de 3 kg, então a divisão é em 3 partes iguais. Confira: 3 kg a R$ 9 cada dariam 3 × 9 = 27, e não 18."]}, {"id": "p8q2", "texto": "Quais grandezas são DIRETAMENTE proporcionais?", "alts": ["Idade de uma pessoa e sua altura", "Número de operários e dias para o mesmo serviço", "Velocidade e tempo na mesma viagem", "Quantidade de pães e preço total, com o mesmo preço por pão"], "certa": 3, "nivel": "Entrada", "tempo": 30, "just": "Dobrando os pães, dobra o preço: a razão preço ÷ pães é constante.", "pista": "Imagine dobrar uma das grandezas de cada par. A outra dobra também, diminui ou muda sem regra? Faça esse teste com cada alternativa.", "alem": "Invente um par de grandezas do dia a dia que seja diretamente proporcional e outro que seja inversamente proporcional. Explique como testar cada um dobrando uma das grandezas.", "erros": ["Em geral quem fica mais velho cresce, mas sem uma regra fixa. Teste: com o dobro da idade, a altura dobra? Na relação direta, dobrar uma grandeza dobra a outra sempre.", "Você pode ter pensado que mais operários significam mais trabalho junto. Teste: se o número de operários dobra para o mesmo serviço, o que acontece com os dias? Veja se as duas sobem ou se uma sobe e a outra desce.", "Você pode ter pensado que as duas grandezas variam juntas. Teste: na mesma viagem, se a velocidade dobra, o que acontece com o tempo? Veja se as duas sobem ou se uma sobe e a outra desce.", null]}, {"id": "p8q3", "texto": "Na proporção 2/3 = x/12, qual é o valor de x?", "alts": ["18", "8", "10", "6"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "3x = 24, então x = 8.", "passos": ["Multiplique em cruz: 3 × x = 2 × 12.", "3x = 24.", "x = 8. Outro caminho: o 3 virou 12 (vezes 4), então o 2 vira 2 × 4 = 8."], "pista": "Compare os denominadores: por qual número o 3 foi multiplicado para chegar ao 12? Faça a mesma coisa com o numerador, ou use a multiplicação em cruz.", "alem": "Resolva de dois jeitos (multiplicação em cruz e razões equivalentes) e compare. Depois troque o 12 por outro número e descubra para quais valores x continua sendo inteiro.", "erros": ["Você provavelmente fez 12 × 3 ÷ 2, invertendo a razão. Como 2/3 é menor que 1, x tem de ser menor que 12.", null, "Você provavelmente fez 12 − 2. Em proporção a relação é de multiplicação, não de subtração. Confira: 10/12 simplificado dá 5/6, que é diferente de 2/3.", "Você provavelmente fez 12 ÷ 2. O denominador foi de 3 para 12, que é multiplicar por 4. O numerador precisa ser multiplicado pelo mesmo número."]}, {"id": "p8q4", "texto": "2 máquinas fazem um serviço em 6 h. Em quantas horas 4 máquinas fazem o mesmo serviço?", "alts": ["3 h", "12 h", "8 h", "4 h"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "Grandezas inversas: o produto 2 × 6 = 12 é constante. 12 ÷ 4 = 3.", "passos": ["Mais máquinas, menos tempo: as grandezas são inversamente proporcionais.", "Nas inversas, o produto fica igual: 2 × 6 = 12.", "Com 4 máquinas: 4 × tempo = 12, então o tempo é 3 h."], "pista": "Com mais máquinas trabalhando juntas, o serviço leva mais ou menos tempo? Use isso para decidir se a resposta fica maior ou menor que 6 h antes de calcular.", "alem": "Invente uma situação do dia a dia com grandezas inversas e escreva um problema parecido com este. Mostre que, nela, o produto das duas grandezas não muda.", "erros": [null, "Você provavelmente tratou como relação direta: dobrou as máquinas e dobrou as horas (6 × 2). Com mais máquinas o serviço leva menos tempo, então o resultado deve ser menor que 6 h.", "Você provavelmente somou 2 às 6 horas, usando a diferença entre 4 e 2 máquinas. Com mais máquinas o tempo não aumenta: ele diminui.", "Você provavelmente fez 6 − 2, usando a diferença entre as máquinas. O tempo não muda por subtração. Confira: 4 máquinas × 4 h = 16 e 2 máquinas × 6 h = 12. O trabalho total não seria o mesmo."]}, {"id": "p8q5", "texto": "Se 5 cadernos custam R$ 40, quanto custam 8 cadernos?", "alts": ["R$ 45", "R$ 48", "R$ 53", "R$ 64"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "40 ÷ 5 = 8 por caderno. 8 × 8 = 64.", "pista": "Descubra primeiro o preço de 1 caderno e depois use esse valor para a nova quantidade. Uma tabela com duas colunas, cadernos e preço, pode ajudar.", "alem": "Resolva de outro jeito, por tabela ou por regra de três, e compare os resultados. Depois invente outra pergunta com os mesmos dados, por exemplo quantos cadernos dá para comprar com um certo valor.", "erros": ["Você provavelmente fez 40 + 5. Na proporção, cada caderno a mais custa o mesmo preço. Confira: 3 cadernos a mais custariam apenas R$ 5?", "Você provavelmente fez 40 + 8, usando a quantidade de cadernos como se fosse dinheiro. Confira: 3 cadernos a mais custariam apenas R$ 8?", "Você provavelmente somou os três números do enunciado (40 + 5 + 8). Preço e quantidade não se somam. Primeiro ache o preço de 1 caderno e depois repita esse valor.", null]}, {"id": "p8q6", "texto": "Dividindo 30 na razão 2 : 3, quais são as partes?", "alts": ["20 e 30", "12 e 18", "15 e 15", "10 e 20"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "2 + 3 = 5 partes. 30 ÷ 5 = 6. Então 12 e 18.", "pista": "Some os números da razão para saber em quantas partes iguais o 30 será repartido. Depois descubra quanto vale cada parte.", "alem": "Escolha outra razão para dividir 30 e resolva. Existe alguma razão em que as duas partes ficam iguais? Qual?", "erros": ["Esses números estão na razão 2 : 3, mas somam 50, e o total a repartir é 30. Confira se as partes, somadas, formam o todo.", null, "Você provavelmente dividiu 30 ao meio e ignorou a razão. Partes iguais correspondem à razão 1 : 1, não à razão 2 : 3.", "Você provavelmente dividiu 30 por 3 e deu 1 parte a um lado e 2 partes ao outro. Isso é a razão 1 : 2. Na razão 2 : 3, um lado tem 2 partes e o outro tem 3."]}, {"id": "p8q7", "texto": "Uma receita para 4 pessoas usa 300 g de farinha. Para 10 pessoas, quanto?", "alts": ["750 g", "1.200 g", "600 g", "306 g"], "certa": 0, "nivel": "Raciocínio", "tempo": 90, "just": "300 ÷ 4 = 75 g por pessoa. 75 × 10 = 750 g.", "passos": ["Ache a quantidade para 1 pessoa: 300 ÷ 4 = 75 g.", "Multiplique por 10 pessoas: 75 × 10 = 750 g."], "pista": "Descubra quanta farinha cada pessoa usa. Depois repita essa quantidade para o novo número de pessoas.", "alem": "Resolva de outro jeito, por exemplo achando a farinha para 2 pessoas e juntando grupos, e compare. Depois invente uma receita nova com a mesma ideia e peça a um colega para resolver.", "erros": [null, "Você provavelmente fez 300 × 4, usando o número de pessoas da receita como multiplicador. A farinha de cada pessoa vem de dividir 300 por 4, e não de multiplicar.", "Você provavelmente dobrou a farinha (300 × 2). Mas de 4 para 10 pessoas o grupo não dobrou; dobrar daria 8 pessoas. Confira por quanto o número de pessoas cresceu.", "Você provavelmente somou 6, a diferença entre 10 e 4 pessoas, aos 300 g. Isso daria só 1 g a mais por pessoa nova. Cada pessoa a mais precisa de uma porção inteira de farinha."]}, {"id": "p8q8", "texto": "Um carro a 60 km/h faz o trajeto em 4 h. A 80 km/h, em quanto tempo?", "alts": ["2 h", "3 h", "6 h", "5 h"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "O trajeto é 240 km. 240 ÷ 80 = 3 h.", "pista": "Antes de comparar as velocidades, descubra a distância do trajeto usando a primeira viagem. Depois pense em quanto tempo leva para percorrer essa mesma distância na nova velocidade.", "alem": "Monte uma tabela com pelo menos três outras velocidades e o tempo do trajeto em cada uma. O que acontece com o tempo quando a velocidade aumenta?", "erros": ["Você provavelmente dividiu o tempo por 2, como se a velocidade tivesse dobrado. Mas 80 não é o dobro de 60. Confira: 80 × 2 = 160, bem menos que 60 × 4 = 240.", null, "Você provavelmente fez o tempo aumentar com a velocidade. Confira: 80 × 6 = 480 e 60 × 4 = 240. O trajeto é o mesmo, então as distâncias deviam ser iguais.", "Você provavelmente fez o tempo aumentar junto com a velocidade. Velocidade maior faz o mesmo trajeto em menos tempo, então o resultado deve ser menor que 4 h."]}, {"id": "p8q9", "texto": "Um app cobra R$ 10 fixos mais R$ 5 por km. Preço e distância são diretamente proporcionais?", "alts": ["Não: com 0 km já se paga R$ 10, então a razão não é constante", "Não: o preço diminui quando a distância aumenta", "Sim: toda grandeza que cresce junto é proporcional", "Sim: aumentando a distância, o preço também aumenta"], "certa": 0, "nivel": "Raciocínio", "tempo": 90, "just": "Para ser direta, 0 km deveria custar 0. Com taxa fixa, a razão preço ÷ km muda.", "pista": "Calcule o preço para 1 km, 2 km e 4 km. Depois divida cada preço pela distância correspondente e veja se o resultado é sempre o mesmo.", "alem": "Mude o app: que taxa fixa e que valor por km fariam o preço ser diretamente proporcional à distância? Dê mais de um exemplo e explique.", "erros": [null, "O preço não diminui: cada km a mais soma R$ 5. Confira o que o enunciado diz e teste se a razão preço ÷ distância é a mesma para 1 km e para 2 km.", "Você generalizou a ideia de crescer juntas. Mas há grandezas que crescem juntas sem ser proporcionais, como a idade e a altura de uma criança. Teste: dobrar os km dobra o preço?", "Você viu que o preço cresce com a distância e concluiu que é proporcional. Crescer junto não basta: a razão preço ÷ distância precisa ser sempre a mesma. Calcule para 1 km e para 2 km e compare."]}], "mmcTool": null, "dica": ["Monte uma tabela de duas colunas com as grandezas e pergunte: se uma dobra, a outra dobra ou cai pela metade? Se não acontece nem uma coisa nem outra, não é proporção.", "Mais máquinas trabalhando e MAIS tempo para terminar o mesmo serviço? Não faz sentido: releia."], "mapas": [11], "livro": [1, 11, 20], "kahoot": {"n": 8, "t": "Razão e proporcionalidade", "pin": "07656761", "url": "https://kahoot.it/challenge/07656761", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m1%200h1m1%200h1m2%200h2m2%200h2m3%200h7m-29%201h1m5%200h1m3%200h2m1%200h2m1%200h1m2%200h2m1%200h1m5%200h1m-29%201h1m1%200h3m1%200h1m2%200h4m2%200h3m2%200h1m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m1%200h2m3%200h1m2%200h2m2%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m1%200h2m4%200h2m2%200h1m3%200h1m1%200h3m1%200h1m-29%201h1m5%200h1m1%200h1m1%200h1m1%200h1m6%200h1m2%200h1m5%200h1m-29%201h7m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h7m-21%201h1m2%200h3m3%200h2m-19%201h1m3%200h1m1%200h8m2%200h2m1%200h7m2%200h1m-27%201h1m2%200h1m4%200h1m1%200h4m1%200h2m3%200h7m-29%201h2m1%200h1m2%200h2m2%200h3m2%200h1m2%200h1m5%200h1m3%200h1m-27%201h2m3%200h1m1%200h3m2%200h1m2%200h1m6%200h2m1%200h2m-29%201h1m2%200h1m1%200h2m3%200h2m1%200h2m1%200h2m2%200h2m5%200h1m-28%201h2m1%200h1m1%200h1m1%200h3m1%200h1m3%200h1m2%200h1m2%200h8m-28%201h1m1%200h4m4%200h1m1%200h4m1%200h1m1%200h1m1%200h2m1%200h2m1%200h1m-29%20 200h5m1%200h1m3%200h1m-37%201h7m1%200h1m1%200h1m5%200h3m3%200h1m1%200h4m1%200h2m1%200h5%27%2F%3E%3C%2Fsvg%3E"}}, "deck": 4}, {"n": 9, "titulo": "Porcentagem", "resumo": "porcentagem como fração e decimal, cálculo mental, acréscimos e descontos", "ideias": ["Porcentagem é uma fração de denominador 100: 25% = 25/100 = 1/4.", "Atalhos: 50% é a metade, 25% é a quarta parte, 10% é dividir por 10 e 1% é dividir por 100.", "Monte as outras a partir de 10%: 5% é metade de 10%; 15% é 10% + 5%; 30% é 3 vezes 10%.", "Aumento: calcule a porcentagem e some ao valor. Desconto: calcule e subtraia.", "Leia a pergunta até o fim: ela pode pedir o preço final ou só o valor do desconto."], "q": [{"id": "p9q0", "texto": "25% é o mesmo que:", "alts": ["1/4", "1/25", "25/10", "2/5"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "25% = 25/100 = 1/4.", "pista": "Porcentagem quer dizer \"por cem\". Escreva 25% como uma fração com denominador 100 e veja se dá para simplificar.", "alem": "Escreva 50%, 75% e 20% como frações simplificadas e procure um padrão. Depois invente outra porcentagem que vire uma fração com numerador 1.", "erros": [null, "Você usou o 25 como denominador e deixou de lado o 100. Porcentagem é sempre \"sobre 100\": confira se a fração 25/100 pode ser simplificada.", "Você dividiu por 10 em vez de por 100. Confira o denominador: \"por cento\" quer dizer \"por 100\".", "Parece que você juntou os dígitos 2 e 5 numa fração. Ela equivale a 40/100, ou seja, 40%, e não 25%. Passe a fração para denominador 100 e compare com o enunciado."]}, {"id": "p9q1", "texto": "Quanto é 10% de 80?", "alts": ["10", "70", "8", "0,8"], "certa": 2, "nivel": "Entrada", "tempo": 30, "just": "10% é a décima parte: 80 ÷ 10 = 8.", "pista": "10% quer dizer 10 em cada 100, ou seja, 1 parte em cada 10. Que conta separa 80 em 10 partes iguais?", "alem": "Calcule 10% de 80, de 350 e de 45. Que regra rápida você notou? Use essa regra para calcular 30% de 250 de dois jeitos e compare.", "erros": ["Você copiou o número da porcentagem. 10% é uma parte do 80, e não o próprio 10. Confira por qual número dividir o todo.", "Você tirou 10 unidades de 80 (80 − 10). Isso é subtrair um número, e não calcular uma porcentagem do total.", null, "Você dividiu 80 por 100, o que dá 1%. Para 10%, confira por qual número se divide: 10% é a décima parte."]}, {"id": "p9q2", "texto": "Quanto é 50% de 90?", "alts": ["140", "45", "18", "40"], "certa": 1, "nivel": "Entrada", "tempo": 30, "just": "50% é a metade: 45.", "pista": "50% é 50 em cada 100. Que parte do todo isso representa? Escreva como fração e simplifique.", "alem": "Ache 50% de 36 e de 7. Depois invente uma situação do dia a dia em que 50% de algo não dê um número inteiro e explique o que fazer.", "erros": ["Você somou 50 a 90. Porcentagem de um valor é uma parte desse valor, e não o valor mais a porcentagem.", null, "Parece que você dividiu 90 por 5, o que dá 20% de 90. Confira por qual número se divide para obter 50%.", "Você subtraiu 50 de 90. Porcentagem não é tirar um número: é pegar uma parte do total. Confira qual fração do 90 corresponde a 50%."]}, {"id": "p9q3", "texto": "Quanto é 5% de 80?", "alts": ["40", "5", "8", "4"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "5% é metade de 10%: metade de 8 = 4.", "pista": "Se você sabe quanto é 10% de 80, use isso. Como o 5 se relaciona com o 10?", "alem": "Calcule 5% de 80 de dois jeitos: pela metade de 10% e por 5 × 1%. Compare. Depois escolha um preço em reais em que 5% dê um valor sem vírgula.", "erros": ["Você tomou a metade de 80, que é 50%. O enunciado fala em 5%, e não em 50%.", "Você copiou o número da porcentagem. 5% é uma parte do 80, e não o próprio 5.", "Esse valor é 10% de 80. Você parou no primeiro passo. Confira: 5% é maior ou menor que 10%?", null]}, {"id": "p9q4", "texto": "Quanto é 15% de 80?", "alts": ["20", "12", "15", "8"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "15% = 10% + 5% = 8 + 4 = 12.", "passos": ["Comece por 10% de 80: 80 ÷ 10 = 8.", "5% é a metade de 10%: 4.", "15% = 10% + 5% = 8 + 4 = 12."], "pista": "Separe 15% em duas porcentagens que você sabe calcular de cabeça. Calcule cada uma e junte os resultados.", "alem": "Calcule 15% de 80 de outro jeito (por exemplo, 3 × 5%, ou 15 × 1%) e compare. Depois invente um problema com 15% cuja resposta seja um número inteiro.", "erros": ["Você pode ter somado 15 + 5, tratando as porcentagens como se fossem o resultado. Esse valor é 25% de 80. Calcule 10% e 5% de 80 separadamente e junte.", null, "Você copiou o número da porcentagem. 15% é uma parte do 80. Confira quanto vale 10% de 80 e some o que falta.", "Esse valor é só 10% de 80. Você calculou uma parte e não somou o restante dos 15%."]}, {"id": "p9q5", "texto": "Quanto é 25% de 200?", "alts": ["25", "100", "50", "175"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "25% é a quarta parte: 200 ÷ 4 = 50.", "pista": "Lembre qual fração 25% representa. Divida o 200 em partes iguais de acordo com o denominador dela.", "alem": "Calcule 25% de 200, de 60 e de 1.000. Qual é a regra? Depois explique a um colega como achar 75% de um número usando o 25%.", "erros": ["Você copiou o número da porcentagem. 25% é uma parte do 200. Confira qual fração do todo isso é.", "Você tomou a metade de 200, que é 50%. Confira: 25% é a metade de 50%.", null, "Você subtraiu 25 de 200. Porcentagem é uma parte do total, e não o total menos um número."]}, {"id": "p9q6", "texto": "Um produto de R$ 80 teve aumento de 10%. Qual é o novo preço?", "alts": ["R$ 88", "R$ 8", "R$ 90", "R$ 72"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "10% de 80 = 8. Novo preço: 80 + 8 = 88.", "passos": ["10% de 80 é 8.", "É um aumento, então some: 80 + 8 = 88.", "O novo preço é R$ 88."], "pista": "Primeiro descubra quanto vale 10% de 80 reais. Depois pense: o preço sobe ou desce? O que você faz com esse valor?", "alem": "E se o aumento fosse de 15%? Calcule o novo preço de dois jeitos. Depois teste: se o preço sobe 10% e depois baixa 10%, ele volta ao valor inicial?", "erros": [null, "Você achou só o valor do aumento. A pergunta quer o novo preço, então falta um passo depois de calcular os 10%.", "Você somou 10 reais ao preço, usando o número da porcentagem como se fosse reais. Confira quanto vale 10% de 80.", "Você achou o valor de 10% de 80, mas subtraiu do preço em vez de somar. Aumento faz o preço subir: confira a operação."]}, {"id": "p9q7", "texto": "Uma blusa de R$ 120 tem desconto de 15%. Qual é o preço final?", "alts": ["R$ 18", "R$ 102", "R$ 105", "R$ 138"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "15% de 120 = 18. Preço final: 120 − 18 = 102.", "passos": ["10% de 120 é 12. 5% é a metade: 6. Então 15% é 12 + 6 = 18.", "É um desconto, então subtraia: 120 − 18 = 102.", "O preço final é R$ 102."], "pista": "Descubra quanto vale 10% de 120 e quanto vale 5%, e junte. Depois pense: o desconto faz o preço subir ou descer?", "alem": "Ache o preço final por outro caminho: calcule quanto por cento do preço a pessoa ainda paga e multiplique. Depois invente um desconto de 20% em outro produto e resolva.", "erros": ["Esse valor é o do desconto. A pergunta quer o preço final, então falta um passo depois de achar o desconto.", null, "Você tirou 15 reais do preço, usando o número da porcentagem como se fosse reais. Confira quanto vale 15% de 120.", "Você somou o desconto ao preço. Desconto faz o preço diminuir: confira a operação."]}, {"id": "p9q8", "texto": "Numa turma de 40 alunos, 30% vão de bicicleta. Quantos alunos vão de bicicleta?", "alts": ["30", "10", "28", "12"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "10% de 40 = 4. Então 30% = 12.", "pista": "Ache quanto vale 10% de 40. Depois pense em quantos grupos de 10% cabem em 30%.", "alem": "Na mesma turma de 40, 30% vão de bicicleta e 20% a pé. Quantos alunos vão de outro jeito? Que porcentagem da turma eles são? Resolva por mais de um caminho.", "erros": ["Você copiou o número da porcentagem. 30% é uma parte dos 40 alunos. Confira quanto vale 10% de 40.", "Você subtraiu 30 de 40. Porcentagem é uma parte do total, e não o total menos um número.", "Esse valor corresponde a 70% de 40, os alunos que não vão de bicicleta. Releia o que a pergunta quer saber.", null]}, {"id": "p9q9", "texto": "Uma geladeira custa R$ 1.000. À vista, há 8% de desconto. Quanto se economiza?", "alts": ["R$ 1.008", "R$ 920", "R$ 80", "R$ 8"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "8% de 1.000 = 80. O preço final seria R$ 920, mas a economia é R$ 80.", "pista": "Releia o que a pergunta quer saber. Para o cálculo, comece descobrindo quanto vale 1% de 1.000.", "alem": "Calcule o preço final com desconto de 8% e com desconto de 12%. Em qual caso a economia passa de R$ 100? Depois invente outro produto com desconto de 8% e resolva.", "erros": ["Você somou 8 reais ao preço. Desconto não aumenta o preço, e 8% não é 8 reais: confira o que fazer com a porcentagem.", "Esse valor é o preço final depois do desconto. A pergunta quer a economia, isto é, só o valor do desconto.", null, "Parece que você usou o 8 da porcentagem como se fosse reais. Confira quanto vale 1% de 1.000 antes de multiplicar por 8."]}], "mmcTool": null, "dica": ["Guarde só três atalhos: 50% é a metade, 10% é dividir por 10 e 1% é dividir por 100. O resto você monta com eles.", "Veja o que a pergunta quer: o valor do desconto ou o preço final? As duas respostas costumam estar nas alternativas."], "mapas": [12], "livro": [1, 21, 30], "kahoot": {"n": 9, "t": "Porcentagem", "pin": "07823068", "url": "https://kahoot.it/challenge/07823068", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m2%200h3m2%200h1m1%200h4m2%200h7m-29%201h1m5%200h1m3%200h1m4%200h4m3%200h1m5%200h1m-29%201h1m1%200h3m1%2 e 90°. Confira se 90° é menor que 90° ou se é exatamente esse valor.", "Ângulo raso é o de meia-volta, que forma uma linha reta e mede 180°. Confira se a medida da pergunta é essa."]}, {"id": "p10q1", "texto": "Dois ângulos complementares somam:", "alts": ["180°", "90°", "45°", "360°"], "certa": 1, "nivel": "Entrada", "tempo": 30, "just": "Complementares somam 90°. Suplementares somam 180°.", "pista": "Complementar e suplementar são nomes parecidos. Um deles completa o canto de um esquadro e o outro completa uma linha reta. Qual palavra a pergunta usa?", "alem": "Escreva três pares de ângulos complementares com medidas diferentes. Depois faça o mesmo para ângulos suplementares e compare o que muda entre os dois casos.", "erros": ["Você provavelmente trocou complementar por suplementar. Esse total é o dos suplementares, que formam meia-volta. Confira qual das duas palavras a pergunta usa.", null, "Você pode ter dado a medida de um dos ângulos quando os dois são iguais, e não a soma dos dois. A pergunta pede o total dos dois juntos.", "Esse total é o de uma volta completa. Dois ângulos complementares, lado a lado, não fecham uma volta. Confira o que a palavra complementar significa."]}, {"id": "p10q2", "texto": "Um ângulo de 120° é:", "alts": ["reto", "raso", "agudo", "obtuso"], "certa": 3, "nivel": "Entrada", "tempo": 30, "just": "Maior que 90° e menor que 180° é obtuso.", "pista": "Compare 120° com 90° e com 180°. Ele está antes do 90°, no 90° ou entre o 90° e o 180°?", "alem": "Escreva uma medida de ângulo obtuso e uma de ângulo agudo que, somadas, deem 180°. Existe só um par assim? Quantos você consegue achar?", "erros": ["Ângulo reto mede exatamente 90°, o canto do esquadro. Confira se 120° é igual a 90°.", "Ângulo raso mede 180°, a meia-volta. Confira se 120° chega a esse valor.", "Ângulo agudo é menor que 90°. Confira se 120° está abaixo ou acima de 90°.", null]}, {"id": "p10q3", "texto": "Os ângulos internos de um triângulo somam:", "alts": ["90°", "270°", "180°", "360°"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "A soma dos ângulos internos de qualquer triângulo é 180°.", "pista": "Desenhe um triângulo no papel, pinte os três cantos, recorte e junte os cantos lado a lado. Que figura eles formam juntos?", "alem": "Desenhe três triângulos bem diferentes (por exemplo, um com um canto reto e um com um canto obtuso), meça os ângulos com o transferidor e some. O que você percebe? Por que as somas podem sair um pouco diferentes?", "erros": ["Esse total é o de dois ângulos complementares, ou o de um único canto reto. O triângulo tem três ângulos. Confira se a soma dos três ficaria tão pequena.", "Você pode ter pensado em 3 × 90°, como se os três ângulos fossem retos. Um triângulo não pode ter três ângulos retos. Confira com o desenho.", null, "Esse total é o de uma volta completa, e também o do quadrilátero. O triângulo tem só três cantos. Confira com o desenho se os três cantos fecham uma volta."]}, {"id": "p10q4", "texto": "Dois ângulos de um triângulo medem 50° e 60°. Quanto mede o terceiro?", "alts": ["110°", "130°", "70°", "80°"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "180° − 50° − 60° = 70°.", "passos": ["Os três ângulos internos de um triângulo somam 180°.", "Some os dois conhecidos: 50° + 60° = 110°.", "O terceiro é o que falta: 180° − 110° = 70°."], "pista": "Some os dois ângulos que você já conhece. Depois pense: o total dos três ângulos de um triângulo é um valor conhecido. Quanto falta para chegar nele?", "alem": "Troque 50° e 60° por outras duas medidas e calcule o terceiro ângulo. Existe algum par de medidas que torna o triângulo impossível? Teste e explique o motivo.", "erros": ["Você somou 50° + 60° e parou aí. Essa soma é só o que já está usado. Falta descontar do total do triângulo.", "Você tirou do total só um dos ângulos conhecidos, o de 50°. Os dois já estão no triângulo, então os dois precisam ser descontados.", null, "Você pode ter descontado o 50° duas vezes, em vez de descontar o 50° e o 60°. Confira se usou os dois ângulos do enunciado e depois some os três ângulos para testar."]}, {"id": "p10q5", "texto": "Qual é o suplemento de 65°?", "alts": ["25°", "105°", "115°", "295°"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "180° − 65° = 115°.", "pista": "Ângulos suplementares formam juntos meia-volta, uma linha reta. Que conta dá o ângulo que falta para completar essa linha?", "alem": "Escolha três medidas de ângulo e ache o complemento e o suplemento de cada uma. Existe alguma medida que não tem complemento? Qual e por quê?", "erros": ["Você calculou o complemento, que completa o canto reto. A pergunta pede o suplemento, que completa a meia-volta.", "Você pode ter errado a subtração ao fazer a conta. Confira somando: 65° mais a sua resposta tem de fechar a meia-volta.", null, "Você completou uma volta inteira. O suplemento completa só a meia-volta, que é a metade disso."]}, {"id": "p10q6", "texto": "Um triângulo isósceles tem 40° no vértice. Quanto mede cada ângulo da base?", "alts": ["70°", "40°", "35°", "140°"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "180° − 40° = 140°, dividido em dois ângulos iguais: 70°.", "passos": ["Tire o ângulo do vértice: 180° − 40° = 140°.", "No triângulo isósceles, os dois ângulos da base são iguais.", "Divida por 2: 140° ÷ 2 = 70°."], "pista": "No triângulo isósceles, os dois ângulos da base são iguais. Primeiro descubra quanto sobra para os dois juntos, depois pense em como repartir.", "alem": "Troque o ângulo do vértice por 20°, 80° e 100° e ache a base. O que acontece com a base quando o vértice aumenta? Existe um vértice que deixa os três ângulos iguais?", "erros": [null, "Você repetiu o ângulo do vértice. Nada obriga a base a ter a mesma medida do vértice. Confira se os três ângulos assim somam o total do triângulo.", "Você pode ter dividido duas vezes, ou por 4. Há só dois ângulos na base, então a divisão é uma só. Confira somando os três ângulos.", "Você achou quanto sobra para os dois ângulos da base juntos, mas a pergunta pede a medida de cada um. Falta repartir esse valor."]}, {"id": "p10q7", "texto": "Qual é a soma dos ângulos internos de um quadrilátero?", "alts": ["180°", "360°", "540°", "720°"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "Uma diagonal divide o quadrilátero em 2 triângulos: 2 × 180° = 360°.", "pista": "Desenhe um quadrilátero e trace uma diagonal. Quantos triângulos aparecem? Quanto soma cada triângulo?", "alem": "Descubra a soma dos ângulos internos de um hexágono dividindo-o em triângulos de dois jeitos diferentes e compare os resultados. Se conseguir, escreva uma regra para qualquer polígono.", "erros": ["Esse é o total de um único triângulo. O quadrilátero é maior. Confira em quantos triângulos ele se divide.", null, "Esse é o total de uma figura com 3 triângulos, como o pentágono. O quadrilátero tem menos lados. Confira quantos triângulos cabem nele.", "Esse é o total de uma figura com 4 triângulos, como o hexágono. O quadrilátero tem menos lados. Refaça a contagem com o desenho."]}, {"id": "p10q8", "texto": "Num triângulo, um ângulo interno mede 70°. Quanto mede o ângulo externo ao lado dele?", "alts": ["70°", "20°", "290°", "110°"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "Interno e externo juntos formam um ângulo raso: 180° − 70° = 110°.", "passos": ["O ângulo interno e o externo ao lado dele formam um ângulo raso: 180°.", "180° − 70° = 110°."], "pista": "Prolongue um lado do triângulo e marque o ângulo interno e o externo. Eles ficam lado a lado sobre uma reta. Que conta ligaria os dois?", "alem": "Escolha três medidas de ângulo interno e ache o externo de cada uma. O que acontece com o externo quando o interno aumenta? Existe um interno igual ao seu externo?", "erros": ["Você repetiu a medida do ângulo interno. O externo é outro ângulo, que fica ao lado dele. Confira se os dois juntos formam uma linha reta.", "Você calculou o complemento, que completa o canto reto. Interno e externo juntos formam uma reta, não um canto reto.", "Você completou uma volta inteira. Interno e externo formam só meia-volta, que é a metade disso.", null]}, {"id": "p10q9", "texto": "Um pentágono convexo se divide em 3 triângulos. Qual é a soma dos ângulos internos?", "alts": ["720°", "600°", "360°", "540°"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "3 × 180° = 540°.", "pista": "A pergunta já diz em quantos triângulos o pentágono se divide. Lembre quanto soma cada triângulo e junte tudo.", "alem": "Se todos os ângulos do pentágono fossem iguais, como você descobriria a medida de cada um? Faça o mesmo com o quadrilátero e com o hexágono (que se divide em 4 triângulos) e compare os resultados.", "erros": ["Esse é o total de uma figura com 4 triângulos, como o hexágono. O enunciado fala em 3 triângulos. Confira quantos você usou na conta.", "Esse valor não é múltiplo de 180°. Somar triângulos inteiros sempre dá um múltiplo de 180°. Confira a multiplicação.", "Esse é o total de uma figura com 2 triângulos, como o quadrilátero. O enunciado fala em 3 triângulos. Confira quantos você usou na conta.", null]}], "mmcTool": null, "dica": ["Desenhe a figura no rascunho e escreva nela os ângulos que você já sabe. Geometria se resolve olhando.", "Guarde três somas: 90° (complementares), 180° (suplementares e triângulo) e 360° (quadrilátero)."], "mapas": [13], "livro": [1, 1, 10], "kahoot": {"n": 10, "t": "Ângulos", "pin": "04084818", "url": "https://kahoot.it/challenge/04084818", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m4%200h1m2%200h1m1%200h4m2%200h7m-29%201h1m5%200h1m1%200h1m1%200h2m1%200h1m1%200h1m1%200h3m2%200h1m5%200h1m-29%201h1m1%200h3m1%200h1m4%200h2m1%200h1m1%200h1m1%200h1m3%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200 200h1m1%200h1m1%200h2m3%200h1m1%200h1m1%200h3m-37%201h1m3%200h1m3%200h1m3%200h2m1%200h1m2%200h1m1%200h1m1%200h3m3%200h2m-30%201h1m1%200h1m1%200h1m1%200h1m4%200h3m1%200h5m4%200h2m1%200h2m2%200h1m1%200h4m-37%201h1m1%200h1m1%200h1m2%200h1m1%200h2m1%200h4m2%200h4m4%200h3m1%200h2m1%200h1m1%200h1m-36%201h1m1%200h2m2%200h2m2%200h1m1%200h1m2%200h1m1%200h1m1%200h4m1%200h3m1%200h5m1%200h1m1%200h1m-29%201h2m1%200h2m1%200h1m3%200h2m3%200h1m3%200h2m3%200h2m-34%201h7m6%200h4m1%200h1m3%200h1m1%200h1m3%200h1m1%200h1m1%200h1m1%200h3m-37%201h1m5%200h1m1%200h4m1%200h1m6%200h1m5%200h1m1%200h1m3%200h2m-34%201h1m1%200h3m1%200h1m1%200h2m2%200h4m2%200h1m1%200h4m1%200h8m1%200h3m-37%201h1m1%200h3m1%200h1m1%200h1m1%200h2m2%200h3m6%200h3m2%200h3m1%200h2m2%200h1m-37%201h1m1%200h3m1%200h1m1%200h1m1%200h2m5%200h1m2%200h2m2%200h3m1%200h1m4%200h4m-37%201h1m5%200h1m2%200h1m2%200h1m3%200h1m1%200h1m2%200h3m2%200h3m3%200h1m3%200h1m-37%201h7m1%200h2m1%200h1m4%200h3m3%200h1m1%200h4m1%200h2m1%200h5%27%2F%3E%3C%2Fsvg%3E"}}, "deck": 5}, {"n": 11, "titulo": "Áreas e perímetros", "resumo": "perímetro, área do retângulo, quadrado e triângulo, decomposição e unidades", "ideias": ["Perímetro é o contorno: some todos os lados. A unidade é cm ou m.", "Área é a superfície. A unidade é cm² ou m².", "Retângulo: base × altura. Quadrado: lado × lado.", "Triângulo: base × altura ÷ 2 (metade do retângulo de mesma base e altura).", "Figura composta: separe em figuras conhecidas, calcule cada área e some."], "q": [{"id": "p11q0", "texto": "Qual é o perímetro de um retângulo de 7 cm por 2 cm?", "alts": ["28 cm", "18 cm", "14 cm", "9 cm"], "certa": 1, "nivel": "Entrada", "tempo": 30, "just": "7 + 2 + 7 + 2 = 18 cm.", "pista": "Desenhe o retângulo e escreva a medida de cada um dos quatro lados. O perímetro é o tamanho do contorno inteiro, como o caminho de uma formiga que dá uma volta na borda.", "alem": "Desenhe outro retângulo com o mesmo perímetro, mas com lados de medidas diferentes. Quantos você consegue achar? A área deles é sempre igual?", "erros": ["Você pode ter somado quatro vezes o 7, como se todos os lados medissem 7 cm, ou dobrado o resultado de 7 × 2. Os lados menores têm outra medida. Some cada lado com a sua própria medida.", null, "Você provavelmente fez 7 × 2, que é a conta da área. Perímetro é a soma das medidas dos quatro lados. Confira se você somou o contorno.", "Você somou 7 + 2 e usou só dois lados. O retângulo tem quatro lados, e os lados opostos são iguais. Confira se cada lado entrou na soma."]}, {"id": "p11q1", "texto": "Qual é a área de um retângulo de 7 cm por 2 cm?", "alts": ["14 cm²", "9 cm²", "14 cm", "18 cm²"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "Base × altura = 7 × 2 = 14 cm².", "pista": "Imagine o retângulo cortado em quadradinhos de 1 cm por 1 cm. Quantos quadradinhos cabem em uma fileira? Quantas fileiras há? Que conta resume isso?", "alem": "Invente dois retângulos diferentes com a mesma área deste. Depois confira se o perímetro deles é igual ao deste ou se muda.", "erros": [null, "Você somou 7 + 2. Essa soma não conta os quadradinhos que cobrem a figura. Confira qual operação dá o total de quadradinhos em fileiras iguais.", "Esse número vem de uma conta que combina com a ideia de área, mas a unidade ficou de comprimento. Área mede quadradinhos de 1 cm por 1 cm, então a unidade precisa mostrar isso. Confira o expoente da unidade.", "Você provavelmente somou os quatro lados (7 + 2 + 7 + 2), que dá o perímetro, e escreveu a unidade da área. Área mede a superfície, e isso pede uma multiplicação."]}, {"id": "p11q2", "texto": "Qual é a área de um quadrado de lado 6 cm?", "alts": ["24 cm²", "36 cm", "36 cm²", "12 cm²"], "certa": 2, "nivel": "Entrada", "tempo": 30, "just": "Lado × lado = 6 × 6 = 36 cm².", "pista": "No quadrado, a base e a altura têm a mesma medida. Pense em quantos quadradinhos de 1 cm cabem em uma fileira e em quantas fileiras iguais cabem.", "alem": "O que acontece com a área se o lado do quadrado dobrar? Teste com o lado de 6 cm e com outros lados, e explique o que você percebeu.", "erros": ["Você provavelmente fez 4 × 6, somando os quatro lados, o que dá o perímetro. Área pede outra ideia: quadradinhos que cobrem a superfície em fileiras iguais.", "A conta pode estar certa, mas a unidade ficou de comprimento. Área usa unidade ao quadrado, porque mede quadradinhos. Confira a unidade que você escreveu.", null, "Você pode ter feito 6 + 6 ou 2 × 6. Isso usa só duas medidas de lado e não cobre a superfície. Confira se a conta representa fileiras de quadradinhos."]}, {"id": "p11q3", "texto": "Qual é a área de um triângulo de base 6 cm e altura 4 cm?", "alts": ["10 cm²", "20 cm²", "24 cm²", "12 cm²"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "(6 × 4) ÷ 2 = 12 cm².", "passos": ["A área do triângulo é base × altura ÷ 2.", "6 × 4 = 24.", "24 ÷ 2 = 12 cm²."], "pista": "Desenhe um retângulo de 6 cm de base e 4 cm de altura e trace uma diagonal. Que parte do retângulo cada triângulo ocupa?", "alem": "Desenhe dois triângulos diferentes com a mesma base e a mesma altura deste. Eles têm a mesma área? Explique como você sabe.", "erros": ["Você somou 6 + 4. A soma das medidas não dá a área de uma figura. Confira qual operação conta os quadradinhos que cobrem a superfície.", "Você pode ter somado 6 + 4 e dobrado o resultado, que é a conta do contorno de um retângulo de 6 cm por 4 cm. Contorno é perímetro, e a pergunta é sobre superfície.", "Você multiplicou base por altura e parou aí. Esse valor é a área de um retângulo de 6 cm por 4 cm. Confira se o triângulo ocupa a figura inteira ou só uma parte dela.", null]}, {"id": "p11q4", "texto": "Um terreno retangular tem 8 m por 5 m. Quantos metros de cerca para contorná-lo?", "alts": ["13 m", "40 m", "18 m", "26 m"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "Perímetro = 8 + 5 + 8 + 5 = 26 m.", "pista": "Cerca que contorna é uma volta completa na borda do terreno. Desenhe o terreno, marque 8 m e 5 m e pense em quais outros lados também têm essas medidas.", "alem": "Se a cerca tiver uma porteira de 2 m que não precisa de cerca, de quanto será a cerca? Invente outra situação com o mesmo terreno e mostre a conta.", "erros": ["Você somou 8 + 5 e contou só dois lados. O terreno tem quatro lados, e os lados opostos são iguais. Confira se cada lado entrou na conta.", "Você multiplicou 8 × 5, que dá a área do terreno. A cerca percorre o contorno, então a medida pedida é um comprimento, não uma superfície.", "Você provavelmente somou três lados, como 8 + 5 + 5, e deixou um de fora. Confira se os quatro lados foram contados.", null]}, {"id": "p11q5", "texto": "A área de um retângulo é 48 cm² e a base mede 8 cm. Qual é a altura?", "alts": ["56 cm", "40 cm", "12 cm", "6 cm"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "48 ÷ 8 = 6 cm.", "passos": ["No retângulo, área = base × altura. Então 48 = 8 × altura.", "Use a operação inversa: altura = 48 ÷ 8 = 6 cm."], "pista": "Área é base × altura. Aqui você conhece o total e uma das medidas. Pergunte-se: 8 vezes quanto dá 48?", "alem": "Invente um retângulo com outra base e a mesma área de 48 cm². Quantos retângulos diferentes, com medidas inteiras, existem? Liste os que achar.", "erros": ["Você provavelmente fez 48 + 8. Somar não desfaz uma multiplicação. Confira se 8 vezes esse valor dá a área do enunciado.", "Você provavelmente fez 48 − 8. Como a área vem de uma multiplicação, a operação inversa para achar a altura é outra. Confira multiplicando de volta por 8.", "Esse valor não vem de dividir 48 por 8. Você pode ter dividido por outro número ou estimado. Confira multiplicando de volta: 8 × 12 dá 96, e não 48.", null]}, {"id": "p11q6", "texto": "1 m² equivale a quantos cm²?", "alts": ["10.000 cm²", "100.000 cm²", "100 cm²", "1.000 cm²"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "1 m = 100 cm, então 1 m² = 100 × 100 = 10.000 cm².", "pista": "Desenhe um quadrado de 1 m de lado e escreva o lado em centímetros. Depois pense em quantas fileiras de quadradinhos de 1 cm cabem nele e quantos quadradinhos há em cada fileira.", "alem": "Quantos mm² há em 1 cm²? E em 1 m²? Procure uma regra que funcione para os três casos (m² para cm², cm² para mm², m² para mm²) e explique para um colega.", "erros": [null, "Você pode ter multiplicado 100 por 1.000. Os dois lados do quadrado medem o mesmo número de centímetros, então os dois fatores devem ser iguais. Confira cada lado.", "Você usou 1 m = 100 cm, mas só uma vez. Um metro quadrado é um quadrado com dois lados de 1 m, então a conversão vale para os dois lados.", "Você pode ter usado o fator 1.000, que aparece em outras conversões, como metros e quilômetros. Entre metro e centímetro o fator é outro. Confira o fator e quantas vezes ele entra na conta."]}, {"id": "p11q7", "texto": "Uma figura junta, sem sobreposição, um retângulo de 6 m por 4 m e um quadrado de 2 m de lado. Qual é a área total?", "alts": ["26 m²", "28 m²", "24 m²", "32 m²"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "Retângulo: 24 m². Quadrado: 4 m². Total: 28 m².", "passos": ["Separe a figura em duas partes: o retângulo e o quadrado.", "Retângulo: 6 × 4 = 24 m². Quadrado: 2 × 2 = 4 m².", "Some as áreas: 24 + 4 = 28 m²."], "pista": "Calcule a área de cada figura separada e depois junte as duas. Como as figuras não se sobrepõem, nada precisa ser descontado.", "alem": "Desenhe outra figura formada por um retângulo e um quadrado com a mesma área total desta. Mostre as medidas que você escolheu.", "erros": ["Você parece ter somado a medida do lado do quadrado (2) à área do retângulo, em vez da área do quadrado. Calcule antes a área do quadrado e só depois some.", null, "Você calculou só a área do retângulo. A figura também tem um quadrado, e a área dele precisa entrar na soma. Confira se as duas partes foram contadas.", "Você provavelmente somou 8 em vez da área do quadrado. O 8 aparece em 4 × 2, que é o contorno do quadrado. Para a área, use o lado vezes ele mesmo."]}, {"id": "p11q8", "texto": "Uma sala de 5 m por 4 m será coberta com pisos de 1 m² cada. Quantos pisos?", "alts": ["9", "40", "20", "18"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "Área = 5 × 4 = 20 m². Cada piso cobre 1 m².", "pista": "Imagine a sala dividida em quadrados de 1 m por 1 m, cada um coberto por um piso. Quantos quadrados formam uma fileira? Quantas fileiras existem?", "alem": "E se cada piso medisse 2 m² em vez de 1 m²? Quantos pisos seriam necessários? Compare com este caso e explique o que mudou.", "erros": ["Você somou 5 + 4. Essa soma não conta os quadrados que cobrem o chão. Pense em fileiras iguais de pisos e na operação que conta todos eles.", "Esse valor é o dobro do que cabe na sala, como se cada piso cobrisse só meio metro quadrado. Confira o que o enunciado diz sobre a área de cada piso e se alguma conta a mais entrou.", null, "Você provavelmente somou os quatro lados (5 + 4 + 5 + 4), que dá o perímetro. Para cobrir o chão, o que importa é a superfície, não o contorno."]}, {"id": "p11q9", "texto": "Um triângulo e um retângulo têm base de 10 cm e altura de 6 cm. Qual é a área do triângulo?", "alts": ["30 cm², metade da área do retângulo", "60 cm², igual à área do retângulo", "16 cm², pois soma base e altura", "120 cm², o dobro da área do retângulo"], "certa": 0, "nivel": "Raciocínio", "tempo": 90, "just": "O retângulo tem 60 cm². O triângulo tem (10 × 6) ÷ 2 = 30 cm².", "pista": "Calcule primeiro a área do retângulo de 10 cm por 6 cm. Depois desenhe nele uma diagonal e pense: que parte do retângulo cada triângulo ocupa?", "alem": "Desenhe um retângulo e um triângulo com a mesma base e a mesma altura, mas com outras medidas. A relação entre as áreas continua igual? Teste com dois exemplos.", "erros": [null, "Você calculou base × altura e deu esse valor ao triângulo. Mas o triângulo cabe dentro do retângulo e não o preenche por inteiro. Confira que parte do retângulo ele ocupa.", "Você somou 10 + 6. A soma das medidas não dá a área de uma figura. Confira qual operação conta os quadradinhos que cobrem a superfície.", "Você parece ter multiplicado por 2 em vez de repartir. O triângulo cabe dentro do retângulo, então a área dele não pode ser maior que a do retângulo. Confira o que a conta faz com o valor."]}], "mmcTool": null, "dica": ["Antes da conta, diga em voz alta: a pergunta quer o contorno (perímetro) ou a superfície (área)?", "Olhe a unidade das alternativas: cm e m medem comprimento, como o perímetro; cm² e m² medem área."], "mapas": [14], "livro": [0, 1, 2], "kahoot": {"n": 11, "t": "Áreas e perímetros", "pin": "04235791", "url": "https://kahoot.it/challenge/04235791", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m1%200h1m2%200h1m1%200h4m1%200h1m3%200h7m-29%201h1m5%200h1m1%200h4m1%200h2m1%200h1m2%200h2m1%200h1m5%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m2%200h1m1%200h1m1%200h2m1%200h3m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m2%200h1m2%200h1m1%200h1m2%200h1m1%200h2m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m1%200h5m2%200h3m2%200h1m1%200h3m1%200h1m-29%201h1m5%200h1m5%200h3m2%200h1m2%200h1m1%200h1m5%200h1m-29%201h7m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h7m-19%201h1m1%200h1m1%200h1m4%200h2m-21%201h1m2%200h6m3%200h3m2%200h1m1%200h1m1%200h1m2%200h1m1%200h3m-27%201h3m4%200h4m1%200h6m3%200h2m1%200h2m-27%201h1m2%200h3m2%200h3m2%200h3m3%200h1m1%200h1m3%200h1m-27%201h1m4%200h1m2%200h2m4%200h2m1%200h2m2%200h1m3%200h1m2%200h1m-25%201h1m1%200h1m1%200h1m1%200h2m1%200h3m4%200h1m1%200h2m4%200h1m-29%201h2m3%200h1m3%200h4m2%200h1m2%200h1m2%200h8m-26%201h2m1%200h3m1%200h3m1%200h2m1%200h1m1%200h2m1%200h1m1%200h1m1%200h1m1%200h1m-29%201h2m6%200h1m2%200h1m1%200h2m4%200h2m1%200h1m3%200h1m1%200h1m-29%201h1m1%200h1m1%200h3m5%200h1m2%200h2m3%200h2m1%
