a, qual é a medida do ângulo x?", "tipo": "numero", "aceitas": ["50", "x=50"], "unidade": "°", "opcoes": [], "certa": -1, "resolucao": "Os ângulos do triângulo somam 180°. Então x = 180° − 90° − 40° = 50°."}, {"imp": 256, "rotulo": "Questão 21", "pergunta": "Com A = 48° e B = 67°, quais são as medidas do ângulo externo e do interno em C?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["85° e 95°", "115° e 65°", "132° e 48°", "180° e 0°"], "certa": 1, "resolucao": "O externo é a soma dos internos não adjacentes: 48° + 67° = 115°. O interno em C é suplementar a ele: 180° − 115° = 65°."}, {"imp": 257, "rotulo": "Questão 22", "pergunta": "Qual é a sequência V ou F das quatro afirmações sobre quadriláteros e ângulos?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V, V, F, F.", "V, F, V, F.", "F, V, V, F.", "V, F, F, V."], "certa": 1, "resolucao": "I é verdadeira (4 ângulos internos). II é falsa: a soma é 360°, não 180°. III é verdadeira (interno e externo do mesmo vértice somam 180°). IV é falsa: suplementares somam 180°. Sequência V, F, V, F."}, {"imp": 257, "rotulo": "Questão 23", "pergunta": "Relacione os termos (ângulo interno, externo, complementares, suplementares) com as descrições.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["1–C, 2–D, 3–A, 4–B.", "1–D, 2–C, 3–A, 4–B.", "1–C, 2–D, 3–B, 4–A.", "1–A, 2–B, 3–C, 4–D."], "certa": 0, "resolucao": "Interno é o formado dentro do polígono (C). Externo é o formado ao prolongar um lado (D). Complementares somam 90° (A). Suplementares somam 180° (B)."}, {"imp": 257, "rotulo": "Questão 24", "pergunta": "Num quadrilátero com ângulos (x + 20)°, (2x + 10)°, 90° e 120°, qual é x e quais são os quatro ângulos?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 30; ângulos: 50°, 70°, 90°, 120°", "x = 40; ângulos: 60°, 90°, 90°, 120°", "x = 50; ângulos: 70°, 110°, 90°, 120°", "x = 60; ângulos: 80°, 130°, 90°, 120°"], "certa": 1, "resolucao": "A soma é 360°: (x + 20) + (2x + 10) + 90 + 120 = 360, então 3x + 240 = 360, 3x = 120 e x = 40. Os ângulos são 60°, 90°, 90° e 120°."}, {"imp": 257, "rotulo": "Questão 25", "pergunta": "Qual é a medida do ângulo externo formado ao prolongar um lado de um retângulo, em um canto de 90°?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["35°", "40°", "75°", "90°"], "certa": 3, "resolucao": "O ângulo externo é suplementar ao interno: 180° − 90° = 90°."}, {"imp": 257, "rotulo": "Questão 26", "pergunta": "Num quadrilátero com ângulos 95°, 120°, (x + 15)° e (x + 10)°, qual é x e quais são os quatro ângulos?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A soma é 360°: 95 + 120 + (x + 15) + (x + 10) = 360, então 2x + 240 = 360 e x = 60. Os ângulos são 95°, 120°, 75° e 70°."}, {"imp": 258, "rotulo": "Questão 27", "pergunta": "Em um triângulo, dois ângulos internos medem 38° e 72°. Qual é o terceiro ângulo interno?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["60°", "70°", "80°", "90°"], "certa": 1, "resolucao": "A soma dos ângulos internos de um triângulo é 180°. Somando 38° + 72° = 110°, o terceiro mede 180° − 110° = 70°."}, {"imp": 258, "rotulo": "Questão 28", "pergunta": "Um quadrilátero tem ângulos 90°, (2x + 20)°, 110° e (3x + 30)°. Qual é o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["22", "35", "42", "50"], "certa": 0, "resolucao": "A soma dos ângulos de um quadrilátero é 360°. Então 90 + 2x + 20 + 110 + 3x + 30 = 360, ou seja, 5x + 250 = 360, 5x = 110 e x = 22."}, {"imp": 258, "rotulo": "Questão 29", "pergunta": "Em um triângulo, o ângulo externo mede 110° e um dos ângulos internos não adjacentes mede 45°. Quanto mede o outro ângulo interno não adjacente?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["55°", "60°", "65°", "70°"], "certa": 2, "resolucao": "O ângulo externo é igual à soma dos dois internos não adjacentes. Então 110° = 45° + outro, e o outro mede 110° − 45° = 65°."}, {"imp": 259, "rotulo": "Questão 30", "pergunta": "Um quadrilátero tem três ângulos internos de 90°, 95° e 110°. Quanto medem o quarto ângulo interno e o externo adjacente a ele?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Interno 55° e externo 125°.", "Interno 85° e externo 95°.", "Interno 75° e externo 105°.", "Interno 65° e externo 115°."], "certa": 3, "resolucao": "A soma dos ângulos do quadrilátero é 360°. O quarto ângulo mede 360° − (90° + 95° + 110°) = 360° − 295° = 65°. O externo adjacente completa 180°: 180° − 65° = 115°."}, {"imp": 259, "rotulo": "Questão 31", "pergunta": "O ângulo externo de um triângulo mede (3x + 15)° e os internos não adjacentes medem (x + 25)° e (x + 10)°. Qual é x e quanto mede o interno adjacente ao externo?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 15 e interno adjacente = 120°.", "x = 20 e interno adjacente = 105°.", "x = 25 e interno adjacente = 100°.", "x = 30 e interno adjacente = 90°."], "certa": 1, "resolucao": "O externo é a soma dos dois internos não adjacentes: 3x + 15 = (x + 25) + (x + 10) = 2x + 35, então x = 20. O externo mede 3 × 20 + 15 = 75°, e o interno adjacente mede 180° − 75° = 105°."}, {"imp": 259, "rotulo": "Questão 32", "pergunta": "Classifique como V ou F as seis afirmações (I a VI) sobre ângulos de triângulos e quadriláteros.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "I) V: a soma dos ângulos de um triângulo é 180°. II) V: externo e interno adjacente são suplementares. III) V: o externo é a soma dos dois internos não adjacentes. IV) F: no quadrilátero a soma é 360°. V) F: eles são suplementares, não complementares. VI) V: dois retos somam 180°, e os outros dois completam 360° − 180° = 180°. Resposta: V, V, V, F, F, V."}, {"imp": 260, "rotulo": "Questão 2", "pergunta": "Calcule o valor desconhecido da proporção x/8 = 9/12.", "tipo": "numero", "aceitas": ["6", "x=6"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Multiplicando em cruz: 12 × x = 8 × 9 = 72. Então x = 72 ÷ 12 = 6."}, {"imp": 260, "rotulo": "Questão 3", "pergunta": "Ligue cada quantidade de farinha (a: 2 kg, b: 1/2 kg, c: 1,5 kg, d: 200 g) ao fermento da coluna B (5, 2, 20, 15 colheres), na ordem em que a coluna B aparece.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "São 10 colheres de fermento por 1 kg de farinha. 1/2 kg dá 5 colheres, 200 g (0,2 kg) dá 2 colheres, 2 kg dá 20 colheres e 1,5 kg dá 15 colheres. A coluna B, de cima para baixo, fica: b, d, a, c."}, {"imp": 260, "rotulo": "Questão 4", "pergunta": "Na mistura de 2 medidas de tinta azul para 3 de amarela, quantas latas de amarela são necessárias para usar 6 latas de azul?", "tipo": "numero", "aceitas": ["9"], "unidade": "latas", "opcoes": [], "certa": -1, "resolucao": "A razão é 2 azul para 3 amarela. Com 6 latas de azul (2 × 3), a amarela também é multiplicada por 3: 3 × 3 = 9 latas."}, {"imp": 260, "rotulo": "Questão 5", "pergunta": "Se 4 convites custam R$ 10,00, quantos convites podem ser comprados com R$ 35,00, mantendo o preço por convite?", "tipo": "numero", "aceitas": ["14"], "unidade": "convites", "opcoes": [], "certa": -1, "resolucao": "Cada convite custa 10 ÷ 4 = R$ 2,50. Com R$ 35,00 compram-se 35 ÷ 2,5 = 14 convites."}, {"imp": 260, "rotulo": "Questão 6", "pergunta": "Uma caneta custa R$ 4,00 (preço constante). Quanto custam 6 canetas?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 20,00", "R$ 22,00", "R$ 24,00", "R$ 26,00"], "certa": 2, "resolucao": "O preço é proporcional à quantidade: 6 × R$ 4,00 = R$ 24,00."}, {"imp": 261, "rotulo": "Questão 7", "pergunta": "Analisar três afirmações sobre a tabela tempo × distância do atleta (V ou F).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V, V, V.", "V, F, V.", "F, V, F.", "F, F, V."], "certa": 0, "resolucao": "400÷2 = 200, 1 000÷5 = 200 e 1 600÷8 = 200. A razão é sempre a mesma, então distância e tempo são diretamente proporcionais e as três afirmações são verdadeiras: V, V, V."}, {"imp": 261, "rotulo": "Questão 8", "pergunta": "Relacionar o número de porções com a quantidade de farinha da receita.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["I – 1 xícara; II – 3 xícaras; III – 5 xícaras.", "I – 2 xícaras; II – 3 xícaras; III – 4 xícaras.", "I – 5 xícaras; II – 1 xícara; III – 3 xícaras.", "I – 2 xícaras; II – 3 xícaras; III – 5 xícaras."], "certa": 0, "resolucao": "2 xícaras servem 4 porções, então 1 xícara serve 2 porções. Logo 2 porções = 1 xícara, 6 porções = 3 xícaras e 10 porções = 5 xícaras: I – 1; II – 3; III – 5."}, {"imp": 261, "rotulo": "Questão 9", "pergunta": "Quanto custa ficar 5 horas no estacionamento a R$ 6,00 por hora?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 24,00", "R$ 30,00", "R$ 36,00", "R$ 42,00"], "certa": 1, "resolucao": "Cada hora custa R$ 6,00, então 5 horas custam 5 × 6 = 30. Resposta: R$ 30,00."}, {"imp": 261, "rotulo": "Questão 10", "pergunta": "Quantos km o ônibus percorre em 45 minutos, se faz 12 km em 30 minutos?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["15 km", "18 km", "20 km", "24 km"], "certa": 1, "resolucao": "Em 30 minutos são 12 km, então em 15 minutos são 6 km. Em 45 minutos (30 + 15): 12 + 6 = 18 km."}, {"imp": 261, "rotulo": "Questão 11", "pergunta": "Completar a tabela de canteiros e mudas plantadas (4 canteiros = 48 mudas).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["72 e 108", "64 e 96", "60 e 120", "56 e 84"], "certa": 0, "resolucao": "48 ÷ 4 = 12 mudas por canteiro. Para 6 canteiros: 6 × 12 = 72. Para 9 canteiros: 9 × 12 = 108."}, {"imp": 262, "rotulo": "Questão 12", "pergunta": "Quantas camisetas 10 máquinas produzem em um turno, se 4 máquinas produzem 60?", "tipo": "numero", "aceitas": ["150"], "unidade": "camisetas", "opcoes": [], "certa": -1, "resolucao": "60 ÷ 4 = 15 camisetas por máquina. Com 10 máquinas: 10 × 15 = 150 camisetas."}, {"imp": 262, "rotulo": "Questão 13", "pergunta": "Analisar três afirmações sobre a produção de 4 bicicletas a cada 2 horas (V ou F).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V, V, V.", "V, F, F.", "F, V, V.", "V, F, V."], "certa": 3, "resolucao": "4 ÷ 2 = 2 bicicletas por hora (V). Em 6 horas são 6 × 2 = 12, e não 14 (F). Dobrando o tempo, a produção dobra (V). Resposta: V, F, V."}, {"imp": 262, "rotulo": "Questão 14", "pergunta": "Quantos sacos de ração chegam em 4 caminhões, se 7 caminhões trazem 84 sacos?", "tipo": "numero", "aceitas": ["48"], "unidade": "sacos", "opcoes": [], "certa": -1, "resolucao": "84 ÷ 7 = 12 sacos por caminhão. Em 4 caminhões: 4 × 12 = 48 sacos."}, {"imp": 262, "rotulo": "Questão 15", "pergunta": "Dizer se pagamento e horas são diretamente proporcionais, pela tabela (3 h = 90, 5 h = 140, 7 h = 200).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Sim, porque os valores aumentam juntos.", "Sim, porque a diferença entre pagamentos é constante.", "Não, porque a razão pagamento/horas não é constante.", "Não, porque o pagamento deveria diminuir."], "certa": 2, "resolucao": "90 ÷ 3 = 30, 140 ÷ 5 = 28 e 200 ÷ 7 é cerca de 28,6. As razões são diferentes, então não são diretamente proporcionais."}, {"imp": 262, "rotulo": "Questão 16", "pergunta": "Qual a quantidade de composto para 480 kg de terra, na proporção composto/terra = 5/12?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["160 kg", "180 kg", "200 kg", "240 kg"], "certa": 2, "resolucao": "480 ÷ 12 = 40. Então o composto é 5 × 40 = 200 kg."}, {"imp": 263, "rotulo": "Questão 17", "pergunta": "Em qual situação as grandezas são inversamente proporcionais?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Quantidade de camisetas compradas e valor total pago, considerando o mesmo preço por camiseta.", "Número de trabalhadores e tempo necessário para concluir o mesmo serviço.", "Quantidade de litros colocados em um recipiente e volume de líquido nele.", "Número de páginas lidas e total de páginas já lidas de um livro."], "certa": 1, "resolucao": "Quanto mais trabalhadores, menos tempo para terminar o mesmo serviço: uma grandeza aumenta e a outra diminui. Nas outras opções as duas crescem juntas."}, {"imp": 263, "rotulo": "Questão 18", "pergunta": "O que vale para duas grandezas inversamente proporcionais?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["aumentam e diminuem juntas.", "o quociente entre valores correspondentes é constante.", "o produto entre valores correspondentes é constante.", "uma não depende da outra."], "certa": 2, "resolucao": "Em grandezas inversamente proporcionais, o produto dos valores correspondentes é sempre o mesmo (por exemplo, 4 × 15 = 60 e 6 × 10 = 60)."}, {"imp": 263, "rotulo": "Questão 19", "pergunta": "Quantas pessoas fazem em 10 horas a tarefa que 4 pessoas fazem em 15 horas?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5", "6", "8", "10"], "certa": 1, "resolucao": "Pessoas e horas são inversamente proporcionais: 4 × 15 = 60. Então x × 10 = 60, e x = 6 pessoas."}, {"imp": 263, "rotulo": "Questão 20", "pergunta": "Em quantas horas 9 máquinas imprimem o lote que 5 máquinas imprimem em 18 horas?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["6 horas", "8 horas", "10 horas", "15 horas"], "certa": 2, "resolucao": "Máquinas e horas são inversamente proporcionais: 5 × 18 = 90. Então 9 × x = 90, e x = 10 horas."}, {"imp": 263, "rotulo": "Questão 21", "pergunta": "Por quantos dias o pacote de ração alimenta 5 cachorros, se alimenta 3 por 30 dias?", "tipo": "numero", "aceitas": ["18"], "unidade": "dias", "opcoes": [], "certa": -1, "resolucao": "Mais cachorros, menos dias (inversa). 3 × 30 = 90 porções no pacote; com 5 cachorros: 90 ÷ 5 = 18 dias."}, {"imp": 263, "rotulo": "Questão 22", "pergunta": "Classificar como V ou F três afirmações sobre regra de três simples.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V – V – F.", "V – F – V.", "F – V – F.", "V – F – F."], "certa": 0, "resolucao": "I é verdadeira: a regra de três acha um valor desconhecido. II é verdadeira: serve para grandezas direta ou inversamente proporcionais. III é falsa: só se usa quando as grandezas têm relação. Resposta: V – V – F."}, {"imp": 264, "rotulo": "Questão 24", "pergunta": "Preço de 10 cadernos sabendo que 4 custam R$ 32,00.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 64,00", "R$ 72,00", "R$ 78,00", "R$ 80,00"], "certa": 3, "resolucao": "Cada caderno custa 32 ÷ 4 = R$ 8,00. Então 10 cadernos custam 10 × 8 = R$ 80,00."}, {"imp": 264, "rotulo": "Questão 25", "pergunta": "Número de viagens com 6 veículos, sabendo que 2 veículos fazem 9 viagens.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2", "3", "6", "12"], "certa": 1, "resolucao": "Mais veículos, menos viagens: as grandezas são inversamente proporcionais. O total é 2 × 9 = 18, e 18 ÷ 6 = 3 viagens."}, {"imp": 264, "rotulo": "Questão 26", "pergunta": "Quais afirmações sobre 8 máquinas que fazem o serviço em 15 horas são verdadeiras.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Apenas I e II são verdadeiras.", "Apenas I, III e IV são verdadeiras.", "Apenas II, III e IV são verdadeiras.", "Apenas I e IV são verdadeiras."], "certa": 1, "resolucao": "Máquinas e tempo são inversamente proporcionais, então II é falsa. I e III são verdadeiras. Em IV, 8 × 15 = 120 e 120 ÷ 12 = 10 horas, verdadeira. Resposta: I, III e IV."}, {"imp": 265, "rotulo": "Questão 27", "pergunta": "Explicar a diferença entre grandezas diretamente e inversamente proporcionais.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Diretamente proporcionais: aumentam ou diminuem juntas, na mesma proporção. Inversamente proporcionais: quando uma aumenta, a outra diminui na mesma proporção."}, {"imp": 265, "rotulo": "Questão 28", "pergunta": "Classificar as três relações (camisetas e valor, caixas e livros por caixa, idade e calçado).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["I não proporcional; II inversamente proporcional; III diretamente proporcional.", "I inversamente proporcional; II diretamente proporcional; III não proporcional.", "I diretamente proporcional; II não proporcional; III inversamente proporcional.", "I diretamente proporcional; II inversamente proporcional; III não proporcional."], "certa": 3, "resolucao": "Com preço fixo, mais camisetas custam mais: direta. Mais caixas, menos livros em cada uma: inversa. Idade e número do calçado não seguem proporção. Resposta: direta, inversa, não proporcional."}, {"imp": 265, "rotulo": "Questão 29", "pergunta": "Classificar como V ou F as quatro afirmações sobre proporcionalidade.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V, V, F, V.", "V, F, V, V.", "F, F, V, V.", "V, F, F, V."], "certa": 1, "resolucao": "I é verdadeira. II é falsa, pois na inversa, se uma aumenta, a outra diminui. III é verdadeira. IV é verdadeira. Sequência: V, F, V, V."}, {"imp": 265, "rotulo": "Questão 30", "pergunta": "Valor total de 7 pacotes de folhas a R$ 18,00 cada.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 106,00", "R$ 116,00", "R$ 126,00", "R$ 136,00"], "certa": 2, "resolucao": "Multiplique o preço pelo número de pacotes: 7 × 18 = R$ 126,00."}, {"imp": 265, "rotulo": "Questão 31", "pergunta": "Fichas por grupo ao dividir 30 fichas igualmente entre 10 grupos.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2", "3", "4", "5"], "certa": 1, "resolucao": "O total de fichas não muda: 30. Com 10 grupos, cada um recebe 30 ÷ 10 = 3 fichas."}, {"imp": 266, "rotulo": "Questão 32", "pergunta": "Associar cada situação (8 cadernos; 10 envelopes) ao seu resultado (64 ou 4).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["1-A, 2-B.", "1-B, 2-A.", "1-A, 2-A.", "1-B, 2-B."], "certa": 0, "resolucao": "Situação 1: cada caderno custa 24 ÷ 3 = 8, e 8 × 8 = 64 (A). Situação 2: são 5 × 8 = 40 cartões, e 40 ÷ 10 = 4 cartões por envelope (B). Resposta: 1-A, 2-B."}, {"imp": 266, "rotulo": "Questão 33", "pergunta": "Metros de fita para 25 lembrancinhas, sabendo que 4 metros fazem 10.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["8 metros", "9 metros", "10 metros", "12 metros"], "certa": 2, "resolucao": "Cada lembrancinha usa 4 ÷ 10 = 0,4 m. Para 25: 25 × 0,4 = 10 metros."}, {"imp": 266, "rotulo": "Aula 22, Questão 1", "pergunta": "Porcentagem correspondente ao decimal 0,25.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2,5%", "25%", "250%", "0,25%"], "certa": 1, "resolucao": "Multiplique o decimal por 100: 0,25 × 100 = 25%."}, {"imp": 266, "rotulo": "Aula 22, Questão 2", "pergunta": "Quantas de 60 pessoas preferem estudar pela manhã, sendo 50% delas.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["20", "25", "30", "50"], "certa": 2, "resolucao": "50% é a metade: 60 ÷ 2 = 30 pessoas."}, {"imp": 266, "rotulo": "Aula 22, Questão 3", "pergunta": "Escrever 3/4, 0,10 e 1/5 como porcentagens.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["75%, 1% e 20%", "75%, 10% e 5%", "34%, 10% e 20%", "75%, 10% e 20%"], "certa": 3, "resolucao": "3/4 = 0,75 = 75%. 0,10 = 10%. 1/5 = 0,20 = 20%. Resposta: 75%, 10% e 20%."}, {"imp": 267, "rotulo": "Questão 4 a)", "pergunta": "Quantos litros de um tanque de 160 litros foram usados para irrigação (15%)?", "tipo": "numero", "aceitas": ["24"], "unidade": "litros", "opcoes": [], "certa": -1, "resolucao": "15% de 160 é 0,15 × 160 = 24. Foram usados 24 litros."}, {"imp": 267, "rotulo": "Questão 4 b)", "pergunta": "Quantos dos 34 mil alunos (25%) concluíram a prova em menos de duas horas?", "tipo": "numero", "aceitas": ["8500", "8.500"], "unidade": "alunos", "opcoes": [], "certa": -1, "resolucao": "25% é a quarta parte: 34 000 ÷ 4 = 8 500. Concluíram 8 500 alunos."}, {"imp": 267, "rotulo": "Questão 4 c)", "pergunta": "Quantos dos 12 mil livros do acervo (30%) foram emprestados no último mês?", "tipo": "numero", "aceitas": ["3600", "3.600"], "unidade": "livros", "opcoes": [], "certa": -1, "resolucao": "30% de 12 000 é 0,30 × 12 000 = 3 600. Foram emprestados 3 600 livros."}, {"imp": 267, "rotulo": "Questão 5", "pergunta": "Quantas das 850 caixas, depois de tirar as 120 de alimentos, serão entregues no armazém (30% das restantes)?", "tipo": "numero", "aceitas": ["219"], "unidade": "caixas", "opcoes": [], "certa": -1, "resolucao": "Restam 850 − 120 = 730 caixas. 30% de 730 é 0,30 × 730 = 219. Serão entregues 219 caixas."}, {"imp": 267, "rotulo": "Questão 6 a)", "pergunta": "Qual o percentual de participação: 25 estudantes em uma turma de 500?", "tipo": "numero", "aceitas": ["5"], "unidade": "%", "opcoes": [], "certa": -1, "resolucao": "25 ÷ 500 = 0,05, que é 5%. O percentual foi de 5%."}, {"imp": 267, "rotulo": "Questão 6 b)", "pergunta": "Qual o percentual do percurso concluído: 200 m de 1 000 m?", "tipo": "numero", "aceitas": ["20"], "unidade": "%", "opcoes": [], "certa": -1, "resolucao": "200 ÷ 1 000 = 0,20, que é 20%. O percentual foi de 20%."}, {"imp": 267, "rotulo": "Questão 6 c)", "pergunta": "Qual o percentual reciclado: 6 000 garrafas de 15 000?", "tipo": "numero", "aceitas": ["40"], "unidade": "%", "opcoes": [], "certa": -1, "resolucao": "6 000 ÷ 15 000 = 0,40, que é 40%. O percentual foi de 40%."}, {"imp": 267, "rotulo": "Questão 7", "pergunta": "Classificar em V ou F as conversões de porcentagem em decimal (9% = 0,09; 120% = 0,12; 45% = 0,45).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V, F, V.", "V, V, F.", "F, V, V.", "F, F, V."], "certa": 0, "resolucao": "9% = 0,09 (V). 120% = 1,20 e não 0,12 (F). 45% = 0,45 (V). A sequência é V, F, V."}, {"imp": 267, "rotulo": "Questão 8", "pergunta": "Associar 3%, 27%, 105% e 81% às representações decimais 1,05; 0,03; 0,81; 0,27 (nessa ordem de parênteses).", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes" rotulo": "Questão 12 d)", "pergunta": "Escrever 0,1 como porcentagem e como fração.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "0,1 × 100 = 10, então 10%. Como fração, 0,1 = 1/10."}, {"imp": 268, "rotulo": "Questão 13", "pergunta": "Que porcentagem representam 18 tarefas acertadas de 24?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["65%", "70%", "72%", "75%"], "certa": 3, "resolucao": "18/24 = 3/4 = 0,75, que é 75%."}, {"imp": 268, "rotulo": "Questão 14", "pergunta": "Analisar as afirmações sobre as 52 autorizações entregues de 80 (65%; 28%; 8 a mais chega a 75%).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Apenas I é verdadeira.", "Apenas I e III são verdadeiras.", "Apenas II e III são verdadeiras.", "I, II e III são verdadeiras."], "certa": 1, "resolucao": "52/80 = 65% (I verdadeira). Faltam 28 de 80, que é 35%, e não 28% (II falsa). Com mais 8, são 60/80 = 75% (III verdadeira)."}, {"imp": 269, "rotulo": "Questão 15", "pergunta": "Qual o novo preço de um tênis de R$ 120,00 com 25% de desconto?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 90,00", "R$ 95,00", "R$ 100,00", "R$ 105,00"], "certa": 0, "resolucao": "25% de 120 = 30. Então 120 − 30 = R$ 90,00 (ou 0,75 × 120 = 90)."}, {"imp": 269, "rotulo": "Questão 16", "pergunta": "Quantos ingressos restaram da meta de 500, após vender 3/5 e mais 20% do total previsto?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["80", "120", "100", "150"], "certa": 2, "resolucao": "3/5 de 500 = 300 e 20% de 500 = 100, somando 400 vendidos. Restaram 500 − 400 = 100 ingressos."}, {"imp": 269, "rotulo": "Questão 17", "pergunta": "Quantas figurinhas faltam num álbum de 360 após 2/3 completos e mais 15% do total?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["54", "60", "66", "72"], "certa": 2, "resolucao": "2/3 de 360 = 240 e 15% de 360 = 54, somando 294. Faltam 360 − 294 = 66 figurinhas."}, {"imp": 269, "rotulo": "Questão 18", "pergunta": "Qual o fator de aumento para um acréscimo de 45%?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["0,045", "1,05", "1,45", "45"], "certa": 2, "resolucao": "Acréscimo de 45% é 100% + 45% = 145% = 1,45. O fator é 1,45."}, {"imp": 270, "rotulo": "Questão 19", "pergunta": "Julgar como V ou F três afirmações sobre um produto que teve aumento de 25%.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V, V, F.", "F, V, V.", "V, F, F.", "V, F, V."], "certa": 3, "resolucao": "Com aumento de 25%, o valor final é 125% do inicial, então fica maior (I é V) e não é 25% do inicial (II é F). A III é V. Resposta: V, F, V."}, {"imp": 270, "rotulo": "Questão 20", "pergunta": "Completar a taxa em decimal, o acréscimo e o valor final da mochila de R$ 80,00 com aumento de 15%.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["0,15; R$ 15,00; R$ 95,00", "0,15; R$ 12,00; R$ 92,00", "1,15; R$ 12,00; R$ 80,15", "0,12; R$ 15,00; R$ 92,00"], "certa": 1, "resolucao": "15% = 0,15. O acréscimo é 0,15 × 80 = R$ 12,00. O valor final é 80 + 12 = R$ 92,00."}, {"imp": 270, "rotulo": "Questão 21", "pergunta": "Preço final da bicicleta de R$ 800,00 após dois aumentos seguidos (15% e depois 10%).", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 920,00", "R$ 1 012,00", "R$ 1 000,00", "R$ 1 080,00"], "certa": 1, "resolucao": "Primeiro aumento: 800 × 1,15 = 920. Segundo aumento, sobre 920: 920 × 1,10 = 1 012. Resposta: R$ 1 012,00."}, {"imp": 270, "rotulo": "Questão 22 a)", "pergunta": "Salário de Rafael (R$ 10 000,00) após dois aumentos de 10%.", "tipo": "numero", "aceitas": ["12100", "12.100", "12100,00"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "Primeiro aumento: 10 000 × 1,10 = 11 000. Segundo: 11 000 × 1,10 = 12 100. O salário será R$ 12 100,00."}, {"imp": 270, "rotulo": "Questão 22 b)", "pergunta": "Percentual total de aumento em relação ao salário inicial de Rafael.", "tipo": "numero", "aceitas": ["21", "21%"], "unidade": "%", "opcoes": [], "certa": -1, "resolucao": "O aumento foi de 12 100 − 10 000 = 2 100. Como 2 100 ÷ 10 000 = 0,21, o aumento total foi de 21%."}, {"imp": 271, "rotulo": "Questão 24", "pergunta": "Associar cada redução (10%, 25%, 40%) ao seu fator.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["1-A, 2-B, 3-C.", "1-B, 2-C, 3-A.", "1-C, 2-A, 3-B.", "1-B, 2-A, 3-C."], "certa": 1, "resolucao": "O fator é 1 menos a taxa: 10% dá 0,90 (B), 25% dá 0,75 (C) e 40% dá 0,60 (A). Resposta: 1-B, 2-C, 3-A."}, {"imp": 271, "rotulo": "Questão 25", "pergunta": "Julgar quatro afirmações sobre um produto com decréscimo de 30%.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V, F, V, V.", "V, V, F, V.", "F, F, V, V.", "V, F, F, V."], "certa": 0, "resolucao": "O valor final é menor (I é V). O fator é 1 − 0,30 = 0,70, não 0,30 (II é F). Restam 70% (III é V) e 30% = 0,30 (IV é V)."}, {"imp": 271, "rotulo": "Questão 26", "pergunta": "Valor final da mochila de R$ 80,00 com 15% de desconto.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 65,00", "R$ 66,00", "R$ 68,00", "R$ 72,00"], "certa": 2, "resolucao": "O desconto é 0,15 × 80 = 12. O valor final é 80 − 12 = R$ 68,00."}, {"imp": 271, "rotulo": "Questão 27", "pergunta": "Valor final da jaqueta de R$ 200,00 com 20% de desconto e depois mais 10% sobre o novo preço.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 140,00", "R$ 144,00", "R$ 150,00", "R$ 160,00"], "certa": 1, "resolucao": "Primeiro: 200 × 0,80 = 160. Depois, sobre 160: 160 × 0,90 = 144. Resposta: R$ 144,00."}, {"imp": 271, "rotulo": "Questão 28", "pergunta": "Novo preço do ingresso de R$ 30,00 com acréscimo de 20%.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 34,00", "R$ 35,00", "R$ 36,00", "R$ 38,00"], "certa": 2, "resolucao": "O acréscimo é 0,20 × 30 = 6. O novo preço é 30 + 6 = R$ 36,00."}, {"imp": 272, "rotulo": "Questão 29", "pergunta": "Julgar três afirmativ co e lembrar de novo é o que fixa."], ["Misture os assuntos", "Na prova as questões vêm misturadas. Treine assim também: um pouco de fração, um pouco de equação, um pouco de ângulo."], ["Ensine alguém", "Explique a matéria para um colega, para alguém de casa ou em voz alta. O ponto em que você travar é o que falta estudar."], ["Do exemplo para o sozinho", "Veja um exemplo resolvido, cubra a solução e refaça. Depois faça um exercício parecido sem ajuda."], ["Caderno de erros", "Copie a questão que errou, escreva onde foi o erro e refaça dias depois. Seus erros mostram exatamente o que estudar."], ["Celular longe", "Deixe o celular em outro cômodo durante os 20 minutos. Se estiver estudando nele, silencie as notificações."]]}, {"t": "Como memorizar", "itens": [["Cartões de memória", "Pergunta de um lado, resposta do outro. Separe os que você errou e repita esses mais vezes."], ["Escreva à mão", "Fazer a conta no papel fixa mais do que só olhar a conta pronta na tela."], ["Crie frases e imagens", "\"Na multiplicação e na divisão: sinais iguais, resultado positivo.\" \"Dividir fração: copia a primeira, inverte a segunda e multiplica.\" Invente as suas: quanto mais engraçada, mais gruda."], ["Faça o seu mapa mental", "Depois de estudar um tema, feche tudo e desenhe o mapa de memória. Compare com o mapa do material e complete com outra cor."], ["Durma", "É dormindo que o cérebro guarda o que você estudou. Virar a noite antes da prova atrapalha."]]}, {"t": "Na hora da prova", "itens": [["Leia a pergunta inteira", "Sublinhe os dados e circule o que a questão pede. Muita gente erra respondendo outra pergunta."], ["Duas passadas", "Na primeira, faça as que você sabe. Marque as difíceis e volte depois. Não fique muito tempo preso em uma questão só."], ["Estime antes de calcular", "Pense no tamanho da resposta antes da conta. Se o resultado sair muito diferente, confira."], ["Use o rascunho", "Conta de cabeça é onde mora o erro bobo. Escreva os passos, mesmo os fáceis."], ["Confira pelo caminho de volta", "Use a operação inversa: se 48 ÷ 8 = 6, então 6 × 8 tem de dar 48. Em equação, troque o x."], ["Olhe o que foi pedido e a unidade", "Preço final ou desconto? Área ou perímetro? Metros ou centímetros?"], ["Cuidado ao marcar o gabarito", "A cada cinco respostas, confira se o número da questão bate com o número da folha."]]}, {"t": "Na véspera e no dia", "itens": [["Na véspera", "Faça uma revisão leve, separe o material que a escola pedir e durma cedo."], ["No dia", "Tome café da manhã, chegue no horário e vá ao banheiro antes de começar."], ["Se der nervoso", "Solte o lápis, respire fundo três vezes e comece por uma questão fácil. A prova mostra o que você já sabe."]]}], "cofre": {"t": "Plano B: quando você não souber a questão", "aviso": "Isto vale para a questão que sobrou depois de você tentar de verdade. Chute bem dado ajuda em uma ou duas questões; estudo ajuda em todas.", "fecho": "Eliminar duas alternativas leva a chance de 25% para 50%. Saber fazer leva para 100%. Volte para as aulas.", "itens": [["Em branco, nunca", "Questão em branco não soma ponto. Marque sempre uma alternativa."], ["Elimine antes de chutar", "Com 4 alternativas, o chute puro acerta 1 em cada 4. Se você eliminar duas que estão mesmo erradas, passa a ser 1 em cada 2."], ["Corte os absurdos", "Desconto que deixa o preço maior, ângulo de triângulo acima de 180°, idade negativa, parte maior que o todo: risque."], ["Pense no tamanho da resposta", "Arredonde os números e faça a conta de cabeça. A alternativa mais perto da estimativa é a melhor candidata."], ["Teste as alternativas", "Em equação, troque o x por cada alternativa. A que deixa os dois lados iguais é a certa."], ["Olhe a unidade", "Se a pergunta pede área, a resposta está em cm² ou m². Se pede porcentagem, não pode ser em reais."], ["Desconfie do número repetido", "Alternativa que só repete um número do enunciado, ou o resultado da primeira conta, pode ser o passo do meio e não a resposta. Veja se o problema já acabou."], ["Não existe letra da sorte", "\"Na dúvida, marque C\" não funciona. As respostas certas ficam espalhadas entre as letras."], ["Marque e volte", "Chutou? Faça um sinal na questão e volte a ela se sobrar tempo."]]}, "sintese": [{"t": "Números", "temas": [["Inteiros", 1, ["Na reta, mais à direita é maior", "Em × e ÷: sinais iguais dão +, diferentes dão −", "Subtrair é somar o oposto"]], ["Decimais", 2, ["Iguale as casas para comparar", "Vírgula embaixo de vírgula", "0,5 = 1/2 = 50%"]], ["Frações: comparar", 3, ["Mesmo denominador para comparar", "Equivalente: multiplica ou divide em cima e embaixo", "Fração de quantidade: divide e multiplica"]], ["Frações: operações", 4, ["Somar e subtrair: mesmo denominador (MMC)", "Multiplicar: cima × cima, baixo × baixo", "Dividir: multiplica pelo inverso"]], ["Múltiplos, divisores e plano", 12, ["MMC: quando acontece junto de novo", "MDC: grupos iguais, o maior possível", "(x, y): horizontal primeiro, vertical depois"]]]}, {"t": "Álgebra", "temas": [["Letras e sequências", 5, ["Valor numérico: troque a letra pelo número", "Sequência: quanto soma a cada passo?", "Termo geral: passo × n + ajuste"]], ["Equações I", 6, ["Balança: faça o mesmo dos dois lados", "Use a operação inversa", "Confira trocando o x"]], ["Equações II", 7, ["Distributiva: multiplica cada termo", "Letras de um lado, números do outro", "Em problema: diga quem é o x"]], ["Interpretar e montar", 13, ["Valor por unidade × quantidade", "O valor fixo entra uma vez só", "A ordem das operações muda a equação"]]]}, {"t": "Grandezas", "temas": [["Razão e proporção", 8, ["Direta: uma dobra, a outra dobra", "Inversa: uma dobra, a outra cai pela metade", "Na direta, ache o valor de 1"]], ["Porcentagem", 9, ["10% é dividir por 10", "Aumento soma, desconto subtrai", "Preço final ou valor do desconto?"]]]}, {"t": "Geometria", "temas": [["Ângulos", 10, ["Complementares somam 90°", "Triângulo: 180°", "Quadrilátero: 360°"]], ["Áreas e perímetros", 11, ["Perímetro é  da fração. Diz em quantas partes iguais o inteiro foi dividido.", "Em 3/4, o denominador é 4."], ["Frações equivalentes", "Escritas diferentes de uma mesma quantidade. Aparecem quando se multiplica ou divide o número de cima e o de baixo pelo mesmo número.", "1/2 = 2/4 = 4/8."], ["Simplificar", "Dividir o numerador e o denominador pelo mesmo número, para escrever a fração com números menores.", "6/8 = 3/4 (dividiu por 2)."], ["Fração irredutível", "Fração em que o número de cima e o de baixo não podem mais ser divididos pelo mesmo número (a não ser por 1).", "3/4 é irredutível; 6/8 não é, porque dá para dividir os dois por 2."], ["Inverso de uma fração", "A fração com o numerador e o denominador trocados de lugar.", "O inverso de 2/3 é 3/2."], ["Denominador comum", "O mesmo número embaixo em todas as frações, conseguido com frações equivalentes. Permite somar, subtrair e comparar.", "1/4 e 1/6 viram 3/12 e 2/12."], ["Fração de uma quantidade", "Parte de um total: divide pelo denominador e multiplica pelo numerador.", "3/5 de 20 = 20 ÷ 5 × 3 = 12."]]}, {"t": "Letras e sequências", "cartas": [["Variável", "Letra que representa um número que pode mudar.", "Em C = 4n, o n pode ser 1, 2, 3..."], ["Incógnita", "Letra que representa um número desconhecido, que queremos descobrir.", "Em x + 5 = 12, a incógnita x vale 7."], ["Expressão algébrica", "Expressão matemática com números, letras e operações, sem sinal de igual. Ela representa situações como preço, perímetro ou idade.", "3n − 2: o triplo de um número, menos 2."], ["Valor numérico", "O resultado da expressão quando trocamos a letra por um número.", "Para n = 3, a expressão 2n + 1 vale 7."], ["Sequência", "Lista de números ou figuras que segue uma ordem e uma regra.", "5, 9, 13, 17, ..."], ["Termo", "Cada número de uma sequência.", "Em 5, 9, 13, o 2º termo é 9."], ["Regra de formação", "A instrução, dita em palavras, que explica como obter os termos da sequência (somar, subtrair ou multiplicar por um número).", "Em 5, 9, 13, 17, a regra é somar 4."], ["Termo geral", "Expressão que calcula qualquer termo da sequência a partir da posição n.", "Em 5, 9, 13, ..., o termo geral é 4n + 1."], ["Sequência recursiva", "Sequência em que um termo só pode ser calculado se já se conhece o termo anterior.", "Começa em 2 e soma 5: 2, 7, 12, 17."]]}, {"t": "Equações", "cartas": [["Incógnita", "Letra que representa um número desconhecido, que queremos descobrir.", "Em x + 5 = 12, a incógnita x vale 7."], ["Equação", "Igualdade que tem um valor desconhecido (a incógnita).", "2x − 3 = 11."], ["Membros da equação", "Os dois lados do sinal de igual: o 1º membro fica à esquerda e o 2º, à direita.", "Em 2x + 6 = 18, o 1º membro é 2x + 6."], ["Solução (ou raiz)", "O valor da incógnita que torna a igualdade verdadeira.", "x = 6 é a solução de 2x + 6 = 18."], ["Operação inversa", "A operação que desfaz outra.", "A subtração desfaz a soma; a divisão desfaz a multiplicação."], ["Equações equivalentes", "Equações diferentes que têm a mesma solução.", "2x + 6 = 18 e 2x = 12."], ["Termos semelhantes", "Termos que têm a mesma letra, ou que são só números. Podem ser somados ou subtraídos entre si.", "4x + 9x = 13x e 3 + 5 = 8. Já 4x + 9 não se junta."], ["Propriedade distributiva", "O número de fora dos parênteses multiplica cada termo de dentro.", "3(x + 4) = 3x + 12."], ["Coeficiente", "O número que multiplica a letra.", "Em 5x, o coeficiente é 5."], ["Isolar a incógnita", "Deixar a letra sozinha de um lado da igualdade, usando operações inversas dos dois lados.", "x + 5 = 12, então x = 12 − 5, então x = 7."], ["Dobro, triplo e metade", "Dobro é 2 vezes; triplo é 3 vezes; metade é dividir por 2.", "O dobro de x é 2x; a metade de x é x/2."]]}, {"t": "Proporção e porcentagem", "cartas": [["Razão", "Comparação de duas quantidades por meio de uma divisão.", "2 meninas para cada 3 meninos: razão 2/3."], ["Proporção", "Igualdade entre duas razões.", "2/3 = 4/6."], ["Grandeza", "Tudo o que pode ser medido ou contado.", "Tempo, distância, preço, massa."], ["Grandezas diretamente proporcionais", "Quando uma é multiplicada por um número, a outra é multiplicada pelo mesmo número (uma dobra, a outra dobra). A razão entre elas é sempre a mesma.", "1 pão custa R$ 0,50; 2 pães custam R$ 1,00; 4 pães custam R$ 2,00."], ["Grandezas inversamente proporcionais", "Quando uma é multiplicada por um número, a outra é dividida por esse número (uma dobra, a outra cai pela metade). O produto entre elas é sempre o mesmo.", "2 máquinas levam 12 h; 4 máquinas levam 6 h (2 × 12 = 4 × 6)."], ["Regra de três", "Método para achar o quarto valor de uma proporção quando três são conhecidos.", "5 cadernos custam R$ 40; então 8 cadernos custam R$ 64."], ["Porcentagem", "Fração de denominador 100.", "25% = 25/100 = 1/4."], ["Acréscimo", "Aumento: calcula-se a porcentagem e soma-se ao valor.", "R$ 80 com acréscimo de 10% vira R$ 88."], ["Desconto", "Redução: calcula-se a porcentagem e subtrai-se do valor.", "R$ 120 com 15% de desconto vira R$ 102."]]}, {"t": "Ângulos e triângulos", "cartas": [["Ângulo agudo", "Ângulo menor que 90°.", "Um ângulo de 45°."], ["Ângulo reto", "Ângulo de exatamente 90°.", "O canto de uma folha de caderno."], ["Ângulo obtuso", "Ângulo maior que 90° e menor que 180°.", "Um ângulo de 120°."], ["Ângulo raso", "Ângulo de 180°. Forma uma linha reta.", "Meia-volta."], ["Ângulos complementares", "Dois ângulos que somam 90°.", "35° e 55°."], ["Ângulos suplementares", "Dois ângulos que somam 180°.", "65° e 115°."], ["Vértice", "O ponto em que dois lados se encontram.", "Um triângulo tem 3 vértices."], ["Triângulo equilátero", "Triângulo com os 3 lados de mesma medida.", "Cada ângulo interno mede 60°."], ["Triângulo isósceles", "Triângulo com 2 lados de mesma medida (o terceiro pode ter outra medida).", "Os dois ângulos da base também são iguais."], ["Triângulo escaleno", "Triângulo com os 3 lados diferentes.", "Lados de 3 cm, 4 cm e 5 cm."], ["Ângulo interno", "Ângulo que fica dentro do po const CHAVE = 'revisaoSaresp7ano_v01';
const app = document.getElementById('app');
const esc0 = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// Toda fração a/b vira numerador sobre denominador (barra horizontal). "km/h" não é fração e fica como está.
const esc = s => esc0(s).replace(/(^|[^A-Za-zÀ-ÿ0-9])(\([^()\/]+\)|\d+|[a-z])\/(\d+|[a-z])(?![A-Za-zÀ-ÿ0-9])/g,
  (m, pre, a, b) => pre + '<span class="fr"><span>' + a.replace(/^\(|\)$/g, '') + '</span><span>' + b + '</span></span>');
function mdc(a, b){ return b ? mdc(b, a % b) : a; }
function tabuadas(ns){
  const L = ns.reduce((a, b) => a * b / mdc(a, b));
  const nomes = ns.length > 1 ? ns.slice(0, -1).join(', ') + ' e ' + ns[ns.length - 1] : String(ns[0]);
  return '<div class="tabs">' + ns.map(n => {
    let h = '<div class="tab"><span class="rot">Tabuada do ' + n + '</span><div class="nums">';
    for (let i = 1; i <= Math.max(10, L / n); i++) { const v = n * i; h += '<span class="' + (v === L ? 'mmc' : v % L === 0 ? 'com' : '') + '">' + v + '</span>'; }
    return h + '</div></div>';
  }).join('') + '<p class="leg">O primeiro número que aparece em todas as tabuadas é o <b>' + L + '</b>. Esse é o MMC de ' + nomes + '.</p></div>';
}

function comecar(lista, chave, titulo, refaz){
  Q = { lista: lista, k: 0, acertos: 0, erros: [], chave: chave, titulo: titulo, refaz: refaz, semPista: 0 };

}

function pergunta(){
  parar();
  const q = Q.lista[Q.k], total = q.tempo * mult;
  Q.alts = q.alts.map((t, j) => ({ t: t, c: j === q.certa, o: j }));
  if (!q.fixo) Q.alts = embaralhar(Q.alts);
  Q.respondida = false; Q.usouPista = false; Q.pausado = false; Q.t0 = Date.now();
  mostrar('<div class="quiz-topo"><div class="topo"><span><b>' + esc(Q.titulo) + '</b> · Questão ' + (Q.k + 1) + ' de ' + Q.lista.length + ' · ' + esc(q.nivel) + '</span><span class="tempo-quiz"><span class="relogio" id="rel">' + total + ' s</span>' +
    (mem.comTempo ? '<button class="leve" data-acao="pausa" id="pausa" aria-pressed="false">Pausar</button>' : '') + '</span></div>' +
    '<div class="barra"><i id="bar"></i></div></div><p class="perg">' + esc(q.texto) + '</p>' +
    (q.pista ? '<div class="linha" style="margin:0 0 10px"><button class="leve" data-acao="pista">Comece aqui: quero uma pista</button></div><div id="pista" role="status" aria-live="polite"></div>' : '') + '<div class="opcoes">' +
    Q.alts.map((a, j) => '<button data-acao="resp" data-j="' + j + '"><b>' + 'ABCD'[j] + '</b><span>' + esc(a.t) + '</span></button>').join('') +
    '</div><div id="fb" role="status" aria-live="polite"></div><div class="linha"><button class="leve" data-acao="sair">Sair dos exercícios</button></div>');
  Q.fim = Date.now() + total * 1000; Q.resta = null;
  const bar = document.getElementById('bar'), rel = document.getElementById('rel');
  if (!mem.comTempo) { rel.textContent = ''; bar.parentNode.hidden = true; return; }  // o relógio só roda para quem ligou
  relogio = setInterval(() => {
    if (document.hidden || Q.resta != null) return;
    const r = Math.max(0, Q.fim - Date.now()), pct = r / (total * 10);
    bar.style.width = pct + '%';
    rel.textContent = Math.ceil(r / 1000) + ' s';
    if (pct < 25) { bar.classList.add('fim'); rel.classList.add('fim'); }
    if (r <= 0) responder(-1);
  }, 100);
}

function responder(j){
  if (!Q || Q.respondida) return;
  if (j >= 0 && Date.now() - Q.t0 < 500) return;
  Q.respondida = true; parar();
  const q = Q.lista[Q.k], ok = j >= 0 && Q.alts[j].c, certa = q.alts[q.certa];
  if (ok) Q.acertos++; else Q.erros.push({ q: q, marcada: j >= 0 ? Q.alts[j].t : null });
  if (ok) {
    if (!Q.usouPista) Q.semPista++;
    if (Date.now() - Q.t0 < 1500) aviso('Rápido demais para valer ponto. Leia a pergunta com calma.'); else ganha(10, 'resposta certa', q.id);
  }
  if (Q.k === Q.lista.length - 1) gravaMelhor();  // grava já na última resposta: sair sem ver o resultado não perde a rodada

    b.disabled = true;
    if (Q.alts[i].c) { b.classList.add('certa'); b.querySelector('span').insertAdjacentHTML('beforeend', ' <small>✔ Resposta certa</small>'); }
    else if (i === j) { b.classList.add('errada'); b.querySelector('span').insertAdjacentHTML('beforeend', ' <small>✘ Sua resposta</small>'); }
  });
  const ultima = Q.k === Q.lista.length - 1;
  document.getElementById('fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><p><b>' +
    (ok ? '✔ Acertou!' : j < 0 ? '⏰ O tempo acabou.' : '✘ Ainda não.') + '</b></p>' + (!ok && j >= 0 && q.erros && q.erros[Q.alts[j].o] ? '<p><b>Sobre a sua resposta:</b> ' + esc(q.erros[Q.alts[j].o]) + '</p>' : '') +
    '<p>Resposta: <b>' + esc(certa) + '</b></p><p>' + esc(q.just) + '</p>' + (q.mmc ? tabuadas(q.mmc) : '') + '</div>' + degrauAlem(q) +

  const px = document.querySelector('[data-acao="proxima"]');

  try { px.focus({ preventScroll: true }); } catch (e) {}
}

function gravaMelhor(){
  const n = Q.lista.length, a = Q.acertos, ant = mem[Q.chave], ehAula = /^p\d+$/.test(Q.chave), antes = ehAula && feita(D.partes[parteAtual]);

let hist = [], tela = inicio, soEx = true;
// Cada tela aberta empilha uma entrada no histórico, para o botão Voltar do celular não sair do site.
let empilhadas = 0, pulando = 0;  // pulando: quantas voltas do histórico foram pedidas pelo próprio site
const SESSAO = Date.now();  // marca as entradas desta visita, para reconhecer a seta Avançar do navegador
let yAntes = 0;
app.addEventListener('click', () => { yAntes = window.scrollY; }, true);  // posição da tela antes de qualquer clique redesenhar
let aEmpilhar = 0, tPulo = 0;
function empilha(){ try { history.pushState({ d: empilhadas + 1, s: SESSAO }, ''); empilhadas++; } catch (e) {} }
function marcaHistorico(){ if (pulando > 0) aEmpilhar++; else empilha(); }  // com uma volta em andamento, espera ela terminar
function fimDoPulo(){ while (pulando === 0 && aEmpilhar > 0) { aEmpilhar--; empilha(); } }
function pula(n){  // o próprio site volta n entradas
  pulando++; clearTimeout(tPulo); tPulo = setTimeout(() => { pulando = 0; fimDoPulo(); }, 1500);  // se o aviso da volta não chegar, destrava
  try { history.go(-n); } catch (e) { pulando--; fimDoPulo(); }
}
function fundo(){ const st = history.state; return st && st.s === SESSAO ? st.d : 0; }  // entradas desta visita que existem de fato atrás da tela
function esvaziaHistorico(){  // voltou ao início por um botão da página: descarta as entradas que sobraram
  const n = pulando > 0 ? empilhadas : Math.min(empilhadas, fundo());  // nunca volta além do que existe
  empilhadas = 0; aEmpilhar = 0;
  if (n > 0) pula(n);
}
const emTreino = () => !!app.querySelector('.opcoes,.fc,.em-treino');
function confirmaSair(){  // o relógio do exercício não anda enquanto a pergunta está na tela
  const t = Date.now(), r = confirm('Sair agora? Você perde as respostas desta rodada.'), dt = Date.now() - t;
  if (Q && relogio && !Q.respondida && Q.resta == null) Q.fim += dt;
  return r || dt < 30;  // "não" instantâneo é o navegador bloqueando a pergunta: não prende o aluno no treino
}
function descartaUma(){
  if (aEmpilhar > 0) { aEmpilhar--; return; }
  if (empilhadas > 0) { empilhadas--; pula(1); }
}
function nav(fn){ hist.push({ fn: tela, y: window.scrollY }); tela = fn; fn(); marcaHistorico(); }
function voltar(){
  parar();
  if (app.querySelector('.opcoes,.placar,.fc,.em-treino')) { tela(); return; }  // saiu do quiz: volta para a aula (ou para o início, no simulado)
  const e = hist.pop();
  if (!e && tela === inicio) return;
  tela = e ? e.fn : inicio;
  tela();
  if (e) window.scrollTo(0, e.y);
}
const DIM = { livro: ' width="1000" height="1300"', slide: ' width="960" height="540"', mapa: ' width="1200" height="1778"' };
function topo(){ return '<div class="linha" style="margin-top:0"><button class="leve" data-acao="voltar">← Voltar</button><button class="leve" data-acao="inicio">Início</button></div>'; }
function rodapeVoltar(){ return '<div class="linha"><button class="leve" data-acao="voltar">← Voltar</button></div>'; }  // páginas compridas: voltar sem rolar até o topo
function pagImg(src, alt, falta, tipo){
  return '<div class="pg ' + (tipo || '') + '"><img loading="lazy" tabindex="0" role="button" aria-pressed="false"' + (DIM[tipo] || '') + ' src="' + esc0(encodeURI(src)) + '" alt="' + esc0(alt) + ' (ampliar ou reduzir)" data-falta="' + esc0(falta) + '"></div>';
}
function attrs(v, x, y){ return ' data-v="' + v + '"' + (x == null ? '' : ' data-x="' + x + '"') + (y == null ? '' : ' data-y="' + y + '"'); }
function botaoIr(txt, v, x, y, cls, acao){ return '<button class="' + (cls || '') + '" data-acao="' + (acao || 'ir') + '"' + attrs(v, x, y) + '>' + esc(txt) + '</button>'; }
function cartao(v, x, num, tit, res, cls){
  return '<button class="cartao ' + (cls || '') + '" data-acao="ir"' + attrs(v, x) + '><span class="num">' + num + '</span><span class="tit">' + esc(tit) + '</span><span class="res">' + esc(res) + '</span></button>';
}
function faixa(a){ return 'p. ' + a.pags[0].imp + ' a ' + a.pags[a.pags.length - 1].imp; }

function notaDica(p){
  if (!p.dica) return '';
  return '<div class="nota"><p><b>Dica de estudo.</b> ' + esc(p.dica[0]) + '</p><p><b>Na prova.</b> ' + esc(p.dica[1]) + '</p>' +
    '<div class="linha" style="margin-top:8px">' + botaoIr('Ver todas as técnicas de estudo e de prova', 'tecnicas', null, null, 'leve') + '</div></div>';
}

function itemKahoot(rotulo, k, info, n){
  return '<div class="khi"><p class="fck">' + rotulo + '</p><img class="qr" width="150" height="150" src="' + k.qr + '" alt="QR code do Kahoot de ' + rotulo.toLowerCase() + '">' +
    '<p>' + info + '</p><a class="bt" data-kn="' + n + '" href="' + esc0(k.url) + '" target="_blank" rel="noopener">Abrir ' + rotulo.toLowerCase() + '</a></div>';
}
function blocoKahoot(tit, d){
  return '<div class="caixa kh"><h3>' + esc(tit) + '</h3><div class="khd">' + itemKahoot('Revisão', d, 'Modo fácil · PIN <b>' + d.pin + '</b>', d.n) +
    (d.ap ? itemKahoot('Aprofundamento', d.ap, 'Mais difícil · treino individual', d.n) : '') + '</div></div>';
}

function extrasAula(p){
  let h = '<h2 id="sec4">4. Mais para estudar</h2>';
  if (p.deck != null) h += '<div class="lista">' + botaoIr('Vocabulário desta aula: flashcards', 'flash', p.deck, null, 'dest') + '</div>';
  if (p.kahoot) {
    h += blocoKahoot('Kahoot deste conteúdo', p.kahoot) + '<p class="sub">Toque no botão ou aponte a câmera para o QR code. A revisão fica aberta até ' + X.kahoot.prazo + '.</p>' +
      '<div class="linha" style="margin-top:0">' + botaoIr('Ver todos os Kahoots', 'kahoot', null, null, 'leve') + '</div>';
  }
  if (p.livro) {
    const L = X.livros[p.livro[0]];
    h += '<div class="caixa"><h3>No livro: Volume ' + L.vol + '</h3><p class="sub">Exercícios do Livro do Estudante sobre este conteúdo.</p><div class="lista">';
    for (let n = p.livro[1]; n <= p.livro[2]; n++) { const a = L.aulas[n - 1]; h += botaoIr('Livro, aula ' + a.n + ': ' + a.titulo + ' · ' + faixa(a), 'livaula', p.livro[0], n); }
    h += '</div></div>';
  }
  if (p.mapas && p.mapas.length) {
    h += '<div class="caixa"><h3>Mapa mental</h3><p class="sub">Toque na imagem para ampliar.</p>' +
      p.mapas.map(m => pagImg('img/mapas/' + X.mapas[m - 1].f, 'Mapa mental ' + m, 'Mapa mental ' + m + ': imagem não encontrada.', 'mapa')).join('') + '</div>';
  }
  return h;
}

function livroLista(vi){
  const L = X.livros[vi], c = L.caderno;
  let h = topo() + '<h2>Livro do Estudante · Volume ' + L.vol + ' (' + L.bim + ')</h2>' +
    '<p class="sub">Os números são as páginas impressas no seu livro. Faça os exercícios no caderno.</p><div class="lista">' +
    botaoIr('Caderno de exercícios (aprofundamento) · p. ' + c[0].imp + ' a ' + c[c.length - 1].imp, 'caderno', vi, 0, 'dest');
  L.aulas.forEach(a => { h += botaoIr('Aula ' + a.n + ': ' + a.titulo + ' · ' + faixa(a), 'livaula', vi, a.n); });
  mostrar(h + '</div>');
}

function focoDe(bim, n){
  const bi = X.foco.findIndex(B => B.bim === bim);
  if (bi < 0) return null;
  const k = X.foco[bi].aulas.findIndex(a => a.n === n);
  return k < 0 ? null : [bi, k];
}

function livroAula(vi, n){
  const L = X.livros[vi], a = L.aulas[n - 1];
  const filtra = soEx && a.pags.some(p => p.ex);
  const pg = a.pags.filter(p => !filtra || p.ex);
  let h = topo() + '<h2>Volume ' + L.vol + ' · Aula ' + a.n + ': ' + esc(a.titulo) + '</h2>' +
    '<p class="sub">No seu livro: páginas ' + a.pags[0].imp + ' a ' + a.pags[a.pags.length - 1].imp + '. Faça no caderno. Toque na imagem para ampliar.</p>' +
    '<div class="linha" style="margin-top:0"><button class="' + (filtra ? 'ativo' : '') + '" aria-pressed="' + (filtra ? 'true' : 'false') + '" data-acao="filtro" data-s="1">Só os exercícios</button>' +
    '<button class="' + (filtra ? '' : 'ativo') + '" aria-pressed="' + (filtra ? 'false' : 'true') + '" data-acao="filtro" data-s="0">Aula inteira (resumo e exemplos)</button></div>';
  pg.forEach(p => {
    h += '<p class="pgn">Página ' + p.imp + (p.rot.length ? ' · ' + esc(p.rot.join(' · ')) : '') + '</p>' +
      pagImg('img/livro' + L.vol + '/' + p.f, 'Livro volume ' + L.vol + ', página ' + p.imp, 'Imagem não encontrada. Abra a página ' + p.imp + ' do seu livro (volume ' + L.vol + ').', 'livro') + confPagina(vi, 'a' + a.n, p.imp);
  });
  h += livroFeito(vi, n) + '<div class="lista">';
  if (L.cadernoAula[a.n] !== undefined) h += botaoIr('Aprofundamento: exercícios desta aula no Caderno de exercícios', 'caderno', vi, L.cadernoAula[a.n], 'dest');
  const f = focoDe(L.vol, a.n);
  if (f) h += botaoIr('Slides desta aula: Foco no conteúdo', 'focoaula', f[0], f[1]);
  h += '</div><div class="linha">';
  if (n > 1) h += botaoIr('← Aula ' + (n - 1), 'livaula', vi, n - 1, 'leve', 'troca');
  if (n < L.aulas.length) h += botaoIr('Aula ' + (n + 1) + ' →', 'livaula', vi, n + 1, 'leve', 'troca');
  mostrar(h + '</div>' + rodapeVoltar());
}

function caderno(vi, ini){
  const L = X.livros[vi], c = L.caderno, marcas = {};
  Object.keys(L.cadernoAula).forEach(k => { const i = L.cadernoAula[k]; (marcas[i] = marcas[i] || []).push(k); });
  let h = topo() + '<h2>Caderno de exercícios · Volume ' + L.vol + '</h2>' +
    '<p class="sub">Exercícios de aprofundamento do fim do livro: páginas ' + c[0].imp + ' a ' + c[c.length - 1].imp + '. Toque na imagem para ampliar.</p>';
  c.forEach((p, i) => {
    h += '<p class="pgn" id="cad' + i + '">Página ' + p.imp + (marcas[i] ? ' · começam aqui os exercícios da Aula ' + marcas[i].join(' e da Aula ') : '') + '</p>' +
      pagImg('img/livro' + L.vol + '/' + p.f, 'Caderno de exercícios, página ' + p.imp, 'Imagem não encontrada. Abra a página ' + p.imp + ' do seu livro (volume ' + L.vol + ').', 'livro') + confPagina(vi, 'cad', p.imp);
  });
  mostrar(h + rodapeVoltar());
  if (ini) { const e = document.getElementById('cad' + ini); if (e) e.scrollIntoView(); }
}

function focoLista(bi){
  const B = X.foco[bi];
  let h = topo() + '<h2>Foco no conteúdo · ' + B.bim + 'º bimestre</h2><p class="sub">Slides das aulas oficiais que explicam o conteúdo. Reveja antes de fazer os exercícios.</p><div class="lista">';
  B.aulas.forEach((a, k) => { h += botaoIr('Aula ' + a.n + ': ' + a.titulo + ' · ' + a.slides.length + (a.slides.length === 1 ? ' slide' : ' slides'), 'focoaula', bi, k); });
  mostrar(h + '</div>');
}

function focoAula(bi, k){
  const B = X.foco[bi], a = B.aulas[k];
  let h = topo() + '<h2>' + B.bim + 'º bimestre · Aula ' + a.n + ': ' + esc(a.titulo) + '</h2><p class="sub">Foco no conteúdo. Toque na imagem para ampliar.</p>';
  a.slides.forEach((s, i) => {
    h += '<p class="pgn">' + (i + 1) + '. ' + esc(s.t) + (s.olho ? ' <span class="selo">De olho no modelo</span>' : '') + '</p>' + pagImg('img/foco/' + s.f, s.t, 'Slide não encontrado.', 'slide');
  });
  const vi = X.livros.findIndex(L => L.vol === B.bim);
  if (vi >= 0 && a.n <= X.livros[vi].aulas.length) h += '<div class="lista">' + botaoIr('Exercícios desta aula no livro (volume ' + B.bim + ')', 'livaula', vi, a.n, 'dest') + '</div>';
  mostrar(h + rodapeVoltar());
}

function kahoot(){
  const K = X.kahoot;
  let h = topo() + '<h2>Kahoots por conteúdo</h2><p class="sub">Cada conteúdo tem dois Kahoots: a revisão (modo fácil, aberta até ' + K.prazo +
    ') e o aprofundamento (mais difícil, em treino individual). Toque em Abrir ou aponte a câmera para o QR code.</p><div class="grade2">';
  K.desafios.forEach(d => { h += blocoKahoot(d.n + '. ' + d.t, d); });

function listaTec(itens){ return '<dl class="tec">' + itens.map(i => '<dt>' + esc(i[0]) + '</dt><dd>' + esc(i[1]) + '</dd>').join('') + '</dl>'; }

  const c = X.cofre;

  X.sintese.forEach((b, k) => {

    X.mapas.map((m, i) => '<p class="pgn">Mapa ' + (i + 1) + '</p>' + pagImg('img/mapas/' + m.f, 'Mapa mental ' + (i + 1), 'Mapa mental ' + (i + 1) + ': imagem não encontrada.', 'mapa')).join('');

const TELAS = { livro: livroLista, livaula: livroAula, caderno: caderno, foco: focoLista, focoaula: focoAula, kahoot: kahoot, tecnicas: tecnicas, sintese: sintese };
function telaDe(b){
  const v = b.dataset.v, x = b.dataset.x === undefined ? undefined : +b.dataset.x, y = b.dataset.y === undefined ? undefined : +b.dataset.y;
  return () => TELAS[v](x, y);
}

app.addEventListener('click', ev => {
  if (ev.target.matches && ev.target.matches('.pg img')) { ev.target.setAttribute('aria-pressed', ev.target.classList.toggle('zoom') ? 'true' : 'false'); return; }
  const b = ev.target.closest('[data-acao]');
  if (!b) return;
  const a = b.dataset.acao;
  if (a === 'ir') nav(telaDe(b));
  else if (a === 'troca') { tela = telaDe(b); tela(); }
  else if (a === 'voltar') { if (empilhadas > 0) history.back(); else voltar(); }
  else if (a === 'filtro') { soEx = b.dataset.s === '1'; tela(); }
  else if (a === 'inicio' || a === 'todas') { hist = []; tela = inicio; esvaziaHistorico(); }
  else if (a === 'sair') descartaUma();
  else if (a === 'aula') {
    const i = +b.dataset.i;
    if (b.classList.contains('tema-bt')) hist.push({ fn: tela, y: yAntes });  // veio do mapa de síntese: Voltar retorna a ele
    tela = () => aula(i);
    mem.ultima = i; salvar();
    marcaHistorico();
  }
  else if (a === 'comecar' || a === 'simulado') marcaHistorico();
});
window.addEventListener('popstate', ev => {
  if (pulando > 0) { pulando--; fimDoPulo(); return; }
  const st = ev.state;
  if (st && st.s === SESSAO && st.d > empilhadas) { pula(1); return; }  // seta Avançar: desfaz
  if (emTreino() && !confirmaSair()) { try { history.pushState({ d: empilhadas, s: SESSAO }, ''); } catch (e) {} return; }  // ficou: repõe a entrada que o Voltar consumiu
  empilhadas = Math.max(0, empilhadas - 1);
  voltar();
  if (tela === inicio && !hist.length) esvaziaHistorico();
});
document.addEventListener('visibilitychange', () => {  // tela bloqueada ou outro app: o relógio do exercício espera
  if (!Q || Q.respondida || !relogio || Q.pausado) return;  // pausado pelo aluno: continua pausado
  if (document.hidden) Q.resta = Q.fim - Date.now();
  else if (Q.resta != null) { Q.fim = Date.now() + Q.resta; Q.resta = null; }
});
app.addEventListener('keydown', ev => {  // ampliar a imagem pelo teclado
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches && ev.target.matches('.pg img')) { ev.preventDefault(); ev.target.click(); }
});
app.addEventListener('error', ev => {
  const t = ev.target;
  if (t && t.tagName === 'IMG' && t.dataset.falta) { const p = document.createElement('p'); p.className = 'falta'; p.textContent = t.dataset.falta; t.replaceWith(p); }
}, true);

// ===== v05: abas no rodapé, início por seção, flashcards de vocabulário e uso sem internet =====
let aba = 'aulas';
const pl = (n, s, p) => n + ' ' + (n === 1 ? s : p);
const ABAS = [['aulas', 'Aulas', '📘'], ['treinar', 'Treinar', '🎯'], ['tabuada', 'Tabuada', '🔢'], ['livro', 'Livro', '📖'], ['mais', 'Mais', '⭐']];
const navAbas = document.getElementById('abas');
const calmo = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function pintaAbas(){
  navAbas.innerHTML = ABAS.map(a => '<button data-aba="' + a[0] + '"' + (a[0] === aba ? ' class="on" aria-current="page"' : '') + '><span aria-hidden="true">' + a[2] + '</span>' + a[1] + '</button>').join('');
}
navAbas.addEventListener('click', ev => {
  const b = ev.target.closest('[data-aba]');
  if (!b) return;
  if (emTreino() && !confirmaSair()) return;
  parar(); aba = b.dataset.aba; hist = []; tela = inicio; inicio(); esvaziaHistorico();
});

const feita = p => { const r = mem['p' + p.n]; return !!r && r.total > 0 && r.melhor >= Math.ceil(r.total * 0.7); };  // concluída: 70% de acertos
function proximaAula(){
  const u = mem.ultima, tem = u != null && D.partes[u];
  if (tem && !feita(D.partes[u])) return u;
  const ini = tem ? u + 1 : 0;  // depois da última aula aberta; só então volta para as que ficaram para trás
  let i = D.partes.findIndex((p, k) => k >= ini && !feita(p));
  if (i < 0) i = D.partes.findIndex(p => !feita(p));
  return i < 0 ? (tem ? u : 0) : i;
}
function cartaoAula(p, i){
  const r = mem['p' + p.n], ok = feita(p);
  return '<button class="cartao' + (ok ? ' feito' : '') + '" data-acao="aula" data-i="' + i + '"><span class="num">' + (ok ? '✓' : p.n) + '</span><span class="tit">' + (ok ? p.n + '. ' : '') + esc(p.titulo) +
    '</span><span class="res">' + (r ? 'Melhor resultado: ' + r.melhor + ' de ' + r.total + (ok ? '' : ' · tente de novo') : 'Exercícios ainda não feitos') + '</span></button>';
}
function barra(pct){ return '<div class="prog"><i style="width:' + Math.round(pct) + '%"></i></div>'; }
function caixaOffline(){
  if (!('caches' in window) || !('serviceWorker' in navigator)) return '';
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent), icone = navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  let dica = '';
  if (ios && !icone) dica = '<p class="sub"><b>No iPhone, faça nesta ordem:</b> 1) toque em Compartilhar e em "Adicionar à Tela de Início"; 2) abra o ícone novo; 3) no ícone, com Wi-Fi, toque em "Guardar tudo no aparelho". ' +
    'O que for guardado aqui no Safari não vale para o ícone, e o iPhone apaga o que fica só no Safari depois de alguns dias sem uso.</p>';
  else if (!icone) dica = '<p class="sub">Para abrir como um aplicativo, toque em ⋮ e em "Adicionar à tela inicial".</p>';
  return '<div class="caixa off"><h3>Usar sem internet</h3><p class="sub">Guarde no aparelho as páginas do livro, os slides e os mapas (cerca de 25 MB). Faça isso no Wi-Fi. Depois essas imagens abrem sem internet. Os Kahoots precisam de internet.</p>' + dica +
    '<button data-acao="baixar" id="bx">' + (mem.offline ? 'Já está guardado. Guardar de novo' : 'Guardar tudo no aparelho') + '</button><p class="sub" id="bxs" role="status"></p></div>';
}
function dicaDoDia(){
  const todas = [];
  X.tecnicas.forEach(s => s.itens.forEach(i => todas.push(i)));
  const i = todas[hoje() % todas.length];
  return '<div class="nota"><p><b>Dica de hoje: ' + esc(i[0]) + '.</b> ' + esc(i[1]) + '</p></div>';
}

function inicio(){
  parar();
  if (ABA_EXTRA[aba]) { ABA_EXTRA[aba](); pintaAbas(); return; }  // abas dos módulos (ex.: Tabuada)
  let h = '';
  if (aba === 'aulas') {
    const tot = D.partes.length, feitas = D.partes.filter(feita).length, px = proximaAula(), pp = D.partes[px];
    h = trilhaBloco() + '<section class="heroi"><p class="hk">Seu progresso</p><p class="hn"><b>' + feitas + '</b> de ' + tot + ' aulas concluídas (com 70% de acertos ou mais)</p>' + barra(100 * feitas / tot) +
      '<button class="forte" data-acao="aula" data-i="' + px + '">' + (feitas === tot ? 'Rever' : (feitas || mem.ultima != null) ? 'Continuar' : 'Começar') + ': Aula ' + pp.n + ' · ' + esc(pp.titulo) + '</button></section>' +
      '<h2>Aulas de revisão</h2><p class="sub">Uma aula por dia: ideias-chave, exemplos passo a passo e exercícios.</p><div class="grade">' + D.partes.map(cartaoAula).join('') + '</div>' +
      '<details class="ajuda"><summary>Como usar e ajustes</summary><ol><li>Escolha uma aula.</li><li>Leia as ideias-chave e veja os exemplos resolvidos, um passo de cada vez.</li>' +
      '<li>Faça os exercícios com calma. No fim, veja o que errou e tente de novo.</li><li>Use as abas de baixo para treinar, abrir o livro e ver as dicas.</li></ol>' +
      '<label class="tempo"><input type="checkbox" id="comtempo"' + (mem.comTempo ? ' checked' : '') + '> Usar relógio nos exercícios (dá para pausar)</label>' +
      '<label class="tempo"><input type="checkbox" id="dobro"' + (mult === 2 ? ' checked' : '') + '> Com o relógio ligado, dar o tempo em dobro</label></details>';
  } else if (aba === 'treinar') {
    const s = mem.sim;
    h = '<h2>Treinar</h2><p class="sub">Teste o que você já sabe. Errar aqui é o jeito mais rápido de aprender.</p><div class="grade">' +
      '<button class="cartao sim" data-acao="simulado"><span class="num">★</span><span class="tit">Simulado: 20 questões sorteadas</span><span class="res">' +

async function baixarTudo(){
  const bt = document.getElementById('bx'), st = document.getElementById('bxs'), urls = [];
  X.livros.forEach(L => { L.aulas.forEach(a => a.pags.forEach(p => urls.push('img/livro' + L.vol + '/' + p.f))); L.caderno.forEach(p => urls.push('img/livro' + L.vol + '/' + p.f)); });
  X.foco.forEach(B => B.aulas.forEach(a => a.slides.forEach(s => urls.push('img/foco/' + s.f))));
  X.mapas.forEach(m => urls.push('img/mapas/' + m.f));
  bt.disabled = true;
  let ok = 0, falhas = 0, pagOk = false;
  try {
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
    const c = await caches.open(CACHE_IMG);
    try {  // a página inicial também: sem ela, as imagens guardadas não têm como abrir sem rede
      const r = await fetch('./', { cache: 'no-cache' });
      if (r.ok && !r.redirected && (r.headers.get('content-type') || '').indexOf('text/html') === 0) { await (await caches.open(CACHE_PAG)).put('./', r); pagOk = true; }
    } catch (e) {}
    for (let i = 0; i < urls.length; i += 6) {
      await Promise.all(urls.slice(i, i + 6).map(async u => {
        try { if (!(await c.match(u))) { const r = await fetch(u); if (!r.ok || (r.headers.get('content-type') || '').indexOf('image/') !== 0) throw new Error('falha'); await c.put(u, r); } ok++; } catch (e) { falhas++; }
      }));
      if (st.isConnected) st.textContent = 'Guardando: ' + (ok + falhas) + ' de ' + urls.length + ' imagens...';
    }
  } catch (e) { falhas = urls.length - ok; }
  mem.offline = falhas === 0 && pagOk; salvar();
  if (st.isConnected) {
    st.textContent = !pagOk ? 'A página inicial não foi guardada. Tente de novo com a internet melhor.' : falhas ? (falhas === 1 ? 'Faltou 1 imagem.' : 'Faltaram ' + falhas + ' imagens.') + ' Tente de novo com a internet melhor.'
      : 'Pronto: ' + pl(ok, 'imagem guardada', 'imagens guardadas') + '. O livro, os slides e os mapas abrem sem internet.';
    bt.disabled = false; bt.textContent = (falhas || !pagOk) ? 'Tentar de novo' : 'Já está guardado. Guardar de novo';
  }
}
function confereOffline(){  // o aparelho pode ter apagado o que estava guardado
  if (!mem.offline || !('caches' in window)) return;

// ===== v06 núcleo: pontos, sequência de dias, avisos, trilha até a prova, aba Mais e envio ao professor =====
const META_DIA = 50;
const ABA_EXTRA = {};  // os módulos registram aqui a tela inicial das abas novas
function pontosHoje(){ return (mem.dias && mem.dias[hoje()]) || 0; }
function sequencia(){
  if (!mem.dias) return 0;
  let d = hoje(), s = 0;
  if (!mem.dias[d]) d--;  // hoje ainda sem pontos não quebra a sequência
  while (mem.dias[d]) { s++; d--; }
  return s;
}
let tAviso = 0;
function aviso(txt){
  const a = document.getElementById('aviso');
  if (!a) return;
  a.textContent = txt; a.classList.add('on');
  clearTimeout(tAviso); tAviso = setTimeout(() => a.classList.remove('on'), 2400);
}
function pintaPlacar(){
  const p = document.getElementById('placar');
  if (!p) return;
  const s = sequencia();
  p.innerHTML = '<span><span aria-hidden="true">⭐</span> ' + (mem.xp || 0) + '<span class="so-leitor"> pontos</span></span>' +
    (s > 1 ? '<span><span aria-hidden="true">🔥</span> ' + s + '<span class="so-leitor"> dias seguidos</span></span>' : '');
}
// Pontos valem o esforço novo: repetir o mesmo item no mesmo dia rende um quinto. Errar não tira ponto.
function ganha(n, motivo, chave){
  if (!(n > 0)) return 0;
  const d = hoje();
  if (!mem.vistos || mem.vistos.d !== d) mem.vistos = { d: d, k: {} };
  if (chave) { if (mem.vistos.k[chave]) n = Math.max(1, Math.round(n / 5)); mem.vistos.k[chave] = 1; }
  const antes = pontosHoje();
  mem.xp = (mem.xp || 0) + n;
  mem.dias = mem.dias || {}; mem.dias[d] = antes + n;
  salvar(); pintaPlacar();
  aviso('+' + n + (n === 1 ? ' ponto' : ' pontos') + (motivo ? ' · ' + motivo : '') + (antes < META_DIA && antes + n >= META_DIA ? ' · meta de hoje batida!' : ''));
  return n;
}
function marca(grupo, chave){  // registro simples de "feito" (livro, Kahoot, etapas): mem[grupo][chave] = dia
  mem[grupo] = mem[grupo] || {};
  const novo = !mem[grupo][chave];
  mem[grupo][chave] = hoje(); salvar();
  return novo;
}
function feito(grupo, chave){ return !!(mem[grupo] && mem[grupo][chave]); }

// ---------- trilha até a prova ----------
const DIAS_SEMANA = ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'];
function diaDe(iso){ const p = iso.split('-'); return Math.floor(Date.UTC(+p[0], +p[1] - 1, +p[2]) / 864e5); }
function dataCurta(iso){ const p = iso.split('-'); return p[2] + '/' + p[1]; }
function nomeDia(iso){ const p = iso.split('-'); return DIAS_SEMANA[new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])).getUTCDay()]; }
function tarefaFeita(t){
  if (t.tipo === 'aula') return feita(D.partes[t.i]);
  if (t.tipo === 'tab') return feito('tab', 'e' + t.e);
  if (t.tipo === 'flash') return feito('fcs', 'b' + t.di);
  if (t.tipo === 'sim') return (mem.simN || 0) >= (t.vez || 1);
  if (t.tipo === 'livro') return feito('liv', t.vi + ':' + t.n);
  if (t.tipo === 'kahoot') return feito('kh', 'k' + t.n);
  if (t.tipo === 'aquece') return !!mem['aq' + diaDe(t.d)];
  return false;
}
function tarefaBotao(t){
  const ok = tarefaFeita(t), m = '<span class="tk" aria-hidden="true">' + (ok ? '✓' : '') + '</span>';
  let attr = '', txt = t.txt;
  if (t.tipo === 'aula') attr = 'data-acao="aula" data-i="' + t.i + '"';
  else if (t.tipo === 'tab') attr = 'data-acao="ir" data-v="tabetapa" data-x="' + t.e + '"';
  else if (t.tipo === 'flash') attr = 'data-acao="ir" data-v="flash" data-x="' + t.di + '"';
  else if (t.tipo === 'aquece') attr = 'data-acao="aquece" data-k="' + t.k + '"';
  else if (t.tipo === 'sim') attr = 'data-acao="simulado"';
  else if (t.tipo === 'livro') attr = 'data-acao="ir" data-v="livaula" data-x="' + t.vi + '" data-y="' + t.n + '"';
  else if (t.tipo === 'kahoot') attr = 'data-acao="ir" data-v="kahoot"';
  return '<button class="tarefa' + (ok ? ' ok' : '') + '" ' + attr + '>' + m + '<span>' + esc(txt) + (ok ? '<span class="so-leitor"> (feito)</span>' : '') + '</span></button>';
}
function diaDaTrilha(){  // o dia de hoje; antes do início, o primeiro; depois do fim, nenhum
  const T = X.trilha, h = hoje();
  if (!T || !T.dias.length) return -1;
  if (h < diaDe(T.dias[0].d)) return 0;
  return T.dias.findIndex(x => diaDe(x.d) === h);
}
function cartaoDia(k, aberto){
  const T = X.trilha, x = T.dias[k], h = hoje(), dn = diaDe(x.d), feitas = x.tarefas.filter(tarefaFeita).length;
  const quando = dn === h ? 'Hoje' : dn === h + 1 ? 'Amanhã' : dn < h ? 'Já passou' : '';
  return '<section class="dia' + (dn === h ? ' hoje' : '') + (x.leve ? ' leve' : '') + '"><h3>' + (quando ? quando + ' · ' : '') + nomeDia(x.d) + ', ' + dataCurta(x.d) +
    ' <small>' + feitas + ' de ' + x.tarefas.length + '</small></h3><p class="sub">' + esc(x.foco) + (x.leve ? ' Dia leve: faça se puder.' : '') + '</p>' +
    (aberto ? '<div class="lista">' + x.tarefas.map(tarefaBotao).join('') + '</div>' : '') + '</section>';
}
function trilhaBloco(){
  const T = X.trilha;
  if (!T || !T.dias.length) return '';
  const k = diaDaTrilha(), prova = diaDe(T.prova), falta = prova - hoje();
  let h = '<h2>Trilha até a prova</h2>';
  if (falta < 0) return h + '<p class="sub">A prova já passou. O material continua aqui para você rever o que quiser.</p>';
  h += '<p class="sub">' + (falta === 0 ? 'A prova é hoje. Respire fundo e boa prova!' : falta === 1 ? 'A prova é amanhã. Faça só uma revisão leve e durma cedo.' : 'Faltam ' + falta + ' dias para a prova (' + dataCurta(T.prova) + '). Um pouco por dia vale mais que tudo na véspera.') + '</p>';
  if (k >= 0) h += cartaoDia(k, true);
  return h + '<div class="linha" style="margin-top:8px">' + botaoIr('Ver a trilha inteira', 'trilha', null, null, 'leve') + '</div>';
}
function trilhaInteira(){
  const T = X.trilha;
  let h = topo() + '<h2>Trilha até a prova</h2><p class="sub">' + esc(T.intro) + '</p>';

  else if (k === 'dobro') { o.txt = 'É o dobro de ' + Y + ': ' + Y + ' + ' + Y + '.'; o.dica = 'É o mesmo grupo de ' + Y + ' duas vezes: junte os dois grupos.'; o.conta = Y + ' + ' + Y + ' = ' + p; }
  else if (k === 'cinco') { o.txt = 'É a metade do ×10: faça 10 × ' + Y + ' e pegue a metade.'; o.conta = '10 × ' + Y + ' = ' + (10 * y) + '; a metade de ' + (10 * y) + ' é ' + p; }
  else if (k === 'nove') { o.txt = 'É o ×10 menos um grupo: faça 10 × ' + Y + ' e tire um ' + Y + '.'; o.conta = '10 × ' + Y + ' − ' + Y + ' = ' + (10 * y) + ' − ' + Y + ' = ' + p; }
  else if (k === 'tres') { o.txt = 'É o dobro mais um grupo: o dobro de ' + Y + ' e mais um ' + Y + '.'; o.conta = '2 × ' + Y + ' + ' + Y + ' = ' + (2 * y) + ' + ' + Y + ' = ' + p; }
  else if (k === 'quatro') { o.txt = 'É o dobro do dobro: faça o dobro de ' + Y + ' e depois o dobro desse resultado.'; o.conta = '2 × ' + Y + ' = ' + (2 * y) + '; ' + (2 * y) + ' + ' + (2 * y) + ' = ' + p; }
  else if (k === 'seis') { o.txt = 'É o ×5 mais um grupo: faça 5 × ' + Y + ' e some mais um ' + Y + '.'; o.conta = '5 × ' + Y + ' + ' + Y + ' = ' + (5 * y) + ' + ' + Y + ' = ' + p; }
  else if (k === 'sete') { o.txt = 'É o ×5 mais o ×2: faça 5 × ' + Y + ' e 2 × ' + Y + ', e some.'; o.conta = '5 × ' + Y + ' + 2 × ' + Y + ' = ' + (5 * y) + ' + ' + (2 * y) + ' = ' + p; }
  else if (k === 'oito') { o.txt = 'É o dobro do ×4: faça 4 × ' + Y + ' e depois o dobro.'; o.conta = '4 × ' + Y + ' = ' + (4 * y) + '; ' + (4 * y) + ' + ' + (4 * y) + ' = ' + p; }

// Lista de estratégias para chegar em a × b, da mais curta para a mais longa (quadrado e espelho no fim).
function estrategias(a, b){
  const lista = [], p = a * b, xs = a === b ? [a] : [a, b];
  xs.sort((u, v) => TB_ORDEM.indexOf(u) - TB_ORDEM.indexOf(v));
  xs.forEach(x => { const y = x === a ? b : a; if (x === 1 || y !== 1) lista.push(tbEstrDe(TB_POR[x], x, y)); });  // com um fator 1, só o ×1 faz sentido
  if (a === b) {
    const q = { k: 'quadrado', x: a, y: a, nome: TB_NOME.quadrado };
    if (a === 1) { q.txt = 'É o menor quadrado: 1 linha de 1.'; q.conta = '1 × 1 = 1'; }
    else {
      const v = a - 1;
      q.txt = 'É um quadrado, na diagonal da tabela. Ele é o quadrado vizinho, ' + v + ' × ' + v + ', mais uma faixa em L: ' + v + ' quadradinhos de um lado e ' + a + ' do outro.';
      q.conta = v + ' × ' + v + ' + ' + v + ' + ' + a + ' = ' + (v * v) + ' + ' + v + ' + ' + a + ' = ' + p;
    }
    lista.push(q);
  } else lista.push({ k: 'espelho', x: b, y: a, nome: TB_NOME.espelho, txt: 'Espelho: ' + b + ' × ' + a + ' é o mesmo retângulo girado. Se você sabe um, sabe o outro.', conta: a + ' × ' + b + ' = ' + b + ' × ' + a + ' = ' + p });
  return lista;
}
function tbEstr(e, a, b){  // a estratégia da etapa e para o fato a × b
  const l = estrategias(a, b), ch = TB_CHAVES[e];
  if (ch) for (let i = 0; i < l.length; i++) if (ch.indexOf(l[i].k) >= 0) return l[i];
  return l[0];
}
function tbCorte(m, n, k, dir){  // corte do retângulo m × n depois da linha ou coluna k
  const p = m * n;
  if (dir === 'l') {
    const r = m - k;
    return { f: (i) => i < k ? 'a' : 'b', expr: m + ' × ' + n + ' = ' + k + ' × ' + n + ' + ' + r + ' × ' + n,
      conta: k + ' × ' + n + ' + ' + r + ' × ' + n + ' = ' + (k * n) + ' + ' + (r * n) + ' = ' + p, soma: (k * n) + ' + ' + (r * n) + ' = ' + p, leg: 'Azul: ' + k + ' × ' + n + '. Laranja: ' + r + ' × ' + n + '.', p1: k + ' × ' + n, p2: r + ' × ' + n };
  }
  const r = n - k;
  return { f: (i, j) => j < k ? 'a' : 'b', expr: m + ' × ' + n + ' = ' + m + ' × ' + k + ' + ' + m + ' × ' + r,
    conta: m + ' × ' + k + ' + ' + m + ' × ' + r + ' = ' + (m * k) + ' + ' + (m * r) + ' = ' + p, soma: (m * k) + ' + ' + (m * r) + ' = ' + p, leg: 'Azul: ' + m + ' × ' + k + '. Laranja: ' + m + ' × ' + r + '.', p1: m + ' × ' + k, p2: m + ' × ' + r };
}
function tbCorteEstr(a, b, k){

// ---------- malha de quadradinhos (CSS grid, sem imagem) ----------
function tbMalha(m, n, f, rot, leg, altMax){
  const W = Math.min(((app && app.clientWidth) || 360) - 70, 420), H = altMax || 260;
  let s = Math.floor((W - (n - 1) * 2) / n);
  s = Math.max(7, Math.min(28, s, Math.floor((H - (m - 1) * 2) / m)));
  let h = '<figure class="tbfig"><div class="tbm" role="img" aria-label="' + esc0(rot || (m + ' linhas de ' + n + ' quadradinhos')) + '" style="grid-template-columns:repeat(' + n + ',' + s + 'px);grid-auto-rows:' + s + 'px">';
  for (let i = 0; i < m; i++) for (let j = 0; j < n; j++) h += '<i class="' + (f ? f(i, j) : 'a') + '"></i>';
  return h + '</div>' + (leg ? '<figcaption class="sub">' + esc(leg) + '</figcaption>' : '') + '</figure>';
}
function tbMalhaS(a, b, s, altMax){  // malha que mostra a estratégia s no fato a × b (altMax: altura máxima, opcional)
  if (s.k === 'corte') return tbMalha(a, b, s.f, a + ' linhas de ' + b + ', cortado em duas partes', s.leg, altMax);
  if (s.k === 'quadrado') {
    const n = a, v = n - 1;
    return tbMalha(n, n, (i, j) => (i < v && j < v) ? 'a' : 'b', 'Quadrado de ' + n + ' por ' + n, n > 1 ? 'Azul: o quadrado vizinho, ' + v + ' × ' + v + '. Laranja: a faixa em L que falta, ' + v + ' + ' + n + ' quadradinhos.' : '', altMax);
  }
  if (s.k === 'espelho') return tbMalha(b, a, null, b + ' linhas de ' + a + ' quadradinhos', 'O mesmo retângulo, girado: ' + b + ' linhas de ' + a + '.', altMax);
  const G = { dobro: [2, 1, 'b'], tres: [3, 2, 'b'], quatro: [4, 2, 'b'], cinco: [10, 5, 'meia'], nove: [10, 9, 'fora'], seis: [6, 5, 'b'], sete: [7, 5, 'b'], oito: [8, 4, 'b'] }[s.k];
  const g = G ? G[0] : s.x, corte = G ? G[1] : g, outra = G ? G[2] : 'a', y = s.y, porLinha = s.x === a;
  const cls = i => i < corte ? 'a' : outra, gr = porLinha ? ' Cada grupo é uma linha.' : ' Cada grupo é uma coluna.';
  const leg = {
    dobro: 'Azul: um grupo de ' + y + '. Laranja: outro grupo igual.',
    tres: 'Azul: o dobro, 2 grupos de ' + y + '. Laranja: mais um grupo.',
    quatro: 'Azul: o dobro, 2 grupos de ' + y + '. Laranja: o mesmo dobro de novo.',
    cinco: 'São 10 grupos de ' + y + '. Azul: a metade, 5 grupos. Tracejado: a outra metade.',
    nove: 'São 10 grupos de ' + y + '. O grupo com borda tracejada sai: ficam 9.',
    seis: 'Azul: 5 grupos de ' + y + '. Laranja: mais um grupo.',
    sete: 'Azul: 5 grupos de ' + y + '. Laranja: mais 2 grupos.',
    oito: 'Azul: 4 grupos de ' + y + '. Laranja: outros 4 grupos.'
  }[s.k] || (g + (g === 1 ? ' grupo' : ' grupos') + ' de ' + y + '.');
  if (porLinha) return tbMalha(g, y, i => cls(i), g + ' linhas de ' + y + ' quadradinhos', leg + gr, altMax);
  return tbMalha(y, g, (i, j) => cls(j), y + ' linhas de ' + g + ' quadradinhos', leg + gr, altMax);
}
