200h3%27%2F%3E%3C%2Fsvg%3E"}}, "deck": 6}, {"n": 12, "titulo": "Múltiplos, divisores e plano cartesiano", "resumo": "múltiplos, divisibilidade, fatoração, MMC e MDC em problemas, e pares ordenados no 1º quadrante", "ideias": ["Múltiplos de um número são os resultados da tabuada dele. Divisor é quem divide sem deixar resto.", "Divisível por 2: é par. Por 3: a soma dos algarismos é múltipla de 3. Por 5: termina em 0 ou 5.", "MMC resolve \"quando acontece junto de novo\". MDC resolve \"dividir em grupos iguais, o maior possível\".", "No par ordenado (x, y), o primeiro número anda na horizontal e o segundo na vertical.", "A ordem importa: (3, 2) e (2, 3) são pontos diferentes."], "q": [{"id": "p12q0", "texto": "Qual destes números é múltiplo de 7?", "alts": ["27", "56", "17", "74"], "certa": 1, "nivel": "Entrada", "tempo": 30, "just": "7 × 8 = 56.", "pista": "Os múltiplos de 7 aparecem na tabuada do 7: 7, 14, 21... Continue essa tabuada e veja se algum número da lista aparece nela.", "alem": "Escolha um múltiplo de 7 com dois algarismos e troque a ordem dos algarismos. O novo número continua sendo múltiplo de 7? Teste com outros e conte quantos continuam.", "erros": ["Você pode ter achado que 27 está perto da tabuada do 7. Ele fica entre dois múltiplos: 21 e 28. Divida por 7 e veja se sobra resto.", null, "Você pode ter olhado só para o algarismo 7. Ter um 7 no número não basta para ser múltiplo de 7. Na tabuada, 14 e 21 são múltiplos e 17 fica entre eles.", "Você pode ter olhado só para o algarismo 7. É preciso dividir o número inteiro por 7. Os números 70 e 77 são múltiplos de 7, e 74 fica entre eles."]}, {"id": "p12q1", "texto": "Um número é divisível por 3 quando:", "alts": ["a soma dos seus algarismos é múltipla de 3", "o último algarismo é par", "ele termina em 3", "ele tem três algarismos"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "Por exemplo, 123: 1 + 2 + 3 = 6, que é múltiplo de 3.", "pista": "Separe números que você sabe que estão na tabuada do 3 (12, 15, 21) de outros que não estão (13, 16, 20). Veja se alguma conta simples com os algarismos separa os dois grupos.", "alem": "Invente quatro números de três algarismos, teste a regra em cada um e confirme dividindo por 3. Depois veja se uma regra parecida vale para o 9: teste 18, 27 e 21 e explique o que você viu.", "erros": [null, "Essa ideia é da divisibilidade por 2, não por 3. O número 14 termina em algarismo par e 14 ÷ 3 deixa resto 2. Teste números pares e ímpares da tabuada do 3.", "Você olhou só o último algarismo. Mas 13 e 23 terminam em 3 e sobra resto na divisão por 3, enquanto 12 não termina em 3 e é divisível. Teste com outros exemplos.", "A quantidade de algarismos não decide a divisão: 100 tem três algarismos e não é múltiplo de 3, e 12 tem dois e é. Procure algo que dependa de quais são os algarismos."]}, {"id": "p12q2", "texto": "A escrita 12 = 2 × 2 × 3 representa:", "alts": ["a fatoração de 12 em números primos", "a divisão de 12 por 2", "o MDC de 12", "os múltiplos de 12"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "12 foi decomposto em fatores primos.", "pista": "Veja o que o 2 e o 3 têm de especial: só se dividem por 1 e por eles mesmos. Depois calcule 2 × 2 × 3 e compare cada alternativa com o que está escrito.", "alem": "Escreva 18 e 30 como multiplicação de números primos. Dá para escrever cada um em mais de uma ordem? Compare com um colega: o que muda e o que fica igual?", "erros": [null, "Você pode ter visto o 12 e o 2 e pensado em dividir. Na escrita não há o sinal ÷, só multiplicação: 2 × 2 × 3 dá 12, e 12 ÷ 2 daria 6.", "O MDC é o maior divisor comum e precisa de dois números para comparar. Aqui há um único número, o 12, escrito como uma multiplicação.", "Você pode ter confundido com a lista 12, 24, 36... Os múltiplos de 12 são o 12 vezes um número. Aqui há uma multiplicação de números pequenos cujo resultado é o próprio 12."]}, {"id": "p12q3", "texto": "Qual é o MMC de 4 e 6?", "alts": ["24", "12", "10", "2"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "Múltiplos de 4: 4, 8, 12. De 6: 6, 12. O menor comum é 12.", "passos": ["Liste os múltiplos de 4: 4, 8, 12, 16...", "Liste os múltiplos de 6: 6, 12, 18...", "O primeiro que aparece nas duas listas é 12."], "mmc": [4, 6], "mmcPasso": 2, "pista": "Escreva em duas linhas os primeiros múltiplos de 4 e os primeiros múltiplos de 6. Procure o primeiro número que aparece nas duas linhas.", "alem": "Ache o MMC de 4 e 6 de outro jeito, usando a fatoração em primos, e compare com o primeiro resultado. Depois invente dois pares de números: um com MMC igual ao produto deles e outro com MMC menor que o produto.", "erros": ["Você provavelmente fez 4 × 6. O produto aparece nas duas listas de múltiplos, mas o MMC pede o menor número que aparece nas duas. Veja se existe um menor.", null, "Você provavelmente somou 4 + 6. Mas 10 não é múltiplo de 4 (10 ÷ 4 deixa resto 2). Confira se o número se divide por 4 e por 6 sem sobrar resto.", "Esse é o maior divisor que 4 e 6 têm em comum (o MDC). O MMC trata de múltiplos, que nunca são menores que o próprio número: nenhum múltiplo de 6 é menor que 6."]}, {"id": "p12q4", "texto": "Qual é o MDC de 12 e 18?", "alts": ["3", "6", "36", "2"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "Divisores de 12: 1, 2, 3, 4, 6, 12. De 18: 1, 2, 3, 6, 9, 18. O maior comum é 6.", "pista": "Liste todos os divisores de 12 e todos os divisores de 18. Marque os que aparecem nas duas listas e escolha o maior deles.", "alem": "Resolva de outro jeito, usando a fatoração em primos de cada número, e compare. Depois ache outro par de números com o mesmo MDC que 12 e 18. Quantos pares você consegue?", "erros": ["Esse número divide 12 e 18, então é um divisor comum, mas o MDC pede o maior divisor comum. Veja se há um divisor comum maior nas suas listas.", null, "Você pode ter procurado o menor múltiplo comum (MMC), que é outra coisa. O MDC é um divisor, então nunca é maior que o menor dos dois números.", "Esse número divide 12 e 18, então é um divisor comum, mas o MDC pede o maior. Veja se há um divisor comum maior nas suas duas listas."]}, {"id": "p12q5", "texto": "Qual número é divisível por 2, por 3 e por 5 ao mesmo tempo?", "alts": ["90", "75", "84", "48"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "90 termina em 0 (2 e 5) e 9 + 0 = 9 (3). Os outros falham em algum teste.", "pista": "Ser divisível por 2 e por 5 ao mesmo tempo diz algo sobre o último algarismo. Use isso para descartar números e depois teste o 3 com a soma dos algarismos nos que sobrarem.", "alem": "Qual é o menor número maior que zero que passa nos três testes? Liste três números maiores que 100 que também passam. O que eles têm em comum?", "erros": [null, "A soma dos algarismos é 12, então passa no teste do 3, e termina em 5, então passa no do 5. Mas é ímpar, então não é divisível por 2. Confira os três testes, não só dois.", "É par e a soma dos algarismos é 12, então passa no 2 e no 3. Mas termina em 4, e só é divisível por 5 quem termina em 0 ou 5. Faltou conferir o 5.", "É par e a soma dos algarismos é 12, então passa no 2 e no 3. Mas termina em 8, e só é divisível por 5 quem termina em 0 ou 5. Faltou conferir o 5."]}, {"id": "p12q6", "texto": "Dois ônibus saem juntos e voltam a cada 10 min e a cada 15 min. Quando saem juntos de novo?", "alts": ["5 minutos depois", "150 minutos depois", "30 minutos depois", "25 minutos depois"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "MMC de 10 e 15 = 30.", "passos": ["\"Saem juntos de novo\" pede o MMC de 10 e 15.", "Múltiplos de 10: 10, 20, 30. Múltiplos de 15: 15, 30.", "O primeiro em comum é 30: saem juntos 30 minutos depois."], "mmc": [10, 15], "mmcPasso": 1, "pista": "Desenhe uma linha do tempo para cada ônibus e marque os minutos em que ele sai. Procure o primeiro minuto, depois do início, que está marcado nas duas linhas.", "alem": "E se os ônibus saíssem a cada 12 min e a cada 18 min? Resolva. Depois invente um problema parecido com outra situação, como duas luzes piscando, e peça a um colega que resolva.", "erros": ["Esse é um divisor de 10 e de 15, não um múltiplo. Em 5 minutos nenhum dos dois ônibus voltou ainda, pois um volta em 10 e o outro em 15. Procure um tempo em que os dois já tenham voltado.", "Você provavelmente fez 10 × 15. Nesse tempo os dois ônibus se encontram, mas a pergunta é sobre a primeira vez. Veja se existe um tempo menor que também é múltiplo de 10 e de 15.", null, "Você provavelmente somou 10 + 15. Para saírem juntos, o tempo precisa ter um número inteiro de voltas de cada ônibus. Confira se 25 é múltiplo de 10."]}, {"id": "p12q7", "texto": "No plano cartesiano, o ponto (3, 2) fica:", "alts": ["3 unidades acima e 2 à esquerda", "exatamente na origem", "3 unidades à direita e 2 acima da origem", "2 unidades à direita e 3 acima da origem"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "O primeiro número é x (horizontal) e o segundo é y (vertical).", "pista": "Desenhe os dois eixos e comece na origem, que é o ponto (0, 0). A ordem dos números no par diz qual caminho fazer primeiro: na horizontal ou na vertical.", "alem": "Marque o ponto (3, 2). Invente três outros pontos, no 1º quadrante, que formem um quadrado com ele. Ache pelo menos dois quadrados diferentes.", "erros": ["Você parece ter trocado a ordem e ainda andado para a esquerda. Com os dois números positivos, o ponto fica à direita e acima da origem. Ir para a esquerda pediria um número negativo.", "A origem é o ponto (0, 0), com os dois números iguais a zero. Aqui nenhum dos números é zero, então é preciso andar a partir da origem.", null, "Você usou os números certos, mas na ordem trocada. Em (x, y), o primeiro número manda andar na horizontal e o segundo na vertical. Releia qual vem primeiro."]}, {"id": "p12q8", "texto": "Os pontos (3, 2) e (2, 3) são o mesmo ponto?", "alts": ["Não: o segundo está abaixo do eixo x", "Sim: só mudamos a ordem de escrever", "Sim: os números são iguais", "Não: a ordem é x primeiro, depois y"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "(3, 2) e (2, 3) são pontos diferentes.", "pista": "Marque os dois pontos no mesmo plano, cada um partindo da origem. Compare quanto cada um anda na horizontal e quanto anda na vertical.", "alem": "Existe algum ponto (a, b) que seja igual ao ponto (b, a)? Que condição os números precisam cumprir? Dê três exemplos e explique para um colega.", "erros": ["Abaixo do eixo x, o valor de y seria negativo. Nos dois pares os números são positivos, então os dois pontos ficam acima do eixo x. Confira o sinal do y e a posição de cada ponto no desenho.", "Você tratou o par como um grupo de números em que a ordem não importa. No plano, trocar a ordem muda o caminho a percorrer. Marque os dois pontos para ver onde cada um cai.", "Você olhou só quais números aparecem. Em um par ordenado, cada posição manda para um eixo, então os mesmos números em posições diferentes podem levar a lugares diferentes. Marque os dois e compare.", null]}, {"id": "p12q9", "texto": "Um retângulo tem vértices (1, 1), (5, 1), (5, 4) e (1, 4). Qual é a área, em unidades quadradas?", "alts": ["7", "20", "14", "12"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "Base 5 − 1 = 4 e altura 4 − 1 = 3. Área = 4 × 3 = 12.", "passos": ["Base: de x = 1 até x = 5 são 4 unidades.", "Altura: de y = 1 até y = 4 são 3 unidades.", "Área = 4 × 3 = 12 unidades quadradas."], "pista": "Marque os quatro vértices no plano e ligue. Para achar o tamanho de cada lado, veja entre quais coordenadas há diferença e calcule quanto falta de uma até a outra.", "alem": "Desloque o retângulo para outro lugar do plano sem mudar o tamanho. A área muda? Escreva os novos vértices. Depois invente um retângulo com a mesma área e lados diferentes.", "erros": ["Você provavelmente somou o tamanho dos dois lados. Para a área, os lados se multiplicam: ela conta quantos quadradinhos de 1 unidade cabem dentro.", "Você provavelmente multiplicou os números 5 e 4 das coordenadas, como se fossem os lados. Mas o retângulo não começa na origem: o tamanho de cada lado vem da diferença entre coordenadas.", "Você provavelmente somou os lados e dobrou o resultado, o que dá o perímetro, o contorno da figura. A área mede a superfície e usa uma multiplicação dos dois lados.", null]}], "mmcTool": [4, 6], "dica": ["Treine a tabuada um pouco por dia com cartões: de um lado 7 × 8, do outro 56. Embaralhe e repita os que errou.", "\"Juntos de novo\" pede MMC. \"Dividir em grupos iguais, o maior possível\" pede MDC. No plano cartesiano, o x vem primeiro."], "mapas": [16, 15], "kahoot": {"n": 12, "t": "Múltiplos, divisores e plano cartesiano", "pin": "08792395", "url": "https://kahoot.it/challenge/08792395", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m1%200h4m1%200h4m1%200h1m3%200h7m-29%201h1m5%200h1m1%200h1m4%200h2m1%200h1m2%200h2m1%200h1m5%200h1m-29%201h1m1%200h3m1%200h1m1%200h3m1%200h2m1%200h1m2%200h3m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m3%200h1m1%200h1m1%200h1m2%200h1m1%200h2m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m1%200h1m2%200h2m2%200h3m2%200h1m1%200h3m1%200h1m-29%201h1m5%200h1m2%200h2m1%200h3m2%200h1m2%200h1m1%200h1m5%200h1m-29%201h7m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h7m-20%201h3m2%200h1m4%200h2m-21%201h1m2%200h6m2%200h4m2%200h1m1%200h1m1%200h1m2%200h1m1%200h3m-29%201h2m1%200h3m1%200h5m2%200h6m3%200h2m1%200h2m-25%201h1m2%200h1m1%200h5m1%200h3m3%200h1m1%200h1m3%200h1m-27%201h3m2%200h1m5%200h2m1%200h5m2%200h1m3%200h1m2%200h1m-28%201h1m4%200h2m4%200h4m4%200h1m1%200h2m4%200h1m-29%201h2m1%200h1m3%200h3m1%200h2m2%200h1m2%200h1m2%200h8m-29%201h1m4%200h2m2%200h2m1%200h1m1%200h4m1%200h2m1%200h1m1%200h1m1%200h1m1%200h1m-28%201h1m1%200h1m4%200h1m2%200h1m1%200h4m m3%200h1m1%200h1m2%200h4m1%200h5m1%200h2m2%200h1m-37%201h7m1%200h3m5%200h3m3%200h1m1%200h4m1%200h2m1%200h1m1%200h3%27%2F%3E%3C%2Fsvg%3E"}}, "deck": 7}, {"n": 13, "titulo": "Interpretar e montar equações", "resumo": "o vocabulário de equações e sequências, traduzir o enunciado em equação e ler o que cada número significa", "ideias": ["Antes de montar, diga quem é a letra: ela é o que a pergunta quer descobrir.", "Traduza por partes: \"o dobro\" é 2x, \"a metade\" é x/2, \"8 a mais\" é x + 8. \"Ao todo\" e \"o resultado foi\" mostram o total, que fica do outro lado do sinal de igual.", "O valor que se repete (por km, por hora, por unidade) é multiplicado pela quantidade. O valor fixo entra uma vez só, somando.", "A ordem importa: \"multiplicou por 3 e depois somou 7\" é 3x + 7. \"Somou 7 e depois multiplicou por 3\" é 3 · (x + 7).", "Depois de montar, teste: troque a letra por um número e veja se a história continua fazendo sentido."], "q": [{"id": "p13q0", "texto": "Leia a equação  3x + 5 = 20.  Nessa equação, a letra x representa", "alts": ["um número desconhecido, que queremos descobrir: a incógnita.", "o sinal de multiplicação entre o 3 e o 5.", "o resultado da equação, que é 20.", "qualquer número, pois a igualdade vale para todos os valores de x."], "certa": 0, "nivel": "Vocabulário", "tempo": 60, "just": "B confunde a letra com a operação (3x é 3 vezes x, mas x não é o sinal). C confunde a incógnita com o resultado. D descreve uma variável: numa equação a letra vale um número só (aqui, x = 5).", "fixo": true, "pista": "Pense na equação como uma charada: existe um número escondido que deixa a igualdade verdadeira. Qual letra guarda esse número escondido?", "alem": "Invente uma equação com a letra y e peça a um colega para descobrir o valor de y. Depois explique por que o y dessa equação não pode valer qualquer número.", "erros": [null, "Você leu a letra como um sinal de operação entre o 3 e o 5. Confira: o 3 está grudado no x (3x) e o 5 vem depois do sinal de +, então o x não está entre os dois.", "Você tomou o valor depois do sinal de igual como se fosse a letra. Confira: o 20 já está escrito, e o x é o número que ainda não conhecemos.", "Você tratou a letra como algo que pode valer qualquer número. Teste: troque x por 1 e veja se 3x + 5 dá 20 (3 × 1 + 5 = 8). Numa equação, a igualdade fica verdadeira só para certos valores."]}, {"id": "p13q1", "texto": "Qual das alternativas abaixo é uma EQUAÇÃO?", "alts": ["4n + 7", "5 + 8 = 13", "2x − 3 = 11", "3a + 2b"], "certa": 2, "nivel": "Vocabulário", "tempo": 60, "just": "A e D são expressões algébricas: têm letra, mas não têm sinal de igual. B é uma igualdade só com números, sem valor desconhecido. Equação = igualdade + incógnita.", "fixo": true, "pista": "Uma equação é uma igualdade com um valor desconhecido. Em cada alternativa, procure duas coisas: o sinal de = e uma letra.", "alem": "Escolha uma das expressões sem sinal de igual, como 4n + 7, e transforme em equação escolhendo o resultado que quiser. Descubra o valor de n e compare com o de um colega que escolheu outro resultado.", "erros": ["Você viu a letra e pensou em equação. Falta o sinal de igual: 4n + 7 é só uma expressão, não diz que dois lados são iguais.", "Você viu o sinal de igual e pensou em equação. Confira se há alguma letra: 5 + 8 = 13 só tem números, então não há valor desconhecido para descobrir.", null, "Você viu as letras e pensou em equação. Confira se há sinal de igual: 3a + 2b é uma expressão, sem igualdade."]}, {"id": "p13q2", "texto": "Dizer que 8 é a SOLUÇÃO da equação  3x − 4 = 20  significa que", "alts": ["o número 8 aparece escrito na equação.", "20 − 8 = 12.", "8 é o maior número que pode ocupar o lugar de x.", "trocando x por 8, os dois lados ficam iguais: 3 · 8 − 4 = 20."], "certa": 3, "nivel": "Vocabulário", "tempo": 60, "just": "Solução é o valor que torna a igualdade verdadeira: 3 · 8 − 4 = 24 − 4 = 20. A confunde aparecer com resolver; B é uma conta solta com os números do enunciado; C inventa a ideia de \"maior valor\".", "fixo": true, "pista": "Pense em como você testaria se um número serve: coloque-o no lugar da letra, faça as contas e veja o que acontece com os dois lados da igualdade.", "alem": "Invente outra equação que também tenha 8 como solução, começando com 5x. Confira trocando x por 8 e compare com as equações dos colegas: quantas diferentes aparecem?", "erros": ["Você olhou se o 8 está escrito na equação, mas ser solução não depende de aparecer. Solução é o valor que, no lugar de x, faz os dois lados darem o mesmo resultado.", "Você subtraiu 8 de 20. A conta 20 − 8 = 12 está certa, mas ela não usa a equação inteira. Para testar uma solução, troque o x pelo número e use o 3, o − 4 e o 20 juntos.", "Você ligou solução à ideia de maior valor. Solução não compara tamanhos: é o valor que torna a igualdade verdadeira.", null]}, {"id": "p13q3", "texto": "Joana pensou em um número, multiplicou esse número por 3 e depois somou 7. O resultado foi 40. Chamando de x o número pensado, qual equação representa essa situação?", "alts": ["3 + x + 7 = 40", "3x + 7 = 40", "3 · (x + 7) = 40", "7x + 3 = 40"], "certa": 1, "nivel": "Formular", "tempo": 90, "just": "A somou 3 em vez de multiplicar. C inverteu a ordem (seria \"somou 7 e depois multiplicou por 3\"). D trocou os papéis do 3 e do 7. Se quiser conferir: x = 11, pois 3 · 11 + 7 = 40.", "fixo": true, "passos": ["Chame o número pensado de x.", "Multiplicou por 3: 3x. Depois somou 7: 3x + 7.", "O resultado foi 40: 3x + 7 = 40. Cuidado: 3 · (x + 7) seria somar 7 primeiro e multiplicar depois."], "pista": "Siga a ordem da história: primeiro existe o número x, depois uma operação com o 3 e só depois outra com o 7. Escreva cada passo separado antes de juntar tudo.", "alem": "Invente duas histórias parecidas, mudando a ordem das operações, e escreva a equação de cada uma. Explique para um colega por que elas são equações diferentes.", "erros": ["Você somou o 7 ao número antes de multiplicar, usando parênteses. Confira a ordem do texto: ela multiplicou primeiro e somou depois, então o 7 fica fora da multiplicação.", null, "Você somou o 7 ao número antes de multiplicar, usando parênteses. Confira a ordem do texto: ela multiplicou primeiro e somou depois, então o 7 fica fora da multiplicação.", "Você trocou os papéis dos números: multiplicou por 7 e somou 3. Releia o texto e confira qual número multiplica e qual é somado."]}, {"id": "p13q4", "texto": "Para levar a turma a um passeio, uma van cobra R$ 15,00 fixos mais R$ 4,00 por quilômetro rodado. O passeio custou R$ 63,00. Sendo k o número de quilômetros rodados, qual equação representa a situação?", "alts": ["15k + 4 = 63", "19k = 63", "4k + 15 = 63", "4 + 15 + k = 63"], "certa": 2, "nivel": "Formular", "tempo": 90, "just": "O valor que se repete (R$ 4 por km) multiplica a letra; o fixo entra uma vez só. A inverteu os papéis; B juntou o fixo com o variável (15 + 4 = 19), erro clássico; D não multiplicou. Conferindo: k = 12 km, pois 4 · 12 + 15 = 63.", "fixo": true, "pista": "Separe o que se paga uma única vez do que se paga a cada quilômetro. Qual dos dois valores depende de k?", "alem": "Invente um valor fixo e um valor por quilômetro para outra van, escolhendo números que você consiga calcular de cabeça. Escreva a equação para um passeio de R$ 100,00 e descubra quantos quilômetros foram. Compare com os valores de um colega.", "erros": ["Você multiplicou o k pelo valor fixo e somou o valor por quilômetro, trocando os papéis. Confira: o valor que se repete a cada quilômetro é o que multiplica o k.", "Você juntou o 15 com o 4 como se fossem a mesma coisa. Só o valor por quilômetro se repete com o k; o valor fixo é pago uma vez e não pode ser somado ao outro antes.", null, "Você somou os três números sem multiplicar. Confira: se a van rodar 2 quilômetros, o valor por quilômetro é cobrado 2 vezes, então o k precisa multiplicar algum valor."]}, {"id": "p13q5", "texto": "Uma horta tem a forma de um retângulo com 5 m de largura e 60 m² de área. Chamando de c o comprimento da horta, em metros, qual equação permite descobrir c?", "alts": ["5 · c = 60", "5 + c = 60", "2 · 5 + 2 · c = 60", "c = 60 + 5"], "certa": 0, "nivel": "Formular", "tempo": 90, "just": "Área do retângulo = comprimento × largura. B somou as medidas; C montou o PERÍMETRO (a volta), não a área; D somou a largura à área. Conferindo: c = 12 m.", "fixo": true, "pista": "Desenhe o retângulo e escreva 5 m na largura e c no comprimento. Depois pergunte: o 60 m² mede a volta da horta ou o espaço dentro dela?", "alem": "Desenhe outro retângulo que também tenha 60 m² de área, mas com a largura diferente. Quantos retângulos assim você consegue achar? Compare a volta (perímetro) de cada um.", "erros": [null, "Você somou a largura e o comprimento. Somar as duas medidas não dá a área. Confira como se calcula a área de um retângulo.", "Você montou o perímetro, a medida da volta, e igualou a 60. Mas 60 m² mede o espaço dentro da horta, que é a área.", "Você somou a largura à área. Medidas de tipos diferentes (m e m²) não se somam. Confira como a área se relaciona com a largura e o comprimento."]}, {"id": "p13q6", "texto": "Ana e Bia têm, juntas, 50 figurinhas. Bia tem 8 figurinhas a mais que Ana. Se Ana tem x figurinhas, qual equação representa a situação?", "alts": ["x + 8 = 50", "2x = 50 + 8", "x + 8x = 50", "x + (x + 8) = 50"], "certa": 3, "nivel": "Formular", "tempo": 90, "just": "Ana tem x e Bia tem x + 8; juntas: x + (x + 8) = 50. A esqueceu as figurinhas da Ana; B somou 8 em vez de tirar (o certo seria 2x = 50 − 8); C transformou \"8 a mais\" em \"8 vezes\". Conferindo: Ana 21, Bia 29.", "fixo": true, "passos": ["Ana tem x figurinhas.", "Bia tem 8 a mais que Ana: x + 8.", "Juntas têm 50: x + (x + 8) = 50. Conferindo: Ana tem 21 e Bia tem 29."], "pista": "Experimente com um número: se Ana tivesse 10 figurinhas, quantas Bia teria? Agora faça o mesmo raciocínio com x no lugar do 10 e some as duas quantidades para formar o total.", "alem": "Invente um problema parecido em que Bia tenha 8 figurinhas a menos que Ana e juntas tenham outro total. Escreva a equação e compare com a original: o que mudou?", "erros": ["Você escreveu só uma das quantidades e igualou ao total, mas o total é das duas juntas. Confira se as figurinhas da Ana e as da Bia estão ambas na equação.", "Você tratou as duas como se tivessem x cada uma (2x) e somou 8 ao total. Mas o 8 a mais já está dentro dos 50. Confira se Ana e Bia têm a mesma quantidade.", "Você leu \"8 a mais\" como \"8 vezes\". Teste: se Ana tivesse 2 figurinhas, quantas Bia teria com 8 a mais e quantas com 8 vezes?", null]}, {"id": "p13q7", "texto": "Uma loja aluga bicicletas e calcula o valor a pagar pela fórmula  V = 5 + 2h,  em que V é o valor em reais e h é o número de horas de uso. Nessa fórmula, o número 2 representa", "alts": ["o valor fixo, pago uma única vez.", "o valor cobrado por cada hora de uso.", "o número de horas de uso.", "o valor total do aluguel."], "certa": 1, "nivel": "Interpretar", "tempo": 90, "just": "O número que multiplica a letra é o que se paga a cada hora. A: o fixo é o 5. C: as horas são o h. D: o total é o V.", "fixo": true, "pista": "Teste a fórmula: o que muda no valor se alguém usar a bicicleta por 1 hora e depois por 2 horas? Observe qual parte da fórmula se repete a cada hora.", "alem": "Invente a fórmula de uma loja que cobra um valor fixo e outro valor por hora, com números diferentes. Calcule quanto custam 4 horas e compare com a fórmula de um colega.", "erros": ["Você ligou o 2 ao valor pago uma só vez. O valor fixo não multiplica a letra h. Confira qual número está sozinho na fórmula e qual está junto do h.", null, "Você confundiu o 2 com a quantidade de horas. As horas são representadas pela letra h, que muda de cliente para cliente.", "Você tomou o 2 como o total. O total é representado pela letra V e muda conforme o número de horas."]}, {"id": "p13q8", "texto": "Qual das situações abaixo pode ser representada pela equação  2x + 10 = 50?", "alts": ["Comprei 10 cadernos de x reais cada um e gastei R$ 50,00.", "Eu tinha x reais, ganhei R$ 10,00 e fiquei com R$ 50,00.", "Comprei 2 cadernos de x reais cada um e um estojo de R$ 10,00, e gastei R$ 50,00 ao todo.", "Gastei metade dos meus x reais, ganhei R$ 10,00 e fiquei com R$ 50,00."], "certa": 2, "nivel": "Interpretar", "tempo": 90, "just": "A é 10x = 50. B é x + 10 = 50. D é x/2 + 10 = 50. Só a C tem \"2 vezes x\" mais um valor fixo de 10.", "fixo": true, "passos": ["Leia a equação em partes: 2x é \"2 vezes um valor x\"; + 10 é um valor que entra uma vez só; = 50 é o total.", "Procure a situação com 2 coisas de x reais, mais R$ 10,00, dando R$ 50,00.", "É a dos 2 cadernos e do estojo. As outras seriam 10x = 50, x + 10 = 50 e x/2 + 10 = 50."], "pista": "Leia a equação em voz alta, em palavras: o que se faz com o x e o que se faz depois. Em cada história, procure essas mesmas operações, na mesma ordem.", "alem": "Escreva outra história, com outro tema, que também combine com essa equação. Depois mude a equação para 3x + 10 = 50 e adapte a história.", "erros": ["Você ligou o 10 ao número de cadernos, o que dá 10 vezes x. Confira quantas vezes o x se repete na equação e onde o 10 aparece.", "Você somou o 10 ao x sem multiplicar. Falta a parte do 2 antes do x: confira se a história tem uma quantidade que se repete.", null, "Você usou a metade do x, ou seja, uma divisão. Na equação, o x é multiplicado, não dividido."]}, {"id": "p13q9", "texto": "Para resolver a equação  5x − 3 = 22,  Pedro somou 3 aos dois membros (aos dois lados do sinal de igual). Qual equação ele obteve?", "alts": ["5x = 25", "5x = 19", "5x − 6 = 22", "2x = 22"], "certa": 0, "nivel": "Interpretar", "tempo": 90, "just": "5x − 3 + 3 = 22 + 3, logo 5x = 25 (e x = 5). B é o erro de \"passar para o outro lado\" sem trocar a operação; C mexeu só no primeiro membro, e subtraindo; D misturou o 5 com o 3 (5 − 3).", "fixo": true, "pista": "Somar 3 ao lado esquerdo faz o − 3 desaparecer. Para a igualdade continuar verdadeira, o que é preciso fazer com o lado direito? Faça a conta nos dois lados.", "alem": "Resolva a equação de outro jeito, como testar valores ou pensar \"que número vezes 5, menos 3, dá 22?\", e compare com o caminho do Pedro. Depois invente uma equação que alguém resolveria somando 7 aos dois lados.", "erros": [null, "Você subtraiu 3 do 22 em vez de somar (22 − 3 = 19). Pedro somou 3 ao lado esquerdo, então o lado direito também recebe a mesma operação: somar 3.", "Você mexeu só no lado esquerdo e subtraiu mais 3. Confira o que acontece com − 3 quando se soma 3, e lembre que o que se faz de um lado também se faz do outro.", "Você combinou o 5 com o 3, fazendo 5 − 3. Eles não se juntam: 5x tem letra e o 3 é número solto. Pedro somou 3 aos dois lados da igualdade."]}, {"id": "p13q10", "texto": "Observe a sequência numérica:  7, 11, 15, 19, 23, …  Qual afirmação está correta?", "alts": ["O 3º termo é 19 e a regra de formação é \"somar 4 ao termo anterior\".", "O 3º termo é 15 e a regra de formação é \"somar 4 ao termo anterior\".", "O número 15 ocupa a 15ª posição da sequência.", "A regra de formação é \"multiplicar o termo anterior por 4\"."], "certa": 1, "nivel": "Vocabulário", "tempo": 60, "just": "Posição diz ONDE o termo está; o termo é o número. A: 19 é o 4º termo. C confunde o valor do termo com a posição (15 está na 3ª). D não confere: 7 × 4 = 28, não 11.", "fixo": true, "pista": "A posição diz o lugar do número na fila (1º, 2º, 3º...) e o termo é o número que está nesse lugar. Conte as posições e confira de quanto em quanto a sequência cresce.", "alem": "Escreva outra sequência com a mesma regra, mas começando em outro número. O que muda e o que continua igual? Depois invente uma sequência cuja regra seja \"multiplicar por 2\".", "erros": ["A regra que você escolheu confere, mas o termo foi pego na posição errada, pulando um. Conte de novo, partindo do 7 como 1º termo, até parar no 3º.", null, "Você tratou o valor 15 como se fosse o número da posição. O 15 é um termo; a posição diz onde ele está na fila. Conte a posição dele a partir do 7.", "Você viu o 4 e pensou em multiplicar. Confira com o 1º e o 2º termos: 7 × 4 dá 11?"]}, {"id": "p13q11", "texto": "Uma sequência pode ser RECURSIVA ou NÃO RECURSIVA. Qual das regras abaixo descreve uma sequência RECURSIVA?", "alts": ["O termo é o triplo da posição:  aₙ = 3n.", "O termo é a posição mais 10:  aₙ = n + 10.", "O termo é o dobro da posição menos 1:  aₙ = 2n − 1.", "O 1º termo é 2, e cada termo seguinte é o anterior mais 5."], "certa": 3, "nivel": "Vocabulário", "tempo": 60, "just": "Recursiva: para achar um termo, preciso do termo ANTERIOR (2, 7, 12, 17…). A, B e C calculam direto pela posição n, sem olhar o anterior: são não recursivas.", "fixo": true, "pista": "Numa sequência recursiva, cada termo depende do termo que veio antes dele. Para cada regra, pergunte: preciso conhecer o termo anterior ou só a posição?", "alem": "Escolha uma regra que usa só a posição e escreva os 4 primeiros termos. Depois tente escrever uma regra recursiva que dê os mesmos termos. Dá para fazer? Compare com um colega.", "erros": ["Você viu uma regra com a letra n e pensou em recursiva. Aqui o termo sai direto da posição: para o 5º termo, basta fazer 3 × 5, sem olhar o 4º.", "Aqui o termo também sai direto da posição, somando 10 a n, sem precisar do termo anterior. Ter a letra n não torna a regra recursiva.", "Você pode ter achado que \"o dobro menos 1\" usa o termo anterior. Ela usa só a posição n: para qualquer n, a conta é direta, sem olhar os outros termos.", null]}, {"id": "p13q12", "texto": "Com palitos de sorvete, Lucas monta quadrados lado a lado. Com 1 quadrado ele usa 4 palitos; com 2 quadrados, 7 palitos; com 3 quadrados, 10 palitos. Qual expressão dá o número de palitos necessários para montar n quadrados?", "alts": ["3n + 1", "4n", "n + 3", "4n + 3"], "certa": 0, "nivel": "Interpretar", "tempo": 90, "just": "3n + 1 dá 4, 7 e 10. B (4n) e C (n + 3) acertam só a figura 1 — quem testou só no primeiro termo cai aqui (4n dá 8 na figura 2; n + 3 dá 5). D não serve nem na figura 1 (dá 7). Cada quadrado novo acrescenta 3 palitos.", "fixo": true, "pista": "Teste cada expressão nas três figuras do enunciado, não só na primeira. Outra ideia: veja quantos palitos aparecem a mais cada vez que você junta um quadrado novo.", "alem": "Use a sua expressão para calcular os palitos de 10 quadrados e confira montando a sequência passo a passo. Depois invente uma figura com triângulos lado a lado e procure uma expressão para ela.", "erros": [null, "Você pode ter pensado que cada quadrado usa 4 palitos. Isso vale para um quadrado sozinho, mas lado a lado eles dividem um palito. Teste com 2 quadrados e compare com o enunciado.", "Você provavelmente testou só a figura 1. Teste a figura 2 e a figura 3 e compare com o número de palitos do enunciado.", "Teste com n = 1 e compare com a figura 1: a expressão já falha ali. O número somado no final está fazendo sobrar palitos."]}, {"id": "p13q13", "texto": "A sequência abaixo cresce sempre do mesmo jeito. Qual número completa o espaço?\n12,  19,  26,  ____,  40,  47", "alts": ["32", "33", "34", "36"], "certa": 1, "nivel": "Resolver", "tempo": 90, "just": "19 − 12 = 7, então a regra é somar 7: 26 + 7 = 33, e confere com 33 + 7 = 40. A, C e D usam acréscimos errados (+6, +8, +10); conferir com o 40 elimina todas.", "fixo": true, "pista": "Veja de quanto em quanto os números aumentam, calculando a diferença entre dois termos vizinhos que já estão escritos. Depois use essa regra para chegar ao espaço e confira com o 40.", "alem": "Invente uma sequência de adição com um espaço em branco no meio e peça a um colega para completar, explicando como conferiu. Depois responda: que número viria antes do 12 nessa sequência?", "erros": ["Você pode ter somado 6 ao 26. Confira de quanto é o salto entre os termos já escritos e veja se, do seu número até o 40, o salto é o mesmo.", null, "Você pode ter somado 8 ao 26. Confira o salto entre os termos já escritos e veja se, do seu número até o 40, o salto é o mesmo.", "Você pode ter somado 10 ao 26. Confira se esse salto aparece entre 12 e 19 e depois veja se, do seu número até o 40, o salto é igual."]}, {"id": "p13q14", "texto": "Na fileira 1 de um auditório há 20 cadeiras. Cada fileira tem 3 cadeiras a mais do que a fileira anterior. Quantas cadeiras há na fileira 5?", "alts": ["26", "29", "32", "35"], "certa": 2, "nivel": "Resolver", "tempo": 90, "just": "20, 23, 26, 29, 32 → fileira 5 = 32 (20 + 4 · 3). A é a fileira 3; B é a fileira 4 (contou uma a menos); D = 20 + 5 · 3 somou o acréscimo 5 vezes — da fileira 1 à 5 são só 4 saltos.", "fixo": true, "pista": "Escreva a lista fileira por fileira: a 1ª tem 20 e cada fileira seguinte recebe o acréscimo. Numere cada linha da lista e pare exatamente na 5ª.", "alem": "Invente outra regra para o auditório, com outro acréscimo por fileira, e calcule a fileira 5. Depois descubra a partir de qual fileira passaria de 50 cadeiras com a regra original.", "erros": ["Você pode ter parado duas fileiras antes da 5ª, somando o acréscimo só duas vezes. Numere cada fileira da sua lista e confira onde parou.", "Você contou uma fileira a menos e parou antes da 5ª. Escreva a lista, numere cada fileira e confira se chegou à quinta.", null, "Você somou o acréscimo cinco vezes, uma por fileira. Mas a 1ª fileira já tem 20 e não recebe acréscimo: confira quantos acréscimos existem entre a 1ª e a 5ª fileira."]}], "dica": ["Leia o problema duas vezes: na primeira, entenda a história; na segunda, sublinhe os números e a pergunta.", "Escolheu a equação? Leia-a como uma frase. Ela tem de contar a mesma história do enunciado."], "mapas": [1], "livro": [0, 26, 30], "deck": 3}], "extra": {"trilha": {"prova": "2026-11-26", "intro": "Um pouco por dia até a prova. Cada dia começa com um aquecimento de questões de dias anteriores: misturar assuntos parece mais trabalhoso, mas é assim que a pro  "i": 4, "txt": "Aula 5: Letras e regularidades"}, {"tipo": "livro", "vi": 0, "n": 5, "txt": "Livro vol. 3, aula 5: Revisão: Linguagem algébrica (p. 125 a 127)"}, {"tipo": "tab", "e": 8, "txt": "Tabuada, etapa 8: Cortar o retângulo"}]}, {"d": "2026-11-19", "foco": "Equações: a balança.", "leve": false, "tarefas": [{"tipo": "aquece", "k": 7, "d": "2026-11-19", "txt": "Aquecimento: 4 questões dos dias anteriores"}, {"tipo": "aula", "i": 5, "txt": "Aula 6: Equações do 1º grau I: igualdade e resolução"}, {"tipo": "livro", "vi": 0, "n": 15, "txt": "Livro vol. 3, aula 15: Revisão: Propriedades da igualdade (p. 157 a 158)"}, {"tipo": "tab", "e": 9, "txt": "Tabuada, etapa 9: Ler a tabela inteira"}]}, {"d": "2026-11-20", "foco": "Equações com parênteses e problemas.", "leve": true, "tarefas": [{"tipo": "aula", "i": 6, "txt": "Aula 7: Equações do 1º grau II: problemas e distributiva"}, {"tipo": "flash", "di": 3, "txt": "Flashcards: Equações"}]}, {"d": "2026-11-21", "foco": "Do texto para a equação.", "leve": true, "tarefas": [{"tipo": "aula", "i": 12, "txt": "Aula 13: Interpretar e montar equações"}, {"tipo": "tab", "e": 10, "txt": "Tabuada, etapa 10: Recuperar sem olhar"}]}, {"d": "2026-11-22", "foco": "Geometria e múltiplos.", "leve": true, "tarefas": [{"tipo": "aula", "i": 10, "txt": "Aula 11: Áreas e perímetros"}, {"tipo": "aula", "i": 11, "txt": "Aula 12: Múltiplos, divisores e plano cartesiano"}]}, {"d": "2026-11-23", "foco": "Razão e proporção.", "leve": false, "tarefas": [{"tipo": "aquece", "k": 11, "d": "2026-11-23", "txt": "Aquecimento: 4 questões dos dias anteriores"}, {"tipo": "aula", "i": 7, "txt": "Aula 8: Razão e proporcionalidade"}, {"tipo": "livro", "vi": 1, "n": 20, "txt": "Livro vol. 4, aula 20: Revisão: Grandezas diretamente e inversamente proporcionais (p. 186 a 188)"}, {"tipo": "kahoot", "n": 8, "txt": "Kahoot: Razão e proporcionalidade"}]}, {"d": "2026-11-24", "foco": "Porcentagem e ângulos.", "leve": false, "tarefas": [{"tipo": "aquece", "k": 12, "d": "2026-11-24", "txt": "Aquecimento: 4 questões dos dias anteriores"}, {"tipo": "aula", "i": 8, "txt": "Aula 9: Porcentagem"}, {"tipo": "aula", "i": 9, "txt": "Aula 10: Ângulos"}]}, {"d": "2026-11-25", "foco": "Véspera: revisão leve e dormir cedo.", "leve": false, "tarefas": [{"tipo": "aquece", "k": 13, "d": "2026-11-25", "txt": "Aquecimento: 4 questões dos dias anteriores"}, {"tipo": "sim", "vez": 2, "txt": "Simulado final: 20 questões"}]}]}, "livros": [{"vol": 3, "bim": "3º bimestre", "aulas": [{"n": 1, "titulo": "A linguagem algébrica e a área de triângulos", "pags": [{"f": "p113.webp", "imp": 112, "rot": ["Resumo"], "ex": false}, {"f": "p114.webp", "imp": 113, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p115.webp", "imp": 114, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 114, "rotulo": "Atividade 1 (expressão)", "pergunta": "Qual expressão algébrica calcula a área do triângulo da malha, cuja altura é a e cuja base é b?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A área de um triângulo é base × altura ÷ 2. Aqui a base é b e a altura é a, então a área = (a × b) ÷ 2."}, {"imp": 114, "rotulo": "Atividade 1 (cálculo)", "pergunta": "Se a = 5 e b = 6, qual é a área do triângulo?", "tipo": "numero", "aceitas": ["15"], "unidade": "unidades de área", "opcoes": [], "certa": -1, "resolucao": "Substituindo na expressão: (5 × 6) ÷ 2 = 30 ÷ 2 = 15. A área é 15 unidades de área."}]}, {"n": 2, "titulo": "A linguagem algébrica e a área de retângulos", "pags": [{"f": "p116.webp", "imp": 115, "rot": ["Resumo"], "ex": false}, {"f": "p117.webp", "imp": 116, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p118.webp", "imp": 117, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 117, "rotulo": "Atividade 1", "pergunta": "O que acontece com a área do retângulo da malha (base 7, altura 4) se a base for triplicada?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A área inicial é 7 × 4 = 28. Com a base triplicada, a base vira 21 e a área é 21 × 4 = 84. Como 84 = 3 × 28, a área também fica 3 vezes maior (triplica)."}, {"imp": 117, "rotulo": "Atividade 2 (retângulo azul)", "pergunta": "Escreva a expressão algébrica da área do retângulo azul, de base a e altura 6.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Área = base × altura = a × 6, ou seja, 6a."}, {"imp": 117, "rotulo": "Atividade 2 (quadrado rosa)", "pergunta": "Escreva a expressão algébrica da área do quadrado rosa, de lado g.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "No quadrado, a área é lado × lado = g × g, ou seja, g² (g ao quadrado)."}, {"imp": 117, "rotulo": "Atividade 2 (retângulo marrom)", "pergunta": "Escreva a expressão algébrica da área do retângulo marrom, de base k e altura 4.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Área = base × altura = k × 4, ou seja, 4k."}]}, {"n": 3, "titulo": "Letras para expressar generalidades", "pags": [{"f": "p119.webp", "imp": 118, "rot": ["Resumo"], "ex": false}, {"f": "p120.webp", "imp": 119, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p121.webp", "imp": 120, "rot": ["Na prática"], "ex": true}, {"f": "p122.webp", "imp": 121, "rot": [], "ex": true}], "conf": [{"imp": 120, "rotulo": "Atividade 1", "pergunta": "Associar cada sentença (I a IV) à expressão algébrica correspondente na segunda coluna.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "De cima para baixo, as expressões da segunda coluna combinam com: a . b é II (produto de dois números); 4L é IV (perímetro do quadrado: L + L + L + L); 2x + 3y é I (dobro de um número mais o triplo de outro); 3m – 2p é III (triplo de um número menos o dobro de outro). Resposta: II, IV, I, III."}, {"imp": 121, "rotulo": "Atividade 2", "pergunta": "Escrever a expressão algébrica da área A da piscina com comprimento 5x e largura 3y.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A área é o comprimento vezes a largura: A = 5x × 3y. Multiplicando os números (5 × 3 = 15) e juntando as letras, fica A = 15xy."}]}, {"n": 4, "titulo": "Resolução de problemas envolvendo a linguagem algébrica", "pags": [{"f": "p123.webp", "imp": 122, "rot": ["Na prática"], "ex": true}, {"f": "p124.webp", "imp": 123, "rot": [], "ex": true}, {"f": "p125.webp", "imp": 124, "rot": [], "ex": true}], "conf": [{"imp": 122, "rotulo": "Atividade 1 (expressão)", "pergunta": "Escreva a expressão algébrica da área de um triângulo de base x e altura y.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A área do triângulo é base vezes altura dividido por 2. Então a expressão é Área = (x × y) ÷ 2."}, {"imp": 122, "rotulo": "Atividade 1 (valor)", "pergunta": "Calcule a área do triângulo com base 5 cm e altura 4 cm.", "tipo": "numero", "aceitas": ["10"], "unidade": "cm²", "opcoes": [], "certa": -1, "resolucao": "Troque x por 5 e y por 4 na expressão: (5 × 4) ÷ 2 = 20 ÷ 2 = 10. A área é 10 cm²."}, {"imp": 123, "rotulo": "Atividade 2 a)", "pergunta": "Escreva a expressão do valor V gasto pelos cinco amigos, sendo c o ingresso e p a pipoca.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Os 5 amigos compraram ingresso, mas só 3 compraram pipoca. Então V = 5c + 3p."}, {"imp": 123, "rotulo": "Atividade 2 b)", "pergunta": "Com ingresso a R$ 25,00 e pipoca a R$ 18,00, qual foi o valor total gasto?", "tipo": "numero", "aceitas": ["179", "179,00"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "Troque c por 25 e p por 18: V = 5 × 25 + 3 × 18 = 125 + 54 = 179. O grupo gastou R$ 179,00."}, {"imp": 124, "rotulo": "Atividade 3", "pergunta": "Represente o total de litros gastos em um banho de t minutos, com x litros por minuto.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Em 1 minuto gasta x litros, em 2 minutos 2x, em 3 minutos 3x. Em t minutos o total é x × t (ou xt)."}, {"imp": 124, "rotulo": "Atividade 4 a)", "pergunta": "Escreva a expressão do tempo total T em função dos quilômetros k e diga o que k representa.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Cada quilômetro acrescenta 4 minutos, então T = 4k. A letra k é a variável e representa o número de quilômetros percorridos."}, {"imp": 124, "rotulo": "Atividade 4 b)", "pergunta": "Qual é o tempo total quando o ciclista percorre 7 quilômetros?", "tipo": "numero", "aceitas": ["28"], "unidade": "minutos", "opcoes": [], "certa": -1, "resolucao": "Troque k por 7 em T = 4k: T = 4 × 7 = 28. O tempo total é 28 minutos."}]}, {"n": 5, "titulo": "Revisão: Linguagem algébrica", "pags": [{"f": "p126.webp", "imp": 125, "rot": ["Resumo"], "ex": false}, {"f": "p127.webp", "imp": 126, "rot": ["Na prática"], "ex": true}, {"f": "p128.webp", "imp": 127, "rot": [], "ex": true}], "conf": [{"imp": 126, "rotulo": "Atividade 1", "pergunta": "Qual expressão algébrica representa a área de um retângulo de base 7 cm e altura h?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["A = 7 + h", "A = 7 · h", "A = 7h/2", "A = 7 − h"], "certa": 1, "resolucao": "A área do retângulo é a base vezes a altura. Como a base mede 7 e a altura é h, A = 7 · h."}, {"imp": 126, "rotulo": "Atividade 2", "pergunta": "Qual expressão algébrica representa a área de um triângulo de base b e altura a?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["A = b · a", "A = b − a", "A = (b · a)/2", "A = 2a · b"], "certa": 2, "resolucao": "A área do triângulo é base × altura ÷ 2. Trocando a base por b e a altura por a, A = (b · a)/2."}, {"imp": 127, "rotulo": "Atividade 3", "pergunta": "Qual é a área de um triângulo com base 10 cm e altura 6 cm?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["30 cm²", "40 cm²", "50 cm²", "60 cm²"], "certa": 0, "resolucao": "A = base × altura ÷ 2 = 10 × 6 ÷ 2 = 60 ÷ 2 = 30. A área é 30 cm²."}, {"imp": 127, "rotulo": "Atividade 4", "pergunta": "Qual expressão algébrica representa a área de um quadrado de lado x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["A = 2x²", "A = x²", "A = x + x", "A = 4x"], "certa": 1, "resolucao": "A área do quadrado é lado × lado. Com lado x, A = x · x = x²."}]}, {"n": 6, "titulo": "A regra de formação em sequências numéricas", "pags": [{"f": "p129.webp", "imp": 128, "rot": ["Resumo", "Exercícios resolvidos"], "ex": false}, {"f": "p130.webp", "imp": 129, "rot": [], "ex": false}, {"f": "p131.webp", "imp": 130, "rot": ["Na prática"], "ex": true}, {"f": "p132.webp", "imp": 131, "rot": [], "ex": true}], "conf": [{"imp": 130, "rotulo": "Atividade 1 – 1", "pergunta": "Qual é o padrão observado na quantidade de bolinhas das figuras?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "As figuras têm 1, 3 e 6 bolinhas. Do 1º para o 2º termo soma-se 2 e do 2º para o 3º soma-se 3. Cada termo é o anterior mais o número da posição dele na sequência (Figura 4 = 6 + 4, e assim por diante)."}, {"imp": 130, "rotulo": "Atividade 1 – 2", "pergunta": "Quantas bolinhas há nas Figuras 4, 5 e 6?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Figura 4: 6 + 4 = 10. Figura 5: 10 + 5 = 15. Figura 6: 15 + 6 = 21. A sequência fica 1, 3, 6, 10, 15, 21."}, {"imp": 131, "rotulo": "Atividade 2 a)", "pergunta": "Qual é o padrão entre os termos 1, 4, 16, 64, 256?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Cada termo é o anterior multiplicado por 4: 1 × 4 = 4, 4 × 4 = 16, 16 × 4 = 64, 64 × 4 = 256."}, {"imp": 131, "rotulo": "Atividade 2 b)", "pergunta": "Escreva os sete primeiros termos da sequência 1, 4, 16, 64, 256...", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Continue multiplicando por 4: 256 × 4 = 1 024 e 1 024 × 4 = 4 096. Os sete termos são 1, 4, 16, 64, 256, 1 024 e 4 096."}]}, {"n": 7, "titulo": "Calculando termos futuros em uma sequência numérica", "pags": [{"f": "p133.webp", "imp": 132, "rot": ["Resumo"], "ex": false}, {"f": "p134.webp", "imp": 133, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p135.webp", "imp": 134, "rot": ["Na prática"], "ex": true}, {"f": "p136.webp", "imp": 135, "rot": [], "ex": true}], "conf": [{"imp": 134, "rotulo": "Atividade 1 a)", "pergunta": "Escreva a regra geral (an em função de n) da sequência 2, 8, 18, 32, 50, …", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Cada termo é 2 vezes o quadrado da posição: 2 × 1² = 2, 2 × 2² = 8, 2 × 3² = 18, 2 × 4² = 32, 2 × 5² = 50. Então an = 2 × n²."}, {"imp": 134, "rotulo": "Atividade 1 b)", "pergunta": "Usando a regra geral, calcule o 12º termo da sequência.", "tipo": "numero", "aceitas": ["288", "a12=288"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Troque n por 12 em an = 2 × n²: a12 = 2 × 12² = 2 × 144 = 288."}, {"imp": 135, "rotulo": "Atividade 2 a)", "pergunta": "Desenhe as duas próximas figuras do padrão de quadrados azuis e laranja.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A figura n é um quadrado de n × n quadradinhos, com n azuis na diagonal e o resto laranja. A figura 4 tem 16 quadrados (4 azuis e 12 laranja) e a figura 5 tem 25 quadrados (5 azuis e 20 laranja)."}, {"imp": 135, "rotulo": "Atividade 2 b)", "pergunta": "Na figura 10, quantos quadrados há no total, quantos são azuis e quantos são laranja?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Total: 10 × 10 = 100 quadrados. Azuis: 10 (a diagonal). Laranja: 100 − 10 = 90."}, {"imp": 135, "rotulo": "Atividade 2 c)", "pergunta": "Escreva as relações entre a posição n da figura e Q (total), A (azuis) e L (laranja).", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "O total é n × n, então Q = n². Os azuis são um por linha, então A = n. Os laranja são o que sobra: L = n² − n."}]}, {"n": 8, "titulo": "Resolução de problemas envolvendo linguagem algébrica e sequências numéricas", "pags": [{"f": "p137.webp", "imp": 136, "rot": ["Na prática"], "ex": true}, {"f": "p138.webp", "imp": 137, "rot": [], "ex": true}, {"f": "p139.webp", "imp": 138, "rot": [], "ex": true}], "conf": [{"imp": 136, "rotulo": "Atividade 1", "pergunta": "Qual alternativa descreve a regra de formação da sequência 1, 3, 7, 13, 21, 31, 43, …?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Adicionar sempre 3 ao termo anterior.", "Adicionar sempre 4 ao termo anterior.", "Adicionar números pares consecutivos ao termo anterior (2, 4, 6, 8, 10, 12, …).", "Multiplicar o termo anterior por 2 e subtrair 1."], "certa": 2, "resolucao": "Veja as diferenças entre termos vizinhos: 3 − 1 = 2, 7 − 3 = 4, 13 − 7 = 6, 21 − 13 = 8, 31 − 21 = 10, 43 − 31 = 12. Elas formam os números pares consecutivos, então a resposta é a alternativa c."}, {"imp": 137, "rotulo": "Atividade 2 (expressão)", "pergunta": "Qual expressão algébrica dá o número de cadeiras da n-ésima fileira (8, 12, 16, …)?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A cada fileira entram 4 cadeiras a mais, e isso acontece (n − 1) vezes a partir das 8 cadeiras da 1ª fileira. Logo a expressão é 8 + 4 × (n − 1), que também pode ser escrita como 4n + 4."}, {"imp": 137, "rotulo": "Atividade 2 (10ª fileira)", "pergunta": "Quantas cadeiras há na 10ª fileira?", "tipo": "numero", "aceitas": ["44"], "unidade": "cadeiras", "opcoes": [], "certa": -1, "resolucao": "Troque n por 10 em 8 + 4 × (n − 1): 8 + 4 × 9 = 8 + 36 = 44."}, {"imp": 138, "rotulo": "Atividade 3", "pergunta": "Qual expressão algébrica dá a quantidade de quadradinhos da Figura n na sequência de figuras?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "As figuras têm 1, 3, 5, 7, … quadradinhos, ou seja, 2 a mais a cada figura. Comparando com a posição: 1 = 2 × 1 − 1, 3 = 2 × 2 − 1, 5 = 2 × 3 − 1. A expressão é 2n − 1."}, {"imp": 138, "rotulo": "Atividade 4", "pergunta": "Qual alternativa traz a expressão do valor da n-ésima parcela Pn (80, 95, 110, …)?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Pn = 80 + 5n", "Pn = 80 + 15n", "Pn = 80 + (n – 1) × 15", "Pn = 95 + (n – 1) × 15"], "certa": 2, "resolucao": "Cada parcela custa R$ 15 a mais que a anterior, e a 1ª parcela é 80. A 2ª é 80 + 15 × 1, a 3ª é 80 + 15 × 2, então Pn = 80 + 15 × (n − 1), alternativa c."}]}, {"n": 9, "titulo": "Aula de verificação: Linguagem algébrica", "pags": [{"f": "p140.webp", "imp": 139, "rot": ["Na prática"], "ex": true}, {"f": "p141.webp", "imp": 140, "rot": [], "ex": true}, {"f": "p142.webp", "imp": 141, "rot": [], "ex": true}, {"f": "p143.webp", "imp": 142, "rot": [], "ex": true}], "conf": [{"imp": 139, "rotulo": "Atividade 1 a)", "pergunta": "Quais são os dois próximos termos da sequência 5, 8, 11, 14, …?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "De um termo para o outro somamos 3. Depois do 14 vem 14 + 3 = 17 e depois do 17 vem 17 + 3 = 20. Resposta: 17 e 20."}, {"imp": 139, "rotulo": "Atividade 1 b)", "pergunta": "Qual é a regra de formação da sequência 5, 8, 11, 14, …?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Para achar o próximo termo, somamos 3 ao termo anterior. Também dá para escrever uma expressão para o termo n: an = 3n + 2."}, {"imp": 140, "rotulo": "Atividade 2 a)", "pergunta": "Quantos pontos a equipe recebe na etapa 4, se o padrão continuar (4, 9, 14, …)?", "tipo": "numero", "aceitas": ["19"], "unidade": "pontos", "opcoes": [], "certa": -1, "resolucao": "A cada etapa a equipe ganha 5 pontos a mais. Na etapa 4 são 14 + 5 = 19 pontos."}, {"imp": 140, "rotulo": "Atividade 2 b)", "pergunta": "Escreva a expressão algébrica dos pontos recebidos na etapa n.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "O primeiro termo é 4 e o acréscimo é 5, então an = 4 + (n − 1) × 5 = 5n − 1."}, {"imp": 141, "rotulo": "Atividade 3 a)", "pergunta": "Na expressão C = 20 + 4x, o que representam os números 20 e 4?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "O 20 é o valor fixo cobrado para preparar o cartaz, mesmo sem nenhuma cópia. O 4 é o valor cobrado por cada cópia impressa (R$ 4,00 por cópia)."}, {"imp": 141, "rotulo": "Atividade 3 b)", "pergunta": "Qual é o custo total se forem impressas 10 cópias?", "tipo": "numero", "aceitas": ["60"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "C = 20 + 4 × 10 = 20 + 40 = 60. O custo total é R$ 60,00."}, {"imp": 141, "rotulo": "Atividade 3 c)", "pergunta": "Com C = R$ 52,00, x é variável ou incógnita? Justifique e ache o número de cópias.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Só um valor de x dá 52 em 20 + 4x, então x deixa de variar e vira uma incógnita. Fazendo 20 + 4x = 52, temos 4x = 32 e x = 8 cópias."}, {"imp": 142, "rotulo": "Atividade 4 a)", "pergunta": "Escreva a expressão algébrica dos livros arrecadados no mês n (14, 20, 26, …).", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "O primeiro termo é 14 e o acréscimo é 6, então L(n) = 14 + 6 × (n − 1) = 6n + 8."}, {"imp": 142, "rotulo": "Atividade 4 b)", "pergunta": "Usando a expressão, quantos livros serão arrecadados no 7º mês?", "tipo": "numero", "aceitas": ["50"], "unidade": "livros", "opcoes": [], "certa": -1, "resolucao": "L(7) = 14 + 6 × (7 − 1) = 14 + 6 × 6 = 14 + 36 = 50. Serão 50 livros."}, {"imp": 142, "rotulo": "Atividade 4 c)", "pergunta": "Em qual mês a turma arrecadará 62 livros?", "tipo": "numero", "aceitas": ["9", "9º"], "unidade": "mês", "opcoes": [], "certa": -1, "resolucao": "Resolvendo 6n + 8 = 62, temos 6n = 54 e n = 9. No 9º mês: 14 + 6 × 8 = 62 livros."}]}, {"n": 10, "titulo": "Revisão: Sequências numéricas", "pags": [{"f": "p144.webp", "imp": 143, "rot": ["Resumo"], "ex": false}, {"f": "p145.webp", "imp": 144, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 144, "rotulo": "Atividade 1", "pergunta": "Qual é a regra de formação da sequência 5, 9, 13, 17, …?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["an = 2n", "an = 3n + 1", "an = 4n + 1", "an = 5n"], "certa": 2, "resolucao": "Os termos aumentam de 4 em 4, então a regra tem 4n. Testando an = 4n + 1: a1 = 4×1 + 1 = 5, a2 = 4×2 + 1 = 9 e a3 = 4×3 + 1 = 13. A resposta é an = 4n + 1."}, {"imp": 144, "rotulo": "Atividade 2", "pergunta": "Complete a tabela com os valores de an = 3n – 2 para n = 1, n = 5 e n = 10.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Troque n em an = 3n – 2. Para n = 1: 3×1 – 2 = 1. Para n = 5: 3×5 – 2 = 13. Para n = 10: 3×10 – 2 = 28. Resposta: 1, 13 e 28."}, {"imp": 144, "rotulo": "Atividade 3 a)", "pergunta": "Em an = 2n + 3, a afirmação a₁ = 4 é verdadeira ou falsa?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Verdadeira (V)", "Falsa (F)"], "certa": 1, "resolucao": "a₁ = 2×1 + 3 = 5, e não 4. Portanto a afirmação é falsa (F)."}, {"imp": 144, "rotulo": "Atividade 3 b)", "pergunta": "Em an = 2n + 3, a afirmação a₃ = 9 é verdadeira ou falsa?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Verdadeira (V)", "Falsa (F)"], "certa": 0, "resolucao": "a₃ = 2×3 + 3 = 6 + 3 = 9. Portanto a afirmação é verdadeira (V)."}, {"imp": 144, "rotulo": "Atividade 3 c)", "pergunta": "Em an = 2n + 3, a afirmação a₅ = 14 é verdadeira ou falsa?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Verdadeira (V)", "Falsa (F)"], "certa": 1, "resolucao": "a₅ = 2×5 + 3 = 10 + 3 = 13, e não 14. Portanto a afirmação é falsa (F)."}, {"imp": 144, "rotulo": "Atividade 4", "pergunta": "Na sequência an = n² – 1, qual é o valor de a₇?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["48", "49", "50", "51"], "certa": 0, "resolucao": "a₇ = 7² – 1 = 49 – 1 = 48. A resposta é 48."}]}, {"n": 11, "titulo": "Princípios de equivalência", "pags": [{"f": "p146.webp", "imp": 145, "rot": ["Resumo"], "ex": false}, {"f": "p147.webp", "imp": 146, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p148.webp", "imp": 147, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 147, "rotulo": "Atividade 1", "pergunta": "Nas duas balanças em equilíbrio (balança 1: x de um lado e y do outro; balança 2: y de um lado e 42 kg do outro), qual é o valor de y e o de x?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Na balança 2, y está em equilíbrio com 42, então y = 42 kg. Na balança 1, x está em equilíbrio com y, então x = y = 42 kg. Resposta: x = 42 kg e y = 42 kg."}]}, {"n": 12, "titulo": "Explorando igualdades envolvendo a multiplicação", "pags": [{"f": "p149.webp", "imp": 148, "rot": ["Resumo"], "ex": false}, {"f": "p150.webp", "imp": 149, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p151.webp", "imp": 150, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 150, "rotulo": "Atividade 1", "pergunta": "O que acontece com a igualdade 7 + 3 = 2 + 8 quando os dois lados são multiplicados por 4?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Multiplicando os dois lados por 4: (7 + 3) × 4 = 10 × 4 = 40 e (2 + 8) × 4 = 10 × 4 = 40. Como 40 = 40, a igualdade continua verdadeira."}, {"imp": 150, "rotulo": "Atividade 2", "pergunta": "Qual valor no lugar da estrela torna 8 × ★ = 40 verdadeira?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["4", "5", "6", "7"], "certa": 1, "resolucao": "Dividimos os dois lados por 8: 40 ÷ 8 = 5. Então a estrela vale 5, alternativa b."}]}, {"n": 13, "titulo": "Conhecendo as equações do 1º grau", "pags": [{"f": "p152.webp", "imp": 151, "rot": ["Resumo"], "ex": false}, {"f": "p153.webp", "imp": 152, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p154.webp", "imp": 153, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 153, "rotulo": "Atividade 1 a)", "pergunta": "Escreva a fórmula do valor total P a pagar em função do número x de pacotes contratados.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A taxa fixa é R$ 15,00 e cada pacote custa R$ 8,00, então x pacotes custam 8 × x. A fórmula é P = 15 + 8x."}, {"imp": 153, "rotulo": "Atividade 1 b)", "pergunta": "Se o cliente pagou R$ 39,00 no total, quantos pacotes ele contratou?", "tipo": "numero", "aceitas": ["3", "x=3"], "unidade": "pacotes", "opcoes": [], "certa": -1, "resolucao": "Troque P por 39: 39 = 15 + 8x. Então 8x = 39 − 15 = 24 e x = 24 ÷ 8 = 3. O cliente contratou 3 pacotes."}, {"imp": 153, "rotulo": "Atividade 2", "pergunta": "Qual sentença representa 3 camisetas iguais mais um boné de R$ 20,00 por R$ 95,00?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["3 + 20x = 95", "3x – 20 = 95", "x + 20 + 3 = 95", "3x + 20 = 95"], "certa": 3, "resolucao": "Cada camiseta custa x, então as 3 camisetas custam 3x. Somando o boné de 20 reais, o total é 3x + 20 = 95."}]}, {"n": 14, "titulo": "Resolução de problemas envolvendo igualdades", "pags": [{"f": "p155.webp", "imp": 154, "rot": ["Na prática"], "ex": true}, {"f": "p156.webp", "imp": 155, "rot": [], "ex": true}, {"f": "p157.webp", "imp": 156, "rot": [], "ex": true}], "conf": [{"imp": 154, "rotulo": "Atividade 1", "pergunta": "Qual alternativa classifica corretamente as três afirmações sobre equações do 1º grau?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V – V – V.", "V – F – V.", "F – V – F.", "V – V – F."], "certa": 3, "resolucao": "I é verdadeira: x é o valor que não conhecemos. II é verdadeira: resolver é achar o valor que deixa a igualdade verdadeira. III é falsa: o 5 é uma constante e a variável é x. Resposta: V – V – F (alternativa d)."}, {"imp": 155, "rotulo": "Atividade 2", "pergunta": "Na figura da balança, qual é a massa x do bloco, em quilogramas?", "tipo": "numero", "aceitas": ["2", "x=2"], "unidade": "kg", "opcoes": [], "certa": -1, "resolucao": "A balança está equilibrada: de um lado ficam o bloco x e 1 kg, do outro 3 kg. Então 1 + x = 3, e x = 3 − 1 = 2. Conferindo: 1 + 2 = 3. Resposta: 2 kg."}, {"imp": 156, "rotulo": "Atividade 4", "pergunta": "Qual equação descreve a pontuação do estudante, com n atividades de 8 pontos, uma perda de 20 pontos e 140 pontos no final?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A pontuação é o número de atividades (n) vezes 8 pontos, menos os 20 pontos perdidos. O total final é 140. Então a equação é 8n − 20 = 140."}, {"imp": 156, "rotulo": "Atividade 5", "pergunta": "Qual equação representa a encomenda dos chaveiros e quantos chaveiros foram feitos?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Cada chaveiro custa R$ 12,00 e há R$ 4,00 de entrega, então 12n + 4 = 280. Tirando 4 dos dois lados: 12n = 276. Dividindo por 12: n = 23. Foram feitos 23 chaveiros."}]}, {"n": 15, "titulo": "Revisão: Propriedades da igualdade", "pags": [{"f": "p158.webp", "imp": 157, "rot": ["Resumo"], "ex": false}, {"f": "p159.webp", "imp": 158, "rot": ["Exercícios"], "ex": true}], "conf": [{"imp": 158, "rotulo": "Atividade 1", "pergunta": "Qual valor de x torna verdadeira a igualdade x + 7 = 15?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 6", "x = 7", "x = 8", "x = 22"], "certa": 2, "resolucao": "Subtraia 7 dos dois lados: x + 7 − 7 = 15 − 7. Então x = 8."}, {"imp": 158, "rotulo": "Atividade 2", "pergunta": "Verifique se 6 é solução da equação 4x – 5 = 19.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Troque x por 6: 4 × 6 − 5 = 24 − 5 = 19. Como 19 = 19, a igualdade é verdadeira, então 6 é solução da equação."}, {"imp": 158, "rotulo": "Atividade 3", "pergunta": "Lucas terminou a rodada com 13 pontos, e a pontuação é x + 5. Qual era a pontuação inicial x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["10", "7", "9", "8"], "certa": 3, "resolucao": "Monte a equação x + 5 = 13 e subtraia 5 dos dois lados: x = 13 − 5. Então x = 8."}, {"imp": 158, "rotulo": "Atividade 4", "pergunta": "Cada ingresso custa R$ 12,00 e Marina gastou R$ 60,00 no total. Quantos ingressos ela comprou?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["4", "5", "6", "12"], "certa": 1, "resolucao": "Com x ingressos, 12x = 60. Divida os dois lados por 12: x = 60 ÷ 12 = 5."}]}, {"n": 16, "titulo": "A solução de equações do 1º grau – Parte 1", "pags": [{"f": "p160.webp", "imp": 159, "rot": ["Resumo"], "ex": false}, {"f": "p161.webp", "imp": 160, "rot": ["Exercícios resolvidos", "Na prática"], "ex": true}, {"f": "p162.webp", "imp": 161, "rot": [], "ex": true}], "conf": [{"imp": 160, "rotulo": "Atividade 1", "pergunta": "Quantos pacotes de macarrão Marina comprou?", "tipo": "numero", "aceitas": ["6", "x=6"], "unidade": "pacotes", "opcoes": [], "certa": -1, "resolucao": "Cada pacote custa R$ 4,00 e a sacola custou R$ 6,00, então 4x + 6 = 30. Subtraindo 6 dos dois lados, 4x = 24; dividindo por 4, x = 6. Verificando: 4 × 6 + 6 = 30. Marina comprou 6 pacotes."}, {"imp": 161, "rotulo": "Atividade 2", "pergunta": "Quantas voltas extras Lucas correu no treino?", "tipo": "numero", "aceitas": ["12", "x=12"], "unidade": "voltas", "opcoes": [], "certa": -1, "resolucao": "As voltas obrigatórias são 3 + 2 = 5, então 5 + x = 17. Subtraindo 5 dos dois lados, x = 17 − 5 = 12. Lucas correu 12 voltas extras."}]}, {"n": 17, "titulo": "A solução de equações do 1º grau – Parte 2", "pags": [{"f": "p163.webp", "imp": 162, "rot": ["Resumo"], "ex": false}, {"f": "p164.webp", "imp": 163, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p165.webp", "imp": 164, "rot": ["Na prática"], "ex": true}, {"f": "p166.webp", "imp": 165, "rot": [], "ex": true}], "conf": [{"imp": 164, "rotulo": "Atividade 1 (equação)", "pergunta": "Qual equação do 1º grau representa a compra de Ana, usando m para o gasto com os marcadores?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A agenda custou R$ 18,90, os marcadores custaram m e o total foi R$ 32,50. Então a equação é m + 18,90 = 32,50."}, {"imp": 164, "rotulo": "Atividade 1 (valor de m)", "pergunta": "Qual é o valor de m, o gasto de Ana com os marcadores?", "tipo": "numero", "aceitas": ["13,60", "13,6", "m=13,60", "m=13,6"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "Subtraia 18,90 dos dois lados: m = 32,50 − 18,90. Assim, m = 13,60, ou seja, Ana gastou R$ 13,60 com os marcadores."}, {"imp": 164, "rotulo": "Atividade 2", "pergunta": "Qual é a distância x que Pedro já percorreu, resolvendo x + 1/4 = 5/2 − 1/2?", "tipo": "numero", "aceitas": ["1,75", "7/4", "x=1,75", "x=7/4"], "unidade": "km", "opcoes": [], "certa": -1, "resolucao": "Primeiro, 5/2 − 1/2 = 4/2 = 2 = 8/4. Então x + 1/4 = 8/4 e x = 8/4 − 1/4 = 7/4, que é 1,75 km."}]}, {"n": 18, "titulo": "Resolução de problemas envolvendo equações do 1º grau", "pags": [{"f": "p167.webp", "imp": 166, "rot": ["Na prática"], "ex": true}, {"f": "p168.webp", "imp": 167, "rot": [], "ex": true}, {"f": "p169.webp", "imp": 168, "rot": [], "ex": true}], "conf": [{"imp": 166, "rotulo": "Atividade 1", "pergunta": "Na equação 5x – 2 = 3x + 6, a afirmação \"se subtrairmos 3x dos dois membros, a igualdade permanece verdadeira\" está correta?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["A afirmação é verdadeira.", "A afirmação é falsa.", "O correto seria subtrair em apenas um dos membros"], "certa": 0, "resolucao": "Se fazemos a mesma operação nos dois membros, a igualdade continua verdadeira. Então subtrair 3x dos dois lados é permitido, e a afirmação é verdadeira."}, {"imp": 167, "rotulo": "Atividade 2", "pergunta": "Qual valor de x satisfaz a equação 4x + 1,5 = 9,5?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 1", "x = 2", "x = 3", "x = 4"], "certa": 1, "resolucao": "Subtraia 1,5 dos dois lados: 4x = 8. Divida por 4: x = 2."}, {"imp": 167, "rotulo": "Atividade 3", "pergunta": "Quantos sucos de R$ 4,00 foram comprados, se, com um chocolate de R$ 2,50, o total foi R$ 18,50?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2", "3", "4", "5"], "certa": 2, "resolucao": "A equação é 4x + 2,5 = 18,5. Então 4x = 16 e x = 4 sucos."}, {"imp": 168, "rotulo": "Atividade 4", "pergunta": "Qual é a distância x, em km, de cada trecho, sabendo que 3 trechos iguais mais 3/4 km somam 15/4 km?", "tipo": "numero", "aceitas": ["1", "x=1"], "unidade": "km", "opcoes": [], "certa": -1, "resolucao": "A equação é 3x + 3/4 = 15/4. Subtraindo 3/4 dos dois lados: 3x = 12/4 = 3. Então x = 1 km."}, {"imp": 168, "rotulo": "Atividade 5", "pergunta": "Qual é o comprimento do pedaço menor do fio, sabendo que 4 vezes ele mais 3/4 m dá 19/3 m?", "tipo": "numero", "aceitas": ["67/48", "1,39", "1,4", "1,40", "x=67/48", "x=1,39", "x=1,4"], "unidade": "m", "opcoes": [], "certa": -1, "resolucao": "A equação é 4x + 3/4 = 19/3. Com denominador 12: 4x = 76/12 – 9/12 = 67/12. Dividindo por 4: x = 67/48, que é cerca de 1,4 m (o gabarito do livro escreve 1,39 m)."}]}, {"n": 19, "titulo": "Aula de verificação: Equações do 1º grau", "pags": [{"f": "p170.webp", "imp": 169, "rot": ["Na prática"], "ex": true}, {"f": "p171.webp", "imp": 170, "rot": [], "ex": true}, {"f": "p172.webp", "imp": 171, "rot": [], "ex": true}], "conf": [{"imp": 169, "rotulo": "Atividade 1", "pergunta": "Qual é o valor de x, a quantidade de litros que cada uma das 4 bombas adicionou ao reservatório?", "tipo": "numero", "aceitas": ["120", "x=120"], "unidade": "litros", "opcoes": [], "certa": -1, "resolucao": "A equação é 4x − 120 = 360. Somando 120 dos dois lados: 4x = 480. Dividindo por 4: x = 120."}, {"imp": 170, "rotulo": "Atividade 3 a)", "pergunta": "Escreva a equação que representa o valor total cobrado pelo fotógrafo, com x sendo o valor de cada ensaio.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "São 3 ensaios de valor x e 3 edições de R$ 54,90, que dão 3 × 54,90 = 164,70. O total é 989,40, então a equação é 3x + 164,70 = 989,40."}, {"imp": 170, "rotulo": "Atividade 3 b)", "pergunta": "Qual é o valor cobrado por cada ensaio fotográfico?", "tipo": "numero", "aceitas": ["274,90", "274,9", "x=274,90", "x=274,9"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "Em 3x + 164,70 = 989,40, subtraia 164,70 dos dois lados: 3x = 824,70. Dividindo por 3: x = 274,90."}, {"imp": 171, "rotulo": "Atividade 4", "pergunta": "Qual é o valor de x, o número de porções de 1/2 kg de queijo compradas depois?", "tipo": "numero", "aceitas": ["5", "x=5"], "unidade": "porções", "opcoes": [], "certa": -1, "resolucao": "A equação é 1/2 + x · 1/2 = 3. Tirando 1/2 dos dois lados: x/2 = 5/2. Multiplicando por 2: x = 5."}]}, {"n": 20, "titulo": "Revisão: Equações polinomiais do 1º grau", "pags": [{"f": "p173.webp", "imp": 172, "rot": ["Resumo"], "ex": false}, {"f": "p174.webp", "imp": 173, "rot": ["Na prática"], "ex": true}, {"f": "p175.webp", "imp": 174, "rot": [], "ex": true}, {"f": "p176.webp", "imp": 175, "rot": [], "ex": true}], "conf": [{"imp": 173, "rotulo": "Atividade 1", "pergunta": "Qual valor de x torna verdadeira a igualdade x + 7 = 15?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["6", "7", "8", "22"], "certa": 2, "resolucao": "Subtraímos 7 dos dois lados: x + 7 − 7 = 15 − 7. Então x = 8."}, {"imp": 173, "rotulo": "Atividade 2", "pergunta": "Que equação a balança (x e 5 de um lado, 3 do outro) representa, e x = −2 a torna verdadeira?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A balança mostra x + 5 = 3. Trocando x por −2: −2 + 5 = 3, e o outro prato também é 3. Os dois lados são iguais, então x = −2 torna a igualdade verdadeira."}, {"imp": 174, "rotulo": "Atividade 3", "pergunta": "Qual valor de x satisfaz a equação 3x − 4 = 11?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["3", "5", "7", "15"], "certa": 1, "resolucao": "Somamos 4 aos dois lados: 3x = 15. Dividimos os dois lados por 3: x = 5."}, {"imp": 174, "rotulo": "Atividade 4", "pergunta": "Na balança 2x − 9 = −7, qual sequência de ações deixa o x sozinho?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Adicionar 9 aos dois lados e depois dividir por 2.", "Subtrair 9 dos dois lados e depois dividir por 2.", "Adicionar 9 aos dois lados e depois multiplicar por 2.", "Dividir os dois lados por 2 e depois adicionar 9."], "certa": 0, "resolucao": "Somamos 9 aos dois lados: 2x − 9 + 9 = −7 + 9, que dá 2x = 2. Depois dividimos os dois lados por 2 e obtemos x = 1."}, {"imp": 175, "rotulo": "Atividade 4 (continuação)", "pergunta": "Explique como resolver a equação da balança (2x − 9 = −7) usando propriedades que mantêm a igualdade.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A equação é 2x − 9 = −7. Somamos 9 aos dois lados: 2x = 2. Dividimos os dois lados por 2: x = 1. Fazemos sempre a mesma operação nos dois lados para a balança continuar em equilíbrio."}]}, {"n": 21, "titulo": "Reconhecendo outros formatos de equações do 1º grau", "pags": [{"f": "p177.webp", "imp": 176, "rot": ["Resumo"], "ex": false}, {"f": "p178.webp", "imp": 177, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p179.webp", "imp": 178, "rot": ["Na prática"], "ex": true}, {"f": "p180.webp", "imp": 179, "rot": [], "ex": true}], "conf": [{"imp": 178, "rotulo": "Atividade 1 a)", "pergunta": "Quais das quatro igualdades são equações do 1º grau?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "x + 7 = 20, 15 = 3x e 2x + 5 = x + 12 são equações do 1º grau: cada uma tem uma só incógnita, com grau 1. Já 8 + 4 = 12 não tem incógnita, é só uma igualdade de números."}, {"imp": 178, "rotulo": "Atividade 1 b)", "pergunta": "Em quais igualdades a incógnita aparece em apenas um dos membros?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Em x + 7 = 20 a incógnita está só no lado esquerdo. Em 15 = 3x ela está só no lado direito."}, {"imp": 178, "rotulo": "Atividade 1 c)", "pergunta": "Em qual igualdade a incógnita aparece nos dois membros?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x + 7 = 20", "15 = 3x", "2x + 5 = x + 12", "8 + 4 = 12"], "certa": 2, "resolucao": "Em 2x + 5 = x + 12 há incógnita dos dois lados do sinal de igual: 2x no 1º membro e x no 2º. Nas outras, ela aparece em um lado só ou nem aparece."}, {"imp": 179, "rotulo": "Atividade 2 a)", "pergunta": "Para cada uma das quatro equações, dizer se a incógnita aparece em um só membro ou nos dois.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "3(x − 2) = 21: só no 1º membro. y/4 + 5 = 9: só no 1º membro. 2m + 7 = m − 3: nos dois membros. 10 = 2(5 + x): só no 2º membro."}, {"imp": 179, "rotulo": "Atividade 2 b)", "pergunta": "Dizer qual equação tem termo fracionário e quais usam apenas números inteiros.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Só y/4 + 5 = 9 tem termo fracionário (y/4). As outras três, 3(x − 2) = 21, 2m + 7 = m − 3 e 10 = 2(5 + x), usam apenas números inteiros."}]}, {"n": 22, "titulo": "Estratégias de resolução de equações do 1º grau – Parte 1", "pags": [{"f": "p181.webp", "imp": 180, "rot": ["Resumo"], "ex": false}, {"f": "p182.webp", "imp": 181, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p183.webp", "imp": 182, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 182, "rotulo": "Atividade 1", "pergunta": "Reescrever x/3 + 4 = 10 em uma forma equivalente ax + b = c, sem a fração no coeficiente de x.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Multiplique os dois lados por 3: 3 × (x/3 + 4) = 3 × 10. Isso dá x + 12 = 30, que é a equação no formato ax + b = c."}]}, {"n": 23, "titulo": "Estratégias de resolução de equações do 1º grau – Parte 2", "pags": [{"f": "p184.webp", "imp": 183, "rot": ["Resumo"], "ex": false}, {"f": "p185.webp", "imp": 184, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p186.webp", "imp": 185, "rot": [], "ex": false}, {"f": "p187.webp", "imp": 186, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 186, "rotulo": "Atividade 1", "pergunta": "Resolva a equação x/3 + 5 = x − 1 e escolha o valor de x.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["6", "9", "12", "18"], "certa": 1, "resolucao": "Multiplique tudo por 3: x + 15 = 3x − 3. Subtraia x dos dois lados: 15 = 2x − 3; some 3: 18 = 2x, então x = 9. Verificando: 9/3 + 5 = 8 e 9 − 1 = 8. Resposta: x = 9 (alternativa b)."}]}, {"n": 24, "titulo": "Resolução de problemas envolvendo equações do 1º grau – Parte 1", "pags": [{"f": "p188.webp", "imp": 187, "rot": ["Na prática"], "ex": true}, {"f": "p189.webp", "imp": 188, "rot": [], "ex": true}, {"f": "p190.webp", "imp": 189, "rot": [], "ex": true}], "conf": [{"imp": 187, "rotulo": "Atividade 1", "pergunta": "Resolva a equação 2(x − 3/4) = 1/2 e dê o valor de x.", "tipo": "numero", "aceitas": ["1", "x=1"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Divida os dois lados por 2: x − 3/4 = 1/4. Some 3/4 dos dois lados: x = 1/4 + 3/4 = 4/4 = 1."}, {"imp": 187, "rotulo": "Atividade 2", "pergunta": "Resolva 3(2x − 5) = 4x + 6 e dê o valor de x.", "tipo": "numero", "aceitas": ["10,5", "x=10,5", "21/2"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Distribuindo: 6x − 15 = 4x + 6. Então 6x − 4x = 6 + 15, ou seja, 2x = 21 e x = 10,5. Verificando: 3(21 − 5) = 48 e 4 × 10,5 + 6 = 48."}, {"imp": 188, "rotulo": "Atividade 3", "pergunta": "Qual era o preço original de cada xampu, sabendo que 6 xampus com metade do preço custaram R$ 90,00 no total?", "tipo": "numero", "aceitas": ["30", "30,00"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "Com x sendo o preço original, a equação é 6 × (x/2) = 90. Isso dá 3x = 90, então x = 90 ÷ 3 = 30. Cada xampu custava R$ 30,00."}, {"imp": 188, "rotulo": "Atividade 4", "pergunta": "Quanto o setor de alimentação receberá dos R$ 2 400,00 arrecadados?", "tipo": "numero", "aceitas": ["1400", "1.400", "1400,00"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "Infraestrutura: 2 400 ÷ 4 = 600. Divulgação: 600 − 200 = 400. Equação: 600 + 400 + x = 2 400, então x = 2 400 − 1 000 = 1 400. Alimentação recebe R$ 1 400,00."}, {"imp": 189, "rotulo": "Atividade 5", "pergunta": "Quantos cartazes há em cada conjunto, sabendo que 3 conjuntos idênticos custaram R$ 150,00 no total, com taxa fixa de R$ 30,00 e R$ 4,00 por cartaz?", "tipo": "numero", "aceitas": ["10"], "unidade": "cartazes", "opcoes": [], "certa": -1, "resolucao": "São 3x cartazes no total, então a equação é 30 + 4 × 3x = 150, ou seja, 30 + 12x = 150. Daí 12x = 120 e x = 10. Cada conjunto tem 10 cartazes."}]}, {"n": 25, "titulo": "Revisão: Equações do 1º grau em diferentes formatos", "pags": [{"f": "p191.webp", "imp": 190, "rot": ["Resumo"], "ex": false}, {"f": "p192.webp", "imp": 191, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 191, "rotulo": "Na prática 1", "pergunta": "Qual das expressões é uma equação do 1º grau?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x² + 3 = 7", "2(x + 5) = 11", "3x² – x = 4", "x · y = 6"], "certa": 1, "resolucao": "Uma equação do 1º grau tem uma só incógnita, e ela não fica elevada ao quadrado nem a uma potência maior. Só 2(x + 5) = 11 serve: as outras têm x² ou duas incógnitas. Resposta: b."}, {"imp": 191, "rotulo": "Na prática 2", "pergunta": "Como x/2 + 4 = 10 foi transformada em x + 8 = 20?", "tipo": "escolha", "aceit
