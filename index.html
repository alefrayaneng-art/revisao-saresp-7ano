// ---------- instrumento: tabela pitagórica ----------
TELAS.tabela = function(i, j){
  tbParaTimer();
  if (i >= 1 && i <= 10 && j >= 1 && j <= 10) tbT.sel = [i, j];
  mostrar(topo() + '<h2>Tabela pitagórica</h2><p class="sub">Toque numa casa para ver o retângulo e os caminhos até o resultado. A diagonal em destaque tem os quadrados: ela é a linha do espelho.</p>' +
    '<div id="tbmb">' + tbBotoesMult('tbtf', tbT.f) + '</div><div id="tbpad">' + tbPadrao() + '</div>' +
    tbTabelaBotoes('tbcel', (a, b) => ({ txt: a * b, cls: tbTabCls(a, b), lab: a + ' × ' + b + ' = ' + (a * b) })) +
    '<div id="tbinfo" role="status" aria-live="polite">' + tbInfo() + '</div>' + rodapeVoltar());
}
function tbTabCls(i, j){
  const s = tbT.sel, f = tbT.f;
  return (i === j ? 'diag ' : '') + (f && (i * j) % f === 0 ? 'mult ' : '') + (s && s[0] === i && s[1] === j ? 'sel ' : '') + (s && s[0] === j && s[1] === i && i !== j ? 'esp' : '');
}
function tbTabAtualiza(){ app.querySelectorAll('.tbtab button[data-acao="tbcel"]').forEach(b => { b.className = tbTabCls(+b.dataset.i, +b.dataset.j); }); }
function tbPadrao(){ return tbT.f ? '<div class="nota"><p><b>Múltiplos de ' + tbT.f + '.</b> ' + esc(TB_PADRAO[tbT.f]) + '</p></div>' : ''; }
function tbInfo(){
  const s = tbT.sel;
  if (!s) return '<p class="sub">Nenhuma casa escolhida ainda.</p>';
  const a = s[0], b = s[1], p = a * b;
  return '<div class="caixa"><h3>' + a + ' × ' + b + ' = ' + p + '</h3><p class="sub">' + a + (a === 1 ? ' linha' : ' linhas') + ' de ' + b + ' quadradinhos.' +
    (a !== b ? ' O espelho, ' + b + ' × ' + a + ', está marcado com borda laranja.' : ' É um quadrado: fica na diagonal.') + '</p>' + tbMalha(a, b, null, a + ' linhas de ' + b + ' quadradinhos') +
    '<h3>Caminhos para chegar lá</h3><ul class="ideias">' + estrategias(a, b).map(x => '<li><b>' + esc(tbCap(x.nome)) + ':</b> ' + esc(x.txt) + ' <span class="tbconta">' + esc(x.conta) + '</span></li>').join('') + '</ul>' +
    '<div class="linha"><button data-acao="tbvt">↑ Voltar à tabela</button>' + (a > 1 || b > 1 ? botaoIr('Cortar este retângulo', 'tabcorte', a, b, 'leve') : '') + '</div></div>';
}

// ---------- instrumento: cortar o retângulo ----------
TELAS.tabcorte = function(m, n){
  tbParaTimer();
  if (m >= 1 && m <= 10 && n >= 1 && n <= 10) { tbC.m = m; tbC.n = n; tbC.dir = n >= 2 ? 'c' : 'l'; tbC.k = 5; tbC.salvos = []; }
  tbcAjusta();
  mostrar(topo() + '<h2>Cortar o retângulo</h2><p class="sub">Escolha o retângulo e onde cortar. As duas partes são contas menores; somando as duas, dá o total.</p>' +
    '<div class="caixa" id="tbcx">' + tbcCaixa() + '</div><div id="tbcs">' + tbcSalvos() + '</div>' +
    '<div class="nota"><p><b>Experimente comparar:</b> 6 × 7 cortando as colunas em 5 e 2, e depois cortando as linhas em 3 e 3. 8 × 7 cortando as linhas em 4 e 4 (o dobro do ×4).</p></div>' + rodapeVoltar());
};
function tbcAjusta(){ const d = tbC.dir === 'c' ? tbC.n : tbC.m; tbC.k = d < 2 ? 0 : Math.max(1, Math.min(d - 1, tbC.k || 1)); }
function tbcCaixa(){
  const C = tbC, p = C.m * C.n, d = C.dir === 'c' ? C.n : C.m;
  let h = tbPasso('Linhas', C.m, 'tbc', 'm') + tbPasso('Colunas', C.n, 'tbc', 'n') +
    '<div class="tbpasso" role="group" aria-label="Como cortar"><button data-acao="tbc" data-p="dc" class="' + (C.dir === 'c' ? 'ativo' : '') + '" aria-pressed="' + (C.dir === 'c') + '">Cortar as colunas</button>' +
    '<button data-acao="tbc" data-p="dl" class="' + (C.dir === 'l' ? 'ativo' : '') + '" aria-pressed="' + (C.dir === 'l') + '">Cortar as linhas</button></div>';
  if (d < 2) return h + tbMalha(C.m, C.n, null) + '<p class="tbfato">' + C.m + ' × ' + C.n + ' = ' + p + '</p><p class="sub">Com só 1 ' + (C.dir === 'c' ? 'coluna' : 'linha') + ' não dá para cortar desse jeito. Aumente o retângulo ou troque o corte.</p>';
  const c = tbCorte(C.m, C.n, C.k, C.dir);
  return h + tbPasso(C.dir === 'c' ? 'Cortar depois da coluna' : 'Cortar depois da linha', C.k, 'tbc', 'k') + tbMalha(C.m, C.n, c.f, C.m + ' linhas de ' + C.n + ', cortado em duas partes', c.leg) +
    '<p class="tbconta" style="text-align:center">' + esc(c.expr) + '</p><p class="tbconta" style="text-align:center">' + esc('= ' + c.soma) + '</p>' +
    '<div class="linha"><button data-acao="tbc" data-p="guarda">Guardar este corte para comparar</button></div>';
}
function tbcSalvos(){
  const L = tbC.salvos;
  if (!L.length) return '';
  return '<div class="caixa"><h3>Cortes guardados de ' + tbC.m + ' × ' + tbC.n + '</h3><ul class="ideias">' + L.map(t => '<li class="tbconta">' + esc(t) + '</li>').join('') + '</ul>' +
    (L.length > 1 ? '<p>Cortes diferentes, o mesmo total: ' + (tbC.m * tbC.n) + '. O retângulo é o mesmo; só mudou o jeito de contar.</p>' : '<p class="sub">Guarde outro corte do mesmo retângulo para comparar.</p>') +
    '<div class="linha"><button class="leve" data-acao="tbc" data-p="limpa">Apagar a lista</button></div></div>';
}
function tbcMuda(p){
  const C = tbC, lim = v => Math.max(1, Math.min(10, v));
  if (p === 'm-' || p === 'm+') { C.m = lim(C.m + (p === 'm+' ? 1 : -1)); C.salvos = []; }
  else if (p === 'n-' || p === 'n+') { C.n = lim(C.n + (p === 'n+' ? 1 : -1)); C.salvos = []; }
  else if (p === 'k-' || p === 'k+') C.k += p === 'k+' ? 1 : -1;
  else if (p === 'dc' || p === 'dl') { C.dir = p === 'dc' ? 'c' : 'l'; C.k = Math.floor((C.dir === 'c' ? C.n : C.m) / 2); }
  else if (p === 'limpa') C.salvos = [];
  else if (p === 'guarda') {
    const d = C.dir === 'c' ? C.n : C.m;
    if (d >= 2) {
      const t = tbCorte(C.m, C.n, C.k, C.dir), linha = t.expr + ' = ' + t.soma;
      if (C.salvos.indexOf(linha) < 0) { C.salvos.push(linha); if (C.salvos.length > 6) C.salvos.shift(); aviso('Corte guardado'); }
      else aviso('Esse corte já está na lista');
    }
  }
  tbcAjusta();
  const x = document.getElementById('tbcx'), s = document.getElementById('tbcs');
  if (x) x.innerHTML = tbcCaixa();
  if (s) s.innerHTML = tbcSalvos();
  tbFoco('[data-acao="tbc"][data-p="' + p + '"]');
}

// ---------- flashcards da tabuada: três caixas (0 = ainda não, 1 = volta em 1 dia, 2 = dominado, volta em 3 dias) ----------
function tbfEstado(k){ return (mem.tbf && mem.tbf[k]) || [0, 0]; }
function tbfDevida(k){ const s = tbfEstado(k); return s[0] === 0 || Math.abs(hoje() - s[1]) >= (s[0] === 1 ? 1 : 3); }
function tbfDom(){ return TB_FPARES.filter(k => tbfEstado(k)[0] >= 2).length; }
TELAS.tabflash = function(){
  tbParaTimer();
  if (!feito('tab', 'e9')) { tbTravado('Flashcards da tabuada'); return; }
  const dev = TB_FPARES.filter(tbfDevida).length, dom = tbfDom(), tr = TB_FPARES.filter(k => tbfEstado(k)[0] === 1).length;
  mostrar(topo() + '<h2>Flashcards da tabuada</h2><p class="sub">36 fatos de 2 a 9 · ' + dom + ' dominados' + (tr ? ' · ' + tr + ' em treino' : '') + '</p>' + barra(100 * dom / 36) +
    '<p>Veja a conta, pense na estratégia e digite o resultado no teclado da tela. Sem relógio. O que você errar volta nesta sessão e de novo em outro dia.</p><div class="lista">' +
    (dev ? '<button class="dest" data-acao="tbfini">Treinar os cartões de hoje (' + Math.min(8, dev) + ')</button>'
      : '<p class="sub">Nada para rever hoje: os cartões voltam em 1 e em 3 dias, porque rever depois de um tempo ajuda a fixar.</p>') +
    '<button data-acao="tbfini" data-m="todos">Treinar 8 cartões sorteados</button></div>' +
    '<details class="ajuda"><summary>Como funcionam as caixas</summary><p>Todo cartão começa em "ainda não". Acertou de primeira no dia certo: sobe uma caixa. Na caixa 1 ele volta no dia seguinte; na caixa 2 (dominado) volta em 3 dias. ' +
    'Acertar fora do dia não sobe a caixa. Errar volta o cartão para o começo, em qualquer dia.</p></details>' + rodapeVoltar());
};
function tbfIni(todos){
  const fila = embaralhar(todos ? TB_FPARES : TB_FPARES.filter(tbfDevida)).slice(0, 8);
  if (!fila.length) return;
  tbF = { fila: fila, total: fila.length, certos: 0, erros: {} };
  marcaHistorico();
  tbfCartao();
}
function tbfCartao(){
  const F = tbF;
  if (!F.fila.length) { tbfFim(); return; }
  const p = F.fila[0].split(',').map(Number), gira = Math.random() < 0.5;
  F.at = gira ? [p[1], p[0]] : p;
  tbTecladoNovo(tbfResp, tbfCartao);
  mostrar('<div class="tbs em-treino"><div class="topo"><span><b>Flashcards da tabuada</b> · ' + (F.fila.length === 1 ? 'falta 1' : 'faltam ' + F.fila.length) + '</span><button class="leve" data-acao="tbfsair">Sair</button></div>' +
    barra(100 * Math.min(F.total, F.total - F.fila.length) / F.total) + '<div class="tbcard"><p class="fck">Quanto é?</p><p class="tbq"><span>' + F.at[0] + ' × ' + F.at[1] + ' = </span><span class="tbvisor" id="tbvisor">?</span></p></div>' +
    tbTeclado() + '<div id="tbfb" class="tbfb" role="status" aria-live="polite"></div><div id="tbprox" class="linha"></div></div>');
}
function tbfResp(n){
  const F = tbF, k = F.fila[0], a = F.at[0], b = F.at[1], p = a * b, s = estrategias(a, b)[0], fb = document.getElementById('tbfb');
  const st = tbfEstado(k), noPrazo = tbfDevida(k);
  mem.tbf = mem.tbf || {};
  tbTravaTeclado(); F.fila.shift();
  if (n === p) {
    if (!F.erros[k]) {
      F.certos++;
      if (noPrazo) { mem.tbf[k] = [Math.min(2, st[0] + 1), hoje()]; ganha(3, 'flashcard da tabuada', 'tbf:' + k); }  // só sobe de caixa na data certa
    }
    salvar();
    fb.innerHTML = '<div class="fb ok"><p><b>✔ ' + a + ' × ' + b + ' = ' + p + '.</b> ' + (F.erros[k] ? 'Desta vez você lembrou sem ajuda.' : 'Certo de primeira.') + '</p><p class="tbconta">' + esc('Um caminho (' + s.nome + '): ' + s.conta) + '</p></div>';
    tbProx(F.fila.length ? 'Próximo cartão' : 'Ver o resultado');
    return;
  }
  mem.tbf[k] = [0, hoje()]; F.erros[k] = 1; salvar();
  F.fila.splice(Math.min(3, F.fila.length), 0, k);  // volta mais adiante nesta sessão
  fb.innerHTML = '<div class="fb no"><p><b>✘ Ainda não: ' + a + ' × ' + b + ' = ' + p + '.</b></p><p><b>' + esc(tbCap(s.nome)) + ':</b> ' + esc(s.txt) + '</p><p class="tbconta">' + esc(s.conta) + '</p>' + tbMalhaS(a, b, s) +
    '<p>Este cartão volta daqui a pouco.</p></div>';
  tbProx('Continuar');
}
function tbfFim(){
  const F = tbF;
  tbConcluiE10();
  mostrar('<h2>Sessão concluída</h2><div class="caixa"><p class="placar">' + pl(F.total, 'cartão', 'cartões') + '</p><p>Você acertou de primeira ' + F.certos + ' de ' + F.total +
    '. O que você acertou volta outro dia para uma nova checagem; o que errou volta antes.</p><p class="sub">Agora são ' + tbfDom() + ' de 36 fatos dominados.</p></div>' +
    '<div class="linha"><button class="forte" data-acao="tbfsair">Voltar aos flashcards</button></div>');
}

// ---------- jogo do produto ----------
function tbjCasas(v){ const r = []; for (let i = 1; i <= 10; i++) for (let j = 1; j <= 10; j++) if (i * j === v) r.push(i + ',' + j); return r; }
TELAS.tabjogo = function(){
  tbParaTimer();
  if (!feito('tab', 'e9')) { tbTravado('Jogo do produto'); return; }
  tbJ = null;
  mostrar(topo() + '<h2>Jogo do produto</h2><p>Aparece um número. Toque, na tabela, em todas as casas que dão esse número, inclusive os espelhos. A tabela fica em branco: descubra pelas linhas e colunas.</p>' +
    '<p class="sub">6 rodadas, sem relógio. Errar não tira ponto: a casa errada mostra o resultado dela e você continua procurando.</p>' +
    '<div class="linha"><button class="forte" data-acao="tbjini">Começar o jogo</button></div><div id="tbdes">' + tbDesafioCaixa() + '</div>' + rodapeVoltar());
};
function tbDesafioCaixa(){
  if (!mem.tbjok) return '';
  const on = tbDesOn;
  return '<div class="caixa"><h3>Desafio de 60 segundos (opcional)</h3><p class="sub">Contra o seu próprio recorde, e só você vê o resultado. Fica desligado até você ligar.</p>' +
    '<div class="linha"><button data-acao="tbdtog" class="' + (on ? 'ativo' : '') + '" aria-pressed="' + on + '">' + (on ? 'Desafio ligado' : 'Ligar o desafio') + '</button>' +
    (on ? '<button class="forte" data-acao="tbdini">Começar o desafio</button>' : '') + '</div>' + (mem.tbrec ? '<p class="sub">Seu recorde: ' + pl(mem.tbrec, 'casa', 'casas') + ' em 60 segundos.</p>' : '') + '</div>';
}
function tbjIni(desafio){
  tbParaTimer();
  const jaEm = tbJ && tbJ.fim;  // jogar de novo: reaproveita a entrada do histórico desta sessão
  const rod = desafio ? [] : embaralhar(embaralhar(TB_JRICOS).slice(0, 3).concat(embaralhar(TB_JOUTROS).slice(0, 3)));
  tbJ = { rod: rod, r: 0, errTot: 0, desafio: !!desafio, casas: 0, fim: false, ult: 0 };
  if (!jaEm) marcaHistorico();
  if (desafio) {
    tbJ.tFim = Date.now() + 60000;
    tbTimer = setInterval(tbTick, 250);
  }
  tbjRodada(true);
}
function tbjValor(){
  const J = tbJ;
  if (!J.desafio) return J.rod[J.r];
  const todos = TB_JRICOS.concat(TB_JOUTROS);
  let v = J.ult;
  while (v === J.ult) v = todos[Math.floor(Math.random() * todos.length)];
  return v;
}
function tbjRodada(novo){
  const J = tbJ, v = tbjValor();
  J.v = v; J.ult = v; J.alvo = tbjCasas(v); J.achou = {}; J.errou = {}; J.t0 = Date.now(); J.pronta = false;
  const resta = J.desafio ? Math.max(0, Math.ceil((J.tFim - Date.now()) / 1000)) : 0;
  const h = '<div class="tbs em-treino"><div class="topo"><span>' + (J.desafio ? '<b>Desafio</b> · <span id="tbrel" class="tbrel">' + resta + ' s</span> · <span id="tbjpts">' + pl(J.casas, 'casa', 'casas') + '</span>'
      : '<b>Jogo do produto</b> · rodada ' + (J.r + 1) + ' de ' + J.rod.length) + '</span><button class="leve" data-acao="tbjsair">Sair</button></div>' +
    '<p class="tbq">Ache todas as casas que dão <b>' + v + '</b></p><p class="sub" id="tbjfalta" style="text-align:center">' + tbjFaltaTxt() + '</p>' +
    tbTabelaBotoes('tbjc', (i, j) => ({ txt: '', cls: '', lab: 'linha ' + i + ', coluna ' + j })) +
    '<div id="tbfb" class="tbfb" role="status" aria-live="polite"></div><div id="tbprox" class="linha"></div></div>';
  if (novo) mostrar(h); else app.innerHTML = h;
}
function tbjFaltaTxt(){ const f = tbJ.alvo.length - Object.keys(tbJ.achou).length; return f === 1 ? 'Falta 1 casa.' : 'Faltam ' + f + ' casas.'; }
function tbjToque(b){
  const J = tbJ;
  if (!J || J.fim || J.pronta || Date.now() - J.t0 < 450) return;
  const i = +b.dataset.i, j = +b.dataset.j, k = i + ',' + j, p = i * j, fb = document.getElementById('tbfb');
  if (J.achou[k] || J.errou[k]) return;
  if (p === J.v) {
    J.achou[k] = 1; b.classList.add('achou'); b.innerHTML = p + '<br><span aria-hidden="true">✔</span>'; b.setAttribute('aria-label', i + ' × ' + j + ' = ' + p + ', certo');
    if (J.desafio) { J.casas++; const pt = document.getElementById('tbjpts'); if (pt) pt.textContent = pl(J.casas, 'casa', 'casas'); }
    document.getElementById('tbjfalta').textContent = tbjFaltaTxt();
    if (Object.keys(J.achou).length < J.alvo.length) { fb.innerHTML = '<div class="fb ok"><p><b>✔ ' + i + ' × ' + j + ' = ' + p + '.</b> Continue: ainda tem casa com ' + J.v + '.</p></div>'; return; }
    if (J.desafio) { tbjRodada(false); return; }
    J.pronta = true;
    ganha(3, 'jogo do produto', 'tbj:' + J.v);
    const temEsp = J.alvo.some(x => { const q = x.split(','); return q[0] !== q[1]; });
    fb.innerHTML = '<div class="fb ok"><p><b>✔ Rodada completa:</b> você achou ' + (J.alvo.length === 1 ? 'a casa' : 'as ' + J.alvo.length + ' casas') + ' que dão ' + J.v + (temEsp ? ', com os espelhos' : '') + '.</p><p class="tbconta">' +
      esc(J.alvo.map(x => x.replace(',', ' × ')).join(' · ')) + '</p></div>';
    tbProx(J.r + 1 < J.rod.length ? 'Próxima rodada' : 'Ver o resultado', 'tbjprox');
    return;
  }
  J.errou[k] = 1; J.errTot++;
  b.classList.add('errou'); b.innerHTML = p + '<br><span aria-hidden="true">✘</span>'; b.setAttribute('aria-label', i + ' × ' + j + ' = ' + p + ', não é ' + J.v);
  fb.innerHTML = '<div class="fb no"><p><b>✘ ' + i + ' × ' + j + ' = ' + p + ', não ' + J.v + '.</b> Continue procurando.</p></div>';
}
function tbjSeguir(){
  const J = tbJ;
  if (!J || !J.pronta) return;
  J.r++;
  if (J.r < J.rod.length) { tbjRodada(true); return; }
  tbjFim();
}
function tbjFim(){
  const J = tbJ;
  J.fim = true;
  tbConcluiE10();
  if (J.errTot === 0) { mem.tbjok = 1; salvar(); }
  mostrar('<h2>Jogo do produto: resultado</h2><div class="caixa"><p class="placar">' + pl(J.rod.length, 'rodada', 'rodadas') + '</p><p>' +
    (J.errTot === 0 ? 'Você achou todas as casas sem tocar em nenhuma errada, inclusive os espelhos.' : 'Você achou todas as casas das ' + J.rod.length + ' rodadas. No caminho tocou em ' + pl(J.errTot, 'casa errada', 'casas erradas') + ' e seguiu procurando.') +
    '</p></div><div id="tbdes">' + tbDesafioCaixa() + '</div><div class="linha"><button class="forte" data-acao="tbjini">Jogar de novo</button><button data-acao="tbjsair">Voltar</button></div>');
}
function tbTick(){
  const J = tbJ, el = document.getElementById('tbrel');
  if (!J || !J.desafio || J.fim || !el) { tbParaTimer(); return; }
  if (document.hidden) return;
  const r = Math.max(0, Math.ceil((J.tFim - Date.now()) / 1000));
  el.textContent = r + ' s';
  if (r <= 0) tbjDesFim();
}
function tbjDesFim(){

// ===== módulo "Meu caderno" (prefixo de ação: cd) =====
// O aluno registra o desenvolvimento de uma questão: escrevendo na tela, digitando ou fotografando o caderno.
// Guarda tudo no aparelho (IndexedDB "rev7-caderno", store "itens"). Nada é enviado sem o aluno tocar em "Enviar".
const CD_BANCO = 'rev7-caderno', CD_LOJA = 'itens', CD_MAXF = 3, CD_ALT_MAX = 3600;
let cdDbP = null, cdSemBanco = false, cdAvisou = false, cdTok = 0, cdE = null;
let cdFila = Promise.resolve();
const cdMemo = {};      // plano B: itens só na memória, quando o IndexedDB não funciona

// ---------- banco de dados ----------
function cdAvisaSemBanco(){
  if (cdAvisou) return;
  cdAvisou = true;
  aviso('Neste modo de navegação o caderno não fica guardado');
}
function cdBanco(){
  if (!cdDbP) {
    cdDbP = new Promise(function (res) {
      let fim = false;
      const ok = function (db) { if (fim) return; fim = true; res(db); };
      const falha = function () { if (fim) return; fim = true; cdSemBanco = true; res(null); };
      try {
        if (!window.indexedDB) { falha(); return; }
        const rq = indexedDB.open(CD_BANCO, 1);
        rq.onupgradeneeded = function () {
          try { const db = rq.result; if (!db.objectStoreNames.contains(CD_LOJA)) db.createObjectStore(CD_LOJA, { keyPath: 'id' }); } catch (e) {}
        };
        rq.onsuccess = function () {
          const db = rq.result;
          db.onversionchange = function () { try { db.close(); } catch (e) {} };
          ok(db);
        };
        rq.onerror = falha;
        rq.onblocked = falha;
        setTimeout(falha, 5000);
      } catch (e) { falha(); }
    });
  }
  return cdDbP.then(function (db) { if (!db) cdAvisaSemBanco(); return db; });
}
// falha de uma gravação não desliga o banco: o item fica em cdMemo e o aluno é avisado do motivo
function cdErroGravacao(er){
  if (er && er.name === 'QuotaExceededError') aviso('Sem espaço no aparelho. Remova fotos antigas');
  else aviso('Não consegui guardar agora');
}
function cdTx(db, modo, fn){
  return new Promise(function (res, rej) {
    try {
      const tx = db.transaction(CD_LOJA, modo);
      const r = fn(tx.objectStore(CD_LOJA));
      tx.oncomplete = function () { res(r ? r.result : undefined); };
      tx.onerror = tx.onabort = function () { rej(tx.error || new Error('tx')); };
    } catch (e) { rej(e); }
  });
}
function cdFilaAdd(fn){
  const p = cdFila.then(fn);
  cdFila = p.catch(function () {});
  return p;
}
function cdTem(it){
  return !!(it && ((it.tracos && it.tracos.length) || (it.texto && String(it.texto).trim() !== '') || (it.fotos && it.fotos.length)));
}
// leitura sem esperar a fila (usada de dentro da própria fila, onde esperar travaria)
async function cdLerDireto(id){
  if (cdMemo[id]) return cdMemo[id];  // a memória é mais nova que o banco
  const db = await cdBanco();
  if (db) {
    try { const r = await cdTx(db, 'readonly', function (s) { return s.get(id); }); return r || null; } catch (e) {}
  }
  return null;
}
async function cdLer(id){
  await cdFila;
  return cdLerDireto(id);
}
async function cdTodos(){
  await cdFila;
  const db = await cdBanco();
  let r = [];
  if (db) {
    try {
      r = await new Promise(function (res, rej) {
        const out = [], rq = db.transaction(CD_LOJA, 'readonly').objectStore(CD_LOJA).openCursor();
        rq.onsuccess = function () { const c = rq.result; if (c) { const v = c.value; out.push({ id: v.id, titulo: v.titulo, quando: v.quando, tracos: v.tracos, texto: v.texto, fotos: { length: v.fotos ? v.fotos.length : 0 } }); c.continue(); } else res(out); };
        rq.onerror = function () { rej(rq.error); };
      });
    } catch (e) { r = []; }
  }
  Object.keys(cdMemo).forEach(function (k) { r = r.filter(function (i) { return i.id !== k; }); r.push(cdMemo[k]); });
  return r.filter(cdTem).sort(function (a, b) { return (b.quando || 0) - (a.quando || 0); });
}
// pontos só com conteúdo mínimo: 15 letras, um desenho com alguma extensão ou uma foto
function cdSubstancial(it){
  if (!it) return false;
  const t = String(it.texto || '').trim().length >= 15;
  const n = (it.tracos || []).reduce(function (s, x) { return s + x.pts.length / 2; }, 0) >= 25;
  return t || n || !!(it.fotos && it.fotos.length);
}
function cdMemAtual(id, tem, persiste, subst){
  mem.cad = mem.cad || {};
  mem.cadP = mem.cadP || {};
  if (persiste) {
    if (tem) mem.cad[id] = 1; else delete mem.cad[id];
    mem.cadN = Object.keys(mem.cad).length;
    salvar();
  }
  if (tem && subst && !mem.cadP[id] && !cdPontuou[id]) { mem.cadP[id] = 1; cdPontuou[id] = 1; ganha(5, 'resolução registrada', 'cad:' + id); }
}
async function cdGrava(it){
  const tem = cdTem(it), db = await cdBanco();
  let persiste = false;
  if (db) {
    try {
      if (tem) await cdTx(db, 'readwrite', function (s) { return s.put(it); });
      else await cdTx(db, 'readwrite', function (s) { return s.delete(it.id); });
      persiste = true;
      delete cdMemo[it.id];
    } catch (e) { cdErroGravacao(e); }
  }
  if (!persiste) { if (tem) cdMemo[it.id] = it; else delete cdMemo[it.id]; }
  cdMemAtual(it.id, tem, persiste, cdSubstancial(it));
}
async function cdRemove(id){
  const db = await cdBanco();
  if (db) { try { await cdTx(db, 'readwrite', function (s) { return s.delete(id); }); } catch (e) { cdErroGravacao(e); } }
  delete cdMemo[id];
  mem.cad = mem.cad || {};
  delete mem.cad[id];
  mem.cadN = Object.keys(mem.cad).length;
  salvar();
}

const cdCadernoLivro = TELAS.caderno;  // a tela "Caderno de exercícios" do livro usa o mesmo nome; ela recebe o número do volume

// ---------- cores e desenho ----------
function cdCor(nome){
  let v = '';
  try { v = getComputedStyle(document.documentElement).getPropertyValue(nome === 'dest' ? '--laranja' : '--tinta'); } catch (e) {}
  v = (v || '').trim();
  return v || (nome === 'dest' ? '#e8730c' : '#111111');
}
function cdTraco(c, t, W, cores, k){
  const p = t.pts, lw = Math.max(1, t.esp * (k || 1));
  c.strokeStyle = c.fillStyle = cores[t.cor] || cores.tinta;
  c.lineWidth = lw;
  if (p.length < 4) { c.beginPath(); c.arc(p[0] * W, p[1] * W, lw / 2, 0, 6.2832); c.fill(); return; }
  c.beginPath();
  c.moveTo(p[0] * W, p[1] * W);
  for (let i = 2; i < p.length - 2; i += 2) c.quadraticCurveTo(p[i] * W, p[i + 1] * W, (p[i] + p[i + 2]) / 2 * W, (p[i + 1] + p[i + 3]) / 2 * W);
  c.lineTo(p[p.length - 2] * W, p[p.length - 1] * W);
  c.stroke();
}
function cdDesenha(){
  const e = cdE;
  if (!e || !e.cv || !e.W) return;
  const c = e.ctx;
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, e.cv.width, e.cv.height); c.restore();
  c.lineCap = 'round'; c.lineJoin = 'round';
  const cores = { tinta: cdCor('tinta'), dest: cdCor('dest') };
  e.tracos.forEach(function (t) { cdTraco(c, t, e.W, cores, 1); });
}
function cdAjusta(forca){
  const e = cdE;
  if (!e || !e.cv) return;
  const W = Math.floor(e.quadro.clientWidth);
  if (!W) return;  // aba escondida
  let need = 0;
  e.tracos.forEach(function (t) { for (let i = 1; i < t.pts.length; i += 2) need = Math.max(need, t.pts[i] * W + t.esp); });
  const H = Math.min(CD_ALT_MAX, Math.max(e.alt, Math.ceil(need) + 20));
  if (!forca && W === e.W && H === e.H) return;
  e.W = W; e.H = H; if (H > e.alt) e.alt = H;
  let dpr = Math.min(window.devicePixelRatio || 1, 3);
  while (W * H * dpr * dpr > 14e6 && dpr > 1) dpr -= 0.5;
  e.cv.width = Math.round(W * dpr);
  e.cv.height = Math.round(H * dpr);
  e.cv.style.width = '100%';
  e.cv.style.height = H + 'px';
  e.ctx.setTransform(e.cv.width / W, 0, 0, e.cv.height / H, 0, 0);
  cdDesenha();
}
function cdPonto(ev){
  const r = cdE.cv.getBoundingClientRect(), w = r.width || 1;
  const hMax = (cdE.H || r.height) / w;  // o traço não sai do quadro, mesmo com o dedo fora dele
  const nx = Math.max(0, Math.min(1, (ev.clientX - r.left) / w)), ny = Math.max(0, Math.min(hMax, (ev.clientY - r.top) / w));
  return [Math.round(nx * 10000) / 10000, Math.round(ny * 10000) / 10000];
}
function cdDistSeg(px, py, ax, ay, bx, by){
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  let u = l2 ? ((px - ax) * dx + (py - ay) * dy) / l2 : 0;
  u = Math.max(0, Math.min(1, u));
  const x = ax + u * dx - px, y = ay + u * dy - py;
  return Math.sqrt(x * x + y * y);
}
function cdApagaEm(p){
  const e = cdE, W = e.W, px = p[0] * W, py = p[1] * W;
  const antes = e.tracos.length;
  e.tracos = e.tracos.filter(function (t) {
    const q = t.pts, lim = 12 + t.esp / 2;
    if (q.length < 4) return Math.sqrt(Math.pow(q[0] * W - px, 2) + Math.pow(q[1] * W - py, 2)) > lim;
    for (let i = 0; i < q.length - 2; i += 2) if (cdDistSeg(px, py, q[i] * W, q[i + 1] * W, q[i + 2] * W, q[i + 3] * W) <= lim) return false;
    return true;
  });
  if (e.tracos.length !== antes) { e.mudou = true; cdDesenha(); cdBotoes(); }
}
function cdBaixo(ev){
  const e = cdE;
  if (!e || e.ferr === 'rolar') return;  // no modo "Rolar a página" o toque é do navegador
  if (e.ptr != null && ev.pointerId !== e.ptr && ev.isPrimary) { e.ptr = null; e.tr = null; }  // ponteiro anterior ficou preso
  if (e.ptr != null) return;
  if (ev.pointerType === 'mouse' && ev.button !== 0) return;
  ev.preventDefault();
  e.ptr = ev.pointerId; e.mudou = false;
  try { e.cv.setPointerCapture(ev.pointerId); } catch (x) {}
  const p = cdPonto(ev);
  if (e.ferr === 'borr') { cdApagaEm(p); return; }
  e.tr = { cor: e.ferr === 'dest' ? 'dest' : 'tinta', esp: e.ferr === 'dest' ? 6 : 3, pts: [p[0], p[1]] };
  e.tracos.push(e.tr);
  e.mudou = true;
  cdTraco(e.ctx, e.tr, e.W, { tinta: cdCor('tinta'), dest: cdCor('dest') }, 1);
}
function cdMove(ev){
  const e = cdE;
  if (!e || ev.pointerId !== e.ptr) return;
  ev.preventDefault();
  let lista = [ev];
  try { if (ev.getCoalescedEvents) { const l = ev.getCoalescedEvents(); if (l && l.length) lista = l; } } catch (x) {}
  lista.forEach(function (m) {
    const p = cdPonto(m);
    if (e.ferr === 'borr') { cdApagaEm(p); return; }
    const t = e.tr;
    if (!t) return;
    const n = t.pts.length, ux = t.pts[n - 2], uy = t.pts[n - 1];
    if (Math.abs(p[0] - ux) + Math.abs(p[1] - uy) < 0.002) return;
    t.pts.push(p[0], p[1]);
    const c = e.ctx;
    c.lineCap = 'round'; c.lineJoin = 'round';
    c.strokeStyle = cdCor(t.cor); c.lineWidth = t.esp;
    c.beginPath(); c.moveTo(ux * e.W, uy * e.W); c.lineTo(p[0] * e.W, p[1] * e.W); c.stroke();
  });

function cdSolta(ev){
  const e = cdE;
  if (!e || ev.pointerId !== e.ptr) return;
  try { e.cv.releasePointerCapture(ev.pointerId); } catch (x) {}
  e.ptr = null; e.tr = null;
  if (e.mudou) { e.mudou = false; cdDesenha(); cdBotoes(); cdAgenda(); }
}
function cdBotoes(){

}

// ---------- salvamento ----------
function cdEstado(){

function cdAgenda(){

function cdSnap(e){

function cdQuebra(x, txt, max){
  const palavras = String(txt).split(' '), out = [];
  let atual = '';

    let t = atual ? atual + ' ' + p : p;
    if (x.measureText(t).width <= max) { atual = t; return; }
    if (atual) { out.push(atual); atual = ''; }
    while (x.measureText(p).width > max && p.length > 1) {
      let n = p.length - 1;
      while (n > 1 && x.measureText(p.slice(0, n)).width > max) n--;
      out.push(p.slice(0, n)); p = p.slice(n);
    }
    atual = p;
  });
  if (atual || !out.length) out.push(atual);
  return out;
}
function cdPng(e){

  const tx = linhas.slice(0, 150);

  const nome = mem.nome ? 'Aluno: ' + mem.nome + (mem.turma ? ' · ' + mem.turma : '') : '';

// ===== módulo 30: modo sala (com PIN) =====
// Sem servidor: o PIN é a semente de um sorteio determinístico. Quem digita o mesmo PIN recebe as mesmas
// questões, na mesma ordem e com as alternativas na mesma ordem. Não há rede entre os aparelhos.
// PIN de 6 dígitos: [1-2] conteúdo (00 = misto, 01 a 13 = D.partes[k].n) · [3] quantidade (1 = 5, 2 = 10) · [4-6] semente.

let SL = null;                                   // desafio em andamento (professor ou aluno)
const SL_CFG = { cont: 0, qtd: 1, tempo: false };  // escolhas da tela de criação
let slTimer = 0;

function slPad(n, t){ return ('000000' + n).slice(-t); }
function slFmt(pin){ return pin.slice(0, 3) + ' ' + pin.slice(3); }

// PRNG determinístico (mulberry32)
function slPrng(semente){
  let a = semente >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Fisher-Yates com o PRNG dado; embaralha a lista no lugar
function slEmbaralha(lista, rnd){
  for (let i = lista.length - 1; i > 0; i--) {
    const j = Math.floor(rnd() * (i + 1)), t = lista[i]; lista[i] = lista[j]; lista[j] = t;
  }
  return lista;
}

// Valida o PIN e monta a lista de questões. Devolve { erro } ou { pin, lista, n, cont, qtd }.
// É a mesma função para o professor e para o aluno.
function slMonta(texto){
  const pin = String(texto || '').replace(/\D/g, '');
  if (pin.length !== 6) return { erro: 'O PIN tem 6 números, como 072 418. Confira o que está na projeção.' };
  const cont = +pin.slice(0, 2), qtd = +pin[2];
  let partes;
  if (cont === 0) partes = D.partes;
  else {
    partes = D.partes.filter(p => p.n === cont);
    if (!partes.length) return { erro: 'Este PIN não é de nenhum conteúdo desta revisão: os dois primeiros números vão de 00 (misto) a ' + slPad(D.partes.length, 2) + '. Confira com o professor.' };
  }
  if (qtd !== 1 && qtd !== 2) return { erro: 'O terceiro número do PIN tem de ser 1 (5 questões) ou 2 (10 questões). Confira com o professor.' };
  const pool = [];
  partes.forEach(p => p.q.forEach(q => pool.push(q)));
  if (!pool.length) return { erro: 'Não há questões neste conteúdo.' };
  const rnd = slPrng((Math.imul(parseInt(pin, 10), 2654435761) ^ 0x9E3779B9) >>> 0);
  slEmbaralha(pool, rnd);
  const lista = pool.slice(0, Math.min(qtd * 5, pool.length)).map(q => {
    const ord = q.alts.map((a, i) => i);
    if (!q.fixo) slEmbaralha(ord, rnd);
    return { q: q, ord: ord, certa: ord.indexOf(q.certa) };
  });
  const ver = hashCurto(lista.map(it => it.q.id + ':' + it.ord.join('')).join(','));  // impressão digital do sorteio: PIN igual com versão diferente = site desatualizado
  return { pin: pin, lista: lista, n: lista.length, cont: cont, qtd: qtd, ver: ver };
}

// ===== v06: conferir no site as respostas dos exercícios do livro (gabarito oficial) =====
// Dados: X.livros[vi].aulas[k].conf e X.livros[vi].cadConf = [{imp, rotulo, pergunta, tipo, aceitas, unidade, opcoes, certa, resolucao}]
// Estado: mem.lc[chave] = 1 acertou de primeira · 2 acertou depois · 3 viu a resolução · 4 "fiz parecido" · 5 "vou refazer"
function lcItens(vi, grupo){ const L = X.livros[vi]; return (grupo === 'cad' ? L.cadConf : (L.aulas[+grupo.slice(1) - 1] || {}).conf) || []; }
function lcChave(vi, grupo, i){ return vi + ':' + grupo + ':' + i; }
function lcNorm(s, un){
  let t = String(s).toLowerCase().replace(/\s+/g, '').replace(/r\$/g, '').replace(/−/g, '-').replace(/^\+/, '');
  const u = String(un || '').toLowerCase().replace(/\s+/g, '').replace(/r\$/g, '');
  if (u && t.length > u.length && t.slice(-u.length) === u) t = t.slice(0, -u.length);
  t = t.replace(/[°%]$/, '');
  if (/^-?[1-9]\d{0,2}(\.\d{3})+(,\d+)?$/.test(t)) t = t.replace(/\./g, '');  // 1.512 é mil quinhentos e doze: tira o ponto de milhar
  t = t.replace(/\./g, ',');  // o ponto que sobrou é decimal
  return t.replace(/,0+$/, '').replace(/(,\d*?[1-9])0+$/, '$1');
}
function lcResumo(vi, grupo){
  const it = lcItens(vi, grupo);
  if (!it.length) return '';
  const feitos = it.filter((x, i) => mem.lc && mem.lc[lcChave(vi, grupo, i)]).length;
  return feitos + ' de ' + it.length + (it.length === 1 ? ' resposta conferida' : ' respostas conferidas');
}
function lcItemHtml(vi, grupo, i){
  const x = lcItens(vi, grupo)[i], k = lcChave(vi, grupo, i), est = (mem.lc && mem.lc[k]) || 0, t = LC_TENT[k] || 0;
  let h = '<p class="confr"><b>' + esc(x.rotulo) + '.</b> ' + esc(x.pergunta) + '</p>';
  const resol = '<div class="fb ok"><p><b>Resolução do livro.</b> ' + esc(x.resolucao) + '</p></div>';
  if (est === 1 || est === 2) return h + '<p class="confok">✔ Você acertou' + (est === 1 ? ' de primeira' : ' na nova tentativa') + '.</p>' + resol;
  if (est === 3) return h + '<p class="sub">Você viu a resolução. Refaça no caderno sem olhar e compare.</p>' + resol;
  if (est === 4 || est === 5) return h + '<p class="confok">' + (est === 4 ? '✔ Você marcou: fiz parecido.' : 'Você marcou: vou refazer.') + '</p>' + resol;
  if (x.tipo === 'escolha') {
    h += '<div class="confop">' + x.opcoes.map((o, j) => '<button data-acao="lcop" data-k="' + k + '" data-j="' + j + '"' + (LC_ERR[k] && LC_ERR[k][j] ? ' disabled class="errada"' : '') + '><b>' + 'abcdefgh'[j] + ')</b> <span>' + esc(o) + (LC_ERR[k] && LC_ERR[k][j] ? ' <small>✘ não é esta</small>' : '') + '</span></button>').join('') + '</div>';
  } else if (x.tipo === 'numero') {
    h += '<div class="confn"><label class="so-leitor" for="in' + k + '">Sua resposta</label><input id="in' + k + '" data-k="' + k + '" class="lcin" autocomplete="off" autocapitalize="off" placeholder="Sua resposta">' +
      (x.unidade ? '<span class="confu">' + esc0(x.unidade) + '</span>' : '') + '<button data-acao="lcver" data-k="' + k + '">Conferir</button></div>';
  } else {
    h += '<p class="sub">Resolva no caderno e depois compare com a resposta do livro.</p><div class="linha" style="margin-top:6px"><button data-acao="lcabre" data-k="' + k + '">Ver a resposta do livro</button></div>';
  }
  if (t > 0 && x.tipo !== 'aberta') h += '<p class="conferr" role="status">✘ Ainda não. Refaça a conta no caderno e tente de novo.' + (t >= 2 ? '' : '') + '</p>' +
    (t >= 2 ? '<div class="linha" style="margin-top:6px"><button class="leve" data-acao="lcresol" data-k="' + k + '">Ver a resolução do livro</button></div>' : '');
  if (LC_ABERTA[k]) h += resol + '<div class="linha" style="margin-top:6px"><button class="forte" data-acao="lcauto" data-k="' + k + '" data-s="4">Fiz parecido</button><button data-acao="lcauto" data-k="' + k + '" data-s="5">Vou refazer</button></div>';
  return h;
}
const LC_TENT = {}, LC_ERR = {}, LC_ABERTA = {};
function confPagina(vi, grupo, imp){  // bloco que vai logo abaixo da imagem da página
  const it = lcItens(vi, grupo), idx = [];
  it.forEach((x, i) => { if (x.imp === imp) idx.push(i); });
  if (!idx.length) return '';
  const feitos = idx.filter(i => mem.lc && mem.lc[lcChave(vi, grupo, i)]).length;
  return '<details class="conf"' + (feitos && feitos < idx.length ? ' open' : '') + '><summary>Conferir minhas respostas desta página <small>' + feitos + ' de ' + idx.length + '</small></summary>' +
    '<p class="sub">Resolva primeiro no caderno. Aqui você confere com o gabarito do livro.</p>' +
    idx.map(i => '<div class="confi" id="cf' + lcChave(vi, grupo, i) + '" aria-live="polite">' + lcItemHtml(vi, grupo, i) + '</div>').join('') + '</details>';
}
function lcPinta(k){
  const p = k.split(':'), e = document.getElementById('cf' + k);
  if (e) e.innerHTML = lcItemHtml(+p[0], p[1], +p[2]);
  const d = e && e.closest('details'), s = d && d.querySelector('summary small');
  if (s) { const todos = d.querySelectorAll('.confi'), n = [].filter.call(todos, x => mem.lc && mem.lc[x.id.slice(2)]).length; s.textContent = n + ' de ' + todos.length; }
}
function lcGrava(k, est, pts, motivo){
  mem.lc = mem.lc || {}; mem.lc[k] = est; salvar();
  if (pts) ganha(pts, motivo, 'lc:' + k);
  lcPinta(k);
}
function lcConfere(k, valor, j){
  const p = k.split(':'), x = lcItens(+p[0], p[1])[+p[2]];
  if (!x) return;
  let ok;
  if (x.tipo === 'escolha') ok = j === x.certa;
  else { const v = lcNorm(valor, x.unidade); if (!v) return; ok = x.aceitas.some(a => lcNorm(a, x.unidade) === v); }
  if (ok) { lcGrava(k, LC_TENT[k] ? 2 : 1, LC_TENT[k] ? 3 : 5, 'resposta do livro conferida'); return; }
  LC_TENT[k] = (LC_TENT[k] || 0) + 1;
  if (x.tipo === 'escolha') { (LC_ERR[k] = LC_ERR[k] || {})[j] = 1; }
  lcPinta(k);
}
app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acao]');
  if (!b) return;
  const a = b.dataset.acao, k = b.dataset.k;
  if (a === 'lcver') { const i = document.getElementById('in' + k); if (i) lcConfere(k, i.value); }
  else if (a === 'lcop') lcConfere(k, null, +b.dataset.j);
  else if (a === 'lcresol') lcGrava(k, 3, 0);
  else if (a === 'lcabre') { LC_ABERTA[k] = 1; lcPinta(k); }
  else if (a === 'lcauto') { const s = +b.dataset.s; delete LC_ABERTA[k]; lcGrava(k, s, s === 4 ? 3 : 0, 'comparou com o livro'); }
});
app.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && ev.target.classList && ev.target.classList.contains('lcin')) { ev.preventDefault(); lcConfere(ev.target.dataset.k, ev.target.value); }
});

inicio();
</script>
