<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revisão SARESP · Matemática 7º ano</title>
<style>
:root{--azul:#14284b;--azul2:#24457c;--laranja:#e8791d;--laranja2:#b8510a;--fundo:#f4f6fa;--papel:#fff;--tinta:#1b2433;--cinza:#5b6678;--linha:#d5dbe6;--ok:#1d7a46;--okf:#e3f4ea;--erro:#b3261e;--errof:#fbe9e7}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--azul);color:#fff;padding:16px;border-bottom:5px solid var(--laranja)}
header .in,main{max-width:860px;margin:0 auto}
header h1{margin:0;font-size:1.35rem;line-height:1.25}
header p{margin:4px 0 0;opacity:.85;font-size:.95rem}
main{padding:16px 16px 60px}
h2{color:var(--azul);font-size:1.3rem;margin:22px 0 10px;line-height:1.25}
h3{color:var(--azul2);font-size:1.08rem;margin:0 0 8px}
.caixa{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:16px;margin:14px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--azul);background:var(--papel);color:var(--azul);padding:10px 16px;font-weight:600}
button.forte{background:var(--laranja2);border-color:var(--laranja2);color:#fff;font-size:1.1rem;padding:12px 22px}
button.leve{border-color:var(--linha);color:var(--cinza);font-weight:500}
button:focus-visible{outline:3px solid var(--laranja);outline-offset:2px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cartao{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;text-align:left;border:1px solid var(--linha);padding:14px;align-items:center}
.cartao .num{grid-row:span 2;width:44px;height:44px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:1.15rem}
.cartao .tit{font-weight:700;line-height:1.25}
.cartao .res{font-weight:400;font-size:.88rem;color:var(--cinza)}
.cartao.feito .num{background:var(--ok)}
.cartao.sim{border:2px solid var(--laranja)}
.cartao.sim .num{background:var(--laranja2)}
.tempo{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:.98rem}
.tempo input{width:22px;height:22px}
ul.ideias{margin:0;padding-left:22px}
ul.ideias li{margin:6px 0}
.tag{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--azul2);background:#e6ecf7;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.perg{white-space:pre-line;font-size:1.2rem;font-weight:600;margin:4px 0 12px;line-height:1.35}
ol.alts{list-style:upper-alpha;margin:0 0 10px;padding-left:28px;color:var(--cinza)}
ol.alts li.certa{color:var(--ok);font-weight:700}
ol.passos{margin:10px 0;padding-left:26px}
ol.passos li{margin:6px 0;background:#fff7ef;border-left:4px solid var(--laranja);padding:6px 10px;border-radius:0 8px 8px 0}
.resp{font-weight:700;color:var(--ok);margin:8px 0 0}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem;color:var(--cinza)}
.relogio{font-weight:800;font-size:1.5rem;color:var(--azul);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.relogio.fim{color:var(--erro)}
.barra{height:12px;background:var(--linha);border-radius:6px;overflow:hidden;margin:8px 0 16px}
.barra i{display:block;height:100%;width:100%;background:var(--azul2)}
.barra i.fim{background:var(--erro)}
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opcoes{grid-template-columns:1fr}body{font-size:17px}}
.opcoes button{text-align:left;min-height:58px;font-weight:600;color:var(--tinta);border-color:var(--linha);display:flex;gap:10px;align-items:center}
.opcoes button b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:.9rem}
.opcoes button:disabled{cursor:default;opacity:.75}
.opcoes button.certa{background:var(--okf);border-color:var(--ok);opacity:1}
.opcoes button.errada{background:var(--errof);border-color:var(--erro);opacity:1}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px}
.fb.ok{background:var(--okf);border:1px solid var(--ok)}
.fb.no{background:var(--errof);border:1px solid var(--erro)}
.fb p{margin:4px 0}
.linha{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.placar{font-size:2.4rem;font-weight:800;color:var(--azul);margin:0}
.erros li{margin:10px 0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.12;font-size:.92em}
.fr span{padding:0 .28em}
.fr span:first-child{border-bottom:2px solid currentColor}
.tabs{margin:10px 0 2px}
.tab{display:grid;grid-template-columns:8.6em 1fr;gap:6px 8px;align-items:start;margin:10px 0}
.nums{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:560px){.tab{grid-template-columns:1fr}}
.tab .rot{font-weight:700;color:var(--azul);padding-top:3px}
.nums span{min-width:2.5em;text-align:center;padding:3px 6px;border:1px solid var(--linha);border-radius:6px;background:#fff;font-variant-numeric:tabular-nums}
.nums span.com{background:#ffe9d3;border-color:var(--laranja)}
.nums span.mmc{background:var(--laranja2);border-color:var(--laranja2);color:#fff;font-weight:800}
.leg{margin:8px 0 0;font-size:.97rem}
button,a.bt,.pg img{touch-action:manipulation}
h2:focus{outline:none}
select{min-height:44px;font:inherit;padding:6px 10px;border-radius:8px;border:2px solid var(--azul);background:#fff;margin-left:6px}
.sub{margin:0 0 8px;color:var(--cinza)}
.nota{background:#fff8e6;border:1px solid #f0d48a;border-left:6px solid var(--laranja);border-radius:10px;padding:12px 14px;margin:14px 0}
.nota p{margin:4px 0}
.lista{display:grid;gap:8px;margin:10px 0}
.lista button{text-align:left;font-weight:500;border-color:var(--linha);color:var(--tinta)}
.lista button.dest{border-color:var(--laranja);font-weight:700;color:var(--azul)}
button.ativo{background:var(--azul);color:#fff}
.pg{overflow:auto;margin:6px 0 18px;border:1px solid var(--linha);border-radius:8px;background:#fff}
.pg img{display:block;width:100%;height:auto;cursor:zoom-in}
.pg.livro img{aspect-ratio:567/737}
.pg.slide img{aspect-ratio:16/9}
.pg img.zoom{width:230%;max-width:none;cursor:zoom-out}
.pgn{margin:14px 0 4px;font-weight:700;color:var(--azul2);font-size:.95rem}
.falta{padding:14px;color:var(--cinza);margin:0}
.selo{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;background:var(--laranja2);color:#fff;border-radius:6px;padding:1px 7px;vertical-align:middle}
.khl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.khl p{margin:4px 0}
.qr{width:150px;height:150px;flex:none}
.qr.g{width:220px;height:220px}
a.bt{display:inline-block;background:var(--laranja2);color:#fff;font-weight:700;text-decoration:none;border-radius:10px;padding:10px 18px;margin:4px 0}
a.bt:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.link{font-size:.8rem;color:var(--cinza);word-break:break-all}
.grade2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.grade2 .caixa{margin:0}
.tec{margin:0}
.tec dt{font-weight:700;color:var(--azul);margin-top:10px}
.tec dd{margin:2px 0 0}
details.cofre{margin:28px 0 0;border:1px dashed var(--linha);border-radius:10px;padding:10px 14px;font-size:.93rem;color:var(--cinza)}
details.cofre summary{cursor:pointer}
details.cofre[open]{color:var(--tinta);background:var(--papel)}
.bloco{border-radius:12px;padding:12px;margin:14px 0;border:1px solid var(--linha);background:var(--papel);border-top:6px solid var(--azul)}
.bloco.b1{border-top-color:var(--laranja)}
.bloco.b2{border-top-color:var(--ok)}
.bloco.b3{border-top-color:#7a3fa0}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px}
.tema{text-align:left;font-weight:400;border-color:var(--linha);color:var(--tinta)}
.tema b{color:var(--azul)}
.tema ul{margin:6px 0 0;padding-left:18px;font-size:.93rem}
footer{text-align:center;color:var(--cinza);font-size:.85rem;padding:0 16px 24px}
</style>
</head>

o": 60, "just": "Sinais iguais na multiplicação dão resultado positivo: 21."}, {"texto": "Quanto é −24 ÷ 6?", "alts": ["−4", "−18", "−30", "4"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "Sinais diferentes na divisão dão resultado negativo: −4."}, {"texto": "A temperatura era −3 °C às 6h e chegou a 9 °C às 12h. Qual foi a variação?", "alts": ["+3 °C", "+12 °C", "−12 °C", "+6 °C"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "Variação = final − inicial = 9 − (−3) = 12 °C."}, {"texto": "Uma conta estava com saldo de −R$ 50 e recebeu R$ 80. Qual é o novo saldo?", "alts": ["+R$ 130", "−R$ 30", "+R$ 30", "−R$ 130"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "−50 + 80 = 30: sinais diferentes, subtrai os módulos e fica o sinal do maior."}, {"texto": "Quanto é −8 + 3 × (−2)?", "alts": ["10", "−2", "−14", "14"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "Primeiro a multiplicação: 3 × (−2) = −6. Depois −8 + (−6) = −14.", "passos": ["A multiplicação vem antes da soma.", "3 × (−2) = −6 (sinais diferentes: resultado negativo).", "Agora −8 + (−6): sinais iguais, some e conserve o sinal: −14."]}], "mmcTool": null, "dica": ["Desenhe uma reta numérica no rascunho e ande nela com o dedo: somar um número positivo anda para a direita; somar um negativo anda para a esquerda.", "Em conta com sinais, decida o sinal do resultado antes de fazer a conta. A maioria dos erros é de sinal, não de conta."], "mapas": [8], "kahoot": {"pin": "07659040", "url": "https://kahoot.it/challenge/07659040", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m1%200h1m3%200h5m1%200h1m3%200h7m-29%201h1m5%200h1m1%200h1m2%200h4m4%200h2m1%200h1m5%200h1m-29%201h1m1%200h3m1%200h1m1%200h2m1%200h3m1%200h2m1%200h3m1%200h1m1%200h3m1%200h1m-29%201h m3%200h2m-26%201h7m1%200h2m2%200h2m1%200h2m2%200h2m1%200h1m1%200h2m-26%201h1m5%200h1m1%200h3m2%200h1m1%200h1m1%200h1m2%200h1m3%200h1m3%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m2%200h1m1%200h1m1%200h1m2%200h8m2%200h1m-29%201h1m1%200h3m1%200h1m1%200h3m1%200h1m1%200h2m3%200h3m6%200h1m-29%201h1m1%200h3m1%200h1m4%200h6m1%200h1m2%200h1m1%200h2m1%200h3m-29%201h1m5%200h1m3%200h1m2%200h2m1%200h1m1%200h2m3%200h1m1%200h2m1%200h1m-29%201h7m1%200h1m2%200h2m1%200h1m1%200h1m1%200h3m2%200h1%27%2F%3E%3C%2Fsvg%3E"}}, {"n": 13, "titulo": "Interpretar e montar equações", "resumo": "o vocabulário de equações e sequências, traduzir o enunciado em equação e ler o que cada número significa", "ideias": ["Antes de montar, diga quem é a letra: ela é o que a pergunta quer descobrir.", "Traduza por partes: \"o dobro\" é 2x, \"a metade\" é x/2, \"8 a mais\" é x + 8. \"Ao todo\" e \"o resultado foi\" mostram o total, que fica do outro lado do sinal de igual.", "O valor que se repete (por km, por hora, por unidade) é multiplicado pela quantidade. O valor fixo entra uma vez só, somando.", "A ordem importa: \"multiplicou por 3 e depois somou 7\" é 3x + 7. \"Somou 7 e depois multiplicou por 3\" é 3 · (x + 7).", "Depois de montar, teste: troque a letra por um número e veja se a história continua fazendo sentido."], "q": [{"texto": "Leia a equação  3x + 5 = 20.  Nessa equação, a letra x representa", "alts": ["um número desconhecido, que queremos descobrir: a incógnita.", "o sinal de multiplicação entre o 3 e o 5.", "o resultado da equação, que é 20.", "qualquer número, pois a igualdade vale para todos os valores de x."], "certa": 0, "nivel": "Vocabulário", "tempo": 60, "just": "B confunde a letra com a operação (3x é 3 vezes x, mas x não é o sinal). C confunde a incógnita com o resultado. D descreve uma variável: numa equação a letra vale um número só (aqui, x = 5).", "fixo": true}, {"texto": "Qual das alternativas abaixo é uma EQUAÇÃO?", "alts": ["4n + 7", "5 + 8 = 13", "2x − 3 = 11", "3a + 2b"], "certa": 2, "nivel": "Vocabulário", "tempo": 60, "just": "A e D são expressões algébricas: têm letra, mas não têm sinal de igual. B é uma igualdade só com números, sem valor desconhecido. Equação = igualdade + incógnita.", "fixo": true}, {"texto": "Dizer que 8 é a SOLUÇÃO da equação  3x − 4 = 20  significa que", "alts": ["o número 8 aparece escrito na equação.", "20 − 8 = 12.", "8 é o maior número que pode ocupar o lugar de x.", "trocando x por 8, os dois lados ficam iguais: 3 · 8 − 4 = 20."], "certa": 3, "nivel": "Vocabulário", "tempo": 60, "just": "Solução é o valor que torna a igualdade verdadeira: 3 · 8 − 4 = 24 − 4 = 20. A confunde aparecer com resolver; B é uma conta solta com os números do enunciado; C inventa a ideia de \"maior valor\".", "fixo": true}, {"texto": "Joana pensou em um número, multiplicou esse número por 3 e depois somou 7. O resultado foi 40. Chamando de x o número pensado, qual equação representa essa situação?", "alts": ["3 + x + 7 = 40", "3x + 7 = 40", "3 · (x + 7) = 40", "7x + 3 = 40"], "certa": 1, "nivel": "Formular", "tempo": 90, "just": "A somou 3 em vez de multiplicar. C inverteu a ordem (seria \"somou 7 e depois multiplicou por 3\"). D trocou os papéis do 3 e do 7. Se quiser conferir: x = 11, pois 3 · 11 + 7 = 40.", "fixo": true, "passos": ["Chame o número pensado de x.", "Multiplicou por 3: 3x. Depois somou 7: 3x + 7.", "O resultado foi 40: 3x + 7 = 40. Cuidado: 3 · (x + 7) seria somar 7 primeiro e multiplicar depois."]}, {"texto": "Para levar a turma a um passeio, uma van cobra R$ 15,00 fixos mais R$ 4,00 por quilômetro rodado. O passeio custou R$ 63,00. Sendo k o número de quilômetros rodados, qual equação representa a situação?", "alts": ["15k + 4 = 63", "19k = 63", "4k + 15 = 63", "4 + 15 + k = 63"], "certa": 2, "nivel": "Formular", "tempo": 90, "just": "O valor que se repete (R$ 4 por km) multiplica a letra; o fixo entra uma vez só. A inverteu os papéis; B juntou o fixo com o variável (15 + 4 = 19), erro clássico; D não multiplicou. Conferindo: k = 12 km, pois 4 · 12 + 15 = 63.", "fixo": true}, {"texto": "Uma horta tem a forma de um retângulo com 5 m de largura e 60 m² de área. Chamando de c o comprimento da horta, em metros, qual equação permite descobrir c?", "alts": ["5 · c = 60", "5 + c = 60", "2 · 5 + 2 · c = 60", "c = 60 + 5"], "certa": 0, "nivel": "Formular", "tempo": 90, "just": "Área do retângulo = comprimento × largura. B somou as medidas; C montou o PERÍMETRO (a volta), não a área; D somou a largura à área. Conferindo: c = 12 m.", "fixo": true}, {"texto": "Ana e Bia têm, juntas, 50 figurinhas. Bia tem 8 figurinhas a mais que Ana. Se Ana tem x figurinhas, qual equação representa a situação?", "alts": ["x + 8 = 50", "2x = 50 + 8", "x + 8x = 50", "x + (x + 8) = 50"], "certa": 3, "nivel": "Formular", "tempo": 90, "just": "Ana tem x e Bia tem x + 8; juntas: x + (x + 8) = 50. A esqueceu as figurinhas da Ana; B somou 8 em vez de tirar (o certo seria 2x = 50 − 8); C transformou \"8 a mais\" em \"8 vezes\". Conferindo: Ana 21, Bia 29.", "fixo": true, "passos": ["Ana tem x figurinhas.", "Bia tem 8 a mais que Ana: x + 8.", "Juntas têm 50: x + (x + 8) = 50. Conferindo: Ana tem 21 e Bia tem 29."]}, {"texto": "Uma loja aluga bicicletas e calcula o valor a pagar pela fórmula  V = 5 + 2h,  em que V é o valor em reais e h é o número de horas de uso. Nessa fórmula, o número 2 representa", "alts": ["o valor fixo, pago uma única vez.", "o valor cobrado por cada hora de uso.", "o número de horas de uso.", "o valor total do aluguel."], "certa": 1, "nivel": "Interpretar", "tempo": 90, "just": "O número que multiplica a letra é o que se paga a cada hora. A: o fixo é o 5. C: as horas são o h. D: o total é o V.", "fixo": true}, {"texto": "Qual das situações abaixo pode ser representada pela equação  2x + 10 = 50?", "alts": ["Comprei 10 cadernos de x reais cada um e gastei R$ 50,00.", "Eu tinha x reais, ganhei R$ 10,00 e fiquei com R$ 50,00.", "Comprei 2 cadernos de x reais cada um e um estojo de R$ 10,00, e gastei R$ 50,00 ao todo.", "Gastei metade dos meus x reais, ganhei R$ 10,00 e fiquei com R$ 50,00."], "certa": 2, "nivel": "Interpretar", "tempo": 90, "just": "A é 10x = 50. B é x + 10 = 50. D é x/2 + 10 = 50. Só a C tem \"2 vezes x\" mais um valor fixo de 10.", "fixo": true, "passos": ["Leia a equação em partes: 2x é \"2 vezes um valor x\"; + 10 é um valor que entra uma vez só; = 50 é o total.", "Procure a situação com 2 coisas de x reais, mais R$ 10,00, dando R$ 50,00.", "É a dos 2 cadernos e do estojo. As outras seriam 10x = 50, x + 10 = 50 e x/2 + 10 = 50."]}, {"texto": "Para resolver a equação  5x − 3 = 22,  Pedro somou 3 aos dois membros (aos dois lados do sinal de igual). Qual equação ele obteve?", "alts": ["5x = 25", "5x = 19", "5x − 6 = 22", "2x = 22"], "certa": 0, "nivel": "Interpretar", "tempo": 90, "just": "5x − 3 + 3 = 22 + 3, logo 5x = 25 (e x = 5). B é o erro de \"passar para o outro lado\" sem trocar a operação; C mexeu só no primeiro membro, e subtraindo; D misturou o 5 com o 3 (5 − 3).", "fixo": true}, {"texto": "Observe a sequência numérica:  7, 11, 15, 19, 23, …  Qual afirmação está correta?", "alts": ["O 3º termo é 19 e a regra de formação é \"somar 4 ao termo anterior\".", "O 3º termo é 15 e a regra de formação é \"somar 4 ao termo anterior\".", "O número 15 ocupa a 15ª posição da sequência.", "A regra de formação é \"multiplicar o termo anterior por 4\"."], "certa": 1, "nivel": "Vocabulário", "tempo": 60, "just": "Posição diz ONDE o termo está; o termo é o número. A: 19 é o 4º termo. C confunde o valor do termo com a posição (15 está na 3ª). D não confere: 7 × 4 = 28, não 11.", "fixo": true}, {"texto": "Uma sequência pode ser RECURSIVA ou NÃO RECURSIVA. Qual das regras abaixo descreve uma sequência RECURSIVA?", "alts": ["O termo é o triplo da posição:  aₙ = 3n.", "O termo é a posição mais 10:  aₙ = n + 10.", "O termo é o dobro da posição menos 1:  aₙ = 2n − 1.", "O 1º termo é 2, e cada termo seguinte é o anterior mais 5."], "certa": 3, "nivel": "Vocabulário", "tempo": 60, "just": "Recursiva: para achar um termo, preciso do termo ANTERIOR (2, 7, 12, 17…). A, B e C calculam direto pela posição n, sem olhar o anterior: são não recursivas.", "fixo": true}, {"texto": "Com palitos de sorvete, Lucas monta quadrados lado a lado. Com 1 quadrado ele usa 4 palitos; com 2 quadrados, 7 palitos; com 3 quadrados, 10 palitos. Qual expressão dá o número de palitos necessários para montar n quadrados?", "alts": ["3n + 1", "4n", "n + 3", "4n + 3"], "certa": 0, "nivel": "Interpretar", "tempo": 90, "just": "3n + 1 dá 4, 7 e 10. B (4n) e C (n + 3) acertam só a figura 1 — quem testou só no primeiro termo cai aqui (4n dá 8 na figura 2; n + 3 dá 5). D não serve nem na figura 1 (dá 7). Cada quadrado novo acrescenta 3 palitos.", "fixo": true}, {"texto": "A sequência abaixo cresce sempre do mesmo jeito. Qual número completa o espaço?\n12,  19,  26,  ____,  40,  47", "alts": ["32", "33", "34", "36"], "certa": 1, "nivel": "Resolver", "tempo": 90, "just": "19 − 12 = 7, então a regra é somar 7: 26 + 7 = 33, e confere com 33 + 7 = 40. A, C e D usam acréscimos errados (+6, +8, +10); conferir com o 40 elimina todas.", "fixo": true}, {"texto": "Na fileira 1 de um auditório há 20 cadeiras. Cada fileira tem 3 cadeiras a mais do que a fileira anterior. Quantas cadeiras há na fileira 5?", "alts": ["26", "29", "32", "35"], "certa": 2, "nivel": "Resolver", "tempo": 90, "just": "20, 23, 26, 29, 32 → fileira 5 = 32 (20 + 4 · 3). A é a fileira 3; B é a fileira 4 (contou uma a menos); D = 20 + 5 · 3 somou o acréscimo 5 vezes — da fileira 1 à 5 são só 4 saltos.", "fixo": true}], "dica": ["Leia o problema duas vezes: na primeira, entenda a história; na segunda, sublinhe os números e a pergunta.", "Escolheu a equação? Leia-a como uma frase. Ela tem de contar a mesma história do enunciado."], "mapas": [1], "livro": [0, 26, 30]}], "extra": {"livros": [{"vol": 3, "bim": "3º bimestre", "aulas": [{"n": 1, "titulo": "A linguagem algébrica e a área de triângul EF | 17 / 17 | Agora o mapa é seu!"}], "tecnicas": [{"t": "Plano de estudo até a prova", "itens": [["Pouco e todo dia", "De 20 a 30 minutos por dia costumam render mais que três horas na véspera. O cérebro guarda melhor o que encontra várias vezes."], ["Uma aula por dia", "Abra uma aula deste material, leia as ideias-chave, veja os exemplos passo a passo e faça os exercícios com tempo."], ["Comece pelo que mais pesa", "Números com sinal, equações, frações, proporção e decimais sustentam quase todo o resto. Garanta essas aulas primeiro e depois vá para as outras."], ["Feche com o simulado", "Quando terminar as aulas, faça o simulado de 20 questões. Ele mistura os assuntos, como a prova."]]}, {"t": "Como estudar de verdade", "itens": [["Teste a si mesmo", "Feche o caderno e tente lembrar ou resolver sem olhar. Reler dá a sensação de que você sabe; testar mostra se você sabe."], ["Espalhe as revisões", "Reveja o mesmo assunto no dia seguinte, três dias depois e uma semana depois. Esquecer um pouco e lembrar de novo é o que fixa."], ["Misture os assuntos", "Na prova as questões vêm misturadas. Treine assim também: um pouco de fração, um pouco de equação, um pouco de ângulo."], ["Ensine alguém", "Explique a matéria para um colega, para alguém de casa ou em voz alta. O ponto em que você travar é o que falta estudar."], ["Do exemplo para o sozinho", "Veja um exemplo resolvido, cubra a solução e refaça. Depois faça um exercício parecido sem ajuda."], ["Caderno de erros", "Copie a questão que errou, escreva onde foi o erro e refaça dias depois. Seus erros mostram exatamente o que estudar."], ["Celular longe", "Deixe o celular em outro cômodo durante os 20 minutos. Se estiver estudando nele, silencie as notificações."]]}, {"t": "Como memorizar", "itens": [["Cartões de memória", "Pergunta de um lado, resposta do outro. Separe os que você errou e repita esses mais vezes."], ["Escreva à mão", "Fazer a conta no papel fixa mais do que só olhar a conta pronta na tela."], ["Crie frases e imagens", "\"Na multiplicação e na divisão: sinais iguais, resultado positivo.\" \"Dividir fração: copia a primeira, inverte a segunda e multiplica.\" Invente as suas: quanto mais engraçada, mais gruda."], ["Faça o seu mapa mental", "Depois de estudar um tema, feche tudo e desenhe o mapa de memória. Compare com o mapa do material e complete com outra cor."], ["Durma", "É dormindo que o cérebro guarda o que você estudou. Virar a noite antes da prova atrapalha."]]}, {"t": "Na hora da prova", "itens": [["Leia a pergunta inteira", "Sublinhe os dados e circule o que a questão pede. Muita gente erra respondendo outra pergunta."], ["Duas passadas", "Na primeira, faça as que você sabe. Marque as difíceis e volte depois. Não fique muito tempo preso em uma questão só."], ["Estime antes de calcular", "Pense no tamanho da resposta antes da conta. Se o resultado sair muito diferente, confira."], ["Use o rascunho", "Conta de cabeça é onde mora o erro bobo. Escreva os passos, mesmo os fáceis."], ["Confira pelo caminho de volta", "Use a operação inversa: se 48 ÷ 8 = 6, então 6 × 8 tem de dar 48. Em equação, troque o x."], ["Olhe o que foi pedido e a unidade", "Preço final ou desconto? Área ou perímetro? Metros ou centímetros?"], ["Cuidado ao marcar o gabarito", "A cada cinco respostas, confira se o número da questão bate com o número da folha."]]}, {"t": "Na véspera e no dia", "itens": [["Na véspera", "Faça uma revisão leve, separe o material que a escola pedir e durma cedo."], ["No dia", "Tome café da manhã, chegue no horário e vá ao banheiro antes de começar."], ["Se der nervoso", "Solte o lápis, respire fundo três vezes e comece por uma questão fácil. A prova mostra o que você já sabe."]]}], "cofre": {"t": "Plano B: quando você não souber a questão", "aviso": "Isto vale para a questão que sobrou depois de você tentar de verdade. Chute bem dado ajuda em uma ou duas questões; estudo ajuda em todas.", "fecho": "Eliminar duas alternativas leva a chance de 25% para 50%. Saber fazer leva para 100%. Volte para as aulas.", "itens": [["Em branco, nunca", "Questão em branco não soma ponto. Marque sempre uma alternativa."], ["Elimine antes de chutar", "Com 4 alternativas, o chute puro acerta 1 em cada 4. Se você eliminar duas que estão mesmo erradas, passa a ser 1 em cada 2."], ["Corte os absurdos", "Desconto que deixa o preço maior, ângulo de triângulo acima de 180°, idade negativa, parte maior que o todo: risque."], ["Pense no tamanho da resposta", "Arredonde os números e faça a conta de cabeça. A alternativa mais perto da estimativa é a melhor candidata."], ["Teste as alternativas", "Em equação, troque o x por cada alternativa. A que deixa os dois lados iguais é a certa."], ["Olhe a unidade", "Se a pergunta pede área, a resposta está em cm² ou m². Se pede porcentagem, não pode ser em reais."], ["Desconfie do número repetido", "Alternativa que só repete um número do enunciado, ou o resultado da primeira conta, pode ser o passo do meio e não a resposta. Veja se o problema já acabou."], ["Não existe letra da sorte", "\"Na dúvida, marque C\" não funciona. As respostas certas ficam espalhadas entre as letras."], ["Marque e volte", "Chutou? Faça um sinal na questão e volte a ela se sobrar tempo."]]}, "sintese": [{"t": "Números", "temas": [["Inteiros", 1, ["Na reta, mais à direita é maior", "Em × e ÷: sinais iguais dão +, diferentes dão −", "Subtrair é somar o oposto"]], ["Decimais", 2, ["Iguale as casas para comparar", "Vírgula embaixo de vírgula", "0,5 = 1/2 = 50%"]], ["Frações: comparar", 3, ["Mesmo denominador para comparar", "Equivalente: multiplica ou divide em cima e embaixo", "Fração de quantidade: divide e multiplica"]], ["Frações: operações", 4, ["Somar e subtrair: mesmo denominador (MMC)", "Multiplicar: cima × cima, baixo × baixo", "Dividir: multiplica pelo inverso"]], ["Múltiplos, divisores e plano", 12, ["MMC: quando acontece junto de novo", "MDC: grupos iguais, o maior possível", "(x, y): horizontal primeiro, vertical depois"]]]}, {"t try { mem = JSON.parse(localStorage.getItem(CHAVE) || '{}') || {}; } catch (e) { mem = {}; }
function salvar(){ try { localStorage.setItem(CHAVE, JSON.stringify(mem)); } catch (e) {} }
let mult = mem.mult === 2 ? 2 : 1;
let relogio = null, Q = null, parteAtual = 0;
function parar(){ if (relogio) { clearInterval(relogio); relogio = null; } }
function embaralhar(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function mostrar(h){
  app.innerHTML = h; window.scrollTo(0, 0);
  const t = app.querySelector('h2');
  if (t) { t.tabIndex = -1; try { t.focus({ preventScroll: true }); } catch (e) {} }
}

function inicio(){
  parar();
  let h = '<div class="caixa"><h3>Como usar</h3><ol style="margin:0;padding-left:22px"><li>Escolha uma aula.</li><li>Leia as ideias-chave e veja os exemplos resolvidos, um passo de cada vez.</li><li>Faça os exercícios com o relógio rodando. No fim, veja o que errou e tente de novo.</li></ol>' +
    '<label class="tempo"><input type="checkbox" id="dobro"' + (mult === 2 ? ' checked' : '') + '> Tempo em dobro, para treinar com mais calma</label></div><h2>Aulas</h2><div class="grade">';
  D.partes.forEach((p, i) => {
    const r = mem['p' + p.n];
    h += '<button class="cartao' + (r ? ' feito' : '') + '" data-acao="aula" data-i="' + i + '"><span class="num">' + p.n + '</span><span class="tit">' + esc(p.titulo) + '</span><span class="res">' +
      (r ? 'Melhor resultado: ' + r.melhor + ' de ' + r.total : 'Exercícios ainda não feitos') + '</span></button>';
  });
  const s = mem.sim;
  h += '</div><h2>Para fechar</h2><div class="grade"><button class="cartao sim" data-acao="simulado"><span class="num">★</span><span class="tit">Simulado: 20 questões sorteadas</span><span class="res">' +
    (s ? 'Melhor resultado: ' + s.melhor + ' de ' + s.total : 'Mistura todas as aulas, com tempo') + '</span></button></div>' + menuExtra();
  mostrar(h);
}

function aula(i){
  parar(); parteAtual = i;
  const p = D.partes[i];
  const exs = p.q.filter(q => q.passos), nex = p.q.length - exs.length;
  let h = '<div class="linha" style="margin-top:0"><button class="leve" data-acao="inicio">← Todas as aulas</button></div>' +
    '<h2>Aula ' + p.n + ': ' + esc(p.titulo) + '</h2><p style="margin:0;color:var(--cinza)">Você vai revisar: ' + esc(p.resumo) + '.</p>' +
    notaDica(p) + '<div class="caixa"><h3>1. Ideias-chave</h3><ul class="ideias">' + p.ideias.map(t => '<li>' + esc(t) + '</li>').join('') + '</ul></div>' +
    (p.mmcTool ? '<div class="caixa"><h3>Tabuadas lado a lado: ache o MMC</h3><p style="margin:0 0 6px">Escolha dois números e procure o primeiro resultado que aparece nas duas tabuadas.</p>' +
      '<div class="linha" style="margin-top:6px"><label>1º número<select id="m1">' + opcoesNum(p.mmcTool[0]) + '</select></label><label>2º número<select id="m2">' + opcoesNum(p.mmcTool[1]) + '</select></label></div>' +
      '<div id="mtab">' + tabuadas(p.mmcTool) + '</div></div>' : '') +
    '<h2>2. Exemplos resolvidos</h2><p style="margin:0;color:var(--cinza)">Tente pensar na resposta antes de abrir cada passo.</p>';
  exs.forEach((q, k) => {
    h += '<div class="caixa" id="ex' + k + '"><span class="tag">Exemplo ' + (k + 1) + ' · ' + esc(q.nivel) + '</span><p class="perg">' + esc(q.texto) + '</p>' +
      '<ol class="alts">' + q.alts.map((a, j) => '<li' + (j === q.certa ? ' data-certa="1"' : '') + '>' + esc(a) + '</li>').join('') + '</ol>' +
      '<ol class="passos">' + q.passos.map((t, s) => '<li hidden>' + esc(t) + (q.mmc && q.mmcPasso === s ? tabuadas(q.mmc) : '') + '</li>').join('') + '</ol>' +
      '<p class="resp" hidden>Resposta: ' + esc(q.alts[q.certa]) + '</p>' +
      '<button data-acao="passo" data-k="' + k + '">Mostrar o 1º passo</button></div>';
  });
  h += '<h2>3. Exercícios com tempo</h2><div class="caixa"><p style="margin-top:0">São ' + nex + ' exercícios. Cada um tem de 30 a 90 segundos' + (mult === 2 ? ' (em dobro: você ligou o tempo em dobro)' : '') +
    ', conforme a dificuldade. Pegue lápis e papel antes de começar.</p><button class="forte" data-acao="comecar">Começar os exercícios</button></div>' + extrasAula(p);
  mostrar(h);
}

function passo(k){
  const c = document.getElementById('ex' + k);
  const ocultos = c.querySelectorAll('.passos li[hidden]');
  if (ocultos.length) ocultos[0].hidden = false;
  const botao = c.querySelector('button');
  if (ocultos.length <= 1) {
    c.querySelector('.resp').hidden = false;
    c.querySelector('[data-certa]').classList.add('certa');
    botao.remove();
  } else {
    botao.textContent = 'Mostrar o próximo passo';
  }
}

function comecar(lista, chave, titulo){
  Q = { lista: lista, k: 0, acertos: 0, erros: [], chave: chave, titulo: titulo };
  pergunta();
}

function pergunta(){
  parar();
  const q = Q.lista[Q.k], total = q.tempo * mult;
  Q.alts = q.alts.map((t, j) => ({ t: t, c: j === q.certa }));
  if (!q.fixo) Q.alts = embaralhar(Q.alts);
  Q.respondida = false; Q.t0 = Date.now();
  mostrar('<div class="topo"><span><b>' + esc(Q.titulo) + '</b> · Questão ' + (Q.k + 1) + ' de ' + Q.lista.length + ' · ' + esc(q.nivel) + '</span><span class="relogio" id="rel">' + total + ' s</span></div>' +
    '<div class="barra"><i id="bar"></i></div><p class="perg">' + esc(q.texto) + '</p><div class="opcoes">' +
    Q.alts.map((a, j) => '<button data-acao="resp" data-j="' + j + '"><b>' + 'ABCD'[j] + '</b><span>' + esc(a.t) + '</span></button>').join('') +
    '</div><div id="fb"></div><div class="linha"><button class="leve" data-acao="sair">Sair dos exercícios</button></div>');
  Q.fim = Date.now() + total * 1000; Q.resta = null;
  const bar = document.getElementById('bar'), rel = document.getElementById('rel');
  relogio = setInterval(() => {
    if (document.hidden || Q.resta != null) return;
    const r = Math.max(0, Q.fim - Date.now()), pct = r / (total * 10);
    bar.style.width = pct + '%';
    rel.textContent = Math.ceil(r / 1000) + ' s';
    if (pct < 25) { bar.classList.add('fim'); rel.classList.add('fim'); }
    if (r <= 0) responder(-1);
  }, 100);
}

function responder(j){
  if (!Q || Q.respondida) return;
  if (j >= 0 && Date.now() - Q.t0 < 500) return;
  Q.respondida = true; parar();
  const q = Q.lista[Q.k], ok = j >= 0 && Q.alts[j].c, certa = q.alts[q.certa];
  if (ok) Q.acertos++; else Q.erros.push({ q: q, marcada: j >= 0 ? Q.alts[j].t : null });
  app.querySelectorAll('.opcoes button').forEach((b, i) => {
    b.disabled = true;
    if (Q.alts[i].c) b.classList.add('certa'); else if (i === j) b.classList.add('errada');
  });
  const ultima = Q.k === Q.lista.length - 1;
  document.getElementById('fb').innerHTML = '<div class="fb ' + (ok ? 'ok' : 'no') + '"><p><b>' +
    (ok ? '✔ Acertou!' : j < 0 ? '⏰ O tempo acabou.' : '✘ Ainda não.') + '</b></p><p>Resposta: <b>' + esc(certa) + '</b></p><p>' + esc(q.just) + '</p>' + (q.mmc ? tabuadas(q.mmc) : '') + '</div>' +
    '<div class="linha"><button class="forte" data-acao="proxima">' + (ultima ? 'Ver o resultado' : 'Próxima questão') + '</button></div>';
  document.querySelector('[data-acao="proxima"]').scrollIntoView({ block: 'nearest' });
}

function proxima(){
  if (Q.k < Q.lista.length - 1) { Q.k++; pergunta(); return; }
  const n = Q.lista.length, a = Q.acertos, ant = mem[Q.chave];
  if (!ant || a > ant.melhor) { mem[Q.chave] = { melhor: a, total: n }; salvar(); }
  const frase = a === n ? 'Gabaritou! Pode passar para a próxima aula.' : a >= n * 0.7 ? 'Muito bem! Reveja só o que errou.' : 'Volte às ideias-chave e aos exemplos e tente de novo. Errar faz parte do treino.';
  let h = '<h2>' + esc(Q.titulo) + ': resultado</h2><div class="caixa"><p class="placar">' + a + ' de ' + n + '</p><p style="margin:6px 0 0">' + frase + '</p></div>';
  if (Q.erros.length) {
    h += '<div class="caixa"><h3>Para rever</h3><ol class="erros" style="margin:0;padding-left:22px">' + Q.erros.map(e =>
      '<li><b>' + esc(e.q.texto) + '</b><br>' + (e.marcada === null ? 'O tempo acabou.' : 'Você marcou: ' + esc(e.marcada) + '.') +
      '<br>Resposta: <b>' + esc(e.q.alts[e.q.certa]) + '</b>. ' + esc(e.q.just) + '</li>').join('') + '</ol></div>';
  }
  h += '<div class="linha"><button class="forte" data-acao="refazer">Fazer de novo</button>' +
    (Q.chave === 'sim' ? '' : '<button data-acao="aula" data-i="' + parteAtual + '">Voltar à aula</button>') + '<button data-acao="inicio">Todas as aulas</button></div>';
  mostrar(h);
}

function exerciciosDaParte(){ const p = D.partes[parteAtual]; comecar(p.q.filter(q => !q.passos), 'p' + p.n, 'Aula ' + p.n); }
function simulado(){ const todas = []; D.partes.forEach(p => p.q.forEach(q => todas.push(q))); comecar(embaralhar(todas).slice(0, 20), 'sim', 'Simulado'); }

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-acao]');
  if (!b) return;
  const a = b.dataset.acao;
  if (a === 'inicio') inicio();
  else if (a === 'aula') aula(+b.dataset.i);
  else if (a === 'passo') passo(+b.dataset.k);
  else if (a === 'comecar') exerciciosDaParte();
  else if (a === 'simulado') simulado();
  else if (a === 'resp') responder(+b.dataset.j);
  else if (a === 'proxima') proxima();
  else if (a === 'refazer') { if (Q.chave === 'sim') simulado(); else exerciciosDaParte(); }
  else if (a === 'sair') { parar(); if (Q.chave === 'sim') inicio(); else aula(parteAtual); }
});
app.addEventListener('change', ev => {
  if (ev.target.id === 'm1' || ev.target.id === 'm2') { document.getElementById('mtab').innerHTML = tabuadas([+document.getElementById('m1').value, +document.getElementById('m2').value]); }
  if (ev.target.id === 'dobro') { mult = ev.target.checked ? 2 : 1; mem.mult = mult; salvar(); }
});
// ===== v04: livro didático, slides "Foco no conteúdo", Kahoot, técnicas e mapa de síntese =====
const X = D.extra;
let hist = [], tela = inicio, soEx = true;
function marcaHistorico(){ try { history.pushState({}, ''); } catch (e) {} }  // para o botão Voltar do celular não sair do site
function nav(fn){ hist.push({ fn: tela, y: window.scrollY }); tela = fn; fn(); marcaHistorico(); }
function voltar(){
  parar();
  if (app.querySelector('.opcoes,.placar')) { tela(); return; }  // saiu do quiz: volta para a aula (ou para o início, no simulado)
  const e = hist.pop();
  if (!e && tela === inicio) return;
  tela = e ? e.fn : inicio;
  tela();
  if (e) window.scrollTo(0, e.y);
}
const DIM = { livro: ' width="1000" height="1300"', slide: ' width="960" height="540"' };
function topo(){ return '<div class="linha" style="margin-top:0"><button class="leve" data-acao="voltar">← Voltar</button><button class="leve" data-acao="inicio">Início</button></div>'; }
function pagImg(src, alt, falta, tipo){
  return '<div class="pg ' + (tipo || '') + '"><img loading="lazy"' + (DIM[tipo] || '') + ' src="' + esc0(encodeURI(src)) + '" alt="' + esc0(alt) + '" data-falta="' + esc0(falta) + '"></div>';
}
function attrs(v, x, y){ return ' data-v="' + v + '"' + (x == null ? '' : ' data-x="' + x + '"') + (y == null ? '' : ' data-y="' + y + '"'); }
function botaoIr(txt, v, x, y, cls, acao){ return '<button class="' + (cls || '') + '" data-acao="' + (acao || 'ir') + '"' + attrs(v, x, y) + '>' + esc(txt) + '</button>'; }
function cartao(v, x, num, tit, res, cls){
  return '<button class="cartao ' + (cls || '') + '" data-acao="ir"' + attrs(v, x) + '><span class="num">' + num + '</span><span class="tit">' + esc(tit) + '</span><span class="res">' + esc(res) + '</span></button>';
}
function faixa(a){ return 'p. ' + a.pags[0].imp + ' a ' + a.pags[a.pags.length - 1].imp; }

function menuExtra(){
  let h = '<h2>Kahoot</h2><div class="grade">' + cartao('kahoot', null, 'K', 'Kahoots de revisão', 'Links e QR code dos cursos e de cada conteúdo') + '</div>' +
    '<h2>Livro didático</h2><p class="sub">Exercícios do Livro do Estudante, com o número da página do seu livro.</p><div class="grade">';
  X.livros.forEach((L, i) => { h += cartao('livro', i, L.vol, 'Volume ' + L.vol + ' · ' + L.bim, '30 aulas e o Caderno de exercícios'); });
  h += '</div><h2>Slides das aulas: Foco no conteúdo</h2><p class="sub">Os slides que explicam o conteúdo de cada aula. É o que vale rever antes da prova.</p><div class="grade">';
  X.foco.forEach((B, i) => {
    const ns = B.aulas.reduce((s, a) => s + a.slides.length, 0);
    h += cartao('foco', i, B.bim + 'º', B.bim + 'º bimestre', B.aulas.length + ' aulas · ' + ns + ' slides');
  });
  h += '</div><h2>Estudar melhor e fazer prova</h2><div class="grade">' +
    cartao('tecnicas', null, '✎', 'Técnicas de estudo e de prova', 'Como estudar, memorizar e resolver a prova') +
    cartao('sintese', null, '◎', 'Mapa de síntese', 'O que mais importa de cada conteúdo e os 17 mapas mentais') + '</div>';
  return h;
}

function notaDica(p){
  if (!p.dica) return '';
  return '<div class="nota"><p><b>Dica de estudo.</b> ' + esc(p.dica[0]) + '</p><p><b>Na prova.</b> ' + esc(p.dica[1]) + '</p>' +
    '<div class="linha" style="margin-top:8px">' + botaoIr('Ver todas as técnicas de estudo e de prova', 'tecnicas', null, null, 'leve') + '</div></div>';
}

function blocoKahoot(tit, k, grande){
  return '<div class="caixa kh"><h3>' + esc(tit) + '</h3><div class="khl"><img class="qr' + (grande ? ' g' : '') + '" src="' + k.qr + '" alt="QR code: ' + esc0(tit) + '">' +
    '<div>' + (k.pin ? '<p>PIN: <b>' + k.pin + '</b></p>' : '') + '<a class="bt" href="' + k.url + '" target="_blank" rel="noopener">Abrir no Kahoot</a>' +
    (grande ? '<p class="link">' + esc0(k.url) + '</p>' : '') + '</div></div></div>';
}

function extrasAula(p){
  let h = '<h2>4. Mais para estudar</h2>';
  if (p.kahoot) {
    h += blocoKahoot('Kahoot deste conteúdo', p.kahoot, false) + '<p class="sub">Aponte a câmera do celular para o QR code ou toque no botão. O desafio fica aberto até ' + X.kahoot.prazo + '.</p>' +
      '<div class="linha" style="margin-top:0">' + botaoIr('Ver todos os Kahoots e os cursos', 'kahoot', null, null, 'leve') + '</div>';
  }
  if (p.livro) {
    const L = X.livros[p.livro[0]];
    h += '<div class="caixa"><h3>No livro: Volume ' + L.vol + '</h3><p class="sub">Exercícios do Livro do Estudante sobre este conteúdo.</p><div class="lista">';
    for (let n = p.livro[1]; n <= p.livro[2]; n++) { const a = L.aulas[n - 1]; h += botaoIr('Aula ' + a.n + ': ' + a.titulo + ' · ' + faixa(a), 'livaula', p.livro[0], n); }
    h += '</div></div>';
  }
  if (p.mapas && p.mapas.length) {
    h += '<div class="caixa"><h3>Mapa mental</h3><p class="sub">Toque na imagem para ampliar.</p>' +
      p.mapas.map(m => pagImg('img/mapas/' + X.mapas[m - 1].f, 'Mapa mental ' + m, 'Mapa mental ' + m + ': imagem não encontrada.', 'mapa')).join('') + '</div>';
  }
  return h;
}

function livroLista(vi){
  const L = X.livros[vi], c = L.caderno;
  let h = topo() + '<h2>Livro do Estudante · Volume ' + L.vol + ' (' + L.bim + ')</h2>' +
    '<p class="sub">Os números são as páginas impressas no seu livro. Faça os exercícios no caderno.</p><div class="lista">' +
    botaoIr('Caderno de exercícios (aprofundamento) · p. ' + c[0].imp + ' a ' + c[c.length - 1].imp, 'caderno', vi, 0, 'dest');
  L.aulas.forEach(a => { h += botaoIr('Aula ' + a.n + ': ' + a.titulo + ' · ' + faixa(a), 'livaula', vi, a.n); });
  mostrar(h + '</div>');
}

function focoDe(bim, n){
  const bi = X.foco.findIndex(B => B.bim === bim);
  if (bi < 0) return null;
  const k = X.foco[bi].aulas.findIndex(a => a.n === n);
  return k < 0 ? null : [bi, k];
}

function livroAula(vi, n){
  const L = X.livros[vi], a = L.aulas[n - 1];
  const filtra = soEx && a.pags.some(p => p.ex);
  const pg = a.pags.filter(p => !filtra || p.ex);
  let h = topo() + '<h2>Volume ' + L.vol + ' · Aula ' + a.n + ': ' + esc(a.titulo) + '</h2>' +
    '<p class="sub">No seu livro: páginas ' + a.pags[0].imp + ' a ' + a.pags[a.pags.length - 1].imp + '. Faça no caderno. Toque na imagem para ampliar.</p>' +
    '<div class="linha" style="margin-top:0"><button class="' + (filtra ? 'ativo' : '') + '" data-acao="filtro" data-s="1">Só os exercícios</button>' +
    '<button class="' + (filtra ? '' : 'ativo') + '" data-acao="filtro" data-s="0">Aula inteira (resumo e exemplos)</button></div>';
  pg.forEach(p => {
    h += '<p class="pgn">Página ' + p.imp + (p.rot.length ? ' · ' + esc(p.rot.join(' · ')) : '') + '</p>' +
      pagImg('img/livro' + L.vol + '/' + p.f, 'Livro volume ' + L.vol + ', página ' + p.imp, 'Imagem não encontrada. Abra a página ' + p.imp + ' do seu livro (volume ' + L.vol + ').', 'livro');
  });
  h += '<div class="lista">';
  if (L.cadernoAula[a.n] !== undefined) h += botaoIr('Aprofundamento: exercícios desta aula no Caderno de exercícios', 'caderno', vi, L.cadernoAula[a.n], 'dest');
  const f = focoDe(L.vol, a.n);
  if (f) h += botaoIr('Slides desta aula: Foco no conteúdo', 'focoaula', f[0], f[1]);
  h += '</div><div class="linha">';
  if (n > 1) h += botaoIr('← Aula ' + (n - 1), 'livaula', vi, n - 1, 'leve', 'troca');
  if (n < L.aulas.length) h += botaoIr('Aula ' + (n + 1) + ' →', 'livaula', vi, n + 1, 'leve', 'troca');
  mostrar(h + '</div>');
}

function caderno(vi, ini){
  const L = X.livros[vi], c = L.caderno, marcas = {};
  Object.keys(L.cadernoAula).forEach(k => { const i = L.cadernoAula[k]; (marcas[i] = marcas[i] || []).push(k); });
  let h = topo() + '<h2>Caderno de exercícios · Volume ' + L.vol + '</h2>' +
    '<p class="sub">Exercícios de aprofundamento do fim do livro: páginas ' + c[0].imp + ' a ' + c[c.length - 1].imp + '. Toque na imagem para ampliar.</p>';
  c.forEach((p, i) => {
    h += '<p class="pgn" id="cad' + i + '">Página ' + p.imp + (marcas[i] ? ' · começam aqui os exercícios da Aula ' + marcas[i].join(' e da Aula ') : '') + '</p>' +
      pagImg('img/livro' + L.vol + '/' + p.f, 'Caderno de exercícios, página ' + p.imp, 'Imagem não encontrada. Abra a página ' + p.imp + ' do seu livro (volume ' + L.vol + ').', 'livro');
  });
  mostrar(h);
  if (ini) { const e = document.getElementById('cad' + ini); if (e) e.scrollIntoView(); }
}

function focoLista(bi){
  const B = X.foco[bi];
  let h = topo() + '<h2>Foco no conteúdo · ' + B.bim + 'º bimestre</h2><p class="sub">Slides das aulas oficiais que explicam o conteúdo. Reveja antes de fazer os exercícios.</p><div class="lista">';
  B.aulas.forEach((a, k) => { h += botaoIr('Aula ' + a.n + ': ' + a.titulo + ' · ' + a.slides.length + (a.slides.length === 1 ? ' slide' : ' slides'), 'focoaula', bi, k); });
  mostrar(h + '</div>');
}

function focoAula(bi, k){
  const B = X.foco[bi], a = B.aulas[k];
  let h = topo() + '<h2>' + B.bim + 'º bimestre · Aula ' + a.n + ': ' + esc(a.titulo) + '</h2><p class="sub">Foco no conteúdo. Toque na imagem para ampliar.</p>';
  a.slides.forEach((s, i) => {
    h += '<p class="pgn">' + (i + 1) + '. ' + esc(s.t) + (s.olho ? ' <span class="selo">De olho no modelo</span>' : '') + '</p>' + pagImg('img/foco/' + s.f, s.t, 'Slide não encontrado.', 'slide');
  });
  const vi = X.livros.findIndex(L => L.vol === B.bim);
  if (vi >= 0 && a.n <= X.livros[vi].aulas.length) h += '<div class="lista">' + botaoIr('Exercícios desta aula no livro (volume ' + B.bim + ')', 'livaula', vi, a.n, 'dest') + '</div>';
  mostrar(h);
}

function kahoot(){
  const K = X.kahoot;
  let h = topo() + '<h2>Kahoots de revisão</h2><p class="sub">Aponte a câmera do celular para o QR code ou toque em Abrir. Os desafios ficam abertos até ' + K.prazo + '.</p>';
  K.cursos.forEach(c => { h += blocoKahoot(c.t, c, true); });
  h += '<h2>Um Kahoot por conteúdo</h2><div class="grade2">';
  K.desafios.forEach(d => { h += blocoKahoot(d.n + '. ' + d.t, d, false); });
  mostrar(h + '</div>');
}

function listaTec(itens){ return '<dl class="tec">' + itens.map(i => '<dt>' + esc(i[0]) + '</dt><dd>' + esc(i[1]) + '</dd>').join('') + '</dl>'; }

function tecnicas(){
  const c = X.cofre;
  let h = topo() + '<h2>Técnicas de estudo e de prova</h2><p class="sub">Escolha uma técnica por semana e use de verdade. Não precisa fazer tudo de uma vez.</p>';
  X.tecnicas.forEach(s => { h += '<div class="caixa"><h3>' + esc(s.t) + '</h3>' + listaTec(s.itens) + '</div>'; });
  h += '<details class="cofre"><summary>' + esc(c.t) + '</summary><p><b>' + esc(c.aviso) + '</b></p>' + listaTec(c.itens) + '<p><b>' + esc(c.fecho) + '</b></p></details>';
  mostrar(h);
}

function sintese(){
  let h = topo() + '<h2>Mapa de síntese</h2><p class="sub">O que mais importa de cada conteúdo. Toque em um tema para abrir a aula.</p>';
  X.sintese.forEach((b, k) => {
    h += '<div class="bloco b' + k + '"><h3>' + esc(b.t) + '</h3><div class="temas">' + b.temas.map(t =>
      '<button class="tema" data-acao="aula" data-i="' + (t[1] - 1) + '"><b>' + esc(t[0]) + '</b><ul>' + t[2].map(x => '<li>' + esc(x) + '</li>').join('') + '</ul></button>').join('') + '</div></div>';
  });
  h += '<h2>Mapas mentais</h2><p class="sub">Os 17 mapas mentais de Matemática do 7º ano. Toque na imagem para ampliar.</p>' +
    X.mapas.map((m, i) => '<p class="pgn">Mapa ' + (i + 1) + '</p>' + pagImg('img/mapas/' + m.f, 'Mapa mental ' + (i + 1), 'Mapa mental ' + (i + 1) + ': imagem não encontrada.', 'mapa')).join('');
  mostrar(h);
}

const TELAS = { livro: livroLista, livaula: livroAula, caderno: caderno, foco: focoLista, focoaula: focoAula, kahoot: kahoot, tecnicas: tecnicas, sintese: sintese };
function telaDe(b){
  const v = b.dataset.v, x = b.dataset.x === undefined ? undefined : +b.dataset.x, y = b.dataset.y === undefined ? undefined : +b.dataset.y;
  return () => TELAS[v](x, y);
}

app.addEventListener('click', ev => {
  if (ev.target.matches && ev.target.matches('.pg img')) { ev.target.classList.toggle('zoom'); return; }
  const b = ev.target.closest('[data-acao]');
  if (!b) return;
  const a = b.dataset.acao;
  if (a === 'ir') nav(telaDe(b));
  else if (a === 'troca') { tela = telaDe(b); tela(); }
  else if (a === 'voltar') voltar();
  else if (a === 'filtro') { soEx = b.dataset.s === '1'; tela(); }
  else if (a === 'inicio') { hist = []; tela = inicio; }
  else if (a === 'aula') {
    const i = +b.dataset.i;
    if (b.classList.contains('tema')) hist.push({ fn: tela, y: 0 });  // veio do mapa de síntese: Voltar retorna a ele
    tela = () => aula(i);
    marcaHistorico();
  }
  else if (a === 'comecar' || a === 'simulado') marcaHistorico();
});
window.addEventListener('popstate', voltar);
document.addEventListener('visibilitychange', () => {  // tela bloqueada ou outro app: o relógio do exercício espera
  if (!Q || Q.respondida || !relogio) return;
  if (document.hidden) Q.resta = Q.fim - Date.now();
  else if (Q.resta != null) { Q.fim = Date.now() + Q.resta; Q.resta = null; }
});
app.addEventListener('error', ev => {
  const t = ev.target;
  if (t && t.tagName === 'IMG' && t.dataset.falta) { const p = document.createElement('p'); p.className = 'falta'; p.textContent = t.dataset.falta; t.replaceWith(p); }
}, true);

inicio();
</script>
