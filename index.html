<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Revisão de Matemática do 7º ano para o SARESP: trilha até a prova, aulas, exercícios, tabuada, flashcards, livro e técnicas de estudo.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14284b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Revisão Mat 7º">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Revisão SARESP · Matemática 7º ano</title>
<style>
:root{--azul:#14284b;--azul2:#24457c;--laranja:#e8791d;--laranja2:#b8510a;--tit:#14284b;--tit2:#24457c;--suave:#e6ecf7;--passo:#fff7ef;--com:#ffe9d3;--nota:#fff8e6;--notab:#f0d48a;--fundo:#f4f6fa;--papel:#fff;--tinta:#1b2433;--cinza:#5b6678;--linha:#d5dbe6;--ok:#1d7a46;--okf:#e3f4ea;--erro:#b3261e;--errof:#fbe9e7}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--tinta);font:18px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:var(--azul);color:#fff;padding:16px;border-bottom:5px solid var(--laranja)}
header .in,main{max-width:860px;margin:0 auto}
header h1{margin:0;font-size:1.35rem;line-height:1.25}
header p{margin:4px 0 0;opacity:.85;font-size:.95rem}
main{padding:16px 16px 60px}
h2{color:var(--tit);font-size:1.3rem;margin:22px 0 10px;line-height:1.25}
h3{color:var(--tit2);font-size:1.08rem;margin:0 0 8px}
.caixa{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:16px;margin:14px 0}
button{font:inherit;cursor:pointer;border-radius:10px;border:2px solid var(--azul);background:var(--papel);color:var(--tit);padding:10px 16px;font-weight:600}
button.forte{background:var(--laranja2);border-color:var(--laranja2);color:#fff;font-size:1.1rem;padding:12px 22px}
button.leve{border-color:var(--linha);color:var(--cinza);font-weight:500}
button:focus-visible{outline:3px solid var(--tit);outline-offset:2px}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.cartao{display:grid;grid-template-columns:44px 1fr;gap:2px 12px;text-align:left;border:1px solid var(--linha);padding:14px;align-items:center}
.cartao .num{grid-row:span 2;width:44px;height:44px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:1.15rem}
.cartao .tit{font-weight:700;line-height:1.25}
.cartao .res{font-weight:400;font-size:.88rem;color:var(--cinza)}
.cartao.feito .num{background:var(--ok)}
.cartao.sim{border:2px solid var(--laranja)}
.cartao.sim .num{background:var(--laranja2)}
.tempo{display:flex;gap:10px;align-items:center;margin-top:10px;font-size:.98rem}
.tempo input{width:22px;height:22px}
ul.ideias{margin:0;padding-left:22px}
ul.ideias li{margin:6px 0}
.tag{display:inline-block;font-size:.8rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--tit2);background:var(--suave);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.perg{white-space:pre-line;font-size:1.2rem;font-weight:600;margin:4px 0 12px;line-height:1.35}
ol.alts{list-style:upper-alpha;margin:0 0 10px;padding-left:28px;color:var(--cinza)}
ol.alts li.certa{color:var(--ok);font-weight:700}
ol.passos{margin:10px 0;padding-left:26px}
ol.passos li{margin:6px 0;background:var(--passo);border-left:4px solid var(--laranja);padding:6px 10px;border-radius:0 8px 8px 0}
.resp{font-weight:700;color:var(--ok);margin:8px 0 0}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:.95rem;color:var(--cinza)}
.relogio{font-weight:800;font-size:1.5rem;color:var(--tit);font-variant-numeric:tabular-nums;min-width:4.2ch;text-align:right}
.relogio.fim{color:var(--erro)}
.barra{height:12px;background:var(--linha);border-radius:6px;overflow:hidden;margin:8px 0 16px}
.barra i{display:block;height:100%;width:100%;background:var(--tit2)}
.barra i.fim{background:var(--erro)}
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.opcoes{grid-template-columns:1fr}body{font-size:17px}}
.opcoes button{text-align:left;min-height:58px;font-weight:600;color:var(--tinta);border-color:var(--linha);display:flex;gap:10px;align-items:center}
.opcoes button b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:.9rem}
.opcoes button:disabled{cursor:default;opacity:.75}
.opcoes button.certa{background:var(--okf);border-color:var(--ok);opacity:1}
.opcoes button.errada{background:var(--errof);border-color:var(--erro);opacity:1}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px}
.fb.ok{background:var(--okf);border:1px solid var(--ok)}
.fb.no{background:var(--errof);border:1px solid var(--erro)}
.fb p{margin:4px 0}
.linha{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.placar{font-size:2.4rem;font-weight:800;color:var(--tit);margin:0}
.erros li{margin:10px 0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .18em;line-height:1.12;font-size:.92em}
.fr span{padding:0 .28em}
.fr span:first-child{border-bottom:2px solid currentColor}
.tabs{margin:10px 0 2px}
.tab{display:grid;grid-template-columns:8.6em 1fr;gap:6px 8px;align-items:start;margin:10px 0}
.nums{display:flex;flex-wrap:wrap;gap:6px}
@media(max-width:560px){.tab{grid-template-columns:1fr}}
.tab .rot{font-weight:700;color:var(--tit);padding-top:3px}
.nums span{min-width:2.5em;text-align:center;padding:3px 6px;border:1px solid var(--linha);border-radius:6px;background:var(--papel);font-variant-numeric:tabular-nums}
.nums span.com{background:var(--com);border-color:var(--laranja)}
.nums span.mmc{background:var(--laranja2);border-color:var(--laranja2);color:#fff;font-weight:800}
.leg{margin:8px 0 0;font-size:.97rem}
button,a.bt,.pg img{touch-action:manipulation}
h2:focus{outline:none}
select{min-height:44px;font:inherit;padding:6px 10px;border-radius:8px;border:2px solid var(--azul);background:var(--papel);color:var(--tinta);margin-left:6px}
.sub{margin:0 0 8px;color:var(--cinza)}
.nota{background:var(--nota);border:1px solid var(--notab);border-left:6px solid var(--laranja);border-radius:10px;padding:12px 14px;margin:14px 0}
.nota p{margin:4px 0}
.lista{display:grid;gap:8px;margin:10px 0}
.lista button{text-align:left;font-weight:500;border-color:var(--linha);color:var(--tinta)}
.lista button.dest{border-color:var(--laranja);font-weight:700;color:var(--tit)}
button.ativo{background:var(--azul);color:#fff}
.pg{overflow:auto;margin:6px 0 18px;border:1px solid var(--linha);border-radius:8px;background:#fff}
.pg img{display:block;width:100%;height:auto;cursor:zoom-in}
.pg.livro img{aspect-ratio:567/737}
.pg.slide img{aspect-ratio:16/9}
.pg img.zoom{width:230%;max-width:none;cursor:zoom-out}
.pgn{margin:14px 0 4px;font-weight:700;color:var(--tit2);font-size:.95rem}
.falta{padding:14px;color:var(--cinza);margin:0}
.selo{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;background:var(--laranja2);color:#fff;border-radius:6px;padding:1px 7px;vertical-align:middle}
.khl{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.khl p{margin:4px 0}
.qr{width:150px;height:150px;flex:none}
.qr.g{width:220px;height:220px}
a.bt{display:inline-block;background:var(--laranja2);color:#fff;font-weight:700;text-decoration:none;border-radius:10px;padding:10px 18px;margin:4px 0}
a.bt:focus-visible{outline:3px solid var(--tit);outline-offset:2px}
.link{font-size:.8rem;color:var(--cinza);word-break:break-all}
.grade2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:12px}
.grade2 .caixa{margin:0}
.tec{margin:0}
.tec dt{font-weight:700;color:var(--tit);margin-top:10px}
.tec dd{margin:2px 0 0}
details.cofre{margin:28px 0 0;border:1px dashed var(--linha);border-radius:10px;padding:10px 14px;font-size:.93rem;color:var(--cinza)}
details.cofre summary{cursor:pointer}
details.cofre[open]{color:var(--tinta);background:var(--papel)}
.bloco{border-radius:12px;padding:12px;margin:14px 0;border:1px solid var(--linha);background:var(--papel);border-top:6px solid var(--azul)}
.bloco.b1{border-top-color:var(--laranja)}
.bloco.b2{border-top-color:var(--ok)}
.bloco.b3{border-top-color:#7a3fa0}
.temas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:10px}
.tema{position:relative;border:2px solid var(--linha);border-radius:10px;background:var(--papel);padding:10px 16px;color:var(--tinta)}
.tema-bt{border:0;background:none;padding:0;text-align:left;width:100%;font-weight:400;color:var(--tinta)}
.tema-bt::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;border-radius:10px}
.tema b{color:var(--tit)}
.tema ul{margin:6px 0 0;padding-left:18px;font-size:.93rem}
html{-webkit-text-size-adjust:100%}
body{padding-bottom:calc(66px + env(safe-area-inset-bottom))}
header{padding-top:calc(14px + env(safe-area-inset-top));padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
main{padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
button{-webkit-tap-highlight-color:transparent;min-height:44px}
button:active{transform:scale(.98)}
@media(max-width:560px){header{padding-bottom:10px}header h1{font-size:1.12rem}header p{display:none}}
#abas{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--papel);border-top:1px solid var(--linha);padding:0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-shadow:0 -2px 10px rgba(0,0,0,.08)}
#abas button{border:0;border-radius:0;background:none;min-height:58px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.8rem;font-weight:600;color:var(--cinza)}
#abas button span{font-size:1.3rem;line-height:1.1}
#abas button.on{color:var(--tit);box-shadow:inset 0 3px 0 var(--laranja)}
.heroi{background:var(--azul);color:#fff;border-radius:14px;padding:16px;margin:4px 0 8px}
.heroi .hk{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;opacity:.85}
.heroi .hn{margin:2px 0 8px;font-size:1.05rem}
.heroi .forte{width:100%;margin-top:14px;text-align:left}
.prog{height:10px;background:var(--linha);border-radius:5px;overflow:hidden;margin:6px 0}
.heroi .prog{background:rgba(255,255,255,.28)}
.prog i{display:block;height:100%;background:var(--laranja2);border-radius:5px}
details.ajuda{margin:18px 0 0;border:1px solid var(--linha);border-radius:10px;padding:8px 14px;background:var(--papel)}
details summary{cursor:pointer;font-weight:600;padding:8px 0}
details.ajuda ol{margin:4px 0 8px;padding-left:22px}
.chips{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:8px 0;margin:8px 0 0;background:var(--fundo);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:1 0 auto;border-radius:999px;padding:6px 10px;font-size:.88rem;border-color:var(--linha);color:var(--tit)}
[id^=sec]{scroll-margin-top:66px}
.fc{display:flex;flex-direction:column;justify-content:center;gap:12px;width:100%;min-height:270px;text-align:center;border:2px solid var(--linha);border-radius:18px;padding:22px 18px;background:var(--papel);color:var(--tinta);font-weight:400;box-shadow:0 4px 14px rgba(0,0,0,.08);animation:vira .22s ease}
.fc.v{border-color:var(--laranja)}
.fc:active{transform:none}
@keyframes vira{from{transform:rotateX(70deg);opacity:.3}to{transform:none;opacity:1}}
.fck{margin:0;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--cinza);font-weight:700}
.fct{font-size:1.7rem;font-weight:800;color:var(--tit);line-height:1.2}
.fcd{font-size:1.2rem;line-height:1.4}
.fce{font-size:1rem;color:var(--cinza)}
.fch{font-size:.9rem;color:var(--cinza)}
.fcb{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.fcb button{min-height:56px}
.fcb button:only-child{grid-column:1/-1}
.khd{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.khi{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.khi p{margin:0;font-size:.92rem}
.khi .bt{margin-top:auto;align-self:stretch;text-align:center}
.khi .qr{width:min(150px,100%);height:auto;background:#fff;border-radius:8px;padding:6px;box-sizing:border-box}
.pg .falta{color:#5b6678}
[data-acao="proxima"],[data-acao="fctp"],[data-acao="passo"],.resp,.fcb,#fb{scroll-margin-bottom:calc(78px + env(safe-area-inset-bottom))}
.cartao.feito .num{font-size:1.3rem}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}button:active{transform:none}}
@media(prefers-color-scheme:dark){
:root{--azul:#1e3a6e;--azul2:#4a76c9;--tit:#b4cdf7;--tit2:#9dbcf2;--laranja:#f08c38;--fundo:#0e1420;--papel:#182132;--tinta:#e9edf5;--cinza:#aab4c5;--linha:#33405a;--ok:#62d394;--okf:#12331f;--erro:#ff9388;--errof:#3d1b18;--suave:#22304a;--passo:#2a2318;--com:#4a3320;--nota:#2b2616;--notab:#6b5a25}
header{background:#14284b}
.prog i{background:var(--laranja)}
.heroi .prog i{background:#fff}
.cartao.feito .num{color:#0e1420}
button{border-color:var(--azul2)}
#abas{box-shadow:0 -2px 10px rgba(0,0,0,.4)}
}
.opcoes small{display:block;font-size:.8rem;font-weight:700}
.pg img:focus-visible{outline:3px solid var(--tit);outline-offset:-3px}
.pg.mapa img{aspect-ratio:1200/1778}
.topo:focus{outline:none}
.heroi button:focus-visible{outline-color:#fff}
.heroi .prog i{background:#fff}
.quiz-topo{background:var(--fundo)}
@media(max-height:500px){.quiz-topo{position:sticky;top:0;z-index:6;padding-top:4px}.quiz-topo .barra{margin:4px 0 8px}.fc{min-height:150px;padding:14px}}
footer{text-align:center;color:var(--cinza);font-size:.85rem;padding:0 max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
/* v06 núcleo: placar, avisos, trilha, formulário do resumo */
.so-leitor{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
header .in{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
header .in>div:first-child{min-width:0}
#placar{display:flex;gap:10px;font-weight:700;font-size:.95rem;white-space:nowrap}
#placar>span{background:rgba(255,255,255,.14);border-radius:999px;padding:3px 10px}
#aviso{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom));transform:translate(-50%,20px);z-index:30;max-width:calc(100% - 32px);width:max-content;background:var(--tinta);color:var(--fundo);font-weight:700;font-size:.95rem;border-radius:14px;padding:8px 16px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;text-align:center}
#aviso.on{opacity:1;transform:translate(-50%,0)}
#abas{grid-template-columns:repeat(5,1fr)}
#abas button{font-size:.74rem}
.dia{background:var(--papel);border:1px solid var(--linha);border-radius:12px;padding:12px 14px;margin:10px 0}
.dia.hoje{border:2px solid var(--laranja)}
.dia.leve{border-style:dashed}
.dia h3{margin:0 0 2px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dia h3 small{font-weight:600;color:var(--cinza);font-size:.85rem;white-space:nowrap}
.tarefa{display:flex;gap:10px;align-items:center;text-align:left}
.tarefa .tk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--linha);display:grid;place-items:center;font-weight:800;font-size:.95rem}
.tarefa.ok .tk{background:var(--ok);border-color:var(--ok);color:var(--papel)}
.tarefa.ok{color:var(--cinza)}
.campo{display:flex;flex-direction:column;gap:4px;font-weight:600;margin:8px 0}
.campo input,textarea{font:inherit;font-size:max(16px,1rem);padding:10px 12px;border:2px solid var(--linha);border-radius:10px;background:var(--papel);color:var(--tinta);width:100%;min-height:44px}
.campo input:focus-visible,textarea:focus-visible{outline:3px solid var(--tit);outline-offset:1px}
.resumo{white-space:pre-wrap;font:inherit;font-size:.92rem;background:var(--suave);border-radius:8px;padding:10px 12px;margin:0;overflow-wrap:anywhere}
.pista{background:var(--nota);border:1px solid var(--notab);border-radius:10px;padding:10px 12px;margin:10px 0}
.alem{background:var(--suave);border-left:6px solid var(--tit2);border-radius:0 10px 10px 0;padding:10px 12px;margin:12px 0}
.alem p,.pista p{margin:4px 0}
.tempo-quiz{display:flex;align-items:center;gap:8px}
.tempo-quiz button{min-height:44px;padding:6px 12px}
.relogio.pausado{opacity:.55}

/* módulo 10: tabuada pela tabela pitagórica (malha, mini tabela, tabela grande, teclado numérico, jogo) */
/* malha de quadradinhos: o tamanho de cada quadradinho vem do JS (cabe em 375 px mesmo em 10 × 10) */
.tbfig{margin:10px 0}
.tbm{display:grid;gap:2px;justify-content:center;margin:0 auto}
.tbm i{display:block;background:var(--papel);border:1px solid var(--linha);border-radius:3px}
.tbm i.a{background:var(--azul2);border-color:var(--azul2)}
.tbm i.b{background:var(--laranja2);border-color:var(--laranja2)}
.tbm i.meia{background:var(--suave);border:1px dashed var(--tit2)}
.tbm i.fora{background:transparent;border:2px dashed var(--erro)}
.tbfig figcaption{text-align:center;margin:6px 0 0;font-size:.92rem}
.tbfato{font-size:1.6rem;font-weight:800;color:var(--tit);text-align:center;margin:8px 0 0;font-variant-numeric:tabular-nums}
.tbconta{font-weight:700;color:var(--tit);font-variant-numeric:tabular-nums}
.tbpede{font-size:1.05rem;margin:8px 0}
/* botões de mais e menos, escolha de fator */
.tbpasso{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:8px 0}
.tbpasso>span{min-width:9.5em}
.tbpasso button{min-width:48px;min-height:48px;padding:4px 12px;font-size:1.15rem}
.tbpasso button.ativo,.tbchips button.ativo,.tbmb button.ativo,.tbqnp button.ativo{background:var(--azul);border-color:var(--azul);color:#fff}
/* mini tabela pitagórica: 11 colunas em 343 px */
.tbmini{width:100%;max-width:440px;margin:8px auto 0;table-layout:fixed;border-collapse:separate;border-spacing:1px;font-size:.72rem;font-variant-numeric:tabular-nums}
.tbmini th,.tbmini td{height:26px;padding:0;text-align:center;overflow:hidden}
.tbmini th{color:var(--cinza);font-weight:700}
.tbmini td{background:var(--papel);border:1px solid var(--linha);border-radius:3px;color:var(--tinta)}
.tbmini td.dg{border-style:dashed;border-color:var(--tit2)}
.tbmini td.c{background:var(--suave);color:var(--tit);font-weight:700}
.tbmini td.nv{border:2px solid var(--laranja)}
.tbmini td.aq{background:var(--laranja2);border-color:var(--laranja2);color:#fff;font-weight:800}
.fb .tbmini td{background:var(--papel)}
.fb .tbmini td.c{background:var(--suave)}
.fb .tbmini td.aq{background:var(--laranja2)}
/* tabela grande: rola na horizontal dentro do próprio contêiner */
.tbrola{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:10px 0;border:1px solid var(--linha);border-radius:10px;background:var(--papel);padding:4px}
.tbtab{border-collapse:separate;border-spacing:2px;font-variant-numeric:tabular-nums;margin:0 auto}
.tbtab th{min-width:30px;height:30px;color:var(--cinza);font-weight:800;font-size:.9rem;text-align:center;background:var(--papel)}
.tbtab tbody th{position:sticky;left:0;z-index:1}

<script>
const D = {"partes": [{"n": 1, "titulo": "Números inteiros", "resumo": "comparar, somar, subtrair, multiplicar e dividir inteiros; expressões com sinais", "ideias": ["Na reta numérica, quanto mais à direita, maior o número. Por isso −1 é maior que −12.", "Soma com sinais iguais: some os valores e conserve o sinal. Com sinais diferentes: subtraia os valores sem o sinal e fique com o sinal do número que está mais longe do zero.", "Subtrair é somar o oposto: 3 − (−5) = 3 + 5.", "Na multiplicação e na divisão: sinais iguais dão resultado positivo; sinais diferentes dão negativo.", "Numa expressão: primeiro os parênteses; depois multiplicação e divisão; por fim soma e subtração, sempre da esquerda para a direita."], "q": [{"id": "p1q0", "texto": "Qual destes números inteiros é o MAIOR?", "alts": ["−12", "−1", "−9", "−5"], "certa": 1, "nivel": "Entrada", "tempo": 30, "just": "Na reta numérica, quanto mais à direita, maior. −1 é o mais próximo de zero.", "pista": "Desenhe uma reta numérica e marque o zero e os quatro números. Para que lado ficam os números maiores?", "alem": "Coloque os quatro números em ordem, do menor para o maior. Depois invente uma situação (temperatura ou saldo) em que essa ordem faça sentido e diga onde ficariam o 0 e o +2 na lista.", "erros": ["Você pode ter escolhido o maior valor sem olhar o sinal. Com números negativos acontece o contrário: quanto maior o valor sem o sinal, mais à esquerda ele fica.", null, "Você pode ter olhado só o tamanho do número, sem o sinal. Com sinal negativo, o número mais longe do zero fica mais à esquerda na reta. Confira a posição de cada um.", "Você pode ter escolhido um número do meio sem comparar os quatro. Marque todos na reta e veja qual fica mais à direita."]}, {"id": "p1q1", "texto": "Qual é o oposto de −7?", "alts": ["−7", "+7", "0", "−14"], "certa": 1, "nivel": "Entrada", "tempo": 30, "just": "O oposto troca o sinal: o oposto de −7 é +7.", "pista": "Na reta numérica, o oposto de um número fica do outro lado do zero, à mesma distância. Marque o −7 e veja onde cairia o seu oposto.", "alem": "Escolha três números inteiros e ache o oposto de cada um. Depois ache o oposto do oposto. O que você percebeu? Existe algum número igual ao próprio oposto?", "erros": ["Você repetiu o número sem trocar o sinal. O oposto tem o mesmo valor e o sinal contrário, então não pode ser igual ao número original.", null, "Você pode ter pensado no resultado da soma de um número com o seu oposto, que dá 0. Mas o 0 é o resultado dessa soma, não o oposto. Procure o número que, somado a −7, dá esse 0.", "Você provavelmente fez (−7) + (−7), dobrando o número. O oposto não soma nada: ele só troca o sinal e mantém a distância até o zero."]}, {"id": "p1q2", "texto": "Quanto é (−6) + (−4)?", "alts": ["−10", "10", "−24", "−2"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "Sinais iguais: soma os módulos (6 + 4 = 10) e conserva o sinal: −10.", "passos": ["Os dois números são negativos: os sinais são iguais.", "Some os valores sem o sinal: 6 + 4 = 10.", "Conserve o sinal negativo: −10."], "pista": "Pense em dívidas: você deve 6 reais e depois passa a dever mais 4 reais. A dívida total aumenta ou diminui?", "alem": "Invente outra soma de dois números negativos que também dê −10. Quantas você consegue achar? E se um dos números fosse positivo, como o resultado mudaria?", "erros": [null, "Você somou 6 + 4 e não considerou os sinais. Olhe o sinal dos dois números da conta e use isso para decidir o sinal do resultado.", "Você multiplicou 6 × 4 em vez de somar. O enunciado pede uma soma, então os valores se juntam e não se multiplicam.", "Você provavelmente fez 6 − 4 e ficou com o sinal negativo. Isso vale quando os sinais são diferentes. Aqui os dois números têm o mesmo sinal, então os valores se juntam."]}, {"id": "p1q3", "texto": "Quanto é 5 − 9?", "alts": ["−14", "4", "14", "−4"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "5 − 9 = 5 + (−9) = −4.", "pista": "Imagine que você tem 5 reais e precisa pagar 9 reais. Dá para pagar tudo? Sobra ou falta dinheiro?", "alem": "Escreva três outras subtrações em que o primeiro número é menor que o segundo e compare os resultados: o que eles têm em comum? Depois resolva 5 − 9 na reta numérica e conte os passos.", "erros": ["Você parece ter somado 5 + 9 e colocado o sinal de menos no resultado. A conta é uma subtração: comece no 5 e ande 9 passos para a esquerda na reta.", "Você provavelmente fez 9 − 5, trocando a ordem dos números. Na subtração a ordem importa: a conta começa em 5. Confira se 5 − 9 e 9 − 5 dão o mesmo resultado.", "Você parece ter somado 5 + 9 e colocado o sinal de menos no resultado. A conta é uma subtração: comece no 5 e ande 9 passos para a esquerda na reta.", null]}, {"id": "p1q4", "texto": "Quanto é 3 − (−5)?", "alts": ["−2", "2", "8", "−8"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "Subtrair é somar o oposto: 3 + 5 = 8.", "passos": ["Subtrair um número é somar o oposto dele.", "O oposto de −5 é +5. Então 3 − (−5) = 3 + 5.", "3 + 5 = 8."], "pista": "Subtrair um número é o mesmo que somar o oposto dele. Qual é o oposto de −5? Reescreva a conta como uma soma.", "alem": "Invente uma situação (temperatura ou dívida cancelada) que represente 3 − (−5). Depois calcule 3 − (−5) e (−5) − 3 e compare os dois resultados.", "erros": ["Você provavelmente fez 5 − 3, trocando a ordem e ignorando o sinal. A conta começa em 3 e subtrai o −5. Reescreva como soma antes de calcular.", "Você provavelmente fez 5 − 3, trocando a ordem e ignorando o sinal. A conta começa em 3 e subtrai o −5. Reescreva como soma antes de calcular.", null, "Você juntou 3 e 5, mas pôs sinal de menos no resultado. Confira o que acontece com o sinal quando se subtrai um número negativo."]}, {"id": "p1q5", "texto": "Quanto é (−3) × (−7)?", "alts": ["−10", "−21", "10", "21"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "Sinais iguais na multiplicação dão resultado positivo: 21.", "pista": "Comece multiplicando 3 por 7, sem se preocupar com o sinal. Depois decida o sinal: os dois fatores têm sinais iguais ou diferentes?", "alem": "Calcule (−3) × (−7), (−3) × (+7), (+3) × (−7) e (+3) × (+7). Quais resultados são iguais? Escreva com suas palavras uma regra para o sinal do produto.", "erros": ["Você somou 3 + 7 e ignorou o sinal de ×. A operação pedida é a multiplicação, não a soma.", "Você multiplicou os valores certo, mas o sinal pode estar errado. Compare os sinais dos dois fatores e revise a regra de sinais da multiplicação.", "Você somou 3 + 7 e ignorou o sinal de ×. A operação pedida é a multiplicação, não a soma.", null]}, {"id": "p1q6", "texto": "Quanto é −24 ÷ 6?", "alts": ["−4", "−18", "−30", "4"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "Sinais diferentes na divisão dão resultado negativo: −4.", "pista": "Descubra primeiro que número multiplicado por 6 dá 24. Depois olhe os sinais de −24 e de 6: são iguais ou diferentes?", "alem": "Escreva a multiplicação que confirma essa divisão. Depois invente uma divisão com resultado negativo e outra com o mesmo dividendo (−24) e resultado positivo.", "erros": [null, "Você parece ter feito (−24) + 6. O enunciado pede uma divisão: quantas vezes o 6 cabe em 24?", "Você parece ter feito (−24) − 6. O símbolo é ÷, então a conta é uma divisão, não uma subtração.", "Você dividiu os valores certo, mas o sinal pode estar errado. Compare os sinais de −24 e de 6 e revise a regra de sinais da divisão."]}, {"id": "p1q7", "texto": "A temperatura era −3 °C às 6h e chegou a 9 °C às 12h. Qual foi a variação?", "alts": ["+3 °C", "+12 °C", "−12 °C", "+6 °C"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "Variação = final − inicial = 9 − (−3) = 12 °C.", "pista": "Marque as duas temperaturas em um termômetro desenhado. Quantos graus separam a primeira da segunda, passando pelo zero?", "alem": "E se a temperatura caísse de 9 °C para −3 °C? Qual seria a variação? Depois invente outra situação (saldo ou altitude) com uma variação de mesmo tamanho.", "erros": ["Você pode ter usado os horários em vez das temperaturas (por exemplo, 9 − 6 = 3). A variação compara só as duas temperaturas, em °C.", null, "O tamanho da mudança parece certo, mas o sinal está trocado. Variação é a temperatura final menos a inicial. Veja se a temperatura subiu ou desceu e confira o sinal.", "Você provavelmente fez 9 − 3, ignorando que −3 está abaixo do zero. Para ir de −3 até 9, conte primeiro até o zero e depois até 9."]}, {"id": "p1q8", "texto": "Uma conta estava com saldo de −R$ 50 e recebeu R$ 80. Qual é o novo saldo?", "alts": ["+R$ 130", "−R$ 30", "+R$ 30", "−R$ 130"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "−50 + 80 = 30: sinais diferentes, subtrai os módulos e fica o sinal do maior.", "pista": "Desenhe a situação: você deve 50 reais e recebe 80. Primeiro use o dinheiro para pagar a dívida. Sobra dinheiro ou continua devendo?", "alem": "E se a conta tivesse recebido R$ 40 em vez de R$ 80? E R$ 50? Compare os três saldos e descubra a partir de que valor recebido o saldo deixa de ser negativo.", "erros": ["Você somou 50 + 80 ignorando que o saldo inicial era negativo. Antes de ter saldo positivo, é preciso pagar a dívida de 50.", "Você fez 80 − 50 certo, mas pode ter ficado com o sinal do −50. Compare o que a conta devia com o que recebeu: qual valor é maior? O sinal do resultado depende disso.", null, "Você somou 50 + 80 ignorando que o saldo inicial era negativo. Antes de ter saldo positivo, é preciso pagar a dívida de 50."]}, {"id": "p1q9", "texto": "Quanto é −8 + 3 × (−2)?", "alts": ["10", "−2", "−14", "14"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "Primeiro a multiplicação: 3 × (−2) = −6. Depois −8 + (−6) = −14.", "passos": ["A multiplicação vem antes da soma.", "3 × (−2) = −6 (sinais diferentes: resultado negativo).", "Agora −8 + (−6): sinais iguais, some e conserve o sinal: −14."], "pista": "Na ordem das operações, qual vem antes: a soma ou a multiplicação? Resolva essa parte primeiro, anote o resultado e só depois continue.", "alem": "Coloque parênteses em −8 + 3 × (−2) de modo que o resultado mude e calcule. Compare os dois resultados e explique por que a ordem das operações importa.", "erros": ["Você provavelmente fez (−8) + 3 = −5 primeiro e depois multiplicou por −2. Sem parênteses, a multiplicação vem antes da soma.", "Você parece ter feito 3 × 2 = 6, sem o sinal de −2, e depois (−8) + 6. Confira o sinal de 3 × (−2) antes de somar.", null, "Você parece ter juntado 8 e 6 sem considerar os sinais. Ache primeiro 3 × (−2), com sinal, e depois some com −8."]}], "mmcTool": null, "dica": ["Desenhe uma reta numérica no rascunho e ande nela com o dedo: somar um número positivo anda para a direita; somar um negativo anda para a esquerda.", "Em conta com sinais, decida o sinal do resultado antes de fazer a conta. A maioria dos erros é de sinal, não de conta."], "mapas": [8], "kahoot": {"n": 1, "t": "Números inteiros", "pin": "07659040", "url": "https://kahoot.it/challenge/07659040", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m1%200h1m3%200h5m1%200h1m3%200h7m-29%201h1m5%200h1m1%200h1m2%200h4m4%200h2m1%200h1m5%200h1m-29%201h1m1%200h3m1%200h1m1%200h2m1%200h3m1%200h2m1%200h3m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m3%200h1m3%200h1m2%200h1m1%200h2m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m3%200h3m2%200h3m2%200h1m1%200h3m1%200h1m-29%201h1m5%200h1m2%200h3m1%200h2m1%200h2m2%200h1m1%200h1m5%200h1m-29%201h7m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h7m-20%201h1m4%200h1m1%200h1m2%200h2m-21%201h1m2%200h6m1%200h1m1%200h4m1%200h1m1%200h1m1%200h1m2%200h1m1%200h3m-27%201h4m8%200h6m3%200h2m1%200h2m-28%201h1m1%200h2m2%200h2m3%200h1m2%200h2m4%200h1m1%200h1m3%200h1m-27%201h1m2%200h3m1%20 37%201h1m1%200h3m1%200h1m6%200h3m2%200h1m1%200h6m1%200h6m1%200h1m-35%201h1m1%200h3m1%200h1m3%200h2m2%200h1m2%200h1m2%200h4m1%200h1m1%200h1m1%200h2m2%200h2m1%200h1m-37%201h1m1%200h3m1%200h1m4%200h1m1%200h2m3%200h1m1%200h2m2%200h3m1%200h1m4%200h1m1%200h2m-37%201h1m5%200h1m2%200h1m1%200h2m2%200h2m5%200h3m1%200h1m1%200h1m3%200h1m3%200h1m-37%201h7m1%200h2m1%200h3m4%200h3m2%200h2m2%200h2m1%200h2m4%200h1%27%2F%3E%3C%2Fsvg%3E"}}, "deck": 0}, {"n": 2, "titulo": "Números decimais", "resumo": "comparar decimais, ligar decimal, fração e porcentagem, e as quatro operações", "ideias": ["Para comparar decimais, deixe todos com o mesmo número de casas: 0,7 = 0,700.", "Decimal, fração e porcentagem dizem a mesma coisa: 0,5 = 1/2 = 50% e 0,25 = 1/4 = 25%.", "Para somar e subtrair, alinhe vírgula embaixo de vírgula.", "Para multiplicar, faça a conta sem a vírgula e depois conte as casas decimais dos dois fatores.", "Para dividir, multiplique os dois números por 10 até a vírgula do divisor sumir: 2,4 ÷ 0,6 = 24 ÷ 6."], "q": [{"id": "p2q0", "texto": "Qual destes números é o MAIOR?", "alts": ["0,699", "0,7", "0,07", "0,65"], "certa": 1, "nivel": "Entrada", "tempo": 30, "just": "0,7 = 0,700, que é maior que 0,699, 0,65 e 0,07.", "passos": ["Deixe todos com três casas: 0,700; 0,699; 0,650; 0,070.", "Agora compare como se fossem inteiros: 700, 699, 650 e 70.", "O maior é 700, isto é, 0,7."], "pista": "Escreva todos os números com a mesma quantidade de casas depois da vírgula, acrescentando zeros à direita. Depois compare como se fossem números inteiros.", "alem": "Invente três números decimais diferentes, todos com três casas depois da vírgula, e coloque-os em ordem. Depois explique para um colega por que 0,65 engana quem olha só para o 65.", "erros": ["Você provavelmente achou que mais algarismos significam número maior, pois 699 é maior que 7. Em decimais, o que importa é a casa de cada algarismo, não a quantidade deles. Complete com zeros e compare.", null, "Você pode ter olhado só para o 7 e esquecido o zero logo depois da vírgula. Esse zero faz o 7 valer só 7 centésimos. Confira em qual casa decimal o 7 está.", "Você provavelmente comparou só o 65 com o 7 e achou que 65 é maior. Mas os algarismos estão em casas diferentes. Complete com zeros para igualar as casas e compare de novo."]}, {"id": "p2q1", "texto": "Qual fração é igual a 0,25?", "alts": ["1/4", "25/10", "2/5", "1/25"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "0,25 = 25/100 = 1/4.", "pista": "0,25 se lê \"25 centésimos\". Escreva essa fração com denominador 100 e veja se dá para simplificar, dividindo em cima e embaixo pelo mesmo número.", "alem": "Escreva duas frações diferentes que valham 0,25. Depois invente uma situação com dinheiro em que o valor 0,25 apareça.", "erros": [null, "O 25 em cima combina com 25 centésimos, mas o denominador 10 serve para uma casa decimal. Em 0,25 são duas casas. Confira: 25/10 é maior ou menor que 1?", "Você pode ter separado os algarismos 2 e 5 e colocado um em cima e outro embaixo. Isso não transforma um decimal em fração. Confira dividindo 2 por 5: dá 0,25?", "Você provavelmente usou o 25 como denominador. Mas 0,25 tem duas casas decimais, o que indica partes de 100. Confira qual denominador combina com duas casas depois da vírgula."]}, {"id": "p2q2", "texto": "O número 0,5 é o mesmo que:", "alts": ["5%", "0,5%", "1/5", "50%"], "certa": 3, "nivel": "Entrada", "tempo": 30, "just": "0,5 = 50/100 = 50%.", "pista": "Porcentagem é uma fração com denominador 100. Complete: 0,5 = 5/10 = ?/100.", "alem": "Escreva 0,2, 0,75 e 1,5 como porcentagem. Invente uma regra para passar qualquer decimal para porcentagem e teste se ela funciona com 1,5.", "erros": ["Você provavelmente pegou o algarismo 5 e colocou o símbolo %. Mas 5% é 5/100, um valor bem menor que 0,5. Escreva 0,5 como fração de denominador 100 e compare.", "Você copiou o número e acrescentou o símbolo %, sem converter. Porcentagem quer dizer \"de cada 100\". Confira: 0,5% é meio por cento, bem menos que 0,5 do inteiro.", "Você pode ter confundido 0,5 com \"um quinto\" por causa do algarismo 5. Divida 1 por 5 e veja se o resultado é 0,5.", null]}, {"id": "p2q3", "texto": "Quanto é 2,50 + 0,75?", "alts": ["3,25", "3,00", "3,3", "2,57"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "Alinhando as vírgulas: 2,50 + 0,75 = 3,25.", "pista": "Arme a conta com vírgula embaixo de vírgula. Some primeiro os centésimos, depois os décimos, e lembre de levar para a casa seguinte quando passar de 9.", "alem": "Invente dois números decimais com duas casas cuja soma dê exatamente um número inteiro. Quantos pares diferentes você consegue achar?", "erros": [null, "Você provavelmente tratou 0,75 como 0,50, ou deixou de somar alguns centésimos. Some todas as casas, inclusive os centésimos, e confira o que sobra.", "Esse valor tem só uma casa decimal, mas a conta tem duas. Confira se algum centésimo ficou de fora da soma e refaça sem arredondar.", "Você provavelmente somou só as partes inteiras (2 + 0 = 2) e juntou os algarismos depois da vírgula sem somar 50 + 75 centésimos. Alinhe as vírgulas e some casa por casa, da direita para a esquerda."]}, {"id": "p2q4", "texto": "Quanto é 4,00 − 1,35?", "alts": ["3,35", "3,65", "2,65", "2,35"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "Alinhando as vírgulas: 4,00 − 1,35 = 2,65.", "pista": "Escreva 4,00 alinhado com 1,35 e comece pelos centésimos. Como 0 é menor que 5, será preciso pegar emprestado. Outra ideia: quanto falta de 1,35 até 4,00, como num troco?", "alem": "Resolva de dois jeitos: armando a conta e completando de 1,35 até 4,00, como num troco. Depois invente uma compra paga com R$ 10,00 em que o troco tenha centavos e calcule.", "erros": ["Você provavelmente fez 4 − 1 = 3 e só copiou o 35, sem tirar essa parte. Os décimos e os centésimos também precisam ser subtraídos. Confira somando: 3,35 + 1,35 volta a dar 4,00?", "Você provavelmente subtraiu só 0,35 e esqueceu de tirar o 1 inteiro. Refaça tirando o número 1,35 completo. Depois confira: 3,65 + 1,35 volta a dar 4,00?", null, "Parece que o empréstimo não foi feito do jeito certo e os algarismos de baixo foram só copiados. Quando o número de cima é menor, é preciso pegar emprestado da casa ao lado. Confira somando: 2,35 + 1,35 volta a dar 4,00?"]}, {"id": "p2q5", "texto": "Quanto é 0,4 × 0,5?", "alts": ["2", "0,9", "0,02", "0,2"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "4 × 5 = 20, e há 2 casas decimais nos fatores: 0,20 = 0,2.", "passos": ["Multiplique sem a vírgula: 4 × 5 = 20.", "Conte as casas decimais dos fatores: uma em 0,4 e uma em 0,5. São 2 casas.", "Coloque 2 casas no resultado: 0,20, que é o mesmo que 0,2."], "pista": "Multiplique os números sem a vírgula (4 × 5). Depois conte quantas casas decimais há nos dois fatores juntos e coloque a vírgula para esse total de casas.", "alem": "Calcule 0,4 × 0,5 de outro jeito, usando as frações 4/10 × 5/10, e compare os resultados. Depois, sem calcular, diga se esse produto é maior ou menor que 0,4 e explique por quê.", "erros": ["Você provavelmente multiplicou 4 × 5 e esqueceu a vírgula, ou deslocou só uma casa. Cada fator tem uma casa decimal, então a vírgula deve ficar em outra posição. Confira: o produto de dois números menores que 1 é maior ou menor que cada um deles?", "Você somou 0,4 + 0,5 em vez de multiplicar. Releia o sinal da operação e multiplique.", "Você provavelmente multiplicou os números sem a vírgula, mas andou casas demais com a vírgula. Conte as casas decimais de cada fator e some. Confira também se o tamanho do resultado faz sentido.", null]}, {"id": "p2q6", "texto": "Quanto é 2,4 ÷ 0,6?", "alts": ["40", "4", "1,8", "0,4"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "Multiplicando os dois por 10: 24 ÷ 6 = 4.", "pista": "Multiplique o 2,4 e o 0,6 pelo mesmo número para que o divisor deixe de ter vírgula. A divisão continua com o mesmo resultado. Depois divida números inteiros.", "alem": "Invente outra divisão de decimais, com números diferentes de 2,4 e 0,6, que também dê 4. Quantas você consegue criar? Compare com um colega.", "erros": ["Você provavelmente tirou a vírgula do 2,4 (virou 24) e não fez o mesmo com o 0,6. Os dois números precisam ser multiplicados pelo mesmo valor. Refaça com ambos.", null, "Você subtraiu 2,4 − 0,6 em vez de dividir. Releia o sinal da operação.", "Você provavelmente dividiu 2,4 por 6, ignorando a vírgula do 0,6. Dividir por 0,6 é diferente de dividir por 6. Multiplique os dois números por 10 e refaça."]}, {"id": "p2q7", "texto": "3 pacotes de R$ 4,50 e um refrigerante de R$ 6,25. Qual é o total?", "alts": ["R$ 18,75", "R$ 24,25", "R$ 19,75", "R$ 19,25"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "3 × 4,50 = 13,50. Depois 13,50 + 6,25 = 19,75.", "passos": ["Primeiro os pacotes: 3 × 4,50 = 13,50.", "Depois some o refrigerante, vírgula embaixo de vírgula: 13,50 + 6,25 = 19,75.", "O total é R$ 19,75."], "pista": "Divida em duas partes: primeiro descubra quanto custam os 3 pacotes juntos, somando ou multiplicando. Depois some o valor do refrigerante.", "alem": "Invente outro problema de compras, com dois itens, em que um deles é comprado em várias unidades e o total seja o mesmo. Troque com um colega e confiram.", "erros": ["Essa resposta supõe R$ 12,50 pelos três pacotes. Você pode ter feito 3 × 4 = 12 e somado os 50 centavos só uma vez. Refaça 3 × 4,50 somando 4,50 três vezes.", "Esse total parece vir de 4 pacotes em vez de 3. Releia o enunciado e confira a quantidade de pacotes.", null, "Provavelmente a conta dos 50 centavos saiu errada: 3 × 0,50 não dá 1,00. Confira 3 × 0,50 e depois some o refrigerante."]}, {"id": "p2q8", "texto": "Quanto é 2 + 3,5 × 2?", "alts": ["12", "11", "7", "9"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "A multiplicação vem antes: 3,5 × 2 = 7. Depois 2 + 7 = 9.", "pista": "Antes de calcular, pergunte: numa expressão com soma e multiplicação, qual operação se faz primeiro? Resolva essa parte e só depois faça a outra.", "alem": "Invente uma expressão com soma e multiplicação em que fazer as contas da esquerda para a direita dê resultado diferente da ordem correta. Mostre os dois resultados e explique a diferença.", "erros": ["Esse valor aparece se o 3,5 for lido como 5: 2 + 5 × 2 = 12. Confira o número 3,5 inteiro, com a parte depois da vírgula, antes de calcular, e respeite a ordem das operações.", "Você provavelmente fez primeiro 2 + 3,5 e depois multiplicou por 2. Mas a multiplicação vem antes da soma, a menos que haja parênteses. Refaça na ordem certa.", "Você provavelmente fez só a multiplicação 3,5 × 2 e esqueceu de somar o 2 do início. Depois de multiplicar, falta terminar a conta.", null]}, {"id": "p2q9", "texto": "Uma garrafa tem 1,5 L. Quantos copos de 0,25 L ela enche, sem sobrar?", "alts": ["1,75", "0,375", "6", "4"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "1,5 ÷ 0,25 = 6.", "pista": "0,25 L é um quarto de litro. Pense em quantos copos cabem em 1 litro e depois quantos cabem no resto da garrafa. Ou divida 1,5 por 0,25 depois de multiplicar os dois por 100.", "alem": "Se a garrafa tivesse 2 L, quantos copos de 0,25 L ela encheria? E de 0,2 L? Explique o que muda e o que se mantém no jeito de calcular.", "erros": ["Você somou 1,5 + 0,25. Mas o problema pede quantas vezes o copo cabe na garrafa, e isso não é uma soma de litros. Releia a pergunta.", "Você multiplicou 1,5 × 0,25 em vez de dividir. A pergunta é quantos copos cabem, e isso é uma divisão. Confira: caberia menos de um copo na garrafa?", null, "Você provavelmente calculou só o primeiro litro e esqueceu o meio litro que sobra na garrafa. Confira também quantos copos cabem nos 0,5 L restantes."]}], "mmcTool": null, "dica": ["Leia o decimal como dinheiro: 2,50 é dois reais e cinquenta centavos. Fica mais fácil comparar e somar.", "Antes de calcular, faça uma estimativa: 3 × 4,50 dá perto de 13. Alternativa muito longe disso pode ser descartada."], "mapas": [9], "kahoot"  mesmo denominador e compare os numeradores.", "Com o mesmo numerador, a fração de maior denominador é a menor: 1/5 é menor que 1/2.", "Fração de uma quantidade: divida pelo denominador e multiplique pelo numerador."], "q": [{"id": "p3q0", "texto": "Em 3/4, o número 4 mostra:", "alts": ["em quantas partes iguais o inteiro foi dividido", "o total de pessoas da turma", "quantas partes foram pintadas", "o resultado da divisão"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "O denominador diz em quantas partes iguais o inteiro foi dividido.", "pista": "Desenhe uma barra de chocolate e pense em como ela é repartida antes de alguém pegar um pedaço. Qual dos dois números da fração fala da repartição e qual fala dos pedaços que alguém pegou?", "alem": "Desenhe a fração 3/4 de dois jeitos diferentes (uma barra e um círculo, por exemplo). Depois explique a um colega o que muda e o que continua igual nos dois desenhos.", "erros": [null, "Essa alternativa inventa um dado que a fração não traz. O 3/4 não fala de pessoas, e sim de partes de um inteiro. Confira o que o número de baixo conta dentro do desenho do inteiro.", "Você trocou o papel dos números. Quem diz quantas partes foram pintadas ou pegas é o numerador, que fica em cima. Confira qual número fala da divisão do inteiro.", "Você leu a fração como uma conta já resolvida, como se o 4 fosse a resposta. O 4 não é resultado de nada: ele conta as partes iguais em que o inteiro foi repartido. Confira o papel de cada número no desenho."]}, {"id": "p3q1", "texto": "Qual fração é equivalente a 2/3?", "alts": ["5/6", "3/2", "2/6", "4/6"], "certa": 3, "nivel": "Entrada", "tempo": 30, "just": "Multiplicando numerador e denominador por 2: 2/3 = 4/6.", "passos": ["Para achar uma fração equivalente, multiplique em cima e embaixo pelo mesmo número.", "Multiplicando por 2: 2 × 2 = 4 e 3 × 2 = 6.", "Então 2/3 = 4/6."], "pista": "Frações equivalentes são a mesma quantidade escrita com números diferentes. Pense: o que posso fazer com o número de cima e com o de baixo, juntos, para dividir o inteiro em mais partes sem mudar a quantidade?", "alem": "Escreva mais três frações equivalentes a 2/3 e explique como achou cada uma. Depois invente uma fração que parece equivalente a 2/3, mas não é, e mostre por que não é.", "erros": ["Parece que você somou 3 aos dois termos (2 + 3 = 5 e 3 + 3 = 6). Somar não mantém o valor da fração; o que mantém é multiplicar (ou dividir) os dois termos pelo mesmo número.", "Você trocou o numerador de lugar com o denominador. Isso inverte a fração e muda o valor: 3/2 é maior que 1, e 2/3 é menor que 1. Para achar uma equivalente, os dois números mudam pelo mesmo fator.", "Você mudou só o denominador. O inteiro foi dividido em mais partes, mas continuou-se pegando o mesmo número delas, e a quantidade diminuiu. Para manter o valor, o numerador também precisa mudar pelo mesmo fator.", null]}, {"id": "p3q2", "texto": "Simplificando 6/8, obtemos:", "alts": ["3/8", "2/3", "1/2", "3/4"], "certa": 3, "nivel": "Entrada", "tempo": 30, "just": "Dividindo por 2 em cima e embaixo: 6/8 = 3/4.", "pista": "Simplificar é achar uma fração equivalente com números menores. Procure um número que divida o 6 e o 8 ao mesmo tempo e use-o nos dois.", "alem": "Simplifique 12/16 por dois caminhos diferentes (por exemplo, dividindo por 2 duas vezes, ou por um número maior de uma vez) e compare os resultados. O que você percebe?", "erros": ["Você dividiu só o numerador por 2 e deixou o denominador igual. Isso muda o valor da fração. Na simplificação, o de cima e o de baixo são divididos pelo mesmo número.", "Parece que os dois termos foram divididos por números diferentes (6 ÷ 3 = 2 e 8 ÷ ... para chegar a 3). Para conferir: multiplicando 2/3 por 4 em cima e embaixo, dá 8/12, e não 6/8. Na simplificação, o divisor é o mesmo nos dois termos.", "Você dividiu os dois termos por números diferentes (6 ÷ 6 = 1 e 8 ÷ 4 = 2), e o valor mudou: 1/2 é o mesmo que 4/8, que é menos que 6/8. Para simplificar, divida o de cima e o de baixo pelo mesmo número.", null]}, {"id": "p3q3", "texto": "Qual é a MAIOR fração: 2/3, 3/4, 5/8 ou 1/2?", "alts": ["5/8", "2/3", "1/2", "3/4"], "certa": 3, "nivel": "Aplicação", "tempo": 60, "just": "Com denominador 24: 16/24, 18/24, 15/24 e 12/24. O maior é 18/24 = 3/4.", "passos": ["Escolha um denominador comum: 24 é múltiplo de 3, 4, 8 e 2.", "Reescreva: 2/3 = 16/24, 3/4 = 18/24, 5/8 = 15/24 e 1/2 = 12/24.", "O maior numerador é 18. A maior fração é 18/24 = 3/4."], "mmc": [2, 3, 4, 8], "mmcPasso": 0, "pista": "Os denominadores são diferentes, então comparar só olhando pode enganar. Procure um número que seja múltiplo de 3, de 4, de 8 e de 2, e reescreva todas as frações com ele embaixo.", "alem": "Invente uma quinta fração que seja maior que todas essas quatro, mas menor que 1. Depois explique como você sabe que ela é maior que cada uma.", "erros": ["Você provavelmente escolheu pelos números maiores (5 e 8). Em fração, o tamanho dos números não indica o tamanho da quantidade. Reescreva com denominador comum e compare os numeradores.", "Com denominadores diferentes, só dá para comparar depois de igualá-los. Reescreva 2/3 e as outras frações com o mesmo denominador e compare os numeradores.", "Você pode ter achado que o menor denominador (2) dá a maior fração, ou escolhido a fração mais conhecida. Compare com as outras usando um denominador comum e veja quantas partes de cada tamanho aparecem.", null]}, {"id": "p3q4", "texto": "Qual fração está entre 1/2 e 1?", "alts": ["1/4", "3/4", "1/3", "5/4"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "3/4 = 0,75, entre 0,5 e 1.", "pista": "Imagine uma reta de 0 a 1 com o 1/2 marcado no meio. Procure uma fração que fique depois do meio, mas antes do 1. O numerador precisa ser maior ou menor que a metade do denominador? E precisa ser menor ou maior que o denominador?", "alem": "Ache duas outras frações diferentes que também estejam entre 1/2 e 1. Depois explique como você sabe que existem muitas, e não só uma.", "erros": ["1/4 é menor que 1/2: fica antes do meio da reta. Você pode ter pensado que, como o 4 é um número grande, a fração também é grande. Confira se 1/4 fica antes ou depois do 1/2.", null, "1/3 é menor que 1/2: o inteiro foi dividido em 3 partes e só uma foi pega, o que dá menos que a metade. Confira se essa fração passa do meio da reta.", "Aqui o numerador é maior que o denominador, e isso dá mais de um inteiro. Então 5/4 passa do 1, em vez de ficar entre 1/2 e 1. Confira se o numerador é menor que o denominador."]}, {"id": "p3q5", "texto": "Quanto é 3/5 de 20?", "alts": ["8", "4", "12", "15"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "20 ÷ 5 = 4, e 4 × 3 = 12.", "pista": "Pense em duas etapas: primeiro divida o 20 em partes iguais, de acordo com o denominador; depois conte quantas dessas partes o numerador pede.", "alem": "Calcule 3/5 de 40 e de 60. Depois invente um problema do dia a dia que use \"3/5 de\" e peça a um colega que o resolva de outro jeito.", "erros": ["Você pode ter achado a parte que sobra (2/5 de 20), e não 3/5. Releia a pergunta: ela pede a parte indicada pelo numerador 3.", "Você fez só a primeira etapa: dividiu 20 por 5 e achou o valor de uma parte. Mas a fração pede 3 dessas partes. Falta usar o numerador.", null, "Parece que você fez 20 − 5, subtraindo o denominador. Essa conta não representa 3/5. Para achar uma fração de um número, divida pelo denominador e multiplique pelo numerador."]}, {"id": "p3q6", "texto": "Qual sequência está em ordem CRESCENTE?", "alts": ["1/2, 1/5, 1/3", "1/5, 1/3, 1/2", "1/3, 1/5, 1/2", "1/2, 1/3, 1/5"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "Com o mesmo numerador, quanto maior o denominador, menor a fração: 1/5 < 1/3 < 1/2.", "pista": "Crescente é do menor para o maior. Desenhe três barras iguais: numa pinte 1 de 5 partes, em outra 1 de 3 e na última 1 de 2. Compare o tamanho do pedaço pintado em cada uma.", "alem": "Qual destas frações não pertence ao grupo e por quê: 1/10, 1/8, 1/4, 2/3? Depois invente uma sequência crescente com quatro frações de denominadores diferentes.", "erros": ["Essa ordem não é crescente nem decrescente: sobe e desce. Compare as frações duas a duas: quando o numerador é o mesmo, o denominador menor dá a fração maior.", null, "O 1/5 ficou fora de lugar: ele está depois do 1/3. Compare 1/3 e 1/5 numa barra: com mais partes, cada fatia fica menor. Confira qual das duas deve vir primeiro.", "Essa sequência vai do maior para o menor. Você pode ter lido \"crescente\" ao contrário, ou ter achado que denominador maior dá fração maior. Com o mesmo numerador, mais partes significam fatias menores."]}, {"id": "p3q7", "texto": "Pedro leu 3/8 de um livro e Ana leu 5/12. Quem leu MAIS?", "alts": ["Ana: 10/24 é maior que 9/24", "Não dá para comparar", "Pedro: 8 é menor que 12", "Os dois leram a mesma parte"], "certa": 0, "nivel": "Raciocínio", "tempo": 90, "just": "3/8 = 9/24 e 5/12 = 10/24. Ana leu mais.", "passos": ["Denominador comum de 8 e 12: 24.", "3/8 = 9/24 (multiplicou por 3) e 5/12 = 10/24 (multiplicou por 2).", "10/24 é maior que 9/24. Ana leu mais."], "mmc": [8, 12], "mmcPasso": 0, "pista": "Os dois leram partes do mesmo tipo de livro, mas contadas em partes de tamanhos diferentes. Que tal reescrever as duas frações com um denominador que sirva para os dois (um múltiplo de 8 e de 12)?", "alem": "Se Pedro lesse mais 1/24 do livro, ele passaria Ana, ficaria igual ou continuaria atrás? E se lesse mais 2/24? Depois invente duas frações de leitura de outras pessoas e diga quem leu mais.", "erros": [null, "Dá para comparar, sim: basta reescrever as duas frações com denominadores iguais, usando frações equivalentes. Denominadores diferentes só pedem um passo a mais.", "Você comparou só os denominadores e achou que o menor dá a fração maior. Os numeradores também contam. Compare as frações depois de igualar os denominadores.", "Essas frações parecem próximas, mas não têm o mesmo valor. Com denominadores diferentes, só dá para comparar depois de igualá-los: reescreva as duas com o mesmo denominador e compare os numeradores."]}, {"id": "p3q8", "texto": "Uma pizza tem 8 fatias iguais. Ana comeu 3 e Beto comeu 2. Que fração sobrou?", "alts": ["3/5", "2/8", "3/8", "5/8"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "Comeram 5 de 8. Sobraram 3 de 8.", "pista": "A pergunta é sobre o que sobrou, e não sobre o que foi comido. Descubra quantas fatias foram comidas ao todo e quantas restam das fatias da pizza inteira.", "alem": "Se Carla chegasse e comesse 1/8 da pizza, que fração sobraria? Depois invente outro problema de pizza em que a fração que sobra seja a mesma, mas com um número diferente de fatias.", "erros": ["Aqui o denominador é o total de fatias comidas, mas a fração deve ser em relação à pizza inteira. O inteiro tem 8 fatias, e não só as que foram comidas. Confira qual é o inteiro.", "Você considerou só as fatias de Beto e ignorou as de Ana. Some as fatias comidas pelos dois antes de ver o que sobra.", null, "Você achou a fração que foi comida (3 + 2 fatias), e não a que sobrou. Releia a pergunta: ela quer o que restou. Confira quantas fatias faltam para completar as 8."]}, {"id": "p3q9", "texto": "Qual fração está MAIS PERTO de 1?", "alts": ["7/8", "5/6", "3/4", "4/5"], "certa": 0, "nivel": "Raciocínio", "tempo": 90, "just": "Faltam 1/8, 1/4, 1/6 e 1/5. A menor falta é 1/8, então 7/8.", "pista": "Pense em quanto falta para cada fração chegar a um inteiro. Em 3/4, por exemplo, falta uma parte do tamanho 1/4. Qual fração deixa a menor parte faltando?", "alem": "Invente uma fração que esteja ainda mais perto de 1 do que todas as da lista. Depois responda: existe uma fração que seja a mais perto de 1 de todas? Explique do seu jeito.", "erros": [null, "Em 5/6 falta 1/6. Você pode ter olhado só para os números 5 e 6, que são vizinhos, sem comparar o que falta. Veja quanto falta em cada fração e compare o tamanho dessas partes.", "Em 3/4 falta 1/4 para chegar a 1. Compare essa parte que falta com a que falta nas outras frações para ver quem chega mais perto de 1.", "Em 4/5 falta 1/5. É uma fração próxima de 1, mas outra das opções deixa faltando uma parte menor. Compare o tamanho das partes que faltam em cada fração."]}], "mmcTool": [8, 12], "dica": ["Travou? Desenhe a fração em uma barra ou em uma pizza. Enxergar a quantidade vale mais que decorar a regra.", "Para comparar frações, pergunte primeiro: é mais ou menos que a metade? Isso pode já separar as alternativas."], "mapas": [4], "kahoot": {"n": 3, "t": "Frações: equivalência e comparação", "pin": "07567453", "url": "https://kahoot.it/challenge/07567453", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3D%27M2%202.5h7m1%200h2m1%200h4m2%200h2m3%200h7m-29%201h1m5%200h1m3%200h1m2%200h2m1%200h1m2%200h2m1%200h1m5%200h1m-29%201h1m1%200h3m1%200h1m2%200h2m1%200h1m3%200h2m2%200h1m1%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m6%200h1m2%200h2m2%200h1m1%200h3m1%200h1m-29%201h1m1%200h3m1%200h1m1%200h1m2%200h2m1%200h2m2%200h1m3%200h1m1%200h3m1%200h1m-29%201h1m5%200h1m1%200h1m2%200h2m3%200h1m2%200h1m2%200h1m5%200h1m-29%201h7m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h1m1%200h7m-21%201h3m1%200h2m1%200h1m1%200h2m-19%201h1m3%200h1m1%200h4m1%200h3m2%200h2m1%200h7m2%200h1m-29%201h2m1%200h1m7%200h5m1%200h2m3%200h7m-28%201h1m2%200h4m2%200h1m4%200h2m1%200h1m5%200h1m3%200h1m-27%201h1m2%200h1m1%200h3m4%200h2m1%200h1m6%200h2m1%200h2m-29%201h5m1%200h4m1%200h4m1%200h2m2%200h2m5%200h1m-28%201h4m3%200h3m2%200h1m2%200h1m2%200h1m2%200h8m-26%201h1m2%200h2m2%200h1m1%200h4m2%200h1m1%200h1m1%200h2m1%200h2m1%200h1m-27%201h2m1%200h1m2%200h1m2%200h3m3%200h3m1%200h4m2%200h2m-29%201h2m1%200h1m2%200h2m3%200h1m1%200h1m2%200h2m1%200h2m6%200h1m-28%201h3m1%200h2m1%200h1m2%20 h1m1%200h5%27%2F%3E%3C%2Fsvg%3E"}}, "deck": 1}, {"n": 4, "titulo": "Frações: as quatro operações", "resumo": "somar e subtrair com denominadores diferentes, multiplicar, dividir e problemas", "ideias": ["Para somar ou subtrair frações, elas precisam ter o mesmo denominador. Se não têm, use o MMC: o primeiro número que aparece na tabuada dos dois denominadores.", "Para multiplicar: numerador vezes numerador e denominador vezes denominador.", "Para dividir: multiplique pela fração invertida. Dividir por 1/2 é multiplicar por 2.", "O inteiro pode virar fração: 1 = 5/5 = 8/8.", "No final, simplifique o resultado sempre que der."], "q": [{"id": "p4q0", "texto": "Quanto é 3/8 + 2/8?", "alts": ["6/8", "1/8", "5/16", "5/8"], "certa": 3, "nivel": "Entrada", "tempo": 30, "just": "Mesmo denominador: soma os numeradores e mantém o denominador.", "pista": "Os dois pedaços são do mesmo tamanho: oitavos. Imagine uma pizza cortada em 8 fatias iguais. Quantas fatias você tem ao juntar as duas quantidades? O tamanho de cada fatia muda?", "alem": "Encontre outras duas frações com denominador 8 cuja soma seja a mesma. Existe mais de uma dupla? Explique para um colega por que somar os denominadores engana.", "erros": ["Você provavelmente multiplicou os numeradores (3 × 2 = 6) em vez de somar. Juntar quantidades de pedaços iguais pede soma. Confira a operação.", "Você subtraiu os numeradores (3 − 2 = 1). A conta pede juntar as duas quantidades, não tirar uma da outra. Confira o sinal.", "Você somou os numeradores e também os denominadores (8 + 8 = 16). Quando o denominador é igual, o tamanho do pedaço não muda: só se conta quantos pedaços há.", null]}, {"id": "p4q1", "texto": "Quanto é 1/4 + 1/6?", "alts": ["5/12", "2/10", "2/24", "1/5"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "1/4 = 3/12 e 1/6 = 2/12. A soma é 5/12.", "passos": ["Os denominadores são diferentes. O MMC de 4 e 6 é 12.", "Reescreva: 1/4 = 3/12 e 1/6 = 2/12.", "Some os numeradores: 3/12 + 2/12 = 5/12."], "mmc": [4, 6], "mmcPasso": 0, "pista": "Os pedaços têm tamanhos diferentes, então ainda não dá para juntar. Liste alguns múltiplos de 4 e alguns múltiplos de 6 e procure o primeiro número que aparece nas duas listas. Ele pode ser o novo denominador.", "alem": "Resolva de outro jeito, usando 24 como denominador comum ou desenhando barras, e compare com o primeiro caminho. Depois troque 1/6 por 1/3 e veja o que muda.", "erros": [null, "Você somou os numeradores (1 + 1 = 2) e os denominadores (4 + 6 = 10). Denominadores diferentes não se somam: primeiro deixe os dois iguais, escrevendo frações equivalentes.", "Você somou os numeradores (1 + 1 = 2) e multiplicou os denominadores (4 × 6 = 24), sem escrever frações equivalentes. Para somar, os pedaços precisam ter o mesmo tamanho antes da conta.", "Você provavelmente chegou a 2/10 somando numeradores e denominadores, e depois simplificou para 1/5. Volte e deixe os denominadores iguais antes de somar."]}, {"id": "p4q2", "texto": "Quanto é 5/8 − 1/8?", "alts": ["1/2", "1/8", "6/8", "4/16"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "5/8 − 1/8 = 4/8, que simplifica para 1/2.", "pista": "Os pedaços já são do mesmo tamanho. Pense em uma pizza de 8 fatias: quantas fatias sobram quando você tem 5 e tira 1? Depois veja se a fração obtida pode ser simplificada.", "alem": "Invente outra subtração de frações com denominador 8 que dê o mesmo resultado desta. Quantas você consegue achar?", "erros": [null, "Você parece ter ficado só com a fração que é tirada, sem calcular quantos oitavos sobram. Confira quantas fatias restam ao tirar 1 de 5.", "Você somou os numeradores (5 + 1 = 6), mas a conta é de tirar. Confira o sinal da operação.", "Você mexeu no denominador (8 + 8 = 16). Em frações com denominador igual, o tamanho do pedaço continua o mesmo; só o número de pedaços muda."]}, {"id": "p4q3", "texto": "Quanto é 3/4 − 1/6?", "alts": ["1/3", "7/12", "2/2", "5/12"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "3/4 = 9/12 e 1/6 = 2/12. A diferença é 7/12.", "mmc": [4, 6], "pista": "Os pedaços têm tamanhos diferentes, então primeiro é preciso um denominador comum. Liste os múltiplos de 4 e de 6, escolha o menor que aparece nos dois e reescreva cada fração com ele antes de subtrair.", "alem": "Invente uma subtração de duas frações com denominadores diferentes cujo resultado seja 1/12. Há mais de uma possibilidade?", "erros": ["Você provavelmente subtraiu os numeradores (3 − 1 = 2) e usou o denominador 6 (2/6 = 1/3), sem escrever frações equivalentes. Os pedaços de 1/4 e de 1/6 têm tamanhos diferentes.", null, "Você subtraiu os numeradores (3 − 1 = 2) e os denominadores (6 − 4 = 2). Denominadores diferentes não se subtraem: primeiro deixe os dois iguais.", "Você provavelmente escreveu 1/6 como 4/12, e 4/12 não é igual a 1/6. Ao multiplicar o denominador por um número, o numerador precisa ser multiplicado pelo mesmo número. Confira a conversão de cada fração."]}, {"id": "p4q4", "texto": "Quanto é 3/4 × 2/9?", "alts": ["6/13", "1/6", "27/8", "5/13"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "3 × 2 = 6 e 4 × 9 = 36. 6/36 simplifica para 1/6.", "pista": "Na multiplicação de frações não é preciso denominador comum. Multiplique os numeradores entre si e os denominadores entre si. No fim, veja se dá para simplificar.", "alem": "Resolva de outro jeito: simplifique antes de multiplicar, cortando fatores comuns, e compare. Depois invente duas outras frações cujo produto seja o mesmo.", "erros": ["Você multiplicou os numeradores (3 × 2 = 6), mas somou os denominadores (4 + 9 = 13). Os dois lados da fração são multiplicados.", null, "Você inverteu a segunda fração (9/2) antes de multiplicar, como se fosse uma divisão. Em uma multiplicação, as frações ficam como estão.", "Você somou os numeradores (3 + 2 = 5) e os denominadores (4 + 9 = 13). A conta é de multiplicar: numerador com numerador e denominador com denominador."]}, {"id": "p4q5", "texto": "Quanto é 3/4 ÷ 1/2?", "alts": ["3/2", "2/3", "3/8", "1/2"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "Multiplica pelo inverso: 3/4 × 2/1 = 6/4 = 3/2.", "passos": ["Dividir por uma fração é multiplicar pelo inverso dela.", "O inverso de 1/2 é 2/1. Então 3/4 × 2/1 = 6/4.", "Simplifique por 2: 6/4 = 3/2."], "pista": "Pense em uma pergunta menor: quantas metades cabem em 3/4? Se ajudar, desenhe uma barra e marque 3/4 dela. Depois compare com a regra de multiplicar pelo inverso da segunda fração.", "alem": "Resolva com um desenho de barras e com a regra do inverso, e compare. Depois troque o divisor por 1/4 e preveja, antes de calcular, se o resultado vai aumentar ou diminuir. Por quê?", "erros": [null, "Você parece ter dividido na ordem trocada (1/2 ÷ 3/4 = 2/3). A ordem importa: o primeiro número é o que está sendo dividido.", "Você multiplicou as duas frações diretamente (3 × 1 = 3 e 4 × 2 = 8). Na divisão, a segunda fração precisa ser invertida antes de multiplicar.", "Essa fração é o próprio divisor do enunciado, como se a primeira fração tivesse sido ignorada. Confira se a conta usou as duas frações."]}, {"id": "p4q6", "texto": "Quanto é 1 − 3/5?", "alts": ["−2/5", "3/5", "2/5", "4/5"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "1 = 5/5. Então 5/5 − 3/5 = 2/5.", "pista": "Escreva o 1 como uma fração com denominador 5, ou seja, um inteiro cortado em 5 partes iguais. Depois pense em quantas partes sobram ao tirar a quantidade do enunciado.", "alem": "Calcule 1 − 3/5 e 1 − 6/10 e compare os resultados. O que você percebe? Invente mais um par de subtrações assim.", "erros": ["Você provavelmente fez 3/5 − 1, trocando a ordem. A conta tira 3/5 do inteiro, não o contrário. Confira qual número é maior.", "Essa fração é a que está sendo tirada no enunciado, como se o resultado fosse ela mesma. Confira quantas partes do inteiro restam depois de tirar 3 delas.", null, "Você parece ter tirado só 1 parte do inteiro (5/5 − 1/5), em vez de 3. Confira quantas partes o enunciado manda tirar."]}, {"id": "p4q7", "texto": "Uma receita usa 2/3 de xícara de leite. Para dobrar a receita, quanto de leite?", "alts": ["1 xícara", "4/6 de xícara", "2/6 de xícara", "4/3 de xícara (1 xícara e 1/3)"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "Dobrar é multiplicar por 2: 2 × 2/3 = 4/3.", "pista": "Dobrar significa preparar duas receitas iguais. Desenhe duas xícaras, cada uma com a quantidade do enunciado, e junte o leite. Pense também em qual operação representa \"duas vezes\".", "alem": "E se a receita fosse reduzida à metade? E se fosse triplicada? Calcule os dois casos de mais de um jeito, com desenho e com conta, e compare.", "erros": ["Você provavelmente estimou sem calcular. Confira o valor de 2/3 + 2/3 e compare com 1 xícara.", "Você multiplicou o numerador e o denominador por 2. Isso gera uma fração equivalente à original (a mesma quantidade), não o dobro. Multiplique só o numerador, ou some duas porções.", "Você multiplicou só o denominador por 2. Pedaços mais numerosos ficam menores, então a quantidade diminui em vez de dobrar. Confira o efeito de cada lado da fração.", null]}, {"id": "p4q8", "texto": "Um tanque tinha 3/4 de água. Usaram 1/3 da capacidade. Quanto restou?", "alts": ["1/2", "5/12", "2/1", "7/12"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "3/4 − 1/3 = 9/12 − 4/12 = 5/12.", "passos": ["O que restou é 3/4 − 1/3.", "MMC de 4 e 3 é 12: 3/4 = 9/12 e 1/3 = 4/12.", "9/12 − 4/12 = 5/12."], "mmc": [4, 3], "mmcPasso": 1, "pista": "A palavra \"restou\" indica quanto tinha menos quanto usou. As duas frações são partes da mesma capacidade, então use uma subtração. Antes, deixe os denominadores iguais.", "alem": "Invente um tanque com certa quantidade de água e um uso que deixem exatamente 1/2 da capacidade. Dê duas respostas diferentes.", "erros": ["Você parece ter subtraído os numeradores (3 − 1 = 2) e mantido o denominador 4 (2/4 = 1/2). Mas 3/4 e 1/3 são pedaços de tamanhos diferentes. Reescreva com um denominador comum.", null, "Você subtraiu numeradores (3 − 1 = 2) e denominadores (4 − 3 = 1). Denominadores diferentes não se subtraem: primeiro deixe os dois iguais. Note também que o tanque não pode ficar com mais água do que tinha.", "Você provavelmente escreveu 1/3 como 2/12 (9/12 − 2/12 = 7/12). Ao passar 1/3 para o novo denominador, multiplique o numerador e o denominador pelo mesmo número."]}, {"id": "p4q9", "texto": "Quantas garrafas de 1/4 de litro se enchem com 3 litros?", "alts": ["7", "3/4", "12", "1/12"], "certa": 2, "nivel": "Raciocínio", "tempo": 90, "just": "3 ÷ 1/4 = 3 × 4 = 12.", "pista": "Comece com uma pergunta menor: quantas garrafas de 1/4 de litro cabem em 1 litro? Depois pense no que muda quando são 3 litros.", "alem": "E se as garrafas fossem de 1/3 de litro? E de 3/4 de litro? Preveja, antes de calcular, se vão ser necessárias mais ou menos garrafas. Depois confira.", "erros": ["Você provavelmente somou 3 + 4. Os números do enunciado não devem ser somados: a pergunta é quantas partes de 1/4 há em 3 litros.", "Você multiplicou 3 × 1/4. Isso dá uma parte de litro, não quantas garrafas cabem. A pergunta é quantas vezes 1/4 cabe em 3, o que pede divisão.", null, "Você dividiu 1/4 por 3 (1/4 ÷ 3 = 1/12), trocando a ordem. A conta é 3 litros divididos em garrafas de 1/4. Confira qual quantidade é dividida."]}], "mmcTool": [4, 6], "dica": ["Veja um exemplo resolvido, cubra a solução e refaça sozinho. Só conta como aprendido se você conseguir sem olhar.", "Simplifique o seu resultado e procure a alternativa igual a ele. Ela pode estar escrita de uma forma equivalente."], "mapas": [5, 6], "kahoot": {"n": 4, "t": "Frações: as quatro operações", "pin": "05132189", "url": "https://kahoot.it/challenge/05132189", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20class%3D%27segno%27%3E%3Cpath%20transform%3D%27scale%284%29%27%20class%3D%27qrline%27%20stroke%3D%27%2314284b%27%20d%3 a muda", "sempre o número zero"], "certa": 0, "nivel": "Entrada", "tempo": 30, "just": "Em C = 4n, n é uma variável: muda conforme a quantidade de itens.", "pista": "Imagine três compras: 1 item, 2 itens e 5 itens. O que muda de uma compra para outra? O que continua igual na fórmula?", "alem": "Invente duas situações diferentes em que C = 4n faça sentido. Em cada uma, diga o que significam a letra n e a letra C.", "erros": [null, "Você pode ter confundido o 4, que está escrito na fórmula, com a letra n. O 4 multiplica n. Teste n = 1 e n = 2 e veja se n precisa continuar com o mesmo valor.", "Você pode ter trocado o papel das letras. Em C = 4n, o total é representado por C, e C é calculado a partir de n. Releia o que cada letra representa e veja se algo aqui nunca muda.", "Você pode ter pensado em um único valor para a letra. Zero é só um dos valores possíveis de n. Teste n = 0, n = 1 e n = 2 e veja se n precisa ficar parado."]}, {"id": "p5q1", "texto": "Quanto vale 2n + 1 quando n = 3?", "alts": ["23", "8", "6", "7"], "certa": 3, "nivel": "Entrada", "tempo": 30, "just": "2 × 3 + 1 = 7.", "pista": "Troque o n por 3. Lembre que 2n quer dizer 2 vezes n e que a multiplicação é feita antes da soma.", "alem": "Descubra qual valor de n faz 2n + 1 valer 11. Depois invente outra expressão com n que dê o mesmo resultado de 2n + 1 quando n = 3.", "erros": ["Você juntou o 2 e o 3 como se fossem o número vinte e três. Em 2n, o 2 multiplica o n. Escreva 2 × 3 e depois some 1.", "Você provavelmente somou 3 + 1 antes de multiplicar por 2. A multiplicação 2 × 3 vem antes da soma com 1. Refaça nessa ordem.", "Você calculou 2 × 3 e parou. Falta o + 1 da expressão. Depois da multiplicação, some o que sobrou.", null]}, {"id": "p5q2", "texto": "Qual expressão representa \"o triplo de um número, menos 2\"?", "alts": ["2n − 3", "3 − 2n", "3n − 2", "3(n − 2)"], "certa": 2, "nivel": "Entrada", "tempo": 30, "just": "O triplo de n é 3n. Menos 2: 3n − 2.", "passos": ["Chame o número desconhecido de n.", "O triplo de n é 3n.", "Menos 2: 3n − 2. Cuidado: 3(n − 2) seria o triplo de \"um número menos 2\", que é outra coisa."], "pista": "Escreva primeiro só \"o triplo de um número\". Depois acrescente \"menos 2\" e veja o que está sendo diminuído.", "alem": "Escreva com letras: \"o dobro de um número, mais 5\". Depois invente uma frase em português que corresponda a 3(n − 2) e compare com a frase da questão.", "erros": ["Você trocou os números: o 2 virou multiplicador e o 3 virou o que se subtrai. Releia a frase e veja qual número é o triplo e qual é o \"menos\".", "Você pode ter ligado a letra ao 2 em vez de ligá-la ao 3. Releia a frase e veja qual número multiplica o número desconhecido e qual número é só subtraído.", null, "Com os parênteses, você tira 2 do número antes de multiplicar por 3. A frase pede duas ações: veja qual vem primeiro e qual vem depois."]}, {"id": "p5q3", "texto": "Qual é o próximo termo da sequência 5, 9, 13, 17, ...?", "alts": ["20", "22", "21", "25"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "A sequência soma 4 a cada passo: 17 + 4 = 21.", "pista": "Calcule quanto cada termo aumenta em relação ao anterior: de 5 para 9, de 9 para 13 e de 13 para 17. O que você nota?", "alem": "Continue a sequência até o 10º termo de dois jeitos: somando passo a passo e usando uma conta que pule direto. Compare os resultados.", "erros": ["Você somou 3 ao último termo. Calcule 9 − 5, 13 − 9 e 17 − 13 e confira se o aumento é 3.", "Você pode ter somado o primeiro termo, o 5, ao último. Mas o que se soma é o aumento entre vizinhos, não o primeiro termo. Calcule as diferenças.", null, "Você somou 8 ao último termo. Calcule 17 − 13 e confira se o aumento entre vizinhos é 8."]}, {"id": "p5q4", "texto": "Qual é o termo geral da sequência 5, 9, 13, 17, ...?", "alts": ["5n", "4n + 5", "4n + 1", "n + 4"], "certa": 2, "nivel": "Aplicação", "tempo": 60, "just": "Para n = 1: 4 + 1 = 5. Para n = 2: 8 + 1 = 9.", "passos": ["A sequência cresce de 4 em 4. Então a regra começa com 4n.", "Teste com n = 1: 4 × 1 = 4, mas o 1º termo é 5. Falta somar 1.", "A regra é 4n + 1. Conferindo: n = 2 dá 9 e n = 3 dá 13."], "pista": "Veja de quanto em quanto a sequência aumenta: esse valor multiplica n. Depois teste n = 1 e n = 2 para acertar o número que sobra.", "alem": "Invente uma sequência que aumente de 3 em 3, escreva os três primeiros termos e descubra o termo geral. Troque com um colega para ele conferir.", "erros": ["Você usou o primeiro termo como multiplicador. Para n = 1 dá 5, mas para n = 2 dá 10, e o 2º termo é 9. Teste a regra no 2º termo.", "Para n = 1 essa regra dá 9, mas o primeiro termo é 5. Confira o número somado testando n = 1.", null, "Você usou o aumento como número somado. Para n = 1 dá 5, mas para n = 2 dá 6, e o 2º termo é 9. Confira a regra com mais de um valor de n."]}, {"id": "p5q5", "texto": "Pela regra 4n + 1, quanto vale o 8º termo?", "alts": ["41", "33", "37", "32"], "certa": 1, "nivel": "Aplicação", "tempo": 60, "just": "4 × 8 + 1 = 33.", "pista": "O 8º termo é o valor da regra quando n = 8. Troque n por 8, multiplique primeiro e some depois.", "alem": "Descubra de dois jeitos qual termo vale 41. Depois explique se o número 50 poderia ser um termo dessa regra.", "erros": ["Você pode ter multiplicado 8 por 5 e somado 1. Releia 4n + 1 e veja qual número multiplica n.", null, "Você pode ter usado n = 9 em vez de 8, ou somado 5 em vez de 1. Releia a regra e confira o valor de n e o número somado.", "Você calculou 4 × 8 e parou. Falta somar o + 1 da regra."]}, {"id": "p5q6", "texto": "Qual sequência cresce SEMPRE somando 5?", "alts": ["2, 7, 12, 17", "1, 6, 10, 15", "2, 4, 8, 16", "5, 10, 20, 40"], "certa": 0, "nivel": "Aplicação", "tempo": 60, "just": "2, 7, 12, 17 soma 5 a cada passo. As outras dobram ou variam.", "pista": "Em cada sequência, calcule a diferença entre cada termo e o anterior. Para somar sempre o mesmo valor, todas as diferenças precisam ser iguais.", "alem": "Invente uma sequência que sempre soma 5, começando em outro número, e outra que quase soma 5, mas falha em um passo. Peça a um colega para achar a falha.", "erros": [null, "O primeiro e o último passos somam 5, mas o do meio não. Calcule a diferença em cada par de vizinhos, do primeiro ao último.", "Essa sequência cresce, mas as diferenças são 2, 4 e 8, e elas mudam a cada passo. Confira se cada passo soma o mesmo valor.", "Você pode ter visto o 5 no começo e a sequência crescendo. Mas as diferenças são 5, 10 e 20, e elas mudam a cada passo. Confira todos os passos."]}, {"id": "p5q7", "texto": "Um táxi cobra R$ 5 fixos e R$ 2 por km. Qual expressão dá o preço p para n km?", "alts": ["p = 2n − 5", "p = 2n + 5", "p = 7n", "p = 5n + 2"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "O valor fixo é 5 e cada km custa 2: p = 2n + 5.", "pista": "Calcule o preço para 1 km e para 2 km. O que é cobrado uma vez só e o que é cobrado de novo a cada km?", "alem": "Mude o problema: R$ 3 fixos e R$ 4 por km. Escreva a nova expressão e calcule o preço de 10 km, de dois jeitos. Depois invente outra tarifa e compare.", "erros": ["O sinal está trocado. Teste n = 1: o resultado seria −3. Um preço pode ser negativo? O valor fixo é um acréscimo.", null, "Você somou 5 e 2 e multiplicou por n, como se tudo fosse cobrado a cada km. Só um dos valores é cobrado por km. O outro é pago uma vez.", "Você trocou os valores: aqui o 5 multiplica n, como se cada km custasse 5. Releia o enunciado e veja qual valor se repete a cada km."]}, {"id": "p5q8", "texto": "Pela regra p = 2n + 5, quanto custa uma corrida de 10 km?", "alts": ["R$ 20", "R$ 25", "R$ 70", "R$ 52"], "certa": 1, "nivel": "Raciocínio", "tempo": 90, "just": "2 × 10 + 5 = 25.", "pista": "Troque n por 10 na regra. Faça a multiplicação primeiro e depois some o valor fixo.", "alem": "Com R$ 45, quantos km dá para andar? E com R$ 30? Explique o que acontece em cada caso.", "erros": ["Você calculou só 2 × 10 e esqueceu a parte fixa da regra. Depois de multiplicar, falta somar o outro valor.", null, "Você somou 2 e 5 e multiplicou por 10, cobrando a parte fixa a cada km. Na regra, só um dos números multiplica n. Refaça a ordem.", "Você pode ter trocado os papéis dos números: multiplicou 5 por 10 e somou 2. Na regra p = 2n + 5, confira qual número multiplica n."]}, {"id": "p5q9", "texto": "Quadrados em fila: 1 quadrado usa 4 palitos, 2 usam 7 e 3 usam 10. Quantos palitos para 6 quadrados?", "alts": ["24", "21", "18", "19"], "certa": 3, "nivel": "Raciocínio", "tempo": 90, "just": "A regra é 3n + 1: 3 × 6 + 1 = 19.", "passos": ["Veja quanto aumenta: 4, 7, 10. Cada quadrado novo usa 3 palitos.", "A regra é 3n + 1 (com n = 1: 3 + 1 = 4).", "Para 6 quadrados: 3 × 6 + 1 = 19 palitos."], "pista": "Veja quantos palitos a mais aparecem de 1 para 2 quadrados e de 2 para 3. Desenhe e conte: o que cada quadrado novo acrescenta?", "alem": "Agora imagine triângulos em fila: 1 triângulo usa 3 palitos, 2 usam 5 e 3 usam 7. Descubra a regra e compare o jeito de pensar com o dos quadrados.", "erros": ["Você provavelmente calculou 4 × 6, como se cada quadrado usasse 4 palitos. Mas quadrados vizinhos dividem um lado. Veja quantos palitos cada quadrado novo acrescenta.", "O número 21 não aparece na lista de palitos. Continue a lista 4, 7, 10 passo a passo até o 6º quadrado e confira.", "Você multiplicou o acréscimo de cada quadrado por 6 e não somou o que sobra. Teste a regra com 1 quadrado: ela dá 4?", null]}], "mmcTool": null, "dica": ["Explique em voz alta a regra da sequência, como se ensinasse um colega. Se não conseguir explicar, volte ao exemplo.", "Teste a regra em mais de um termo. Regra que só funciona no primeiro termo é pegadinha."], "mapas": [10], "livro": [0, 1, 10], "kahoot": {"n": 5, "t": "Letras e regularidades", "pin": "0372245", "url": "https://kahoot.it/challenge/0372245", "qr": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%27132%27%20height%3D%27132%27%20clas
