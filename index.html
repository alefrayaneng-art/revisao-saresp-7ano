as": [], "unidade": "", "opcoes": ["somando 4 aos dois membros.", "subtraindo 4 dos dois membros.", "multiplicando os dois membros por 2.", "dividindo os dois membros por 2."], "certa": 2, "resolucao": "Multiplicando tudo por 2: (x/2)×2 = x, 4×2 = 8 e 10×2 = 20, o que dá x + 8 = 20. Resposta: c."}, {"imp": 191, "rotulo": "Na prática 3", "pergunta": "Em x/5 + 3 = 12, qual operação elimina o denominador da incógnita?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Somar 5 em ambos os membros.", "Subtrair 3 em ambos os membros.", "Multiplicar ambos os membros por 5.", "Dividir ambos os membros por 5."], "certa": 2, "resolucao": "Multiplicando os dois lados por 5, (x/5)×5 = x, 3×5 = 15 e 12×5 = 60, e o denominador some: x + 15 = 60. Resposta: c."}, {"imp": 191, "rotulo": "Na prática 4", "pergunta": "Qual é a forma simplificada de 3(x – 4) = x – 11, no formato ax + b = c?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["3x – 4 = 11", "4x + 4 = 11", "7x – 22 = 14", "2x – 12 = –11"], "certa": 3, "resolucao": "Pela distributiva, 3(x – 4) = 3x – 12, então 3x – 12 = x – 11. Subtraindo x dos dois lados: 2x – 12 = –11. Resposta: d."}]}, {"n": 26, "titulo": "Modelagem algébrica de problemas do 1º grau – Parte 1", "pags": [{"f": "p193.webp", "imp": 192, "rot": ["Resumo"], "ex": false}, {"f": "p194.webp", "imp": 193, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p195.webp", "imp": 194, "rot": ["Na prática"], "ex": true}, {"f": "p196.webp", "imp": 195, "rot": [], "ex": true}], "conf": [{"imp": 194, "rotulo": "Atividade 1", "pergunta": "Terreno retangular de área 60 m² e comprimento 10 m: qual é a largura?", "tipo": "numero", "aceitas": ["6", "x=6"], "unidade": "m", "opcoes": [], "certa": -1, "resolucao": "A área do retângulo é comprimento × largura. Então 60 = 10 × x. Dividindo os dois lados por 10, x = 6. A largura é 6 m."}, {"imp": 195, "rotulo": "Atividade 2", "pergunta": "Peça triangular de área 24 m² e altura 6 m: qual é a medida da base?", "tipo": "numero", "aceitas": ["8", "x=8"], "unidade": "m", "opcoes": [], "certa": -1, "resolucao": "A área do triângulo é base × altura ÷ 2, então 24 = x × 6 ÷ 2. Multiplicando os dois lados por 2, 48 = 6x. Dividindo por 6, x = 8. A base mede 8 m."}]}, {"n": 27, "titulo": "Modelagem algébrica de problemas do 1º grau – Parte 2", "pags": [{"f": "p197.webp", "imp": 196, "rot": ["Resumo"], "ex": false}, {"f": "p198.webp", "imp": 197, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p199.webp", "imp": 198, "rot": ["Na prática"], "ex": true}, {"f": "p200.webp", "imp": 199, "rot": [], "ex": true}], "conf": [{"imp": 198, "rotulo": "Atividade 1", "pergunta": "Escreva a equação da fita cortada em duas partes (x e metade de x, total 18 m) e dê a medida de cada parte.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A equação é x + 1/2 de x = 18. Escrevendo x como 2/2 de x, fica 3/2 de x = 18, então 3x = 36 e x = 12. Uma fita mede 12 m e a outra, a metade, mede 6 m."}, {"imp": 199, "rotulo": "Atividade 3", "pergunta": "Ana gastou R$ 42,00 no total, sendo x o preço do produto e a entrega 1/3 desse preço. Qual o valor do produto?", "tipo": "numero", "aceitas": ["31,5", "31,50", "x=31,5", "x=31,50"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "A equação é x + 1/3 de x = 42, ou seja, 4/3 de x = 42. Multiplicando por 3: 4x = 126, e dividindo por 4: x = 31,5. O produto custou R$ 31,50 (e a entrega R$ 10,50, pois 31,5 + 10,5 = 42)."}]}, {"n": 28, "titulo": "Resolução de problemas envolvendo equações do 1º grau – Parte 2", "pags": [{"f": "p201.webp", "imp": 200, "rot": ["Resumo"], "ex": false}, {"f": "p202.webp", "imp": 201, "rot": ["Exercícios resolvidos", "Na prática"], "ex": true}, {"f": "p203.webp", "imp": 202, "rot": [], "ex": true}, {"f": "p204.webp", "imp": 203, "rot": [], "ex": true}], "conf": [{"imp": 202, "rotulo": "Atividade 1", "pergunta": "Um terreno retangular tem área de 48 m² e comprimento de 6 m. Monte a equação e ache a largura x.", "tipo": "numero", "aceitas": ["8", "x=8"], "unidade": "m", "opcoes": [], "certa": -1, "resolucao": "A área é comprimento × largura, então 48 = 6 · x. Dividindo os dois lados por 6, x = 8. A largura do terreno mede 8 metros."}, {"imp": 202, "rotulo": "Atividade 2", "pergunta": "Uma placa triangular tem área de 54 m² e base de 18 m. Monte a equação e ache a altura x.", "tipo": "numero", "aceitas": ["6", "x=6"], "unidade": "m", "opcoes": [], "certa": -1, "resolucao": "A área do triângulo é base × altura ÷ 2, então 54 = 18 · x ÷ 2. Multiplicando por 2: 108 = 18x, e dividindo por 18, x = 6. A altura mede 6 metros."}, {"imp": 203, "rotulo": "Atividade 3", "pergunta": "Um jardim retangular tem área de 40 m², base de 5 m e comprimento x – 4. Qual é o comprimento do jardim?", "tipo": "numero", "aceitas": ["8"], "unidade": "m", "opcoes": [], "certa": -1, "resolucao": "A equação é 40 = 5(x – 4), ou seja, 40 = 5x – 20. Então 60 = 5x e x = 12. O comprimento é x – 4 = 12 – 4 = 8 metros."}]}, {"n": 29, "titulo": "Aula de verificação: Resolução de problemas do 1º grau", "pags": [{"f": "p205.webp", "imp": 204, "rot": ["Na prática"], "ex": true}, {"f": "p206.webp", "imp": 205, "rot": [], "ex": true}, {"f": "p207.webp", "imp": 206, "rot": [], "ex": true}], "conf": [{"imp": 204, "rotulo": "Atividade 1 a)", "pergunta": "Explicar o que a letra x representa na situação das três quantidades iguais que somam 72.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A letra x representa a quantidade desconhecida, que se repete três vezes na situação."}, {"imp": 204, "rotulo": "Atividade 1 b)", "pergunta": "Escrever a equação que representa a situação das três quantidades iguais.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Três quantidades iguais a x somadas dão 72, então a equação é 3x = 72 (o mesmo que x + x + x = 72)."}, {"imp": 204, "rotulo": "Atividade 1 c)", "pergunta": "Determinar o valor de x na situação das três quantidades iguais que somam 72.", "tipo": "numero", "aceitas": ["24", "x=24"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Dividimos os dois lados de 3x = 72 por 3. Então x = 72 ÷ 3 = 24."}, {"imp": 205, "rotulo": "Atividade 2 a)", "pergunta": "Explicar por que a situação da balança (x + 18 de um lado e 60 − x do outro) pode ser representada por uma igualdade.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Porque os dois lados representam valores equivalentes, ou seja, valem o mesmo. Por isso podemos ligar os dois com o sinal de igual."}, {"imp": 205, "rotulo": "Atividade 2 b)", "pergunta": "Escrever a equação que representa a situação da balança.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "De um lado temos x + 18 e do outro 60 − x. A equação é x + 18 = 60 − x."}, {"imp": 205, "rotulo": "Atividade 2 c)", "pergunta": "Determinar o valor de x na situação da balança.", "tipo": "numero", "aceitas": ["21", "x=21"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Somando x aos dois lados de x + 18 = 60 − x: 2x + 18 = 60. Subtraindo 18: 2x = 42. Dividindo por 2: x = 21."}, {"imp": 206, "rotulo": "Atividade 3 a)", "pergunta": "Escrever a equação que representa a frase: três quartos de um número é igual a 45.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Três quartos de x se escreve 3/4 de x, ou (3/4)x. A equação é (3/4)x = 45."}, {"imp": 206, "rotulo": "Atividade 3 b)", "pergunta": "Determinar o valor de x na equação que representa a frase.", "tipo": "numero", "aceitas": ["60", "x=60"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Multiplicamos os dois lados de (3/4)x = 45 por 4: 3x = 180. Dividindo por 3: x = 60."}, {"imp": 206, "rotulo": "Atividade 4", "pergunta": "Resolver a equação 2(x − 5) + 3 = x + 18 e dar o valor de x.", "tipo": "numero", "aceitas": ["25", "x=25"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Distribuindo: 2x − 10 + 3 = x + 18, ou seja, 2x − 7 = x + 18. Tirando x dos dois lados: x − 7 = 18. Somando 7: x = 25."}]}, {"n": 30, "titulo": "Revisão: Modelos matemáticos com equações do 1º grau", "pags": [{"f": "p208.webp", "imp": 207, "rot": ["Resumo"], "ex": false}, {"f": "p209.webp", "imp": 208, "rot": ["Na prática"], "ex": true}, {"f": "p210.webp", "imp": 209, "rot": [], "ex": true}], "conf": [{"imp": 208, "rotulo": "Atividade 1", "pergunta": "Qual é a medida do outro lado de um retângulo de área 48 m² com um lado de 6 m?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["6 m", "8 m", "12 m", "24 m"], "certa": 1, "resolucao": "Área do retângulo = base × altura, então 6 × x = 48. Dividindo os dois lados por 6, x = 8. O outro lado mede 8 m."}, {"imp": 208, "rotulo": "Atividade 2", "pergunta": "Qual é a medida da base de um triângulo de área 30 m² e altura 5 m?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["6 m", "10 m", "12 m", "15 m"], "certa": 2, "resolucao": "Área do triângulo = (base × altura) ÷ 2, então (x × 5) ÷ 2 = 30. Multiplicando por 2: 5x = 60. Dividindo por 5, x = 12. A base mede 12 m."}, {"imp": 208, "rotulo": "Atividade 3", "pergunta": "Qual é o valor de x em um retângulo de lados x e x – 4 com perímetro 56?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["12", "14", "16", "18"], "certa": 2, "resolucao": "O perímetro é x + x + (x – 4) + (x – 4) = 56, ou seja, 4x – 8 = 56. Somando 8: 4x = 64. Dividindo por 4, x = 16."}, {"imp": 209, "rotulo": "Atividade 4", "pergunta": "Qual valor de x representa a base de um terreno retangular de altura 8 m e área 80 m²?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["8", "10", "12", "20"], "certa": 1, "resolucao": "Área = base × altura, então x × 8 = 80. Dividindo os dois lados por 8, x = 10. A base mede 10 m."}]}], "caderno": [{"f": "p237.webp", "imp": 236}, {"f": "p238.webp", "imp": 237}, {"f": "p239.webp", "imp": 238}, {"f": "p240.webp", "imp": 239}, {"f": "p241.webp", "imp": 240}, {"f": "p242.webp", "imp": 241}, {"f": "p243.webp", "imp": 242}, {"f": "p244.webp", "imp": 243}, {"f": "p245.webp", "imp": 244}, {"f": "p246.webp", "imp": 245}, {"f": "p247.webp", "imp": 246}, {"f": "p248.webp", "imp": 247}, {"f": "p249.webp", "imp": 248}, {"f": "p250.webp", "imp": 249}, {"f": "p251.webp", "imp": 250}, {"f": "p252.webp", "imp": 251}, {"f": "p253.webp", "imp": 252}], "cadernoAula": {"2": 0, "3": 1, "4": 1, "6": 2, "7": 3, "8": 4, "12": 6, "13": 7, "14": 7, "16": 8, "17": 9, "18": 10, "22": 11, "24": 13, "26": 14, "27": 15, "28": 16}, "cadConf": [{"imp": 236, "rotulo": "Questão 1", "pergunta": "Qual alternativa expressa a área de um retângulo de lados 3x e 5?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Área = x ∙ 5", "Área = 3x ∙ 5", "Área = 3x + 5", "Área = 3x²"], "certa": 1, "resolucao": "A área do retângulo é lado × lado. Então Área = 3x ∙ 5."}, {"imp": 236, "rotulo": "Questão 2", "pergunta": "Escreva uma expressão para a área de um quadrado de lado 5y.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Área = lado × lado = 5y ∙ 5y = (5y)². Como 5 ∙ 5 = 25, a área é 25y²."}, {"imp": 236, "rotulo": "Questão 3", "pergunta": "Escreva uma expressão para a área do jardim quadrado de lado 2x metros.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Área = 2x ∙ 2x = (2x)². Como 2 ∙ 2 = 4, a área do jardim é 4x²."}, {"imp": 236, "rotulo": "Questão 4 a)", "pergunta": "Qual expressão algébrica representa a área da piscina de 50 m de comprimento e largura x?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Área = comprimento × largura = 50 ∙ x, ou seja, 50x."}, {"imp": 236, "rotulo": "Questão 4 b)", "pergunta": "Qual é a área da piscina se a largura for 25 m?", "tipo": "numero", "aceitas": ["1250", "1 250"], "unidade": "m²", "opcoes": [], "certa": -1, "resolucao": "Área = 50 ∙ 25 = 1 250. A piscina ocupa 1 250 m²."}, {"imp": 236, "rotulo": "Questão 5", "pergunta": "Quanto se cobra por um porta-retratos quadrado de lado 8 cm, a R$ 1,50 por cm²?", "tipo": "numero", "aceitas": ["96", "96,00"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "Área = 8 × 8 = 64 cm². Valor = 64 × 1,50 = 96. São R$ 96,00."}, {"imp": 237, "rotulo": "Questão 6 a)", "pergunta": "De que grandeza depende a massa M do conjunto de pacotes de arroz?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A massa M depende do número de pacotes, n. Se n aumenta ou diminui, a massa total também aumenta ou diminui (M = 2n)."}, {"imp": 237, "rotulo": "Questão 6 b)", "pergunta": "Qual é a massa de um conjunto com 5 pacotes de 2 kg?", "tipo": "numero", "aceitas": ["10"], "unidade": "kg", "opcoes": [], "certa": -1, "resolucao": "M = 2 ∙ 5 = 10. Cinco pacotes têm 10 kg de arroz."}, {"imp": 237, "rotulo": "Questão 7", "pergunta": "Escreva a expressão do valor total arrecadado com p pessoas pagando R$ 12,00 cada.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Cada pessoa paga 12 reais, então o total é 12 ∙ p, ou 12p."}, {"imp": 237, "rotulo": "Questão 8 a)", "pergunta": "Em C = 4a − 3b, as letras a e b são variáveis ou incógnitas? Por quê?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "São variáveis, pois representam quantidades que podem mudar conforme a produção."}, {"imp": 237, "rotulo": "Questão 8 b)", "pergunta": "Se o custo total C deve ser igual a 29, qual letra passa a ser uma incógnita a ser determinada?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Com C = 29, uma das letras (a ou b) passa a ser a incógnita, dependendo de qual delas queremos descobrir. Se uma das quantidades é conhecida, a outra vira a incógnita."}, {"imp": 237, "rotulo": "Questão 9 a)", "pergunta": "Escreva a expressão do valor V gasto por Ana com 6 canetas, 2 borrachas e 1 conjunto de lápis de cor.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "6 canetas custam 6c, 2 borrachas custam 2b e o conjunto custa L. Então V = 6c + 2b + L."}, {"imp": 237, "rotulo": "Questão 9 b)", "pergunta": "Qual o valor gasto por Ana com canetas de R$ 1,50, borrachas de R$ 2,00 e lápis de cor de R$ 11,80?", "tipo": "numero", "aceitas": ["24,80", "24,8"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "V = 6 ∙ 1,50 + 2 ∙ 2,00 + 11,80 = 9,00 + 4,00 + 11,80 = 24,80. Ana gastou R$ 24,80."}, {"imp": 237, "rotulo": "Questão 10", "pergunta": "Quantos graus Fahrenheit correspondem a 35 °C, pela fórmula F = 1,8C + 32?", "tipo": "numero", "aceitas": ["95"], "unidade": "°F", "opcoes": [], "certa": -1, "resolucao": "F = 1,8 × 35 + 32 = 63 + 32 = 95. A temperatura é 95 °F."}, {"imp": 237, "rotulo": "Questão 11", "pergunta": "Qual expressão representa a área de um canteiro retangular de base 8 m e altura h?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["A = 8 + h", "A = 8h", "A = 8 − h", "A = 8 ÷ h"], "certa": 1, "resolucao": "A área do retângulo é base × altura, ou seja, A = 8 ∙ h = 8h."}, {"imp": 238, "rotulo": "Questão 12", "pergunta": "Marque V ou F nas três afirmações sobre expressões algébricas (I, II e III).", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "I é V (5k é 5 vezes k). II é F (em d − 4, d é uma quantidade que pode variar, não fixa). III é V (letras representam grandezas que variam). Resposta: V, F, V."}, {"imp": 238, "rotulo": "Questão 13 a)", "pergunta": "Escreva a expressão do custo total de 3 salgados (x reais cada) e 2 sucos (y reais cada).", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Os salgados custam 3x e os sucos custam 2y. O custo total é C = 3x + 2y."}, {"imp": 238, "rotulo": "Questão 13 b)", "pergunta": "Nessa expressão, x e y são variáveis ou incógnitas? Por quê?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "São variáveis, pois representam grandezas cujo valor pode mudar dependendo da situação."}, {"imp": 238, "rotulo": "Questão 14", "pergunta": "Qual expressão dá o valor total pago: limpeza fixa de R$ 20,00 mais r reais de regulagem?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["20 + r", "20r", "r − 20", "r ÷ 20"], "certa": 0, "resolucao": "O cliente paga o valor fixo de 20 reais mais r reais da regulagem. O total é 20 + r."}, {"imp": 238, "rotulo": "Questão 15", "pergunta": "Escreva a expressão da carga realmente transportada por um caminhão de t toneladas que reserva 2 toneladas.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Da capacidade t, tiram-se 2 toneladas reservadas. A carga transportada é t − 2."}, {"imp": 238, "rotulo": "Questão 16", "pergunta": "Escreva a expressão da água usada: torneira libera a litros por minuto durante m minutos, com perda fixa de 3 litros.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A torneira libera a ∙ m litros, e 3 litros se perdem antes da irrigação. A água utilizada é am − 3."}, {"imp": 238, "rotulo": "Questão 17", "pergunta": "Em uma sequência em que cada termo é o anterior vezes 3 e o primeiro é 2, qual é o terceiro termo?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["3", "6", "9", "18"], "certa": 3, "resolucao": "1º termo = 2; 2º = 2 × 3 = 6; 3º = 6 × 3 = 18. O terceiro termo é 18."}, {"imp": 239, "rotulo": "Questão 18", "pergunta": "Qual regra de formação gera a sequência 40, 33, 26, 19, …?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Somar 5 a cada termo.", "Subtrair 7 a cada termo.", "Subtrair 10 a cada termo.", "Dividir o termo anterior por 6."], "certa": 1, "resolucao": "40 − 33 = 7, 33 − 26 = 7 e 26 − 19 = 7. A cada termo se subtrai 7. Resposta: alternativa b."}, {"imp": 239, "rotulo": "Questão 19", "pergunta": "Quais são os 4 primeiros termos da sequência que começa em 5 e soma 4 a cada novo termo?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5, 8, 11, 14, […]", "5, 11, 17, 23, […]", "5, 9, 13, 17, […]", "5, 12, 19, 26, […]"], "certa": 2, "resolucao": "Começa em 5 e soma 4: 5, 5 + 4 = 9, 9 + 4 = 13, 13 + 4 = 17. Resposta: alternativa c."}, {"imp": 239, "rotulo": "Questão 20 a)", "pergunta": "Escreva a sequência formada pela quantidade total de quadrados de cada figura mostrada.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Contando os quadrados de cada figura: 4, 7 e 10. A sequência é 4, 7, 10."}, {"imp": 239, "rotulo": "Questão 20 b)", "pergunta": "Quantos quadrados compõem a 8ª figura, continuando o padrão?", "tipo": "numero", "aceitas": ["25"], "unidade": "quadrados", "opcoes": [], "certa": -1, "resolucao": "A sequência começa em 4 e aumenta 3 a cada figura. Na 8ª figura: 4 + 7 × 3 = 4 + 21 = 25 quadrados."}, {"imp": 239, "rotulo": "Questão 20 c)", "pergunta": "O que muda de um termo para o outro nessa sequência?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "De uma figura para a seguinte, aumentam 3 quadradinhos (4, 7, 10, …), um a mais em cada extremidade da figura."}, {"imp": 239, "rotulo": "Questão 21", "pergunta": "Seguindo o padrão dos grupos de moedas (1, 3, 6, 10, …), quantas moedas tem o 5º grupo?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["12 moedas.", "13 moedas.", "14 moedas.", "15 moedas."], "certa": 3, "resolucao": "Os grupos têm 1, 3, 6, 10 moedas: as diferenças são 2, 3 e 4. A próxima diferença é 5, então 10 + 5 = 15 moedas. Resposta: alternativa d."}, {"imp": 239, "rotulo": "Questão 22", "pergunta": "Classifique como V ou F as três afirmações sobre sequências numéricas.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V – F – V.", "V – V – V.", "F – F – V.", "V – F – F."], "certa": 3, "resolucao": "A 1ª é verdadeira: n indica a posição do termo. A 2ª é falsa: an = 5n gera 5, 10, 15, 20, 25, 30 (a lista do livro pula o 20). A 3ª é falsa: é preciso substituir n por 1, 2, 3, 4 e 5. Resposta: V – F – F."}, {"imp": 240, "rotulo": "Questão 23", "pergunta": "Quais são os 4 primeiros termos da sequência an = 2n + 5?", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Com n = 1, 2, 3, 4: 2 × 1 + 5 = 7, 2 × 2 + 5 = 9, 2 × 3 + 5 = 11 e 2 × 4 + 5 = 13. Resposta: 7, 9, 11 e 13."}, {"imp": 240, "rotulo": "Questão 24", "pergunta": "Qual expressão geral representa a sequência 4, 9, 14, 19, …?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["an = n² + 9", "an = 5n − 1", "an = n² − n", "an = 3n + 2"], "certa": 1, "resolucao": "A sequência soma 5 a cada termo, então a expressão tem 5n. Para n = 1 deve dar 4: 5 × 1 − 1 = 4. Resposta: an = 5n − 1, alternativa b."}, {"imp": 240, "rotulo": "Questão 25", "pergunta": "Com Mn = 4n + 3, quantas peças têm o 5º e o 8º módulo juntos?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["52", "58", "49", "51"], "certa": 1, "resolucao": "M5 = 4 × 5 + 3 = 23 e M8 = 4 × 8 + 3 = 35. Juntos: 23 + 35 = 58 peças. Resposta: alternativa b."}, {"imp": 240, "rotulo": "Questão 26", "pergunta": "Com Dn = 3n, quantas páginas terá lido no 15º dia?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["30", "40", "45", "75"], "certa": 2, "resolucao": "D15 = 3 × 15 = 45 páginas. Resposta: alternativa c."}, {"imp": 240, "rotulo": "Questão 27", "pergunta": "Qual expressão dá o termo na posição n de uma sequência que começa em 5 e aumenta 6 a cada termo?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5 + 6 ∙ n", "5 + 6 ∙ (n − 1)", "6 + 5 ∙ (n − 1)", "5 ∙ n + 6"], "certa": 1, "resolucao": "O 1º termo é 5 e, para chegar ao termo n, soma-se 6 um total de (n − 1) vezes: 5 + 6 ∙ (n − 1). Resposta: alternativa b."}, {"imp": 240, "rotulo": "Questão 28", "pergunta": "Quais termos a regra 8 + 7 ∙ (n − 1) gera?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["8, 15, 22, 29, …", "7, 15, 22, 28, …", "8, 12, 22, 35, …", "4, 12, 16, 18, …"], "certa": 0, "resolucao": "Com n = 1: 8. Com n = 2: 8 + 7 = 15. Com n = 3: 8 + 14 = 22. Com n = 4: 8 + 21 = 29. Resposta: alternativa a."}, {"imp": 241, "rotulo": "Questão 29", "pergunta": "O aluguel custa 18, 36 e 54 reais por 1, 2 e 3 horas. Quanto se paga por 10 horas?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 144,00", "R$ 160,00", "R$ 162,00", "R$ 180,00"], "certa": 3, "resolucao": "Cada hora custa 18 reais, então Vn = 18n. Para 10 horas: 18 × 10 = 180 reais. Resposta: alternativa d."}, {"imp": 241, "rotulo": "Questão 30", "pergunta": "Prateleiras com 11, 14, 17 livros… Quantos livros cabem na 20ª prateleira?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["68", "69", "70", "71"], "certa": 0, "resolucao": "Começa em 11 e soma 3 a cada prateleira: 11 + 3 ∙ (n − 1) = 3n + 8. Na 20ª: 3 × 20 + 8 = 68 livros. Resposta: alternativa a."}, {"imp": 241, "rotulo": "Questão 31", "pergunta": "Nas figuras em forma de Y, quantas bolinhas terá a 15ª figura?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["35", "47", "50", "52", "60"], "certa": 1, "resolucao": "As figuras têm 5, 8 e 11 bolinhas: soma-se 3 a cada figura, então o termo geral é 3n + 2. Na 15ª: 3 × 15 + 2 = 47. Resposta: alternativa b."}, {"imp": 241, "rotulo": "Questão 32", "pergunta": "Se as caixas dobram a cada dia (2, 4, 8, 16…), quantas haverá no 8º dia?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["64", "96", "128", "256"], "certa": 3, "resolucao": "A quantidade no dia n é 2 elevado a n. No 8º dia: 2⁸ = 256 caixas (2, 4, 8, 16, 32, 64, 128, 256). Resposta: alternativa d."}, {"imp": 242, "rotulo": "Questão 1", "pergunta": "Classificar como V ou F três afirmações sobre operações em igualdades.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V – F – V.", "V – V – V.", "F – F – V.", "F – V – F."], "certa": 0, "resolucao": "Somar o mesmo número aos dois lados mantém a igualdade (V). Multiplicar só um lado por 3 quebra a igualdade (F). Subtrair o mesmo número dos dois lados mantém a igualdade (V). Resposta: V – F – V."}, {"imp": 242, "rotulo": "Questão 2", "pergunta": "Qual é o valor de x em 9 + x = 15?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["4", "5", "6", "7"], "certa": 2, "resolucao": "Tire 9 dos dois lados: x = 15 − 9 = 6."}, {"imp": 242, "rotulo": "Questão 3", "pergunta": "Qual é o valor de x em 5x = 45?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5", "7", "9", "11"], "certa": 2, "resolucao": "Divida os dois lados por 5: x = 45 ÷ 5 = 9."}, {"imp": 242, "rotulo": "Questão 4", "pergunta": "O que acontece com a igualdade 12 = 12 se multiplicarmos só o lado esquerdo por 2?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Continua verdadeira, pois 24 e 12 são números pares.", "Continua verdadeira, pois qualquer multiplicação mantém a igualdade.", "Torna-se falsa, pois apenas um dos lados foi alterado.", "Torna-se verdadeira apenas porque o número multiplicado foi 2."], "certa": 2, "resolucao": "Ficaria 24 = 12, que é falso. Para manter a igualdade, é preciso fazer a mesma operação nos dois lados."}, {"imp": 242, "rotulo": "Questão 5", "pergunta": "Qual operação preserva a igualdade e leva ao valor de x em 3x + 2 = 20?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Somar 2 aos dois lados e depois dividir por 3.", "Subtrair 2 dos dois lados e depois dividir por 3.", "Multiplicar apenas o lado esquerdo por 3.", "Dividir apenas o lado direito por 3"], "certa": 1, "resolucao": "Subtraia 2 dos dois lados: 3x = 18. Depois divida os dois lados por 3: x = 6."}, {"imp": 243, "rotulo": "Questão 6", "pergunta": "Qual é o valor de x em 48 = 35 + x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["8", "10", "13", "15"], "certa": 2, "resolucao": "x = 48 − 35 = 13."}, {"imp": 243, "rotulo": "Questão 7", "pergunta": "Qual sentença representa 2 livros de x reais cada mais um marcador de 5 reais, com total de 85 reais?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2x + 5 = 85", "2x + 85 = 5", "x + 5 = 85", "2x − 5 = 85"], "certa": 0, "resolucao": "Dois livros custam 2x, mais o marcador de 5, e o total é 85: 2x + 5 = 85."}, {"imp": 243, "rotulo": "Questão 8", "pergunta": "Classificar como V ou F três afirmações sobre a equação 4x + 7 = 31.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V – V – F.", "V – F – V.", "F – V – V.", "F – F – V."], "certa": 1, "resolucao": "I: x é a incógnita (V). II: o 7 é uma parte, e o total é 31 (F). III: 4x = 31 − 7 = 24, então x = 6 (V). Resposta: V – F – V."}, {"imp": 243, "rotulo": "Questão 9", "pergunta": "A conta de celular de Ana foi de 80 reais, sendo 50 do plano fixo. Quanto foi gasto com internet extra (x)?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["20 reais", "25 reais", "30 reais", "35 reais"], "certa": 2, "resolucao": "50 + x = 80, então x = 80 − 50 = 30 reais."}, {"imp": 243, "rotulo": "Questão 10", "pergunta": "O número 6 é a solução da equação 3x = 18?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Sim", "Não"], "certa": 0, "resolucao": "Troque x por 6: 3 × 6 = 18, que é verdadeiro. Então 6 é solução. Resposta: sim."}, {"imp": 243, "rotulo": "Questão 11", "pergunta": "Classificar como V ou F três afirmações sobre equações, incógnita e solução.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["V – V – V.", "V – F – V.", "V – V – F.", "F – V – F."], "certa": 2, "resolucao": "I: a letra representa um valor desconhecido (V). II: 2 + 4 = 6, então 2 é solução (V). III: em 6 + x = 20 a incógnita é x, não o 6 (F). Resposta: V – V – F."}, {"imp": 244, "rotulo": "Questão 12", "pergunta": "Qual equação representa: três vezes um número, somado a 4, resulta em 31?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["3 + x + 4 = 31", "3x + 4 = 31", "x + 4 = 31 ∙ 3", "3x − 4 = 31"], "certa": 1, "resolucao": "Três vezes um número é 3x; somado a 4 fica 3x + 4, e isso é igual a 31: 3x + 4 = 31."}, {"imp": 244, "rotulo": "Questão 13", "pergunta": "Qual equação descreve 5 cadernos iguais, de x reais cada, que custaram R$ 75,00 no total?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5 + x = 75", "75 − 5 = x", "5x = 75", "x − 5 = 75"], "certa": 2, "resolucao": "5 cadernos de x reais custam 5x, e o total é 75: 5x = 75."}, {"imp": 244, "rotulo": "Questão 14", "pergunta": "Qual equação descreve um ciclista que percorreu d km por dia durante 7 dias, num total de 98 km?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["d − 7 = 98", "98 − d = 7", "7d = 98", "d + 7 = 98"], "certa": 2, "resolucao": "Em 7 dias, com d km por dia, o total é 7 × d = 98, ou seja, 7d = 98."}, {"imp": 244, "rotulo": "Questão 15", "pergunta": "Qual equação representa n ingressos a 12 reais cada, com desconto de 24 reais, resultando em 180 reais?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["12n + 24 = 180", "12n = 180 − 22", "12n − 24 = 180", "12 − 24n = 180"], "certa": 2, "resolucao": "Os ingressos arrecadam 12n; descontam-se 24 reais de despesas e sobram 180: 12n − 24 = 180."}, {"imp": 244, "rotulo": "Questão 16 a)", "pergunta": "Escrever a equação que representa a balança em equilíbrio da imagem.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Em um prato estão x e 2; no outro, 7. Como a balança está em equilíbrio, os dois pratos valem o mesmo: x + 2 = 7."}, {"imp": 244, "rotulo": "Questão 16 b)", "pergunta": "Resolver a equação da balança para achar x.", "tipo": "numero", "aceitas": ["5", "x=5"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Em x + 2 = 7, tire 2 dos dois lados: x = 7 − 2 = 5."}, {"imp": 244, "rotulo": "Questão 17", "pergunta": "Qual é o valor de x em x + 7 = 19?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["10", "11", "12", "13"], "certa": 2, "resolucao": "x = 19 − 7 = 12."}, {"imp": 245, "rotulo": "Questão 18", "pergunta": "Resolver 4x − 5 = 19 e indicar o valor de x.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5", "6", "7", "8"], "certa": 1, "resolucao": "4x − 5 = 19, então 4x = 19 + 5 = 24. Logo x = 24 ÷ 4 = 6."}, {"imp": 245, "rotulo": "Questão 19", "pergunta": "Resolver −4x − 6 = 10 e indicar o valor de x.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["−4", "−2", "2", "4"], "certa": 0, "resolucao": "−4x − 6 = 10, então −4x = 16. Logo x = 16 ÷ (−4) = −4."}, {"imp": 245, "rotulo": "Questão 20", "pergunta": "Ingresso a R$ 18,00 mais taxa fixa de R$ 4,00, total de R$ 58,00: qual é a equação e o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["18x + 4 = 58, x = 3", "18x − 4 = 58, x = 3", "18x + 4 = 58, x = 4", "18x − 4 = 58, x = 4"], "certa": 0, "resolucao": "A taxa é somada: 18x + 4 = 58. Então 18x = 54 e x = 54 ÷ 18 = 3."}, {"imp": 245, "rotulo": "Questão 21", "pergunta": "Taxa fixa de R$ 50,00 mais R$ 8,00 por hora, total de R$ 194,00: quantas horas (x) de trabalho?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 12", "x = 15", "x = 18", "x = 20"], "certa": 2, "resolucao": "50 + 8x = 194, então 8x = 144. Logo x = 144 ÷ 8 = 18."}, {"imp": 245, "rotulo": "Questão 22", "pergunta": "Achar o valor de x em x + 2,4 = 5,1.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["1,7", "2,7", "3,3", "7,5"], "certa": 1, "resolucao": "x = 5,1 − 2,4 = 2,7."}, {"imp": 245, "rotulo": "Questão 23", "pergunta": "Achar o valor de x em x − 3,75 = 1,2.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2,55", "3,75", "4,95", "5,2"], "certa": 2, "resolucao": "x = 1,2 + 3,75 = 4,95. Verificando: 4,95 − 3,75 = 1,2."}, {"imp": 245, "rotulo": "Questão 24", "pergunta": "Resolver a equação x + 2/3 = 7/4.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5/12", "13/12", "11/12", "7/6"], "certa": 1, "resolucao": "x = 7/4 − 2/3 = 21/12 − 8/12 = 13/12."}, {"imp": 246, "rotulo": "Questão 25", "pergunta": "Suco de R$ 4,50 mais um sanduíche de x reais, conta de R$ 12,80: qual é a equação e o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x + 4,50 = 12,80, com x = 8,30", "x − 4,50 = 12,80, com x = 17,30", "4,50 − x = 12,80, com x = 8,30", "x + 12,80 = 4,50, com x = −8,30"], "certa": 0, "resolucao": "Os preços se somam: x + 4,50 = 12,80. Então x = 12,80 − 4,50 = 8,30."}, {"imp": 246, "rotulo": "Questão 26", "pergunta": "Meta de 7/2 km, já percorreu 7/4 km: quanto falta, pela equação x + 7/4 = 7/2?", "tipo": "escolha", "aceitas": [], "unidade": "km", "opcoes": ["7/8 km", "7/4 km", "3/4 km", "1/2 km"], "certa": 1, "resolucao": "x = 7/2 − 7/4 = 14/4 − 7/4 = 7/4 km."}, {"imp": 246, "rotulo": "Questão 27", "pergunta": "Resolver 6x − 4 = 20.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 2", "x = 3", "x = 4", "x = 6"], "certa": 2, "resolucao": "6x = 20 + 4 = 24. Logo x = 24 ÷ 6 = 4."}, {"imp": 246, "rotulo": "Questão 28", "pergunta": "Achar o valor de x em 6x − 1/3 = 5/3.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 1/3", "x = 2/9", "x = 1/2", "x = 1"], "certa": 0, "resolucao": "6x = 5/3 + 1/3 = 6/3 = 2. Logo x = 2 ÷ 6 = 1/3."}, {"imp": 246, "rotulo": "Questão 29", "pergunta": "Resolver 7x − 2,4 = 3x + 5,6.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 1", "x = 1,5", "x = 2", "x = 2,5"], "certa": 2, "resolucao": "7x − 3x = 5,6 + 2,4, então 4x = 8. Logo x = 8 ÷ 4 = 2."}, {"imp": 246, "rotulo": "Questão 30", "pergunta": "Taxa inicial de R$ 5,50 mais R$ 3,00 por quilômetro, total de R$ 29,50: quantos quilômetros foram percorridos?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["6", "7", "8", "9"], "certa": 2, "resolucao": "5,50 + 3x = 29,50, então 3x = 24. Logo x = 24 ÷ 3 = 8 km."}, {"imp": 246, "rotulo": "Questão 31", "pergunta": "Encomenda de 9/4 kg = 3 pacotes de x kg mais 3/4 kg: qual é o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "kg", "opcoes": ["1/2", "3/4", "1", "5/4"], "certa": 0, "resolucao": "3x + 3/4 = 9/4, então 3x = 6/4. Logo x = (6/4) ÷ 3 = 1/2 kg."}, {"imp": 247, "rotulo": "Questão 32", "pergunta": "Bônus de 11/6 GB = 4 vezes x GB mais 2/3 GB: qual é o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "GB", "opcoes": ["1/12", "5/24", "1/6", "7/24"], "certa": 3, "resolucao": "4x + 2/3 = 11/6, então 4x = 11/6 − 4/6 = 7/6. Logo x = (7/6) ÷ 4 = 7/24 GB."}, {"imp": 247, "rotulo": "Aula 22, Questão 1", "pergunta": "Reescrever x/2 + 3 = 11 no formato ax + b = c, sem fração na incógnita.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x + 3 = 11", "x + 6 = 22", "2x + 3 = 11", "x = 8"], "certa": 1, "resolucao": "Multiplicando os dois lados por 2: x + 6 = 22. Isso mantém a igualdade e tira a fração."}, {"imp": 247, "rotulo": "Aula 22, Questão 2", "pergunta": "Qual equação equivalente a 3x + 4 = x + 12 está no formato ax + b = c?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2x + 4 = 12", "x + 4 = 12", "3x = x + 8", "x = 8"], "certa": 0, "resolucao": "Subtraindo x dos dois lados: 3x − x + 4 = 12, ou seja, 2x + 4 = 12. As outras opções não são equivalentes à equação original."}, {"imp": 248, "rotulo": "Questão 3", "pergunta": "Qual alternativa é equivalente a 2(x/3 + 1) = x + 4, organizada no formato ax + b = c?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2x/3 + 2 = x + 4", "2x + 6 = 4x + 12", "−x + 6 = 12", "x/3 + 2 = 4"], "certa": 2, "resolucao": "Distribua: 2x/3 + 2 = x + 4. Multiplique tudo por 3: 2x + 6 = 3x + 12. Passe 3x para o lado esquerdo: −x + 6 = 12, que está no formato ax + b = c."}, {"imp": 248, "rotulo": "Questão 4", "pergunta": "Eliminando a fração de x/2 = 14, qual equação equivalente se obtém?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x/2 = 14", "x = 28", "x + 2 = 14", "2x = 14"], "certa": 1, "resolucao": "Multiplique os dois lados por 2: x/2 × 2 = 14 × 2, então x = 28."}, {"imp": 248, "rotulo": "Questão 5", "pergunta": "Qual equação equivalente, no formato ax + b = c, representa x/2 + 10 = 65?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x/2 + 10 = 25", "x + 10 = 65", "x + 20 = 130", "2x + 10 = 115"], "certa": 2, "resolucao": "A equação é x/2 + 10 = 65. Multiplicando tudo por 2: x + 20 = 130."}, {"imp": 248, "rotulo": "Questão 6", "pergunta": "Resolva x/2 + 3 = 7 e determine x.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["2", "4", "6", "8"], "certa": 3, "resolucao": "Subtraia 3: x/2 = 4. Multiplique por 2: x = 8."}, {"imp": 248, "rotulo": "Questão 7", "pergunta": "x = 6 é solução de x/3 + 5 = x − 1?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Sim", "Não"], "certa": 1, "resolucao": "Com x = 6: 6/3 + 5 = 2 + 5 = 7, e 6 − 1 = 5. Como 7 ≠ 5, x = 6 não é solução."}, {"imp": 248, "rotulo": "Questão 8", "pergunta": "Resolva 2x/5 + 4 = x + 1 e ache x.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5", "10", "15", "20"], "certa": 0, "resolucao": "Multiplique tudo por 5: 2x + 20 = 5x + 5. Então 15 = 3x, logo x = 5. Conferindo: 2 + 4 = 6 e 5 + 1 = 6."}, {"imp": 248, "rotulo": "Questão 9", "pergunta": "O açúcar usado é metade do pacote mais 200 g, num total de 600 g. Qual é a massa do pacote?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["400 g", "600 g", "800 g", "1 000 g"], "certa": 2, "resolucao": "Seja x o pacote: x/2 + 200 = 600. Então x/2 = 400 e x = 800 g."}, {"imp": 249, "rotulo": "Questão 10", "pergunta": "A metade da pontuação mais 10 é igual à pontuação menos 5. Qual é a pontuação total?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["20", "25", "30", "40"], "certa": 2, "resolucao": "x/2 + 10 = x − 5. Então 15 = x/2 e x = 30. Conferindo: 15 + 10 = 25 e 30 − 5 = 25."}, {"imp": 249, "rotulo": "Questão 11", "pergunta": "Qual valor de x torna 2(x − 3) = x + 4 verdadeira?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x = 2", "x = 4", "x = 6", "x = 10"], "certa": 3, "resolucao": "Distribua: 2x − 6 = x + 4. Então x = 10. Conferindo: 2 × 7 = 14 e 10 + 4 = 14."}, {"imp": 249, "rotulo": "Questão 12", "pergunta": "x = 3 é solução de 2(x/3 + 3) = 3x − 1?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Sim", "Não"], "certa": 0, "resolucao": "Com x = 3: 2 × (1 + 3) = 8, e 3 × 3 − 1 = 8. Os dois lados são iguais, então é solução."}, {"imp": 249, "rotulo": "Questão 14", "pergunta": "O valor pago foi R$ 40,00 fixos mais o triplo da taxa x, num total de R$ 160,00. Quanto vale x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 30,00", "R$ 35,00", "R$ 40,00", "R$ 50,00"], "certa": 2, "resolucao": "40 + 3x = 160, então 3x = 120 e x = R$ 40,00."}, {"imp": 249, "rotulo": "Questão 15", "pergunta": "Três pedaços de queijo pesam o mesmo que um pedaço mais 0,8 kg. Quanto pesa o queijo inteiro (4 pedaços)?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["1,2 kg", "1,5 kg", "1,6 kg", "1,8 kg", "2,4 kg"], "certa": 2, "resolucao": "3p = p + 0,8, então 2p = 0,8 e p = 0,4 kg. O queijo inteiro tem 4 × 0,4 = 1,6 kg."}, {"imp": 250, "rotulo": "Questão 16", "pergunta": "Cada funcionário recebeu 4x/5 + R$ 200,00 e 3 funcionários receberam R$ 1 500,00 no total. Qual é o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 300,00", "R$ 375,00", "R$ 400,00", "R$ 450,00"], "certa": 1, "resolucao": "3 × (4x/5 + 200) = 1 500, então 4x/5 + 200 = 500 e 4x/5 = 300. Logo x = 300 × 5 ÷ 4 = R$ 375,00."}, {"imp": 250, "rotulo": "Questão 17", "pergunta": "Base 7 m, área 35 m² e altura x: qual equação representa a situação?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["7 + x = 35", "35 = 7 ∙ x", "35 = 7 − x", "x = (35 ÷ 7) + 7"], "certa": 1, "resolucao": "A área do retângulo é base × altura, então 35 = 7 ∙ x."}, {"imp": 250, "rotulo": "Questão 18", "pergunta": "O que a equação 40 = 4x pode representar corretamente?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["a área de um quadrado de lado x", "a área de um retângulo de lados 8 e x", "o perímetro de um quadrado de lado x", "o perímetro de um retângulo de lados 4 e 8"], "certa": 2, "resolucao": "O perímetro de um quadrado de lado x é 4 × x, então 40 = 4x. Nesse caso x = 10."}, {"imp": 250, "rotulo": "Questão 19", "pergunta": "Um retângulo tem perímetro 52 cm e base 14 cm. Qual é a altura?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["12 cm", "14 cm", "16 cm", "26 cm"], "certa": 0, "resolucao": "2 × (14 + h) = 52, então 14 + h = 26 e h = 12 cm."}, {"imp": 250, "rotulo": "Questão 20", "pergunta": "Uma placa triangular tem área 30 m² e altura 10 m. Qual é a base?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["3 m", "6 m", "12 m", "15 m"], "certa": 1, "resolucao": "Área = base × altura ÷ 2, então b × 10 ÷ 2 = 30. Assim 5b = 30 e b = 6 m."}, {"imp": 250, "rotulo": "Questão 21", "pergunta": "Um espaço quadrado foi cercado com 72 m de cerca. Quanto mede cada lado?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["9 m", "12 m", "18 m", "36 m"], "certa": 2, "resolucao": "O perímetro do quadrado é 4 × lado = 72, então o lado mede 72 ÷ 4 = 18 m."}, {"imp": 251, "rotulo": "Questão 22", "pergunta": "Qual situação do dia a dia descreve a equação x + 5 = 20?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Um produto custa R$ 5,00 e foram compradas x unidades, totalizando R$ 20,00.", "Uma pessoa tinha R$ 5,00 e, depois de gastar x reais, ficou com R$ 20,00.", "Uma pessoa tinha R$ 5,00 e, após receber x reais, passou a ter R$ 20,00.", "Uma pessoa tinha R$ 20,00 e gastou R$ 5,00, restando x reais."], "certa": 2, "resolucao": "Em x + 5 = 20, o 5 é o que a pessoa já tinha e o x é o que ela recebeu, dando 20 no total. Isso só combina com a alternativa c."}, {"imp": 251, "rotulo": "Questão 23", "pergunta": "Qual equação representa a fita de 20 m dividida em uma parte x e outra 4 m menor?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["x − 4 = 20", "x + (x − 4) = 20", "2x − 4 = 20", "x + 4 = 20"], "certa": 1, "resolucao": "Uma parte mede x e a outra mede x − 4. A soma das duas partes é o total: x + (x − 4) = 20."}, {"imp": 251, "rotulo": "Questão 24", "pergunta": "Qual é o valor de x na equação x/2 + x = 18?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["6", "9", "10", "12"], "certa": 3, "resolucao": "x/2 + x = 3x/2. Então 3x/2 = 18, logo 3x = 36 e x = 12."}, {"imp": 251, "rotulo": "Questão 25", "pergunta": "Qual é a mensalidade, se a mensalidade mais uma taxa de 1/4 dela somam R$ 36,00?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 24,00", "R$ 28,80", "R$ 30,00", "R$ 32,00"], "certa": 1, "resolucao": "x + x/4 = 36, ou seja, 5x/4 = 36. Então x = 36 × 4 ÷ 5 = 144 ÷ 5 = 28,80."}, {"imp": 251, "rotulo": "Questão 26", "pergunta": "Quanto tempo Cláudio estudou Matemática, se o total foi 3 horas e o resto foi metade desse tempo?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["1 hora", "1,5 hora", "2 horas", "2,5 horas"], "certa": 2, "resolucao": "x + x/2 = 3, então 3x/2 = 3 e x = 2. Conferindo: 2 h de Matemática e 1 h nas outras, total 3 h."}, {"imp": 252, "rotulo": "Questão 27", "pergunta": "Qual equação representa o retângulo de área 40 m², base 5 m e outro lado x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["40 = 5 + x", "40 = 2(5 + x)", "40 = 5x", "40 = x − 5"], "certa": 2, "resolucao": "A área do retângulo é base × altura. Com base 5 e outro lado x, fica 40 = 5x."}, {"imp": 252, "rotulo": "Questão 28", "pergunta": "Qual equação representa o perímetro de 28 m do retângulo de base x e altura x − 2?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["28 = x + (x − 2)", "28 = 2x − 2", "28 = x(x − 2)", "28 = 2x + 2(x − 2)"], "certa": 3, "resolucao": "O perímetro soma os quatro lados: duas bases e duas alturas. Fica 28 = 2x + 2(x − 2)."}, {"imp": 252, "rotulo": "Questão 29", "pergunta": "Qual é a base x da placa triangular de área 45 m² e altura 9 m?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5", "10", "12", "14"], "certa": 1, "resolucao": "Área do triângulo = base × altura ÷ 2, então x × 9 ÷ 2 = 45. Logo 9x = 90 e x = 10."}, {"imp": 252, "rotulo": "Questão 30", "pergunta": "Qual é a base x do triângulo de área 54 m² e altura 9 m?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["6", "9", "12", "15"], "certa": 2, "resolucao": "x × 9 ÷ 2 = 54, então 9x = 108 e x = 12."}, {"imp": 252, "rotulo": "Questão 31", "pergunta": "Qual é a altura x do telhado triangular, se a casa tem um quadrado de lado 6 m e área total de 54 m²?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["4", "6", "8", "10"], "certa": 1, "resolucao": "O quadrado tem área 6 × 6 = 36 m². O triângulo tem base 6 e altura x, então 6x ÷ 2 = 3x. Assim 36 + 3x = 54, 3x = 18 e x = 6."}]}, {"vol": 4, "bim": "4º bimestre", "aulas": [{"n": 1, "titulo": "Explorando o conceito de ângulo", "pags": [{"f": "p123.webp", "imp": 122, "rot": ["Resumo"], "ex": false}, {"f": "p124.webp", "imp": 123, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p125.webp", "imp": 124, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 124, "rotulo": "Atividade 1 (figura 1)", "pergunta": "Classifique o ângulo ABC destacado na malha quadriculada (figura 1).", "tipo": "numero", "aceitas": ["reto", "ângulo reto", "angulo reto"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Na figura 1 os dois lados formam um canto de quadrado, marcado com o símbolo de ângulo reto. Por isso o ângulo mede exatamente 90° e é um ângulo reto."}, {"imp": 124, "rotulo": "Atividade 1 (figura 2)", "pergunta": "Classifique o ângulo DEF destacado na malha quadriculada (figura 2).", "tipo": " ade 1 b)", "pergunta": "Classifique, quanto aos ângulos, o triângulo de ângulos 35°, 55° e 90°.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Como o triângulo tem um ângulo reto (90°), ele é um triângulo retângulo."}, {"imp": 133, "rotulo": "Atividade 2 (valor de x)", "pergunta": "Em um triângulo com ângulos de 48°, 62° e 2x, encontre o valor de x.", "tipo": "numero", "aceitas": ["35", "x=35"], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A soma dos ângulos é 180°: 48 + 62 + 2x = 180, então 110 + 2x = 180 e 2x = 70. Logo x = 35."}, {"imp": 133, "rotulo": "Atividade 2 (terceiro ângulo)", "pergunta": "Encontre a medida do terceiro ângulo, que mede 2x, no triângulo de ângulos 48°, 62° e 2x.", "tipo": "numero", "aceitas": ["70"], "unidade": "°", "opcoes": [], "certa": -1, "resolucao": "Como x = 35, o terceiro ângulo mede 2 × 35 = 70°."}, {"imp": 133, "rotulo": "Atividade 3", "pergunta": "Encontre a medida de cada ângulo agudo do triângulo retângulo formado pela escada, sabendo que (2x + 10)° e (x + 5)° são complementares.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Complementares somam 90°: (2x + 10) + (x + 5) = 90, então 3x + 15 = 90, 3x = 75 e x = 25. O ângulo com o chão mede 2 × 25 + 10 = 60° e o ângulo com a parede mede 25 + 5 = 30°."}, {"imp": 134, "rotulo": "Atividade 4", "pergunta": "Qual deve ser o ângulo de abertura da porta, se ele é o quádruplo do seu suplemento (abertura máxima de 180°)?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["36°", "45°", "135°", "144°"], "certa": 3, "resolucao": "Se o suplemento mede x, a abertura mede 4x e 4x + x = 180°. Então 5x = 180°, x = 36° e a abertura é 4 × 36 = 144°."}]}, {"n": 5, "titulo": "Revisão: Classificação e propriedades dos triângulos", "pags": [{"f": "p136.webp", "imp": 135, "rot": ["Resumo"], "ex": false}, {"f": "p137.webp", "imp": 136, "rot": ["Na prática"], "ex": true}, {"f": "p138.webp", "imp" "imp": 162, "rot": [], "ex": true}], "conf": [{"imp": 161, "rotulo": "Atividade 1 a)", "pergunta": "As razões 3/5 e 12/25 formam uma proporção?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Formam uma proporção", "Não formam uma proporção"], "certa": 1, "resolucao": "Multiplicando em cruz: 3 × 25 = 75 e 5 × 12 = 60. Como 75 ≠ 60, as razões não são equivalentes (3/5 = 15/25, que é diferente de 12/25). Não formam uma proporção."}, {"imp": 161, "rotulo": "Atividade 1 b)", "pergunta": "As razões 4/6 e 10/15 formam uma proporção?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Formam uma proporção", "Não formam uma proporção"], "certa": 0, "resolucao": "Simplificando, 4/6 = 2/3 (dividindo por 2) e 10/15 = 2/3 (dividindo por 5). As duas razões valem 2/3, então formam uma proporção."}, {"imp": 161, "rotulo": "Atividade 1 c)", "pergunta": "As razões 7/9 e 21/27 formam uma proporção?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Formam uma proporção", "Não formam uma proporção"], "certa": 0, "resolucao": "Simplificando 21/27 (dividindo por 3), obtemos 7/9. As duas razões são iguais, então formam uma proporção."}, {"imp": 162, "rotulo": "Atividade 2", "pergunta": "Em um mapa, 3 cm representam 12 km. Qual é a distância real entre duas cidades que ficam a 5 cm no mapa?", "tipo": "numero", "aceitas": ["20"], "unidade": "km", "opcoes": [], "certa": -1, "resolucao": "Montamos a proporção 3/12 = 5/x. Pela propriedade fundamental, 3 × x = 5 × 12, ou seja, 3x = 60, então x = 60 ÷ 3 = 20. A distância real é 20 km."}]}, {"n": 13, "titulo": "Grandezas diretamente proporcionais", "pags": [{"f": "p164.webp", "imp": 163, "rot": ["Resumo"], "ex": false}, {"f": "p165.webp", "imp": 164, "rot": [], "ex": false}, {"f": "p166.webp", "imp": 165, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p167.webp", "imp": 166, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 166, "rotulo": "Atividade 1", "pergunta": "Quanto custa a doação de 12 kits, sabendo que cada 2 kits custam R$ 16,00?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 84,00", "R$ 88,00", "R$ 96,00", "R$ 104,00"], "certa": 2, "resolucao": "Se 2 kits custam R$ 16,00, 1 kit custa 16 ÷ 2 = R$ 8,00. Para 12 kits: 12 × 8 = R$ 96,00."}, {"imp": 166, "rotulo": "Atividade 2", "pergunta": "Com velocidade constante, quantos quilômetros a ciclista percorre em 25 minutos, se em 15 minutos percorre 6 km?", "tipo": "numero", "aceitas": ["10"], "unidade": "km", "opcoes": [], "certa": -1, "resolucao": "Em 15 minutos ela faz 6 km, então em 5 minutos faz 6 ÷ 3 = 2 km. Em 25 minutos são 5 partes de 5 minutos: 5 × 2 = 10 km."}]}, {"n": 14, "titulo": "Resolução de problemas – Proporção e grandezas diretamente proporcionais", "pags": [{"f": "p168.webp", "imp": 167, "rot": ["Na prática"], "ex": true}, {"f": "p169.webp", "imp": 168, "rot": [], "ex": true}, {"f": "p170.webp", "imp": 169, "rot": [], "ex": true}], "conf": [{"imp": 167, "rotulo": "Atividade 1", "pergunta": "Quantos cookies podem ser feitos com 10 copos de farinha, mantendo a proporção da receita (4 copos para 12 cookies)?", "tipo": "numero", "aceitas": ["30"], "unidade": "cookies", "opcoes": [], "certa": -1, "resolucao": "A constante de proporcionalidade é 12 ÷ 4 = 3 cookies por copo. Com 10 copos: 10 × 3 = 30. Podem ser feitos 30 cookies."}, {"imp": 167, "rotulo": "Atividade 2", "pergunta": "Complete a tabela de tempo (minutos) e páginas impressas, sabendo que são grandezas diretamente proporcionais (3 min → 24 páginas).", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "A constante é 24 ÷ 3 = 8 páginas por minuto. Então: 5 min → 5 × 8 = 40 páginas; 8 min → 8 × 8 = 64 páginas; 10 min → 10 × 8 = 80 páginas."}, {"imp": 168, "rotulo": "Atividade 3", "pergunta": "Na mistura de 2 partes de xarope para 5 partes de água, quantos mL de xarope foram usados com 250 mL de água?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["80 mL", "90 mL", "100 mL", "120 mL"], "certa": 2, "resolucao": "250 mL de água é 250 ÷ 5 = 50 mL por parte. O xarope tem 2 partes: 2 × 50 = 100. Foram usados 100 mL de xarope."}, {"imp": 168, "rotulo": "Atividade 4", "pergunta": "Em um mapa em que 2 cm representam 6 km, quantos quilômetros correspondem a 7 cm?", "tipo": "numero", "aceitas": ["21"], "unidade": "km", "opcoes": [], "certa": -1, "resolucao": "Cada centímetro vale 6 ÷ 2 = 3 km. Para 7 cm: 7 × 3 = 21. Portanto, 7 cm no mapa representam 21 km."}, {"imp": 169, "rotulo": "Atividade 5", "pergunta": "Com os dados de três corridas de aplicativo (2 km → R$ 14; 4 km → R$ 26; 6 km → R$ 38), o valor a pagar V e a distância d são grandezas diretamente proporcionais? Justifique.", "tipo": "aberta", "aceitas": [], "unidade": "", "opcoes": [], "certa": -1, "resolucao": "Calcule V ÷ d em cada corrida: 14 ÷ 2 = 7; 26 ÷ 4 = 6,5; 38 ÷ 6 ≈ 6,33. Como a razão não é a mesma em todas, as grandezas não são diretamente proporcionais."}]}, {"n": 15, "titulo": "Revisão: Grandezas diretamente proporcionais", "pags": [{"f": "p171.webp", "imp": 170, "rot": ["Resumo"], "ex": false}, {"f": "p172.webp", "imp": 171, "rot": ["Na prática"], "ex": true}, {"f": "p173.webp", "imp": 172, "rot": [], "ex": true}], "conf": [{"imp": 171, "rotulo": "Atividade 1", "pergunta": "Em qual opção a razão valor ÷ quantidade se mantém a mesma?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Quantidade: 2, 4, 6; Valor: 10, 20, 25", "Quantidade: 3, 6, 9; Valor: 12, 24, 36", "Quantidade: 1, 2, 3; Valor: 7, 13, 19", "Quantidade: 5, 10, 15; Valor: 18, 40, 60"], "certa": 1, "resolucao": "Na opção b: 12 ÷ 3 = 4, 24 ÷ 6 = 4 e 36 ÷ 9 = 4. A razão é sempre 4, então as grandezas são diretamente proporcionais. Nas outras opções a razão muda em pelo menos um par."}, {"imp": 171, "rotulo": "Atividade 2", "pergunta": "Se 4 cadernos custam R$ 28,00, qual é a constante de proporcionalidade (preço de 1 caderno)?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["R$ 7,00", "R$ 8,00", "R$ 9,00", "R$ 10,00"], "certa": 0, "resolucao": "A constante é valor ÷ quantidade: 28 ÷ 4 = 7. Então 1 caderno custa R$ 7,00."}, {"imp": 171, "rotulo": "Atividade 3", "pergunta": "Se 3 copos de suco custam R$ 9,00, qual alternativa dá o valor correto de 5 copos?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["5 copos custam R$ 12,00.", "5 copos custam R$ 13,00.", "5 copos custam R$ 15,00.", "5 copos custam R$ 18,00."], "certa": 2, "resolucao": "1 copo custa 9 ÷ 3 = 3 reais. Então 5 copos custam 5 × 3 = 15 reais, ou seja, R$ 15,00."}, {"imp": 172, "rotulo": "Atividade 4", "pergunta": "Em um mapa, 2 cm representam 10 km. Quantos quilômetros representam 7 cm?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["25 km", "27 km", "30 km", "35 km"], "certa": 3, "resolucao": "Se 2 cm representam 10 km, então 1 cm representa 10 ÷ 2 = 5 km. Para 7 cm: 7 × 5 = 35 km."}]}, {"n": 16, "titulo": "Grandezas inversamente proporcionais", "pags": [{"f": "p174.webp", "imp": 173, "rot": ["Resumo"], "ex": false}, {"f": "p175.webp", "imp": 174, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p176.webp", "imp": 175, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 175, "rotulo": "Atividade 1 a)", "pergunta": "Classifique as grandezas quantidade de cadernos comprados e valor total pago (todos com o mesmo preço) em diretamente ou inversamente proporcionais.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Diretamente proporcionais", "Inversamente proporcionais"], "certa": 0, "resolucao": "Quanto mais cadernos você compra, mais paga no total, e na mesma proporção. As grandezas são diretamente proporcionais."}, {"imp": 175, "rotulo": "Atividade 1 b)", "pergunta": "Classifique as grandezas número de trabalhadores e tempo necessário para concluir o mesmo serviço (mesmo ritmo de trabalho) em diretamente ou inversamente proporcionais.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Diretamente proporcionais", "Inversamente proporcionais"], "certa": 1, "resolucao": "Com mais trabalhadores, o tempo necessário para o mesmo serviço diminui. As grandezas são inversamente proporcionais."}, {"imp": 175, "rotulo": "Atividade 1 c)", "pergunta": "Classifique as grandezas velocidade de um carro e tempo para percorrer uma mesma distância em diretamente ou inversamente proporcionais.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Diretamente proporcionais", "Inversamente proporcionais"], "certa": 1, "resolucao": "Se a velocidade aumenta, o tempo para percorrer a mesma distância diminui. As grandezas são inversamente proporcionais."}, {"imp": 175, "rotulo": "Atividade 1 d)", "pergunta": "Classifique as grandezas quantidade de litros colocados em um recipiente e volume de líquido no recipiente em diretamente ou inversamente proporcionais.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Diretamente proporcionais", "Inversamente proporcionais"], "certa": 0, "resolucao": "Quanto mais litros você coloca, maior é o volume de líquido no recipiente. As grandezas são diretamente proporcionais."}]}, {"n": 17, "titulo": "Regra de três simples", "pags": [{"f": "p177.webp", "imp": 176, "rot": ["Resumo"], "ex": false}, {"f": "p178.webp", "imp": 177, "rot": ["Exercícios resolvidos"], "ex": false}, {"f": "p179.webp", "imp": 178, "rot": [], "ex": false}, {"f": "p180.webp", "imp": 179, "rot": ["Na prática"], "ex": true}], "conf": [{"imp": 179, "rotulo": "Atividade 1", "pergunta": "Quanto será cobrado pela impressão de 300 panfletos, se 120 panfletos custam R$ 56,00?", "tipo": "numero", "aceitas": ["140", "140,00"], "unidade": "R$", "opcoes": [], "certa": -1, "resolucao": "Panfletos e valor são diretamente proporcionais: 120/300 = 56/x. Então 120 × x = 300 × 56 = 16 800, e x = 16 800 ÷ 120 = 140. Serão cobrados R$ 140,00."}, {"imp": 179, "rotulo": "Atividade 2", "pergunta": "Em quantos minutos o reservatório seria cheio com 10 torneiras iguais, se 5 torneiras levam 12 minutos?", "tipo": "numero", "aceitas": ["6"], "unidade": "minutos", "opcoes": [], "certa": -1, "resolucao": "Torneiras e tempo são inversamente proporcionais, então o produto é constante: 5 × 12 = 10 × x. Assim 60 = 10x e x = 6. O reservatório seria cheio em 6 minutos."}]}, {"n": 18, "titulo": "Resolução de problemas – Regra de três simples", "pags": [{"f": "p181.webp", "imp": 180, "rot": ["Na prática"], "ex": true}, {"f": "p182.webp", "imp": 181, "rot": [], "ex": true}, {"f": "p183.webp", "imp": 182, "rot": [], "ex": true}], "conf": [{"imp": 180, "rotulo": "Atividade 1 – Situação 1", "pergunta": "Classificar a relação entre o número de trabalhadores (mesmo rendimento) e o tempo para fazer a mesma tarefa.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Diretamente proporcionais", "Inversamente proporcionais", "Não proporcionais"], "certa": 1, "resolucao": "As grandezas são o número de trabalhadores e o tempo para concluir o serviço. Quanto mais trabalhadores, menos tempo: são inversamente proporcionais."}, {"imp": 180, "rotulo": "Atividade 1 – Situação 2", "pergunta": "Classificar a relação entre a idade e a altura de uma criança, dos 2 aos 12 anos.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Diretamente proporcionais", "Inversamente proporcionais", "Não proporcionais"], "certa": 2, "resolucao": "As grandezas são a idade e a altura da criança. A altura não dobra quando a idade dobra, nem diminui: elas não são proporcionais."}, {"imp": 180, "rotulo": "Atividade 1 – Situação 3", "pergunta": "Classificar a relação entre a quantidade de canetas e o valor total a pagar, com cada caneta custando 4 reais.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Diretamente proporcionais", "Inversamente proporcionais", "Não proporcionais"], "certa": 0, "resolucao": "As grandezas são a quantidade de canetas e o valor total. Dobrando as canetas, o valor dobra: são diretamente proporcionais."}, {"imp": 181, "rotulo": "Atividade 2", "pergunta": "Com R$ 144,00 e o quilograma de pão a R$ 12,00, quantos quilogramas Ricardo consegue comprar?", "tipo": "numero", "aceitas": ["12", "x=12"], "unidade": "kg", "opcoes": [], "certa": -1, "resolucao": "Regra de três direta: 1 kg está para 12 reais, assim como x kg está para 144 reais. Então 12x = 144, e x = 144 ÷ 12 = 12 kg."}, {"imp": 181, "rotulo": "Atividade 3", "pergunta": "Se 4 saquinhos levam 12 cartas cada, quantas cartas vai cada um dos 6 saquinhos?", "tipo": "numero", "aceitas": ["8", "x=8"], "unidade": "cartas", "opcoes": [], "certa": -1, "resolucao": "Mais saquinhos, menos cartas em cada: grandezas inversas. O total de cartas é 4 × 12 = 48, então 6x = 48 e x = 48 ÷ 6 = 8 cartas."}, {"imp": 182, "rotulo": "Atividade 4", "pergunta": "Se 2 mesas precisam de 2,5 metros de tecido, quantos metros são necessários para 9 mesas?", "tipo": "numero", "aceitas": ["11,25", "x=11,25"], "unidade": "m", "opcoes": [], "certa": -1, "resolucao": "Regra de três direta: 2x = 9 × 2,5 = 22,5. Então x = 22,5 ÷ 2 = 11,25 metros."}, {"imp": 182, "rotulo": "Atividade 5", "pergunta": "Se 4 fileiras têm 9 cones cada, quantos cones tem cada fileira com 6 fileiras?", "tipo": "numero", "aceitas": ["6", "x=6"], "unidade": "cones", "opcoes": [], "certa": -1, "resolucao": "Mais fileiras, menos cones em cada: grandezas inversas. O total é 4 × 9 = 36, então 6x = 36 e x = 36 ÷ 6 = 6 cones."}]}, {"n": 19, "titulo": "Aula de verificação: Grandezas diretamente e inversamente proporcionais", "pags": [{"f": "p184.webp", "imp": 183, "rot": ["Na prática"], "ex": true}, {"f": "p185.webp", "imp": 184, "rot": [], "ex": true}, {"f": "p186.webp", "imp": 185, "rot": [], "ex": true}], "conf": [{"imp": 183, "rotulo": "Atividade 1 I", "pergunta": "Mais pessoas dividindo a mesma pizza: as grandezas são inversamente proporcionais?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Verdadeira", "Falsa"], "certa": 0, "resolucao": "Quanto mais pessoas dividem a mesma pizza, menor é a parte de cada uma. Uma grandeza aumenta e a outra diminui, então são inversamente proporcionais. A afirmação é verdadeira (V)."}, {"imp": 183, "rotulo": "Atividade 1 II", "pergunta": "Número de páginas e preço de um livro são sempre diretamente proporcionais?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Verdadeira", "Falsa"], "certa": 1, "resolucao": "O preço de um livro depende de vários fatores, não só do número de páginas. Por isso não são sempre proporcionais. A afirmação é falsa (F)."}, {"imp": 183, "rotulo": "Atividade 1 III", "pergunta": "Velocidade média maior e tempo menor para a mesma distância: são inversamente proporcionais?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Verdadeira", "Falsa"], "certa": 0, "resolucao": "Para a mesma distância, se a velocidade aumenta, o tempo diminui. Isso é proporcionalidade inversa. A afirmação é verdadeira (V)."}, {"imp": 183, "rotulo": "Atividade 1 IV", "pergunta": "Camisetas e preço total aumentando na mesma razão: são diretamente proporcionais?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["Verdadeira", "Falsa"], "certa": 0, "resolucao": "Se a quantidade aumenta e o preço total aumenta na mesma razão, a relação é de proporcionalidade direta. A afirmação é verdadeira (V)."}, {"imp": 184, "rotulo": "Atividade 2", "pergunta": "Quantos adesivos a gráfica produz em 14 minutos, mantendo o ritmo de 18 adesivos em 6 minutos?", "tipo": "numero", "aceitas": ["42"], "unidade": "adesivos", "opcoes": [], "certa": -1, "resolucao": "As grandezas são diretamente proporcionais: 18/6 = x/14, então 6 × x = 18 × 14 = 252. Logo x = 252 ÷ 6 = 42 adesivos."}, {"imp": 184, "rotulo": "Atividade 3", "pergunta": "Em quantas horas o motorista faria o trajeto a 90 km/h, se a 72 km/h leva 5 horas?", "tipo": "numero", "aceitas": ["4"], "unidade": "horas", "opcoes": [], "certa": -1, "resolucao": "Velocidade e tempo são inversamente proporcionais: 72 × 5 = 90 × x, ou seja, 360 = 90x. Logo x = 360 ÷ 90 = 4 horas."}, {"imp": 185, "rotulo": "Atividade 4", "pergunta": "Quantos kits a equipe organiza em 9 horas, se faz 28 kits em 4 horas no mesmo ritmo?", "tipo": "numero", "aceitas": ["63"], "unidade": "kits", "opcoes": [], "certa": -1, "resolucao": "As grandezas são diretamente proporcionais: 28 × 9 = x × 4, então 252 = 4x. Logo x = 252 ÷ 4 = 63 kits."}]}, {"n": 20, "titulo": "Revisão: Grandezas diretamente e inversamente proporcionais", "pags": [{"f": "p187.webp", "imp": 186, "rot": ["Resumo"], "ex": false}, {"f": "p188.webp", "imp": 187, "rot": ["Na prática"], "ex": true}, {"f": "p189.webp", "imp": 188, "rot": [], "ex": true}], "conf": [{"imp": 187, "rotulo": "Atividade 1", "pergunta": "Quantos litros de combustível o carro gasta para percorrer 240 km, se gasta 12 litros em 144 km?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["18 litros", "20 litros", "22 litros", "24 litros"], "certa": 1, "resolucao": "Quanto maior a distância, maior o consumo, então as grandezas são diretamente proporcionais: 144/240 = 12/x. Daí 144 × x = 240 × 12 = 2880, e x = 2880 ÷ 144 = 20. Serão necessários 20 litros."}, {"imp": 187, "rotulo": "Atividade 2", "pergunta": "Em quanto tempo 5 torneiras iguais enchem o reservatório que 4 torneiras enchem em 15 minutos?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["9 minutos", "10 minutos", "12 minutos", "14 minutos"], "certa": 2, "resolucao": "Quanto mais torneiras, menos tempo: as grandezas são inversamente proporcionais. Então 4 × 15 = 5 × x, ou seja, 60 = 5x e x = 12. O reservatório será cheio em 12 minutos."}, {"imp": 187, "rotulo": "Atividade 3", "pergunta": "Quantas camisetas a fábrica produz em 7 horas, se faz 18 camisetas em 3 horas no mesmo ritmo?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["36", "40", "42", "48"], "certa": 2, "resolucao": "Em 3 horas são 18 camisetas, então em 1 hora são 18 ÷ 3 = 6 camisetas. Em 7 horas: 6 × 7 = 42 camisetas."}, {"imp": 188, "rotulo": "Atividade 4", "pergunta": 0", "pergunta": "Dois ângulos complementares medem (3x − 5)° e (2x + 15)°. Qual é o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["10", "12", "14", "16"], "certa": 3, "resolucao": "Somam 90°: 3x − 5 + 2x + 15 = 90, então 5x + 10 = 90, 5x = 80 e x = 16."}, {"imp": 254, "rotulo": "Questão 11", "pergunta": "Classificar, quanto ao ângulo, um triângulo com um ângulo interno de 90°.", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["acutângulo.", "retângulo.", "obtusângulo.", "equilátero."], "certa": 1, "resolucao": "Um triângulo com um ângulo de 90° (reto) é retângulo."}, {"imp": 254, "rotulo": "Questão 12", "pergunta": "Dois ângulos internos de um triângulo medem 58° e 47°. Quanto mede o terceiro?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["55°", "65°", "75°", "95°"], "certa": 2, "resolucao": "58 + 47 = 105. Então o terceiro ângulo mede 180° − 105° = 75°."}, {"imp": 254, "rotulo": "Questão 13", "pergunta": "Os ângulos (x + 12)° e (2x − 6)° são complementares. Qual é o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["18", "20", "24", "28"], "certa": 3, "resolucao": "Somam 90°: x + 12 + 2x − 6 = 90, então 3x + 6 = 90, 3x = 84 e x = 28."}, {"imp": 254, "rotulo": "Questão 14", "pergunta": "Os ângulos (x + 45)° e (3x + 15)° são suplementares. Qual é o valor de x?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["20", "25", "30", "35"], "certa": 2, "resolucao": "Somam 180°: x + 45 + 3x + 15 = 180, então 4x + 60 = 180, 4x = 120 e x = 30."}, {"imp": 255, "rotulo": "Questão 15", "pergunta": "Num triângulo ABC com Â = 60° e B igual ao quádruplo de C, qual é a medida de C?", "tipo": "escolha", "aceitas": [], "unidade": "", "opcoes": ["15°", "20°", "24°", "30°"], "certa": 2, "resolucao": "Os ângulos somam 180°, então B + C = 180° − 60° = 120°. Como B = 4C, temos 5C = 120°, logo C = 24°."}, {"imp": 255, "rotulo": "Questão 16", "pergunta": "Quais afirmações sobre ângulos de um triângulo
